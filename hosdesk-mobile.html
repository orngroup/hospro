<link rel="manifest" href="hosdesk-mobile.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#1a2b3a;--navy2:#223a4e;--gold:#BB9979;--green:#2a6a4a;--red:#b3261e;--amber:#b06a00;--line:#e4e8ee;--muted:#6b7886;--bg:#eef1f5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);font-family:Lato,system-ui,Arial,sans-serif;color:#1a2b3a;-webkit-text-size-adjust:100%}
body{max-width:620px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden}
.hide{display:none !important}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
.muted{color:var(--muted)}
/* ---------- Login ---------- */
#login{position:fixed;inset:0;background:linear-gradient(160deg,#1a2b3a 0%,#223a4e 55%,#2a6a4a 150%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;z-index:60}
#login .brand{font-family:'Playfair Display',serif;color:#fff;font-size:30px;font-weight:900;letter-spacing:.3px}
#login .sub{color:#cdd8e2;letter-spacing:4px;font-size:12px;font-weight:800;margin-top:2px}
#login .app-ttl{color:#fff;font-weight:900;font-size:19px;margin-top:22px}
#login .app-sub{color:#cdd8e2;font-size:13px;margin-top:4px;text-align:center;max-width:300px;line-height:1.5}
.pinbox{background:#fff;border-radius:18px;padding:22px 20px;margin-top:26px;width:100%;max-width:330px;box-shadow:0 10px 34px rgba(0,0,0,.25)}
.pinbox label{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.pinbox input{width:100%;margin-top:10px;padding:16px;border:2px solid var(--line);border-radius:13px;text-align:center;letter-spacing:12px;font-size:26px;font-weight:900;color:var(--navy)}
.pinbox button{width:100%;margin-top:14px;padding:15px;border:none;border-radius:13px;background:var(--green);color:#fff;font-weight:900;font-size:16px;cursor:pointer}
.pinerr{color:var(--red);font-size:13px;font-weight:700;min-height:18px;margin-top:10px;text-align:center}
/* ---------- App shell ---------- */
#app{padding-bottom:84px}
.hdr{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#1a2b3a,#223a4e);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px rgba(26,43,58,.22)}
.hdr .logo{width:40px;height:40px;border-radius:11px;flex:0 0 auto;background-size:cover}
.hdr .ht{flex:1;min-width:0}
.hdr .ht .t{font-weight:900;font-size:17px;line-height:1.1}
.hdr .ht .s{font-size:11.5px;color:#cdd8e2;margin-top:2px}
.hdr .gear{background:rgba(255,255,255,.14);border:none;color:#fff;width:40px;height:40px;border-radius:11px;font-size:19px;cursor:pointer}
.live{font-size:10.5px;color:#9fe6bf;display:flex;align-items:center;gap:5px;margin-top:3px}
.live .dot{width:7px;height:7px;border-radius:50%;background:#49d17f;box-shadow:0 0 0 0 rgba(73,209,127,.7);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(73,209,127,.6)}70%{box-shadow:0 0 0 7px rgba(73,209,127,0)}100%{box-shadow:0 0 0 0 rgba(73,209,127,0)}}
.view{padding:14px 14px 20px}
.greet{font-weight:900;font-size:20px;margin:4px 2px 2px}
.greet-sub{color:var(--muted);font-size:13px;margin:0 2px 14px}
.sec-ttl{font-weight:900;font-size:14px;color:var(--navy);margin:20px 2px 10px;display:flex;align-items:center;gap:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
/* on-now banner */
.onnow{background:linear-gradient(135deg,#1a2b3a,#2a6a4a);color:#fff;border-radius:14px;padding:13px 15px;display:flex;align-items:center;gap:12px;margin-bottom:14px}
.onnow .big{font-weight:900;font-size:16px}
.onnow .sm{font-size:12px;color:#d7e4dc}
/* stamps */
.stamp{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;background:#f8fafc}
.stamp.done{background:#e8f6ee;border-color:#bfe3cd}
.stamp.over{background:#fdeceb;border-color:#f0c4c0}
.stamp .ic{font-size:18px}
.stamp .lab{flex:1;font-weight:800;font-size:14px}
.stamp .rt{text-align:right;font-weight:900;font-size:13px}
.stamp.done .rt{color:#13532f}.stamp.over .rt{color:var(--red)}.stamp .rt .by{display:block;font-size:11px;font-weight:700;color:var(--muted)}
/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.tile .v{font-weight:900;font-size:26px;line-height:1}
.tile .k{font-size:11px;color:var(--muted);font-weight:700;margin-top:5px;text-transform:uppercase;letter-spacing:.3px}
/* priority chips */
.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #f0c4c0;background:#fdeceb;border-radius:11px;margin-bottom:8px}
.prow .rn{font-weight:900;font-size:16px;color:var(--red);min-width:46px}
.prow .rr{flex:1;font-size:12.5px;color:#7a2b25}
/* handover entries */
.ho{border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:11px;margin-bottom:9px;background:#fff;overflow:hidden}
.ho .hh{display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer}
.ho .hh .tag{font-weight:900;font-size:12px}
.ho .hh .dt{font-weight:800;font-size:12.5px;color:var(--navy)}
.ho .hh .ct{margin-left:auto;font-size:11px;color:var(--muted)}
.ho .bd{padding:0 13px 11px}
.ho .bd .n{font-size:13px;line-height:1.45;color:#223;margin-bottom:6px;white-space:pre-wrap}
.ho .bd .n .meta{color:var(--muted);font-size:10.5px}
/* checklist week */
.wkgrid{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:6px;align-items:center;font-size:12px}
.wkgrid .hd{font-weight:800;color:var(--muted);font-size:11px;text-align:center}
.wkgrid .dl{font-weight:800;color:var(--navy)}
.pill{border-radius:7px;padding:5px 4px;text-align:center;font-weight:800;font-size:11px}
.pill.ok{background:#e8f6ee;color:#13532f}.pill.no{background:#f1f4f7;color:#99a4b0}
/* search */
.srch{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:12px}
/* info card */
.inf{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:11px}
.inf .top{display:flex;gap:10px;align-items:flex-start}
.inf .num{flex:0 0 auto;background:var(--green);color:#fff;border-radius:9px;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
.inf .ti{font-weight:800;font-size:15px}
.inf .bo{font-size:13.5px;color:#2a3340;line-height:1.5;margin:4px 0;white-space:pre-wrap}
.kw{display:inline-block;background:#eef4f0;color:var(--green);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;margin:3px 4px 0 0}
.sign{display:flex;gap:6px;margin-top:9px;border-top:1px solid var(--line);padding-top:9px}
.sign select{flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.sign button{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-weight:800;font-size:12px;cursor:pointer}
.readby{font-size:12px;color:var(--green);margin-top:7px}
.note{border-left:3px solid var(--gold);background:#fffaf4;border-radius:8px;padding:9px 11px;margin-bottom:8px}
.note .nt{font-size:13px;white-space:pre-wrap;color:#223}
.note .nm{font-size:11px;color:var(--muted);margin-top:3px}
.empty{color:var(--muted);font-size:13px;padding:10px 2px;text-align:center}
/* chips row (room statuses) */
.rchips{display:flex;flex-wrap:wrap;gap:7px}
.rchip{border-radius:9px;padding:7px 10px;font-weight:800;font-size:12.5px;border:1px solid var(--line)}
.rc-done{background:#e8f6ee;color:#13532f;border-color:#bfe3cd}
.rc-prog{background:#fff5e6;color:#b06a00;border-color:#f2d9ab}
.rc-block{background:#fdeceb;color:var(--red);border-color:#f0c4c0}
.rc-none{background:#f1f4f7;color:#5b6b7b}
/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;max-width:620px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);z-index:40;box-shadow:0 -2px 14px rgba(26,43,58,.08)}
.nav button{flex:1;background:none;border:none;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-weight:800;font-size:11px;cursor:pointer}
.nav button .i{font-size:20px}
.nav button.on{color:var(--navy)}
.nav button.on .i{transform:translateY(-1px)}
.nav button.on::after{content:'';position:absolute}
/* settings sheet */
.sheet{position:fixed;inset:0;background:rgba(10,18,26,.55);display:none;align-items:flex-end;justify-content:center;z-index:70}
.sheet.on{display:flex}
.sheet .inner{background:#fff;width:100%;max-width:620px;border-radius:20px 20px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px)}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet .row{padding:14px 2px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px;cursor:pointer}
.sheet .row:last-child{border-bottom:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1a2b3a;color:#fff;padding:11px 18px;border-radius:11px;font-weight:700;font-size:13.5px;z-index:90;opacity:0;transition:opacity .2s;max-width:90%;text-align:center}
.toast.on{opacity:1}
</style>
</head>

<div id="login">

  <button data-tab="rooms" onclick="go('rooms')"><span class="i">🛏️</span>Rooms</button>
  <button data-tab="info" onclick="go('info')"><span class="i">ℹ️</span>Info</button>
</div>

<!-- settings sheet -->
<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()">

  </div>
</div>

/* ---- Firebase ---- */
var db=null;
try{ if(typeof firebase!=='undefined' && typeof firebaseConfig!=='undefined'){ if(!firebase.apps.length) firebase.initializeApp(firebaseConfig); db=firebase.firestore(); } }catch(e){ console.warn('FB init',e); }

/* ---- Access code (stored in Firestore config so it can be changed) ---- */
var PIN='4141';                         // default — overwritten by saved config
var CFG_PATH=['hoshouse_config','hosdesk_mobile'];
function loadConfig(){
  return new Promise(function(res){
    if(!db) return res();
    db.collection(CFG_PATH[0]).doc(CFG_PATH[1]).get().then(function(d){
      if(d.exists){ var v=d.data()||{}; if(v.pin) PIN=String(v.pin); }
      res();
    }).catch(function(){ res(); });
  });
}
function doLogin(){
  var v=($('pin').value||'').trim();
  if(v===PIN){ try{localStorage.setItem('hdm_signed','1');}catch(e){} enterApp(); }
  else { $('pinerr').textContent='Incorrect code — try again'; $('pin').value=''; $('pin').focus(); }
}
$('pin').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
function changeCode(){
  var cur=prompt('Enter the current code:'); if(cur===null) return;
  if(String(cur).trim()!==PIN){ toast('Current code is wrong'); return; }
  var nw=prompt('Enter the new code (3–8 digits):'); if(nw===null) return;
  nw=String(nw).trim();
  if(!/^[0-9]{3,8}$/.test(nw)){ toast('Use 3–8 digits'); return; }
  if(!db){ toast('Offline — cannot change code'); return; }
  db.collection(CFG_PATH[0]).doc(CFG_PATH[1]).set({pin:nw, updatedAt:new Date().toISOString(), updatedBy:'Patrik'},{merge:true})
    .then(function(){ PIN=nw; closeSheet(); toast('✓ Access code changed'); })
    .catch(function(){ toast('Could not save new code'); });
}
function signOut(){ try{localStorage.removeItem('hdm_signed');}catch(e){} closeSheet(); location.reload(); }
function openSheet(){ $('sheet').classList.add('on'); }
function closeSheet(){ $('sheet').classList.remove('on'); }
function howInstall(){ closeSheet(); alert('To add HosDesk to your home screen:\n\niPhone (Safari): tap the Share button, then “Add to Home Screen”.\n\nAndroid (Chrome): tap the ⋮ menu, then “Add to Home screen” / “Install app”.'); }

/* ---- Boot ---- */
function boot(){
  loadConfig().then(function(){
    var signed=false; try{ signed=localStorage.getItem('hdm_signed')==='1'; }catch(e){}
    if(signed){ enterApp(); } else { $('login').classList.remove('hide'); setTimeout(function(){try{$('pin').focus();}catch(e){}},300); }
  });
}
function enterApp(){
  $('login').classList.add('hide');
  $('app').classList.remove('hide');
  $('nav').classList.remove('hide');
  startSubs();
  go('overview');
}

/* ---- Data state + subscriptions ---- */
function todayKey(){ return new Date().toLocaleDateString('en-CA'); }

function startSubs(){
  if(!db){ return; }
  db.collection('hosshift_ops').onSnapshot(function(qs){ SO_MAP={}; qs.forEach(function(d){ var v=d.data()||{}; v.date=v.date||d.id; SO_MAP[d.id]=v; }); rerender(); mark(); }, function(){});
  db.collection('hoshouse_requests').onSnapshot(function(qs){ REQ=qs.docs.map(function(d){return d.data()||{};}); rerender(); }, function(){});
  db.collection('hoshouse_deliveries').onSnapshot(function(qs){ DEL=qs.docs.map(function(d){return d.data()||{};}); rerender(); }, function(){});
  db.collection('hosfix_jobs').onSnapshot(function(qs){ MNT=qs.docs.map(function(d){return d.data()||{};}).filter(function(j){return j && !j.demoHidden;}); rerender(); }, function(){});
  db.collection('hoshouse_rooms').where('date','==',todayKey()).onSnapshot(function(qs){ ROOMS_TODAY=qs.docs.map(function(d){var v=d.data()||{};v._id=d.id;return v;}); rerender(); }, function(){});
  db.collection('hosinfo').onSnapshot(function(qs){ INFO=qs.docs.map(function(d){var v=d.data()||{};v.id=d.id;return v;}).sort(function(a,b){return (b.num||0)-(a.num||0);}); rerender(); }, function(){});
  db.collection('hosnotes').onSnapshot(function(qs){ NOTES=qs.docs.map(function(d){var v=d.data()||{};v.id=d.id;return v;}).sort(function(a,b){return (b.createdAt||'').localeCompare(a.createdAt||'');}); rerender(); }, function(){});
  var mon=mondayKey(); db.collection('hosnight_logs').doc('wk_'+mon).onSnapshot(function(s){ var d=s.exists?(s.data()||{}):{}; CLWK={submitted:d.submitted||{}, weekLabel:d.weekLabel||''}; rerender(); }, function(){});
}
function mark(){ var el=$('live-txt'); if(el){ var t=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); el.textContent='Updated '+t; } }
function mondayKey(){ var t=new Date(), d=new Date(t); d.setDate(t.getDate()-((t.getDay()||7)-1)); d.setHours(12,0,0,0); return d.toLocaleDateString('en-CA'); }

function go(tab){ TAB=tab; Array.prototype.forEach.call(document.querySelectorAll('.nav button'),function(b){ b.classList.toggle('on', b.getAttribute('data-tab')===tab); }); window.scrollTo(0,0); rerender(); }
function rerender(){ if($('app').classList.contains('hide')) return; if(TAB==='overview') renderOverview(); else if(TAB==='handover') renderHandover(); else if(TAB==='rooms') renderRooms(); else if(TAB==='info') renderInfo(); }

var SO_TASKS=[{key:'music',label:'Music on',ic:'🎵',dl:[7,15],dltxt:'07:15'},{key:'arrivals',label:'Arrivals allocated',ic:'🛎️',dl:[9,0],dltxt:'09:00'},{key:'checkout',label:'Check-outs chased',ic:'🚪',dl:[11,30],dltxt:'11:30'}];
var SHIFTS={early:{label:'☀️ Early',col:'#b06a00',hours:'7am–3pm'},late:{label:'🌆 Late',col:'#312e81',hours:'3pm–11pm'},night:{label:'🌙 Night',col:'#1a2b3a',hours:'11pm–7am'}};
function shiftNow(){ var h=new Date().getHours(); return (h>=7&&h<15)?'early':(h>=15&&h<23)?'late':'night'; }
function soToday(){ return SO_MAP[todayKey()]||{}; }
function pastDl(dl){ var n=new Date(), d=new Date(); d.setHours(dl[0],dl[1],0,0); return n.getTime()>d.getTime(); }
function greetWord(){ var h=new Date().getHours(); return h<12?'Good morning':h<18?'Good afternoon':'Good evening'; }

/* ---- OVERVIEW ---- */
function renderOverview(){
  var t=soToday();
  var pend=REQ.filter(function(r){return r.status==='pending';}).length;
  var urg=REQ.filter(function(r){return r.status!=='done'&&r.priority==='urgent';}).length;
  var ip=REQ.filter(function(r){return r.status==='in_progress';}).length;
  var mnt=MNT.filter(function(j){var s=(j.status||'').toLowerCase();return s!=='done'&&s!=='closed'&&s!=='complete'&&s!=='completed'&&s!=='resolved';}).length;
  var del=DEL.filter(function(d){var s=(d.status||'').toLowerCase();return !d.collectedAt && s!=='collected';}).length;
  var prio=ROOMS_TODAY.filter(function(r){return r.urgent;});
  var sk=shiftNow(), sd=SHIFTS[sk];

  var stamps=SO_TASKS.map(function(s){
    var c=t[s.key], done=c&&c.at, over=!done&&pastDl(s.dl);
    var cls=done?'done':over?'over':'';
    var rt=done?('<span class="rt">'+esc(c.at)+'<span class="by">'+esc(c.by||'')+'</span></span>'):over?('<span class="rt">⚠ overdue</span>'):('<span class="rt" style="color:var(--muted);font-weight:800">by '+s.dltxt+'</span>');
    return '<div class="stamp '+cls+'"><span class="ic">'+s.ic+'</span><span class="lab">'+esc(s.label)+'</span>'+rt+'</div>';
  }).join('');

  var prioHtml = prio.length ? prio.map(function(r){ return '<div class="prow"><span class="rn">'+esc(r.room||r._id)+'</span><span class="rr">'+esc(r.priorityNote||r.notes||'Priority — flagged by reception')+'</span></div>'; }).join('') : '<div class="empty">No priority rooms flagged today.</div>';

  $('view').innerHTML=
    '<div class="greet">'+greetWord()+', Patrik</div>'+
    '<div class="greet-sub">'+esc(new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}))+'</div>'+
    '<div class="onnow"><div style="font-size:22px">'+(sk==='early'?'☀️':sk==='late'?'🌆':'🌙')+'</div><div><div class="big">On now: '+esc(sd.label.replace(/^\S+\s/,''))+' shift</div><div class="sm">'+sd.hours+'</div></div></div>'+
    '<div class="sec-ttl">⏱️ Today’s shift checks</div>'+stamps+
    '<div class="sec-ttl">📌 Desk at a glance</div>'+
    '<div class="tiles">'+
      tile(pend,'Pending','#5b6b7b')+tile(urg,'Urgent','var(--red)')+tile(ip,'In progress','var(--amber)')+
      tile(mnt,'Maint. open','#c45c00')+tile(del,'Parcels in','#8a6d1f')+tile(prio.length,'Priority','var(--red)')+
    '</div>'+
    '<div class="sec-ttl">🚨 Priority rooms today</div>'+prioHtml;
}
function tile(v,k,c){ return '<div class="tile"><div class="v" style="color:'+c+'">'+v+'</div><div class="k">'+k+'</div></div>'; }

/* ---- HANDOVER ---- */
var HO_OPEN={};
function hoEntries(){
  var map={};
  Object.keys(SO_MAP).forEach(function(dk){ var r=SO_MAP[dk]; if(!r)return; (r.handoverNotes||[]).forEach(function(n){ var sk=n.shift||'late'; var k=dk+'_'+sk; if(!map[k]) map[k]={dk:dk,shift:sk,by:'',notes:[],key:k}; map[k].notes.push({text:n.text,by:n.by,at:n.at}); if(n.by&&!map[k].by) map[k].by=n.by; }); });
  (typeof HANDOVER_SEED!=='undefined'?HANDOVER_SEED:[]).forEach(function(e){ var k=e.dk+'_'+e.shift; if(!map[k]) map[k]={dk:e.dk,shift:e.shift,by:e.by||'',notes:[],key:k}; (e.notes||[]).forEach(function(t){ map[k].notes.push({text:t}); }); if(e.by&&!map[k].by) map[k].by=e.by; });
  var order={early:0,late:1,night:2};
  return Object.keys(map).map(function(k){return map[k];}).filter(function(x){return x.notes.length;})
    .sort(function(a,b){ if(a.dk!==b.dk) return a.dk<b.dk?1:-1; return (order[b.shift]||0)-(order[a.shift]||0); });
}
function renderHandover(){
  var entries=hoEntries().slice(0,200);
  var hoHtml = entries.length ? entries.map(function(e){
    var sd=SHIFTS[e.shift]||SHIFTS.late, open=!!HO_OPEN[e.key];
    var dlabel=e.dk; try{ dlabel=new Date(e.dk+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}); }catch(_){}
    var head='<div class="hh" onclick="hoToggle(\''+e.key+'\')"><span class="tag" style="color:'+sd.col+'">'+sd.label+'</span><span class="dt">'+esc(dlabel)+'</span>'+(e.by?'<span class="ct">· '+esc(e.by)+'</span>':'')+'<span class="ct">'+e.notes.length+' note'+(e.notes.length===1?'':'s')+' '+(open?'▲':'▼')+'</span></div>';
    var body=open?('<div class="bd">'+e.notes.map(function(n){ return '<div class="n">• '+esc(n.text)+((n.by||n.at)?(' <span class="meta">('+esc(n.by||'')+(n.at?(' '+esc(n.at)):'')+')</span>'):'')+'</div>'; }).join('')+'</div>'):'';
    return '<div class="ho" style="border-left-color:'+sd.col+'">'+head+body+'</div>';
  }).join('') : '<div class="empty">No handovers logged yet.</div>';

  // week checklist summary
  var mon=new Date(mondayKey()+'T12:00:00');
  var days=[]; for(var i=0;i<7;i++){ var x=new Date(mon); x.setDate(mon.getDate()+i); days.push(x); }
  var sub=CLWK.submitted||{};
  var rows=days.map(function(x){
    var dk=x.toLocaleDateString('en-CA');
    var lbl=x.toLocaleDateString('en-GB',{weekday:'short',day:'numeric'});
    function cell(sk){ var on=!!sub[dk+'_'+sk]; return '<div class="pill '+(on?'ok':'no')+'">'+(on?'✓':'·')+'</div>'; }
    var isToday=dk===todayKey();
    return '<div class="dl"'+(isToday?' style="color:var(--green)"':'')+'>'+esc(lbl)+(isToday?' •':'')+'</div>'+cell('early')+cell('late')+cell('night');
  }).join('');

  $('view').innerHTML=
    '<div class="greet">Handover</div>'+
    '<div class="greet-sub">Recent shift notes — read-only. Log new notes on the main HosDesk.</div>'+
    '<div class="sec-ttl">✅ Shift checklists submitted · '+esc(CLWK.weekLabel||'this week')+'</div>'+
    '<div class="card"><div class="wkgrid"><div class="hd"></div><div class="hd">Early</div><div class="hd">Late</div><div class="hd">Night</div>'+rows+'</div></div>'+
    '<div class="sec-ttl">🔄 Recent handovers</div>'+hoHtml;
}

function rcVerdict(r){

      if(!s.exists){ html+='<div style="padding:9px 0;border-top:1px solid var(--line);display:flex;gap:10px"><b style="min-width:92px">'+lbl+'</b><span class="muted">no record</span></div>'; return; }
      var r=s.data()||{}; var v=rcVerdict(r); var dur=r.durationSec?(' · '+Math.round(r.durationSec/60)+' min'):'';
      html+='<div style="padding:9px 0;border-top:1px solid var(--line)"><div style="display:flex;gap:10px;align-items:center"><b style="min-width:92px">'+lbl+'</b><span style="background:'+v.bg+';color:'+v.c+';border:1px solid '+v.bd+';border-radius:8px;padding:3px 9px;font-weight:800;font-size:12.5px">'+v.t+'</span></div>'+(r.housekeeper?('<div class="muted" style="font-size:12.5px;margin-top:4px;margin-left:92px">👤 '+esc(r.housekeeper)+dur+'</div>'):'')+(r.urgent?('<div style="font-size:12px;margin-top:3px;margin-left:92px;color:var(--red);font-weight:700">🚨 '+esc(r.priorityNote||'Priority')+'</div>'):'')+'</div>';
    });
    html+='</div>';
    RC_RESULT=html; renderRooms();
  }).catch(function(){ RC_RESULT='<div class="empty">Could not load — check connection.</div>'; renderRooms(); });
}
function rcDayLabel(iso){ try{ var t=todayKey(); var y=new Date(); y.setDate(y.getDate()-1); var yk=y.toLocaleDateString('en-CA'); if(iso===t)return 'Today'; if(iso===yk)return 'Yesterday'; return new Date(iso+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}); }catch(e){ return iso; } }

/* ---- INFO ---- */
function renderInfo(){
  var q=(window._infoQ||'').toLowerCase().trim();
  var rows=INFO.filter(function(r){ if(!q)return true; var hay=((r.title||'')+' '+(r.body||'')+' '+(r.keywords||'')+' #'+(r.num||'')).toLowerCase(); return hay.indexOf(q)>-1; });
  var infoHtml = rows.length ? rows.map(function(r){
    var acks=r.acks||[], map={}; acks.forEach(function(a){ if(a&&a.name) map[a.name]=1; }); var names=Object.keys(map);
    var signed=names.indexOf('Patrik')>-1;
    var keys=(r.keywords||'').split(',').map(function(x){return x.trim();}).filter(Boolean);
    return '<div class="inf"><div class="top"><div class="num">'+(r.num||'•')+'</div><div style="flex:1;min-width:0"><div class="ti">'+esc(r.title||'')+'</div><div class="bo">'+esc(r.body||'')+'</div>'+(keys.length?('<div>'+keys.map(function(k){return '<span class="kw">'+esc(k)+'</span>';}).join('')+'</div>'):'')+'</div></div>'+
      '<div class="readby">'+(names.length?('✓ Read by '+names.map(esc).join(', ')):'<span class="muted">Not yet signed by anyone.</span>')+'</div>'+
      (signed?'<div class="readby" style="color:var(--green);font-weight:800">✓ You have signed this</div>':'<div class="sign"><select id="iw-'+r.id+'"><option value="Patrik">Patrik</option>'+PEOPLE.filter(function(n){return n!=='Patrik';}).map(function(n){return '<option>'+esc(n)+'</option>';}).join('')+'</select><button onclick="infoSign(\''+r.id+'\')">✓ I have read this</button></div>')+
    '</div>';
  }).join('') : '<div class="empty">'+(q?'No information matches your search.':'No information posted yet.')+'</div>';

  var notesHtml = NOTES.length ? NOTES.slice(0,40).map(function(n){
    var who=n.to&&n.to!=='Everyone'?('→ '+esc(n.to)):'👥 Everyone';
    var done=n.done?' <span style="color:var(--green);font-weight:800">· done</span>':'';
    return '<div class="note"'+(n.important?' style="border-left-color:var(--red);background:#fff6f5"':'')+'><div class="nt">'+(n.important?'⚑ ':'')+esc(n.text||'')+'</div><div class="nm">'+esc(n.from||'')+' '+who+done+'</div></div>';
  }).join('') : '<div class="empty">No notes right now.</div>';

  $('view').innerHTML=
    '<div class="greet">Information</div>'+
    '<div class="greet-sub">Standing notices to read &amp; sign, plus the reception notes board.</div>'+
    '<input class="srch" id="info-q" type="text" placeholder="🔍 Search information…" value="'+esc(window._infoQ||'')+'">'+
    '<div class="sec-ttl">ℹ️ Information for Reception</div>'+infoHtml+
    '<div class="sec-ttl">📝 Notes board</div>'+notesHtml;
  var qi=$('info-q'); if(qi){ qi.addEventListener('input',function(){ window._infoQ=qi.value; var s=qi.selectionStart; renderInfo(); try{ var n=$('info-q'); n.focus(); n.setSelectionRange(s,s); }catch(e){} }); }
}
function infoSign(id){
  var sel=$('iw-'+id); var name=sel?sel.value:'Patrik'; if(!name){ toast('Pick your name'); return; }
  if(!db){ toast('Offline'); return; }
  db.collection('hosinfo').doc(id).set({acks:firebase.firestore.FieldValue.arrayUnion({name:name,at:new Date().toISOString()})},{merge:true})
    .then(function(){ toast('✓ Signed — thank you '+name); }).catch(function(){ toast('Could not save'); });
}

/* ---- SW + go ---- */
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('hosdesk-mobile-sw.js').catch(function(){}); }catch(e){} }
boot();
</script>
