<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a2b3a">
<title>Your Quote — Brandon Hall Hotel and Spa</title>
<meta property="og:title" content="Your Quote — Brandon Hall Hotel and Spa">
<meta property="og:description" content="Please review and accept your event quote.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1a2b3a;--gold:#c9a978;--paper:#f6f8f9;--ink:#2a3644;--line:#e3e7ee}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lato',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55}
.bar{background:var(--navy);color:#fff;text-align:center;padding:18px}
.bar .logo{font-family:'Cormorant Garamond',serif;font-size:26px;letter-spacing:5px;font-weight:600}
.bar .sub{font-size:11px;letter-spacing:4px;color:var(--gold);font-weight:700}
.wrap{max-width:820px;margin:0 auto;padding:24px 18px 60px}
.doc{background:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(26,43,58,.1);padding:34px;margin-top:20px}
h1{font-family:'Cormorant Garamond',serif;font-size:30px;text-align:center;color:var(--navy);margin:6px 0 16px}
h2{font-family:'Cormorant Garamond',serif;font-size:21px;color:var(--navy);margin:24px 0 10px;border-bottom:2px solid #eef2f4;padding-bottom:5px}
.intro{font-size:14.5px;margin-bottom:16px}
.details{width:100%;border-collapse:collapse;font-size:14.5px}
.details td{padding:9px 10px;border-bottom:1px solid var(--line)}
.details td:first-child{color:#7a8494;width:42%}
.total{font-size:20px;font-weight:700;color:var(--navy);text-align:right;margin-top:16px;padding:14px;background:var(--paper);border-radius:10px}
.terms{column-count:2;column-gap:24px;font-size:10px;line-height:1.5;margin-top:8px}
.term{break-inside:avoid;margin-bottom:9px}.term b{color:var(--navy);font-size:10.5px;display:block}.term p{margin:2px 0 0;color:#4a5560}
.accept-card{background:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(26,43,58,.1);padding:30px;margin-top:20px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin:16px 0;cursor:pointer}
.consent input{margin-top:3px}
.btn{display:block;width:100%;background:var(--gold);color:var(--navy);border:none;padding:15px;border-radius:10px;font:700 16px 'Lato';cursor:pointer;transition:.15s}
.btn:hover{background:#b89355}.btn:disabled{opacity:.5;cursor:not-allowed}
.status{text-align:center;padding:20px;border-radius:12px;margin-top:20px;font-size:15px}
.status.done{background:#e8f3ee;color:#2a6a4a}
.msg{font-size:13px;text-align:center;margin-top:10px;color:#b3261e}
.loading{text-align:center;padding:60px 20px;color:#7a8494}
.print-link{text-align:center;margin-top:16px}.print-link a{color:#2f6f9e;font-size:13px;text-decoration:underline;cursor:pointer}
.hero{position:relative;height:360px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.hero-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(16,29,51,.85),rgba(16,29,51,.15))}
.hero-txt{position:absolute;left:0;right:0;bottom:0;padding:32px;max-width:820px;margin:0 auto}
.hero-eyebrow{color:var(--gold);font-size:13px;letter-spacing:3px;font-weight:700}
.hero-title{font-family:'Cormorant Garamond',serif;font-size:42px;color:#fff;font-weight:600;margin:6px 0}
.hero-for{color:#dbe3ec;font-size:15px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.facts div{background:var(--paper);border-radius:10px;padding:14px;text-align:center}
.facts b{display:block;font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--navy)}
.facts span{font-size:11px;color:#7a8494}
.why{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.why-i{background:var(--paper);border-radius:10px;padding:16px}
.why-i b{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--navy)}
.why-i p{font-size:13px;color:#4a5560;margin-top:4px}
.space{display:flex;gap:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.space-img{width:200px;height:150px;object-fit:cover;flex-shrink:0}
.space-body{padding:14px 16px 14px 0;flex:1}
.space-body h3{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--navy);margin-bottom:3px}
.space-body h3 span{font-size:13px;color:#7a8494;font-weight:400}
.space-meta{font-size:12.5px;color:#7a8494;margin-bottom:8px}
.space-pkg{font-size:13.5px;font-weight:700;color:var(--navy)}
.space-inc{margin-top:6px;padding-left:0;list-style:none;columns:2;font-size:12px;color:#4a5560}
.space-inc li::before{content:"✓ ";color:var(--gold)}
.space-menu{margin-top:8px}.space-menu b{font-size:12.5px;color:var(--navy)}
.gallery{display:flex;gap:8px;margin:14px 0}
.gallery img{flex:1;height:130px;object-fit:cover;border-radius:8px}
.cost{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.cost td,.cost th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
.cost th{font-size:11px;color:#7a8494;font-weight:600}
.cost .r{text-align:right}
.cost-sub{color:#7a8494;font-size:12px}
.cost-total td{border-top:2px solid var(--navy);border-bottom:none;font-weight:700;font-size:16px}
.carbon{background:#eef5ec;border-radius:8px;padding:11px 14px;color:#4a6147;font-size:12.5px;margin-top:12px}
.opt-intro{font-size:14px;color:var(--ink);margin-bottom:14px}
.qopt{border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:14px}
.qopt.pick{border-color:var(--gold);box-shadow:0 6px 20px rgba(201,169,120,.15)}
.qopt-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.qopt-h h3{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--navy)}
.qopt-tag{font-size:11px;font-weight:700;background:#e6f6f4;color:#159187;padding:3px 10px;border-radius:12px}
.hotel-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.hotel-links a{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:8px 16px;font-size:13px;font-weight:600;color:var(--navy)}
.hotel-links a:hover{border-color:var(--gold);color:var(--gold-dk,#b89355)}
.addr{text-align:center;font-size:12px;color:#8a97ab;margin-top:20px;padding-bottom:10px}
@media(max-width:600px){.hero-title{font-size:30px}.facts,.why{grid-template-columns:1fr 1fr}.space{flex-direction:column}.space-img{width:100%;height:170px}.space-body{padding:0 16px 14px}.space-inc,.gallery{columns:1}}
@media(max-width:600px){.terms{column-count:1}.doc,.accept-card{padding:22px}}
</style>
</head>
<body>
<div class="bar"><div class="logo">BRANDON HALL</div><div class="sub">HOTEL AND SPA</div></div>
<div class="wrap" id="root"><div class="loading">Loading your quote…</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="data.js"></script>
<script>
const $=s=>document.querySelector(s);
let db=null,auth=null;
try{ if(typeof firebase!=="undefined" && firebaseConfig && !firebaseConfig.apiKey.startsWith("YOUR_")){
  firebase.initializeApp(firebaseConfig); db=firebase.firestore(); auth=firebase.auth(); } }catch(e){}
const params=new URLSearchParams(location.search), qid=params.get("q");
const money=v=>"£"+(Math.round(v)||0).toLocaleString();
const fmt=d=>d&&/^\d{4}-\d{2}-\d{2}/.test(d)?new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}):(d||"—");

async function load(){
  if(!qid){ $("#root").innerHTML=`<div class="doc"><p>No quote reference provided.</p></div>`; return; }
  let q=null;
  if(db){ if(auth && !auth.currentUser){ try{ await auth.signInAnonymously(); }catch(e){} }
    try{ const d=await db.collection("quotes").doc(qid).get(); if(d.exists) q={id:d.id,...d.data()}; }catch(e){ console.warn(e.message); } }
  if(!q){ const l=JSON.parse(localStorage.getItem("bh_quotes")||"[]"); q=l.find(x=>x.id===qid); }
  if(!q){ $("#root").innerHTML=`<div class="doc"><p>Sorry, we couldn't find this quote. Please contact our events team.</p></div>`; return; }
  render(q);
}
function termsHTML(){ return (typeof CONTRACT_TERMS==="undefined")?"":CONTRACT_TERMS.map(t=>`<div class="term"><b>${t.h}</b><p>${t.t}</p></div>`).join(""); }

function render(q){
  const accepted=!!q.acceptedBy;
  const total = q.subtotal!=null ? q.subtotal : q.value;
  const hero = q.hero || (q.gallery&&q.gallery[0]) || "";
  // rooms/spaces
  const roomsHTML = (q.rooms&&q.rooms.length) ? q.rooms.map(r=>`
    <div class="space">
      ${r.img?`<img class="space-img" src="${r.img}" onerror="this.style.display='none'">`:""}
      <div class="space-body">
        <h3>${r.name} ${r.date?`<span>· ${fmt(r.date)}</span>`:""}</h3>
        <div class="space-meta">${[r.fn,r.pax?r.pax+" guests":"",r.m2?r.m2+" m²":"",r.layout].filter(Boolean).join(" · ")}</div>
        ${r.pkg?`<div class="space-pkg">${r.pkg.name}${r.pkg.from?` — from ${money(r.pkg.from)}pp`:""}</div>
          ${r.pkg.inc&&r.pkg.inc.length?`<ul class="space-inc">${r.pkg.inc.slice(0,6).map(i=>`<li>${i}</li>`).join("")}</ul>`:""}`:""}
        ${r.menu&&r.menu.length?`<div class="space-menu"><b>Menu selections</b><ul class="space-inc">${r.menu.map(m=>`<li>${m}</li>`).join("")}</ul></div>`:""}
      </div>
    </div>`).join("") : "";
  // itemised costs OR multiple options
  let costHTML;
  if(q.options && q.options.length){
    costHTML = `<p class="opt-intro">We've prepared ${q.options.length} option${q.options.length>1?"s":""} for you — please review and select the one that suits you best.</p>` +
      q.options.map((o,i)=>`<div class="qopt ${i===q.options.length-1?"pick":""}">
        <div class="qopt-h"><h3>${o.label}</h3>${i===q.options.length-1?`<span class="qopt-tag">Best value</span>`:""}</div>
        <table class="cost">${o.lines.map(l=>`<tr><td>${l.label}${l.sub?` <span class="cost-sub">${l.sub}</span>`:""}</td><td class="r">${money(l.amt)}</td></tr>`).join("")}
          <tr class="cost-total"><td>Total (inc. VAT where applicable)</td><td class="r">${money(o.subtotal)}</td></tr></table>
      </div>`).join("");
  } else {
    costHTML = (q.lines&&q.lines.length) ? `<table class="cost">
      ${q.lines.map(l=>`<tr><td>${l.label}${l.sub?` <span class="cost-sub">${l.sub}</span>`:""}</td><td class="r">${money(l.amt)}</td></tr>`).join("")}
      <tr class="cost-total"><td>Total (inc. VAT where applicable)</td><td class="r">${money(total)}</td></tr>
    </table>` : `<div class="total">Total: ${money(total)} <span style="font-size:13px;font-weight:400;color:#7a8494">(inc. VAT)</span></div>`;
  }
  // payment schedule
  const payHTML = (q.payments&&q.payments.length) ? `<h2>Payment schedule</h2>
    <table class="cost"><tr><th>Instalment</th><th>Due</th><th class="r">Amount</th></tr>
      ${q.payments.map(p=>`<tr><td>${p.label||""}</td><td>${p.due&&/^\d{4}-\d{2}-\d{2}/.test(p.due)?fmt(p.due):"On confirmation"}</td><td class="r">${money(p.amount)}</td></tr>`).join("")}
    </table>` : "";
  // gallery
  const galHTML = (q.gallery&&q.gallery.length) ? `<div class="gallery">${q.gallery.map(u=>`<img src="${u}" onerror="this.style.display='none'">`).join("")}</div>` : "";

  $("#root").innerHTML=`
    ${hero?`<div class="hero"><img src="${hero}" onerror="this.style.display='none'"><div class="hero-ov"></div>
      <div class="hero-txt"><div class="hero-eyebrow">BRANDON HALL HOTEL AND SPA</div>
        <div class="hero-title">${q.eventType||"Event"} Proposal</div>
        <div class="hero-for">Prepared for ${q.client||"you"}${q.company?" · "+q.company:""}</div></div></div>`:""}

    <div class="doc">
      <h1>Your event at Brandon Hall</h1>
      <p class="intro">Dear ${(q.client||"Guest").split(" ")[0]}, thank you for your interest in Brandon Hall Hotel and Spa. We'd love to host your ${(q.eventType||"event").toLowerCase()}. Please find your full proposal below — everything's here to review, and you can accept online when you're ready.</p>
      ${galHTML}
      <div class="facts">
        <div><b>${q.rooms?q.rooms.length:1}</b><span>${q.rooms&&q.rooms.length>1?"Spaces":"Space"}</span></div>
        <div><b>${q.pax||"—"}</b><span>Guests</span></div>
        <div><b>${fmt(q.eventDate)}</b><span>Date</span></div>
        <div><b>${q.ref||q.id}</b><span>Reference</span></div>
      </div>

      <h2>Why Brandon Hall</h2>
      <div class="why">
        <div class="why-i"><b>Exclusive feel, sensible price</b><p>A stunning country-house setting that feels exclusively yours.</p></div>
        <div class="why-i"><b>Everyone under one roof</b><p>Beautiful accommodation so friends and family can stay and celebrate together.</p></div>
        <div class="why-i"><b>Tailored to you</b><p>Be as selective or extravagant as you like — every event is bespoke.</p></div>
        <div class="why-i"><b>All in one place</b><p>Ceremony, dining and celebration, all under one roof.</p></div>
      </div>

      ${roomsHTML?`<h2>Your spaces</h2>${roomsHTML}`:""}

      <h2>${q.options&&q.options.length?"Your options":"Your proposal"}</h2>
      ${costHTML}
      <div class="carbon">🌱 Estimated event carbon footprint: <b>${q.carbon?q.carbon.total:"—"} kg CO₂e</b> across all spaces — we're committed to sustainable events.</div>

      ${payHTML}

      <h2>Terms &amp; Conditions</h2>
      <div class="terms">${termsHTML()}</div>

      <div class="hotel-links">
        <a href="https://www.brandonhallhotelandspa.com" target="_blank">Visit our website</a>
        <a href="https://www.google.com/maps/search/Brandon+Hall+Hotel+and+Spa+Coventry" target="_blank">Directions &amp; map</a>
        <a href="mailto:events@brandonhallhotelandspa.com">Email the events team</a>
        <a href="tel:+442477102555">Call +44 (0)247 710 2555</a>
      </div>
    </div>

    <div class="accept-card" id="acceptcard">${acceptBody(q, accepted)}</div>
    <div class="print-link"><a onclick="window.print()">Print / save a copy</a></div>
    <div class="addr">Brandon Hall Hotel and Spa · Main Street, Brandon, Coventry CV8 3FW · +44 (0)247 710 2555</div>`;
  wire(q, accepted);
}
function acceptBody(q, accepted){
  if(accepted){
    return `<div class="status done">✓ Thank you, ${(q.acceptedBy||"").split(" ")[0]} — you accepted this proposal on ${fmt(q.acceptedDate)}. Our team will now prepare your agreement to sign.</div>`;
  }
  return `<h2 style="margin-top:0">Accept your proposal</h2>
    <p style="font-size:14px">By accepting, you confirm you're happy to proceed on the basis of this proposal and its terms. We'll then send you a formal agreement to sign.</p>
    <div style="margin:14px 0"><label style="display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:6px">Your name</label>
      <input id="a-name" style="width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:9px;font-size:16px;font-family:inherit" placeholder="Your name" value="${q.client||""}"></div>
    <label class="consent"><input type="checkbox" id="a-consent"> <span>I confirm I am happy to accept this quotation and proceed to agreement.</span></label>
    <button class="btn" id="a-accept" disabled>Accept quote</button>
    <div class="msg" id="a-msg"></div>`;
}
function wire(q, accepted){
  if(accepted) return;
  const cs=$("#a-consent"), btn=$("#a-accept");
  if(cs) cs.onchange=()=>btn.disabled=!cs.checked;
  if(btn) btn.onclick=async()=>{
    const name=$("#a-name").value.trim();
    if(!name){ $("#a-msg").textContent="Please type your name."; return; }
    btn.disabled=true;
    const patch={ acceptedBy:name, acceptedDate:new Date().toISOString().slice(0,10), acceptedAt:new Date().toISOString(), status:"accepted" };
    let ok=false;
    if(db){ try{ await db.collection("quotes").doc(q.id).update(patch); ok=true; }catch(e){ console.warn(e.message); } }
    if(!ok){ const l=JSON.parse(localStorage.getItem("bh_quotes")||"[]"); const i=l.findIndex(x=>x.id===q.id); if(i>=0){ Object.assign(l[i],patch); localStorage.setItem("bh_quotes",JSON.stringify(l)); } }
    Object.assign(q,patch);
    $("#acceptcard").innerHTML=acceptBody(q,true);
  };
}
load();
</script>
</body>
</html>
