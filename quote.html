<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a2b3a">
<title>Your Quote — Brandon Hall Hotel and Spa</title>
<meta property="og:title" content="Your Quote — Brandon Hall Hotel and Spa">
<meta property="og:description" content="Please review and accept your event quote.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1a2b3a;--gold:#c9a978;--paper:#f6f8f9;--ink:#2a3644;--line:#e3e7ee}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lato',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55}
.bar{background:var(--navy);color:#fff;text-align:center;padding:18px}
.bar .logo{font-family:'Cormorant Garamond',serif;font-size:26px;letter-spacing:5px;font-weight:600}
.bar .sub{font-size:11px;letter-spacing:4px;color:var(--gold);font-weight:700}
.wrap{max-width:820px;margin:0 auto;padding:24px 18px 60px}
.doc{background:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(26,43,58,.1);padding:34px;margin-top:20px}
h1{font-family:'Cormorant Garamond',serif;font-size:30px;text-align:center;color:var(--navy);margin:6px 0 16px}
h2{font-family:'Cormorant Garamond',serif;font-size:21px;color:var(--navy);margin:24px 0 10px;border-bottom:2px solid #eef2f4;padding-bottom:5px}
.intro{font-size:14.5px;margin-bottom:16px}
.details{width:100%;border-collapse:collapse;font-size:14.5px}
.details td{padding:9px 10px;border-bottom:1px solid var(--line)}
.details td:first-child{color:#7a8494;width:42%}
.total{font-size:20px;font-weight:700;color:var(--navy);text-align:right;margin-top:16px;padding:14px;background:var(--paper);border-radius:10px}
.terms{column-count:2;column-gap:24px;font-size:10px;line-height:1.5;margin-top:8px}
.term{break-inside:avoid;margin-bottom:9px}.term b{color:var(--navy);font-size:10.5px;display:block}.term p{margin:2px 0 0;color:#4a5560}
.accept-card{background:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(26,43,58,.1);padding:30px;margin-top:20px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin:16px 0;cursor:pointer}
.consent input{margin-top:3px}
.btn{display:block;width:100%;background:var(--gold);color:var(--navy);border:none;padding:15px;border-radius:10px;font:700 16px 'Lato';cursor:pointer;transition:.15s}
.btn:hover{background:#b89355}.btn:disabled{opacity:.5;cursor:not-allowed}
.status{text-align:center;padding:20px;border-radius:12px;margin-top:20px;font-size:15px}
.status.done{background:#e8f3ee;color:#2a6a4a}
.msg{font-size:13px;text-align:center;margin-top:10px;color:#b3261e}
.loading{text-align:center;padding:60px 20px;color:#7a8494}
.print-link{text-align:center;margin-top:16px}.print-link a{color:#2f6f9e;font-size:13px;text-decoration:underline;cursor:pointer}
@media(max-width:600px){.terms{column-count:1}.doc,.accept-card{padding:22px}}
</style>
</head>
<body>
<div class="bar"><div class="logo">BRANDON HALL</div><div class="sub">HOTEL &amp; SPA</div></div>
<div class="wrap" id="root"><div class="loading">Loading your quote…</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="data.js"></script>
<script>
const $=s=>document.querySelector(s);
let db=null,auth=null;
try{ if(typeof firebase!=="undefined" && firebaseConfig && !firebaseConfig.apiKey.startsWith("YOUR_")){
  firebase.initializeApp(firebaseConfig); db=firebase.firestore(); auth=firebase.auth(); } }catch(e){}
const params=new URLSearchParams(location.search), qid=params.get("q");
const money=v=>"£"+(Math.round(v)||0).toLocaleString();
const fmt=d=>d&&/^\d{4}-\d{2}-\d{2}/.test(d)?new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}):(d||"—");

async function load(){
  if(!qid){ $("#root").innerHTML=`<div class="doc"><p>No quote reference provided.</p></div>`; return; }
  let q=null;
  if(db){ if(auth && !auth.currentUser){ try{ await auth.signInAnonymously(); }catch(e){} }
    try{ const d=await db.collection("quotes").doc(qid).get(); if(d.exists) q={id:d.id,...d.data()}; }catch(e){ console.warn(e.message); } }
  if(!q){ const l=JSON.parse(localStorage.getItem("bh_quotes")||"[]"); q=l.find(x=>x.id===qid); }
  if(!q){ $("#root").innerHTML=`<div class="doc"><p>Sorry, we couldn't find this quote. Please contact our events team.</p></div>`; return; }
  render(q);
}
function termsHTML(){ return (typeof CONTRACT_TERMS==="undefined")?"":CONTRACT_TERMS.map(t=>`<div class="term"><b>${t.h}</b><p>${t.t}</p></div>`).join(""); }

function render(q){
  const accepted=!!q.acceptedBy;
  $("#root").innerHTML=`
    <div class="doc">
      <h1>Event Quotation</h1>
      <p class="intro">Dear ${(q.client||"Guest").split(" ")[0]}, thank you for your interest in Brandon Hall Hotel and Spa. Please find your quotation below. Accepting this quote lets us prepare your formal agreement to sign.</p>
      <table class="details">
        <tr><td>Client / Organisation</td><td>${q.client||"—"}</td></tr>
        <tr><td>Event</td><td>${q.eventType||"—"}</td></tr>
        <tr><td>Date</td><td>${fmt(q.eventDate)}</td></tr>
        <tr><td>Space</td><td>${q.room||"—"}</td></tr>
        <tr><td>Guests</td><td>${q.pax||"—"}</td></tr>
        <tr><td>Quote reference</td><td>${q.ref||q.id}</td></tr>
      </table>
      <div class="total">Total: ${money(q.value)} <span style="font-size:13px;font-weight:400;color:#7a8494">(inc. VAT)</span></div>
      <h2>Terms &amp; Conditions</h2>
      <div class="terms">${termsHTML()}</div>
    </div>
    <div class="accept-card" id="acceptcard">${acceptBody(q, accepted)}</div>
    <div class="print-link"><a onclick="window.print()">Print / save a copy</a></div>`;
  wire(q, accepted);
}
function acceptBody(q, accepted){
  if(accepted){
    return `<div class="status done">✓ Thank you, ${(q.acceptedBy||"").split(" ")[0]} — you accepted this quote on ${fmt(q.acceptedDate)}. Our team will now prepare your agreement to sign.</div>`;
  }
  return `<h2 style="margin-top:0">Accept your quote</h2>
    <p style="font-size:14px">By accepting, you confirm you're happy to proceed on the basis of this quotation and its terms. We'll then send you a formal agreement to sign.</p>
    <div style="margin:14px 0"><label style="display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:6px">Your name</label>
      <input id="a-name" style="width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:9px;font-size:16px;font-family:inherit" placeholder="Your name" value="${q.client||""}"></div>
    <label class="consent"><input type="checkbox" id="a-consent"> <span>I confirm I am happy to accept this quotation and proceed to agreement.</span></label>
    <button class="btn" id="a-accept" disabled>Accept quote</button>
    <div class="msg" id="a-msg"></div>`;
}
function wire(q, accepted){
  if(accepted) return;
  const cs=$("#a-consent"), btn=$("#a-accept");
  if(cs) cs.onchange=()=>btn.disabled=!cs.checked;
  if(btn) btn.onclick=async()=>{
    const name=$("#a-name").value.trim();
    if(!name){ $("#a-msg").textContent="Please type your name."; return; }
    btn.disabled=true;
    const patch={ acceptedBy:name, acceptedDate:new Date().toISOString().slice(0,10), acceptedAt:new Date().toISOString(), status:"accepted" };
    let ok=false;
    if(db){ try{ await db.collection("quotes").doc(q.id).update(patch); ok=true; }catch(e){ console.warn(e.message); } }
    if(!ok){ const l=JSON.parse(localStorage.getItem("bh_quotes")||"[]"); const i=l.findIndex(x=>x.id===q.id); if(i>=0){ Object.assign(l[i],patch); localStorage.setItem("bh_quotes",JSON.stringify(l)); } }
    Object.assign(q,patch);
    $("#acceptcard").innerHTML=acceptBody(q,true);
  };
}
load();
</script>
</body>
</html>
