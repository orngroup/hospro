<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a2b3a">
<title>HosHouse</title>
<link rel="manifest" href="/hoshouse-manifest.json">
<style>
  :root{--navy:#1a2b3a;--gold:#b89056;--ink:#1f2a37;--line:#dfe4ea;--bg:#eef1f5;--muted:#6b7280;
    --ok:#2a6a4a;--amber:#9c5a00;--red:#b3261e;--dep:#1f7a8c;--stay:#4a86c7;--arr:#2a6a4a;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .screen{display:none;min-height:100vh} .screen.on{display:block}
  header{background:var(--navy);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}
  header .t{font-weight:700;font-size:16px}
  header .u{font-size:12px;color:#aebdce}
  .wrap{max-width:720px;margin:0 auto;padding:16px}
  /* login */
  .lg{max-width:420px;margin:7vh auto;padding:24px;text-align:center}
  .lg .bh-logo{height:88px;width:auto;margin:0 auto 6px;display:block}
  .lg h1{font:800 21px inherit;color:var(--navy);margin:6px 0 4px;letter-spacing:.3px}
  .lg p{color:var(--muted);font-size:14px;margin:0 0 18px}
  select,input{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:11px;font:16px inherit;margin-bottom:12px}
  .btn{width:100%;padding:14px;border:none;border-radius:12px;font:800 16px inherit;cursor:pointer;background:var(--navy);color:#fff}
  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 14px}
  .pinpad button{padding:16px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font:800 20px inherit;cursor:pointer}
  .pindisp{font:800 28px inherit;letter-spacing:10px;min-height:34px;color:var(--navy)}
  /* rooms */
  .sect{font:800 13px inherit;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:16px 2px 8px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .rnote{flex-basis:100%;background:#fff7e8;border:1px solid #f0d9ad;color:#7a5a1e;border-radius:9px;padding:8px 11px;font-size:13px;font-weight:600;margin-top:2px}
  .rmno{font:800 22px inherit;color:var(--navy);min-width:52px}
  .pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;color:#fff}
  .pill.dep{background:var(--dep)} .pill.stay{background:var(--stay)} .pill.arr{background:var(--arr)}
  .grow{flex:1} .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .go{padding:11px 16px;border:none;border-radius:10px;background:var(--ok);color:#fff;font:800 14px inherit;cursor:pointer}
  .ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .done{color:var(--ok);font-weight:800;font-size:13px}
  /* active room */
  .timer{font:800 40px inherit;text-align:center;margin:6px 0}
  .timer.amber{color:var(--amber)} .timer.red{color:var(--red)}
  .chk{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0}
  .chk label{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:12px;font-size:15px;cursor:pointer}
  .chk input{width:22px;height:22px;margin:0;flex:0 0 auto}
  .chk label.ok{border-color:var(--ok);background:#ecf6f0}
  .geo{font-size:12px;color:var(--muted);text-align:center;margin:8px 0}
  .warn{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;border-radius:9px;padding:9px 12px;font-size:13px;margin:10px 0}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
  .logsec{margin:2px 0 14px;display:flex;flex-direction:column;gap:5px}
  .loglbl{font:700 13px inherit;color:var(--ink);margin-top:8px}
  .loglbl span{font-weight:500;color:var(--muted);font-size:12px}
  .loginp{padding:11px;border:1.5px solid var(--line);border-radius:10px;font:15px inherit;margin:0;width:100%}
  .tvrow{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .tvname{font:800 15px inherit;color:var(--navy)}
  .tvbar{height:9px;border-radius:5px;background:#eef1f5;overflow:hidden;margin-top:7px}
  .tvroom{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;margin:4px 4px 0 0}
  .tvtile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .tvtile b{display:block;font:800 22px inherit}
  .tvtile span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="screen on" id="scr-login">
  <div class="lg">
    <img src="bh-logo.svg" alt="Brandon Hall Hotel & Spa" class="bh-logo" onerror="this.style.display='none'">
    <h1>HosHOUSE Management</h1>
    <p>Select your name and enter your code</p>
    <select id="who"><option value="">Select your name…</option></select>
    <div class="pindisp" id="pindisp"></div>
    <div class="pinpad" id="pinpad"></div>
    <button class="btn" id="loginBtn" disabled onclick="doLogin()">Start</button>
    <div id="lgmsg" style="color:var(--red);font-size:13px;min-height:18px;margin-top:8px"></div>
  </div>
</div>

<!-- ROOM LIST -->
<div class="screen" id="scr-list">
  <header><div><div class="t">🧹 My rooms</div><div class="u" id="hdr-date"></div></div>
    <div style="display:flex;gap:14px;align-items:center">
      <div class="u" id="hdr-team" onclick="showTeam()" style="cursor:pointer;display:none">👁 Team</div>
      <div class="u" id="hdr-user" onclick="logout()" style="cursor:pointer">Sign out</div>
    </div></header>
  <div class="wrap" id="listWrap"></div>
</div>

<!-- TEAM VIEW (leads only) -->
<div class="screen" id="scr-team">
  <header><div><div class="t">👁 Manager view</div><div class="u" id="tm-date"></div></div>
    <div class="u" onclick="showScreen('scr-list');renderList()" style="cursor:pointer">← My rooms</div></header>
  <div class="wrap">
    <div id="lead-tools" style="display:none;background:#fff;border:1px solid #e4e9ef;border-radius:12px;padding:12px 13px;margin-bottom:12px">
      <div style="font-weight:800;color:#1F3864;margin-bottom:9px">🛠 Manager tools</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
        <input id="lead-add" inputmode="numeric" placeholder="Room numbers e.g. 101 102" style="flex:1;min-width:150px;padding:10px;border:1px solid #d7dde4;border-radius:9px;font-size:15px">
        <select id="lead-type" style="padding:10px;border:1px solid #d7dde4;border-radius:9px;font-size:15px"><option>Departure</option><option>Stayover</option><option>Arrival-ready</option></select>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button onclick="leadAddRooms(false)" style="flex:1;min-width:120px;padding:10px;border:1px solid #2E6B5E;background:#fff;color:#2E6B5E;border-radius:9px;font-weight:700;font-size:13px">+ Add</button>
        <button onclick="leadAddRooms(true)" style="flex:1;min-width:150px;padding:10px;border:none;background:#2E6B5E;color:#fff;border-radius:9px;font-weight:700;font-size:13px">+ Add &amp; give to lightest</button>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
        <button onclick="leadAllocateAll()" style="flex:1;min-width:140px;padding:10px;border:none;background:#1F3864;color:#fff;border-radius:9px;font-weight:800;font-size:13px">⚖️ Allocate all</button>
        <button onclick="leadAddAreas()" style="flex:1;min-width:120px;padding:10px;border:1px solid #d7dde4;background:#fff;color:#1a2b3a;border-radius:9px;font-weight:700;font-size:13px">🧼 Public areas</button>
      </div>
      <div id="lead-msg" style="font-size:12.5px;color:#2a6a4a;font-weight:700;margin-top:7px;min-height:16px"></div>
    </div>
    <div id="teamWrap"></div>
  </div>
</div>

<!-- ACTIVE ROOM -->
<div class="screen" id="scr-room">
  <header><div><div class="t" id="rm-title">Room</div><div class="u" id="rm-type"></div></div>
    <div class="u" onclick="backToList()" style="cursor:pointer">← Back</div></header>
  <div class="wrap">
    <div class="timer" id="rm-timer">00:00</div>
    <div class="rnote" id="rm-note" style="display:none"></div>
    <div class="geo" id="rm-geo"></div>
    <div id="rm-warn"></div>
    <div class="chk" id="rm-chk"></div>
    <div id="rm-logs"></div>
    <button class="btn" id="rm-finish" style="background:var(--ok)" onclick="finishRoom()">Finish &amp; sign off room</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="hoshouse-config.js"></script>
<script>
  const $=id=>document.getElementById(id);
  const DEFT={Departure:'dep',Stayover:'stay','Arrival-ready':'arr'}, LET={Departure:'Departure',Stayover:'Stayover','Arrival-ready':'Arrival-ready'};
  let ME=null, rooms=[], unwatch=null, active=null, tmr=null, pinBuf='', prevSnap=null, STARS={}, starUnwatch=null;
  const today=HH.todayISO();

  // ---- performance stars (managers rate 1–5; shared + live) ----
  function starsFor(hkId){ return STARS[hkId]||0; }
  function starsHTML(hkId, editable){
    let s=''; const n=starsFor(hkId);
    for(let i=1;i<=5;i++){ const on=i<=n;
      s+=`<span ${editable?`onclick="setStar('${hkId}',${i})"`:''} style="font-size:19px;line-height:1;cursor:${editable?'pointer':'default'};color:${on?'#f0a500':'#cfd6de'}">★</span>`; }
    return `<span style="display:inline-flex;gap:1px;align-items:center">${s}</span>`;
  }
  async function setStar(hkId,n){ if(!(ME&&ME.lead))return; STARS[hkId]=(STARS[hkId]===n?0:n); await saveStars(); renderTeam(); }
  async function loadStars(){
    if(HH.ready&&HH.db){ try{ const d=await HH.db.collection('hoshouse_config').doc('stars__'+today).get(); if(d.exists) return d.data().stars||{}; }catch(e){} }
    try{ return JSON.parse(localStorage.getItem('hoshouse_stars_'+today)||'{}'); }catch(e){ return {}; }
  }
  async function saveStars(){
    try{ localStorage.setItem('hoshouse_stars_'+today, JSON.stringify(STARS)); }catch(e){}
    if(HH.ready&&HH.db){ try{ await HH.db.collection('hoshouse_config').doc('stars__'+today).set({stars:STARS, updatedAt:Date.now()}); }catch(e){} }
  }
  function watchStars(){
    if(HH.ready&&HH.db){ try{ return HH.db.collection('hoshouse_config').doc('stars__'+today).onSnapshot(d=>{ STARS=(d.exists&&d.data().stars)||{};
      if($('scr-team').classList.contains('on')) renderTeam(); if($('scr-list').classList.contains('on')) renderList(); }); }catch(e){} }
    loadStars().then(m=>{ STARS=m||{}; if($('scr-team').classList.contains('on')) renderTeam(); if($('scr-list').classList.contains('on')) renderList(); });
    return null;
  }

  function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); $(id).classList.add('on'); }

  // ---- notifications ----
  function hhToast(msg){
    let t=document.getElementById('hh-toast');
    if(!t){ t=document.createElement('div'); t.id='hh-toast';
      t.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1F3864;color:#fff;padding:12px 16px;border-radius:12px;font:700 14px/1.35 system-ui,-apple-system,sans-serif;box-shadow:0 8px 28px rgba(0,0,0,.35);z-index:99999;max-width:90%;text-align:center;opacity:0;transition:opacity .25s';
      document.body.appendChild(t); }
    t.textContent=msg; t.style.opacity='1'; clearTimeout(window._hhToastT);
    window._hhToastT=setTimeout(()=>{ if(t) t.style.opacity='0'; }, 4500);
  }
  function hhNotify(title, body){
    hhToast(title+' — '+body);
    try{ if('Notification' in window && Notification.permission==='granted'){ new Notification(title,{ body, icon:'icon-192.png', tag:'hh-'+Date.now() }); } }catch(e){}
    try{ if(navigator.vibrate) navigator.vibrate(120); }catch(e){}
  }
  function requestNotifyPerm(){ try{ if('Notification' in window && Notification.permission==='default'){ Notification.requestPermission(); } }catch(e){} }
  // compare each live update to the last snapshot and raise notifications
  function hhNotifyDiff(list){
    const snap={}; list.forEach(r=>{ snap[r.room]={hk:r.housekeeper||'', status:r.status||'pending', name:r.housekeeperName||''}; });
    if(prevSnap && ME){
      const mine=[], done=[];
      list.forEach(r=>{ const p=prevSnap[r.room];
        if(r.housekeeper===ME.id && r.status!=='done' && (!p || p.hk!==ME.id)) mine.push(r);         // newly allocated to me
        if(ME.lead && r.status==='done' && r.housekeeper!==ME.id && (!p || p.status!=='done')) done.push(r); // newly completed → leads
      });
      if(mine.length) hhNotify(mine.length===1?'New room for you':(mine.length+' new rooms'),
        mine.length===1?('Room '+mine[0].room+' · '+(mine[0].type||'')):('Rooms '+mine.map(x=>x.room).join(', ')));
      if(done.length) hhNotify(done.length===1?'Room completed':(done.length+' rooms completed'),
        done.map(x=>'Room '+x.room+(x.housekeeperName?(' · '+x.housekeeperName):'')).join('  ·  '));
    }
    prevSnap=snap;
  }

  // ---- login ----
  function buildLogin(){
    const sel=$('who'); HH.staff.forEach(s=>{ const o=document.createElement('option'); o.value=s.id; o.textContent=s.name; sel.appendChild(o); });
    const pre=new URLSearchParams(location.search).get('u') || localStorage.getItem('hh_pref');
    if(pre && HH.staffById(pre)){ sel.value=pre; }
    sel.addEventListener('change',()=>{ try{ if(sel.value) localStorage.setItem('hh_pref',sel.value); }catch(e){} chkReady(); });
    const pad=$('pinpad'); ['1','2','3','4','5','6','7','8','9','⌫','0','OK'].forEach(k=>{
      const b=document.createElement('button'); b.textContent=k;
      b.onclick=()=>{ if(k==='⌫') pinBuf=pinBuf.slice(0,-1); else if(k==='OK'){ doLogin(); return; } else if(pinBuf.length<4) pinBuf+=k;
        $('pindisp').textContent='•'.repeat(pinBuf.length); chkReady(); };
      pad.appendChild(b);
    });
  }
  function chkReady(){ $('loginBtn').disabled = !($('who').value && pinBuf.length>=3); }
  function doLogin(){
    const id=$('who').value, s=HH.staffById(id);
    if(!s){ $('lgmsg').textContent='Select your name.'; return; }
    if(String(s.pin)!==pinBuf){ $('lgmsg').textContent='Wrong PIN.'; pinBuf=''; $('pindisp').textContent=''; return; }
    ME=s; try{ localStorage.setItem('hh_pref',id); sessionStorage.setItem('hh_me',id); }catch(e){}
    startList();
  }
  function logout(){ try{ sessionStorage.removeItem('hh_me'); }catch(e){} if(unwatch) unwatch(); if(starUnwatch){ try{ starUnwatch(); }catch(e){} } ME=null; pinBuf=''; $('pindisp').textContent=''; showScreen('scr-login'); }

  // ---- room list ----
  function startList(){
    $('hdr-user').textContent=ME.name.split(' ')[0]+' · Sign out';
    $('hdr-date').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
    $('hdr-team').style.display = ME.lead ? 'block' : 'none';   // leads get the team overview
    requestNotifyPerm();
    if(unwatch) unwatch();
    if(starUnwatch){ try{ starUnwatch(); }catch(e){} }
    starUnwatch=watchStars();
    prevSnap=null;   // first tick primes the snapshot without firing notifications
    unwatch=HH.watchDay(today, list=>{ rooms=list; hhNotifyDiff(list);
      if($('scr-list').classList.contains('on')) renderList();
      if($('scr-team').classList.contains('on')) renderTeam();
      if(active) refreshActive(); });
    // Managers (Laith / Ruth) land on the team view — they rarely clean rooms.
    if(ME.lead){ showTeam(); } else { showScreen('scr-list'); }
  }
  // ---- team view (leads: Laith / Ruth) ----
  function showTeam(){ $('tm-date').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}); const lt=$('lead-tools'); if(lt) lt.style.display = (ME&&ME.lead)?'block':'none'; showScreen('scr-team'); renderTeam(); }
  // ---- manager tools (leads: add rooms ad-hoc, allocate) ----
  function leadMsg(t){ const e=$('lead-msg'); if(!e)return; e.textContent=t; clearTimeout(window._leadMsgT); window._leadMsgT=setTimeout(()=>{ if($('lead-msg')) $('lead-msg').textContent=''; },4500); }
  async function leadWorkerPool(){
    try{ const w=await HH.rotaWorkers(today); if(w&&w.length) return w.map(x=>({hkId:x.hkId,name:x.name})); }catch(e){}
    const have={}; rooms.forEach(r=>{ if(r.housekeeper) have[r.housekeeper]=r.housekeeperName||r.housekeeper; });
    const pool=Object.keys(have).map(id=>({hkId:id,name:have[id]}));
    if(pool.length) return pool;
    return HH.staff.filter(s=>!s.lead).map(s=>({hkId:s.id,name:s.name}));
  }
  async function leadDistribute(newRooms){
    const pool=await leadWorkerPool(); if(!pool.length) return 0;
    const after=await HH.getDayRooms(today);
    const load={}; pool.forEach(w=>load[w.hkId]=0);
    after.forEach(r=>{ if(r.housekeeper && r.status!=='done' && load[r.housekeeper]!=null) load[r.housekeeper]++; });
    let n=0;
    for(const room of newRooms){ const w=pool.slice().sort((a,b)=>load[a.hkId]-load[b.hkId])[0]; if(!w) break;
      await HH.updateRoom(today, room, {housekeeper:w.hkId, housekeeperName:w.name}); load[w.hkId]++; n++; }
    return n;
  }
  async function leadAddRooms(distribute){
    if(!(ME&&ME.lead)) return;
    const raw=($('lead-add').value||'').trim(); const type=$('lead-type').value||'Departure';
    const nums=raw.split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);
    if(!nums.length){ leadMsg('Type one or more room numbers first.'); return; }
    const existing=new Set(rooms.filter(r=>!r.area).map(r=>String(r.room)));
    const picks=rooms.filter(r=>!r.area).map(r=>({room:r.room,type:r.type,note:r.notes||''}));
    nums.forEach(nn=>{ if(!existing.has(String(nn))) picks.push({room:nn,type,note:''}); });
    await HH.setDayRooms(today, picks);
    const newOnes=nums.filter(nn=>!existing.has(String(nn)));
    if(distribute && newOnes.length){ const n=await leadDistribute(newOnes.map(String)); leadMsg('✓ Added '+newOnes.length+' · shared '+n+' to the lightest-loaded.'); }
    else { leadMsg('✓ Added '+newOnes.length+' room'+(newOnes.length===1?'':'s')+'.'); }
    $('lead-add').value=''; renderTeam();
  }
  async function leadAllocateAll(){
    if(!(ME&&ME.lead)) return;
    const pool=await leadWorkerPool(); if(!pool.length){ leadMsg('No housekeepers to allocate to yet.'); return; }
    const day=await HH.getDayRooms(today);
    const todo=day.filter(r=>r.status!=='done' && r.status!=='in_progress');
    if(!todo.length){ leadMsg('Nothing waiting to allocate.'); return; }
    const load={}; pool.forEach(w=>load[w.hkId]=0);
    const ordered=todo.slice().sort((a,b)=>(a.area?1:0)-(b.area?1:0)||(+a.room||0)-(+b.room||0));
    for(const r of ordered){ const w=pool.slice().sort((a,b)=>load[a.hkId]-load[b.hkId])[0];
      await HH.updateRoom(today, r.room, {housekeeper:w.hkId, housekeeperName:w.name}); load[w.hkId]++; }
    leadMsg('✓ Allocated '+ordered.length+' room'+(ordered.length===1?'':'s')+' across '+pool.length+' staff.'); renderTeam();
  }
  async function leadAddAreas(){
    if(!(ME&&ME.lead)) return;
    const n=await HH.addPublicAreas(today); leadMsg(n?('✓ Added '+n+' public-area task'+(n>1?'s':'')):'Public areas already on the list.'); renderTeam();
  }
  function renderTeam(){
    const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    const done=rooms.filter(r=>r.status==='done'), prog=rooms.filter(r=>r.status==='in_progress'), pend=rooms.filter(r=>r.status==='pending');
    const pct=rooms.length?Math.round(done.length/rooms.length*100):0;
    const over=r=> (r.status==='in_progress'&&r.startAt&&(Date.now()-r.startAt)/1000>(HH.targetMin(r.type)*60)) || (r.status==='done'&&(r.durationSec||0)>HH.targetMin(r.type)*60);
    const overs=rooms.filter(over).length;
    const avg=done.length?Math.round(done.reduce((a,r)=>a+(r.durationSec||0)/60,0)/done.length):0;
    // group by housekeeper
    const by={}; rooms.forEach(r=>{ const k=r.housekeeper||'_un'; (by[k]=by[k]||{name:r.housekeeperName||(k==='_un'?'Unallocated':k),rooms:[]}).rooms.push(r); });
    const order=Object.keys(by).sort((a,b)=> a==='_un'?1:b==='_un'?-1:0);
    const tiles=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px">
      <div class="tvtile"><b style="color:var(--navy)">${rooms.length}</b><span>Rooms</span></div>
      <div class="tvtile"><b style="color:var(--ok)">${done.length}</b><span>Done</span></div>
      <div class="tvtile"><b style="color:var(--amber)">${prog.length}</b><span>In prog</span></div>
      <div class="tvtile"><b style="color:${overs?'var(--red)':'var(--navy)'}">${overs}</b><span>Over time</span></div>
    </div>
    <div class="tvrow"><div style="display:flex;justify-content:space-between;font-weight:700"><span>Overall progress</span><span>${pct}% · avg ${avg||'–'} min</span></div>
      <div class="tvbar"><div style="width:${pct}%;height:100%;background:var(--ok)"></div></div></div>`;
    const rows=order.map(k=>{ const g=by[k];
      const d=g.rooms.filter(r=>r.status==='done').length, ip=g.rooms.filter(r=>r.status==='in_progress').length, pd=g.rooms.filter(r=>r.status==='pending').length;
      const dmins=g.rooms.filter(r=>r.status==='done'); const gAvg=dmins.length?Math.round(dmins.reduce((a,r)=>a+(r.durationSec||0)/60,0)/dmins.length):0;
      const gp=g.rooms.length?Math.round(d/g.rooms.length*100):0;
      const chips=g.rooms.sort((a,b)=>(+a.room||0)-(+b.room||0)).map(r=>{
        const col=r.status==='done'?'#ecf6f0;color:#2a6a4a':r.status==='in_progress'?'#fff3df;color:#9c5a00':'#eef1f5;color:#6b7280';
        const mins=r.status==='done'?' '+Math.round((r.durationSec||0)/60)+'m':(r.status==='in_progress'&&r.startAt?' '+Math.round((Date.now()-r.startAt)/60000)+'m':'');
        return `<span class="tvroom" style="background:${col}">${esc(r.room)}${mins}</span>`; }).join('');
      const stars = k==='_un' ? '' : `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:5px"><span style="font-size:11.5px;color:var(--muted)">Rating</span>${starsHTML(k, !!(ME&&ME.lead))}</div>`;
      return `<div class="tvrow"><div style="display:flex;justify-content:space-between;align-items:center">
          <span class="tvname">${esc(g.name)}</span>
          <span style="font-size:12px;color:var(--muted)">${d} done · ${ip} now · ${pd} to go${gAvg?' · '+gAvg+'m avg':''}</span></div>
        <div class="tvbar"><div style="width:${gp}%;height:100%;background:${k==='_un'?'#9aa7b5':'var(--ok)'}"></div></div>
        <div style="margin-top:2px">${chips||'<span style="font-size:12px;color:var(--muted)">No rooms</span>'}</div>${stars}</div>`;
    }).join('');
    $('teamWrap').innerHTML = rooms.length ? (tiles+rows) : '<div class="empty">No rooms set yet today. Add them with the Manager tools above (or reception sends them over), then Allocate.</div>';
  }
  function renderList(){
    const mine=rooms.filter(r=>r.housekeeper===ME.id);
    const inprog=mine.filter(r=>r.status==='in_progress');
    // Each person sees ONLY the rooms allocated to them (no picking).
    // Rooms not yet allocated show only to a lead, so they can mop up.
    const pending=rooms.filter(r=>r.status==='pending' && r.housekeeper===ME.id);
    const unassigned=rooms.filter(r=>r.status==='pending' && !r.housekeeper);
    const doneMine=mine.filter(r=>r.status==='done');
    const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const note=r=> r.notes&&r.notes.trim() ? `<div class="rnote">📝 ${esc(r.notes)}</div>` : '';
    const row=r=>{
      const pc=DEFT[r.type]||'dep';
      if(r.status==='in_progress') return `<div class="card"><div class="rmno">${r.room}</div><span class="pill ${pc}">${r.type}</span><div class="grow"><div class="sub">In progress · ${elapsedStr(r)}</div></div><button class="go" onclick="openRoom('${r.room}')">Open</button>${note(r)}</div>`;
      if(r.status==='done') return `<div class="card"><div class="rmno">${r.room}</div><span class="pill ${pc}">${r.type}</span><div class="grow"><div class="done">✓ Done · ${Math.round((r.durationSec||0)/60)} min</div></div>${note(r)}</div>`;
      return `<div class="card"><div class="rmno">${r.room}</div><span class="pill ${pc}">${r.type}</span><div class="grow"></div><button class="go" onclick="startRoom('${r.room}')">Start</button>${note(r)}</div>`;
    };
    const myAvg=doneMine.length?Math.round(doneMine.reduce((a,r)=>a+(r.durationSec||0)/60,0)/doneMine.length):0;
    const left=pending.length+inprog.length;
    const rated=starsFor(ME.id);
    const welcome=`<div style="background:#1F3864;color:#fff;border-radius:14px;padding:15px 16px;margin-bottom:12px">
      <div style="font:800 18px system-ui,-apple-system,sans-serif">👋 Welcome, ${esc(ME.name.split(' ')[0])}</div>
      <div style="font-size:12.5px;opacity:.85;margin-top:2px">${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px">
        <div style="background:rgba(255,255,255,.12);border-radius:10px;padding:10px;text-align:center"><div style="font:800 22px system-ui">${doneMine.length}</div><div style="font-size:10.5px;opacity:.85;text-transform:uppercase;letter-spacing:.4px">Done</div></div>
        <div style="background:rgba(255,255,255,.12);border-radius:10px;padding:10px;text-align:center"><div style="font:800 22px system-ui">${left}</div><div style="font-size:10.5px;opacity:.85;text-transform:uppercase;letter-spacing:.4px">Left</div></div>
        <div style="background:rgba(255,255,255,.12);border-radius:10px;padding:10px;text-align:center"><div style="font:800 22px system-ui">${myAvg||'–'}</div><div style="font-size:10.5px;opacity:.85;text-transform:uppercase;letter-spacing:.4px">Avg min</div></div>
      </div>
      <div style="margin-top:11px;font-size:12.5px;display:flex;align-items:center;gap:8px"><span style="opacity:.85">Today's rating:</span> ${starsHTML(ME.id,false)} ${rated?'':'<span style="opacity:.7">— not rated yet</span>'}</div>
    </div>`;
    let html=welcome;
    if(inprog.length){ html+='<div class="sect">In progress</div>'+inprog.map(row).join(''); }
    html+='<div class="sect">Your rooms ('+pending.length+')</div>'+(pending.length?pending.map(row).join(''):'<div class="empty">Nothing allocated to you yet — your manager will share rooms out shortly.</div>');
    if(ME.lead && unassigned.length){ html+='<div class="sect">Unallocated — anyone spare ('+unassigned.length+')</div>'+unassigned.map(row).join(''); }
    if(doneMine.length){ html+='<div class="sect">Done today ('+doneMine.length+')</div>'+doneMine.map(row).join(''); }
    $('listWrap').innerHTML=html;
  }
  function elapsedStr(r){ if(!r.startAt) return ''; const s=Math.max(0,Math.floor((Date.now()-r.startAt)/1000)); return mmss(s); }
  function mmss(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }

  // ---- start a room (geo at start) ----
  async function startRoom(room){
    const g=await HH.checkGeo();
    if(g.blocked){ alert('You appear to be '+(g.distance||'?')+' m from the hotel. Move on-site to start this room.'); return; }
    await HH.updateRoom(today, room, { status:'in_progress', housekeeper:ME.id, housekeeperName:ME.name, startAt:Date.now(), geoStartOk: g.ok===true, geoStartDist: g.distance||null });
    openRoom(room);
  }
  function openRoom(room){
    active=rooms.find(r=>r.room===room) || {room, type:'Departure', checklist:{}};
    $('rm-title').textContent='Room '+room; $('rm-type').textContent=active.type||'';
    renderActive(); showScreen('scr-room');
    if(tmr) clearInterval(tmr); tmr=setInterval(tickTimer,1000); tickTimer();
  }
  function refreshActive(){ const r=rooms.find(x=>x.room===active.room); if(r) active=r; if($('scr-room').classList.contains('on')) renderActive(); }
  function renderActive(){
    const cl=active.checklist||{};
    const nEl=$('rm-note'); if(active.notes&&active.notes.trim()){ nEl.textContent='📝 '+active.notes; nEl.style.display='block'; } else { nEl.style.display='none'; }
    const items=HH.checklistFor(active.type);
    $('rm-chk').innerHTML=items.map(it=>`<label class="${cl[it.k]?'ok':''}" style="flex-direction:column;align-items:flex-start;gap:5px">
      <div style="display:flex;align-items:center;gap:10px;width:100%"><input type="checkbox" ${cl[it.k]?'checked':''} onchange="toggleChk('${it.k}',this.checked)"><b>${it.t}</b></div>
      <div style="font-size:12.5px;color:var(--muted);font-weight:500;padding-left:32px;line-height:1.35">${it.d}</div>
    </label>`).join('');
    renderLogs();
    $('rm-geo').textContent = active.geoStartOk===false ? '⚠ Start location was off-site (logged)' : (active.geoStartOk? '📍 On-site at start' : '');
  }
  function renderLogs(){
    const box=$('rm-logs'); if(!box) return;
    const esc=s=>String(s||'').replace(/"/g,'&quot;');
    box.innerHTML=`<div class="logsec">
      <label class="loglbl">🔧 Report to maintenance <span>— anything you can't fix yourself</span></label>
      <input class="loginp" placeholder="e.g. blown bathroom bulb" value="${esc(active.maintenance)}" onchange="saveLog('maintenance',this.value)">
      <label class="loglbl">♻ Items replaced <span>— picked up from the store</span></label>
      <input class="loginp" placeholder="e.g. 2 bulbs, 1 TV remote" value="${esc(active.replaced)}" onchange="saveLog('replaced',this.value)">
      <label class="loglbl">🎒 Lost property found</label>
      <input class="loginp" placeholder="e.g. phone charger, under bed" value="${esc(active.lostProperty)}" onchange="saveLog('lostProperty',this.value)">
    </div>`;
  }
  async function saveLog(field,val){ active[field]=val; const p={}; p[field]=val; await HH.updateRoom(today, active.room, p); }
  async function toggleChk(item,val){ const cl=Object.assign({},active.checklist||{}); cl[item]=val; active.checklist=cl; await HH.updateRoom(today, active.room, {checklist:cl}); renderActive(); }
  function tickTimer(){
    if(!active||!active.startAt){ $('rm-timer').textContent='00:00'; return; }
    const s=Math.floor((Date.now()-active.startAt)/1000); const win=HH.targetMin(active.type)||30;
    const el=$('rm-timer'); el.textContent=mmss(s); el.className='timer'+(s>=win*60?' red':s>=(win-5)*60?' amber':'');
  }
  async function finishRoom(){
    const cl=active.checklist||{}; const items=HH.checklistFor(active.type); const missed=items.filter(it=>!cl[it.k]).map(it=>it.t);
    if(missed.length && !confirm('Not ticked: '+missed.join(', ')+'. Finish anyway?')) return;
    const g=await HH.checkGeo();
    const dur=active.startAt? Math.floor((Date.now()-active.startAt)/1000):0;
    await HH.updateRoom(today, active.room, { status:'done', finishAt:Date.now(), durationSec:dur, geoFinishOk:g.ok===true, geoFinishDist:g.distance||null });
    if(tmr) clearInterval(tmr); active=null; backToList();
  }
  function backToList(){ if(tmr) clearInterval(tmr); showScreen('scr-list'); renderList(); }

  // ---- init ----
  (async function(){
    await HH.loadCfg();   // load shared staff list first so names are current
    buildLogin();
    const saved=sessionStorage.getItem('hh_me');
    if(saved && HH.staffById(saved)){ ME=HH.staffById(saved); startList(); }
  })();
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('/hoshouse-sw.js').catch(()=>{}); }
</script>
</body>
</html>
