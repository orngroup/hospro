<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a2b3a">
<title>HosHouse</title>
<link rel="manifest" href="/hoshouse-manifest.json">
<style>
  :root{--navy:#1a2b3a;--gold:#b89056;--ink:#1f2a37;--line:#dfe4ea;--bg:#eef1f5;--muted:#6b7280;
    --ok:#2a6a4a;--amber:#9c5a00;--red:#b3261e;--dep:#1f7a8c;--stay:#4a86c7;--arr:#2a6a4a;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .screen{display:none;min-height:100vh} .screen.on{display:block}
  header{background:var(--navy);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}
  header .t{font-weight:700;font-size:16px}
  header .u{font-size:12px;color:#aebdce}
  .wrap{max-width:720px;margin:0 auto;padding:16px}
  /* login */
  .lg{max-width:420px;margin:7vh auto;padding:24px;text-align:center}
  .lg .bh-logo{height:88px;width:auto;margin:0 auto 6px;display:block}
  .lg h1{font:800 21px inherit;color:var(--navy);margin:6px 0 4px;letter-spacing:.3px}
  .lg p{color:var(--muted);font-size:14px;margin:0 0 18px}
  select,input{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:11px;font:16px inherit;margin-bottom:12px}
  .btn{width:100%;padding:14px;border:none;border-radius:12px;font:800 16px inherit;cursor:pointer;background:var(--navy);color:#fff}
  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 14px}
  .pinpad button{padding:16px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font:800 20px inherit;cursor:pointer}
  .pindisp{font:800 28px inherit;letter-spacing:10px;min-height:34px;color:var(--navy)}
  /* rooms */
  .sect{font:800 13px inherit;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:16px 2px 8px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .rnote{flex-basis:100%;background:#fff7e8;border:1px solid #f0d9ad;color:#7a5a1e;border-radius:9px;padding:8px 11px;font-size:13px;font-weight:600;margin-top:2px}
  .rmno{font:800 22px inherit;color:var(--navy);min-width:52px}
  .pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;color:#fff}
  .pill.dep{background:var(--dep)} .pill.stay{background:var(--stay)} .pill.arr{background:var(--arr)}
  .urg{display:inline-block;font:800 10px inherit;color:#fff;background:var(--red);padding:2px 7px;border-radius:20px;letter-spacing:.3px;margin-left:4px;vertical-align:middle}
  .card.urgent{border-color:#f3b0a8;box-shadow:0 0 0 2px #fdecea}
  .qchip{display:inline-flex;align-items:center;gap:5px;font:800 12px inherit;padding:8px 12px;border-radius:20px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  .qchip.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .qchip b{font-weight:800}
  .grow{flex:1} .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .go{padding:11px 16px;border:none;border-radius:10px;background:var(--ok);color:#fff;font:800 14px inherit;cursor:pointer}
  .ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .done{color:var(--ok);font-weight:800;font-size:13px}
  /* active room */
  .timer{font:800 40px inherit;text-align:center;margin:6px 0}
  .timer.amber{color:var(--amber)} .timer.red{color:var(--red)}
  .chk{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0}
  .chk label{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:12px;font-size:15px;cursor:pointer}
  .chk input{width:22px;height:22px;margin:0;flex:0 0 auto}
  .chk label.ok{border-color:var(--ok);background:#ecf6f0}
  .geo{font-size:12px;color:var(--muted);text-align:center;margin:8px 0}
  .warn{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;border-radius:9px;padding:9px 12px;font-size:13px;margin:10px 0}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
  .logsec{margin:2px 0 14px;display:flex;flex-direction:column;gap:5px}
  .loglbl{font:700 13px inherit;color:var(--ink);margin-top:8px}
  .loglbl span{font-weight:500;color:var(--muted);font-size:12px}
  .loginp{padding:11px;border:1.5px solid var(--line);border-radius:10px;font:15px inherit;margin:0;width:100%}
  .tvrow{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .tvname{font:800 15px inherit;color:var(--navy)}
  .tvbar{height:9px;border-radius:5px;background:#eef1f5;overflow:hidden;margin-top:7px}
  .tvroom{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;margin:4px 4px 0 0}
  .tvtile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .tvtile b{display:block;font:800 22px inherit}
  .tvtile span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  /* admin */
  .adtabs{display:flex;gap:0;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:4}
  .adtab{flex:1;padding:11px 2px;border:none;background:none;font:800 12px inherit;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
  .adtab.on{color:var(--navy);border-bottom-color:var(--gold)}
  .stcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;cursor:pointer}
  .stcard:active{background:#f7f9fb}
  .stname{font:800 15px inherit;color:var(--navy)}
  .skl{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;margin:3px 4px 0 0;color:#fff}
  .skl.dep{background:var(--dep)} .skl.stay{background:var(--stay)} .skl.arr{background:var(--arr)} .skl.off{background:#c3cad3}
  .stat{font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px}
  .stat.active{background:#ecf6f0;color:#2a6a4a} .stat.holiday{background:#fff3df;color:#9c5a00} .stat.left{background:#fdecea;color:#b3261e}
  .shsheet{position:fixed;left:0;right:0;bottom:0;z-index:1001;background:#fff;border-radius:18px 18px 0 0;padding:18px;max-width:720px;margin:0 auto;max-height:90vh;overflow:auto}
  .shback{position:fixed;inset:0;background:rgba(10,20,35,.55);z-index:1000}
  .seg{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 14px}
  .segb{flex:1;min-width:92px;padding:11px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font:700 14px inherit;cursor:pointer;text-align:center}
  .segb.on{border-color:var(--navy);background:#1F3864;color:#fff}
  .lktbl{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .lktbl th{background:#f4f6f9;text-align:left;padding:9px 10px;font-weight:800;color:var(--navy);font-size:12px}
  .lktbl td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
  .lktbl .lk{color:#1f5fb0;word-break:break-all;font-size:12px}
  .lktbl .pin{font-weight:800;letter-spacing:2px}
  /* Housekeeping Overview dashboard */
  .ovhero{background:linear-gradient(135deg,#1F3864,#2a4a80);color:#fff;border-radius:18px;padding:18px 18px 16px;margin-bottom:14px;box-shadow:0 6px 18px rgba(31,56,100,.25)}
  .ovhero .big{font:800 42px inherit;line-height:1;margin-top:10px}
  .ovhero .hbar{height:9px;border-radius:5px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:12px}
  .ovstats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
  .ovstat{position:relative;border-radius:14px;padding:13px 14px;border:1px solid var(--line);background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04);overflow:hidden}
  .ovstat .ic{font-size:15px;line-height:1;margin-bottom:5px;opacity:.9}
  .ovstat b{display:block;font:800 27px inherit;line-height:1}
  .ovstat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:800;margin-top:3px;display:block}
  .ovstat.ok{background:#eafaf1;border-color:#c3e8d3} .ovstat.ok b{color:#1f7a4d}
  .ovstat.am{background:#fff6e8;border-color:#f0dcae} .ovstat.am b{color:#9c5a00}
  .ovstat.td{background:#eef2f8;border-color:#d4deea} .ovstat.td b{color:#3a567d}
  .ovstat.ur{background:#fdeceb;border-color:#f3c4bf} .ovstat.ur b{color:#b3261e}
  .ovstat.ur0{background:#f3f5f8;border-color:#e2e8f0} .ovstat.ur0 b{color:#7a8899}
  .tbar{display:flex;align-items:center;gap:9px;padding:5px 0}
  .tbar .lbl{flex:0 0 40%;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tbar .trk{flex:1;height:15px;background:#eef1f5;border-radius:8px;overflow:hidden}
  .tbar .fil{height:100%;border-radius:8px;min-width:3px}
  .tbar .nn{flex:0 0 auto;font:800 13px inherit;min-width:20px;text-align:right;color:var(--ink)}
  .flbar{display:flex;height:24px;border-radius:9px;overflow:hidden;margin:6px 0 12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
  .flbar>div{display:flex;align-items:center;justify-content:center;color:#fff;font:800 11px inherit;letter-spacing:.2px}
  .tkey{display:flex;flex-wrap:wrap;gap:12px;margin:2px 0 8px}
  .tkey span{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);font-weight:700}
  .tkey i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .stfrow{display:flex;align-items:center;gap:7px;padding:8px 0;border-top:1px solid var(--line)}
  .stfrow .nm{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tbox{flex:0 0 auto;min-width:34px;text-align:center;padding:6px 0;border-radius:9px;color:#fff;font:800 15px inherit;line-height:1}
  .tbox.z{opacity:.28}
  .ql{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .ql:active{background:#f7f9fb}
  .ql .ic{font-size:22px;width:30px;text-align:center}
  .ql .tt{font:800 15px inherit;color:var(--navy)}
  .ql .ds{font-size:12.5px;color:var(--muted);margin-top:1px}
  .ql .ar{margin-left:auto;color:var(--gold);font-weight:800;font-size:18px}
  .perf{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid var(--line)}
  .perf:first-of-type{border-top:none}
  .perf .rk{font:800 16px inherit;width:24px;text-align:center}
  .perf .pn{font:800 14px inherit;color:var(--navy)}
  .perf .pm{font-size:12px;color:var(--muted)}
  /* room board */
  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
  .bd{border-radius:11px;padding:9px 6px;text-align:center;cursor:pointer;border:1.5px solid transparent;line-height:1.2}
  .bd .rn{font:800 17px inherit}
  .bd .ty{font-size:9.5px;font-weight:800;opacity:.85;text-transform:uppercase;letter-spacing:.3px}
  .bd .wh{font-size:9.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
  .bd.done{background:#ecf6f0;color:#2a6a4a} .bd.prog{background:#fff3df;color:#9c5a00}
  .bd.todo{background:#eef1f5;color:#56606c} .bd.blocked{background:#fdecea;color:#b3261e}
  .bd.urgent{box-shadow:0 0 0 2px #e0564a inset}
  .vtog{display:inline-flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
  .vtog button{border:none;background:#fff;padding:7px 13px;font:800 12px inherit;color:var(--muted);cursor:pointer}
  .vtog button.on{background:var(--navy);color:#fff}
  .pbar{height:8px;border-radius:5px;background:#eef1f5;overflow:hidden;margin-top:5px;flex:1}
  .segtog{display:flex;gap:6px;margin-bottom:12px}
  .segtog button{flex:1;padding:9px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font:800 12.5px inherit;color:var(--ink);cursor:pointer}
  .segtog button.on{background:var(--navy);border-color:var(--navy);color:#fff}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="screen on" id="scr-login">
  <div class="lg">
    <img src="bh-logo.svg" alt="Brandon Hall Hotel & Spa" class="bh-logo" onerror="this.style.display='none'">
    <h1>HosHOUSE Management</h1>
    <p>Select your name and enter your code</p>
    <select id="who"><option value="">Select your name…</option></select>
    <div class="pindisp" id="pindisp"></div>
    <div class="pinpad" id="pinpad"></div>
    <button class="btn" id="loginBtn" disabled onclick="doLogin()">Start</button>
    <div id="lgmsg" style="color:var(--red);font-size:13px;min-height:18px;margin-top:8px"></div>
  </div>
</div>

<!-- ROOM LIST -->
<div class="screen" id="scr-list">
  <header><div><div class="t">🧹 My rooms</div><div class="u" id="hdr-date"></div></div>
    <div style="display:flex;gap:14px;align-items:center">
      <div class="u" id="hdr-team" onclick="showTeam()" style="cursor:pointer;display:none">👁 Team</div>
      <div class="u" id="hdr-user" onclick="logout()" style="cursor:pointer">Sign out</div>
    </div></header>
  <div class="wrap" id="listWrap"></div>
</div>

<!-- HOUSEKEEPING OVERVIEW (leads only) -->
<div class="screen" id="scr-team">
  <header><div><div class="t">🏨 Housekeeping Overview</div><div class="u" id="tm-date"></div></div>
    <div style="display:flex;gap:14px;align-items:center">
      <div class="u" onclick="showAdmin()" style="cursor:pointer">⚙ Manage</div>
      <div class="u" onclick="showScreen('scr-list');renderList()" style="cursor:pointer">← My rooms</div>
    </div></header>
  <div class="wrap">
    <div id="teamWrap"></div>
  </div>
</div>

<!-- MANAGE (leads only) -->
<div class="screen" id="scr-admin">
  <header><div><div class="t">⚙ Manage</div><div class="u" id="ad-date"></div></div>
    <div class="u" onclick="showTeam()" style="cursor:pointer">← Overview</div></header>
  <div class="adtabs">
    <button class="adtab on" data-tab="rooms" onclick="setAdminTab('rooms')">🛏 Rooms</button>
    <button class="adtab" data-tab="find" onclick="setAdminTab('find')">🔎 Find</button>
    <button class="adtab" data-tab="perf" onclick="setAdminTab('perf')">🏆 Top</button>
    <button class="adtab" data-tab="staff" onclick="setAdminTab('staff')">👥 Staff</button>
    <button class="adtab" data-tab="links" onclick="setAdminTab('links')">🔗 Links</button>
  </div>
  <div class="wrap" id="adminWrap"></div>
</div>

<!-- ACTIVE ROOM -->
<div class="screen" id="scr-room">
  <header><div><div class="t" id="rm-title">Room</div><div class="u" id="rm-type"></div></div>
    <div class="u" onclick="backToList()" style="cursor:pointer">← Back</div></header>
  <div class="wrap">
    <div class="timer" id="rm-timer">00:00</div>
    <div class="rnote" id="rm-note" style="display:none"></div>
    <div class="geo" id="rm-geo"></div>
    <div id="rm-warn"></div>
    <div class="chk" id="rm-chk"></div>
    <div id="rm-photos"></div>
    <div id="rm-logs"></div>
    <button class="btn" id="rm-finish" style="background:var(--ok)" onclick="finishRoom()">Finish &amp; sign off room</button>
  </div>
</div>

<input type="file" id="camInput" accept="image/*" capture="environment" style="position:fixed;left:-9999px;top:0">
<div id="hhOverlay" style="display:none"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="hoshouse-config.js"></script>
<script>
  const $=id=>document.getElementById(id);
  const DEFT={Departure:'dep',Stayover:'stay','Arrival-ready':'arr'}, LET={Departure:'Departure',Stayover:'Stayover','Arrival-ready':'Arrival-ready'};
  // room category + floor label (from the Guestline inventory), e.g. "Classic Twin · Ground floor"
  function roomMeta(r){ const inf=(HH.roomInfo?HH.roomInfo(r.room):{}); const cat=HH.catLabel(r.cat||inf.cat||''); const fl=(HH.floorLabel?HH.floorLabel(r.floor||inf.floor||''):''); return [cat, fl?(fl+' floor'):''].filter(Boolean).join(' · '); }
  function roomFloor(r){ const inf=(HH.roomInfo?HH.roomInfo(r.room):{}); return HH.floorLabel?HH.floorLabel(r.floor||inf.floor||''):''; }
  let ME=null, rooms=[], unwatch=null, active=null, tmr=null, pinBuf='', prevSnap=null, STARS={}, starUnwatch=null;
  const today=HH.todayISO();
  const PHOTO_SLOTS=[{k:'bath',label:'Bathtub interior'},{k:'mirror',label:'Mirror'},{k:'wc',label:'WC / toilet'},{k:'bed',label:'Bedroom incl. bed'}];
  const THUMBS={}; // in-memory thumbnails for this session (room -> slot -> dataUrl)
  function localThumb(room,slot,du){ (THUMBS[room]=THUMBS[room]||{})[slot]=du; }
  function getThumb(room,slot){ return (THUMBS[room]||{})[slot]; }

  // ---- performance stars (managers rate 1–5; shared + live) ----
  function starsFor(hkId){ return STARS[hkId]||0; }
  function starsHTML(hkId, editable){
    let s=''; const n=starsFor(hkId);
    for(let i=1;i<=5;i++){ const on=i<=n;
      s+=`<span ${editable?`onclick="setStar('${hkId}',${i})"`:''} style="font-size:19px;line-height:1;cursor:${editable?'pointer':'default'};color:${on?'#f0a500':'#cfd6de'}">★</span>`; }
    return `<span style="display:inline-flex;gap:1px;align-items:center">${s}</span>`;
  }
  async function setStar(hkId,n){ if(!(ME&&ME.lead))return; STARS[hkId]=(STARS[hkId]===n?0:n); await saveStars(); renderTeam(); }
  async function loadStars(){
    if(HH.ready&&HH.db){ try{ const d=await HH.db.collection('hoshouse_config').doc('stars__'+today).get(); if(d.exists) return d.data().stars||{}; }catch(e){} }
    try{ return JSON.parse(localStorage.getItem('hoshouse_stars_'+today)||'{}'); }catch(e){ return {}; }
  }
  async function saveStars(){
    try{ localStorage.setItem('hoshouse_stars_'+today, JSON.stringify(STARS)); }catch(e){}
    if(HH.ready&&HH.db){ try{ await HH.db.collection('hoshouse_config').doc('stars__'+today).set({stars:STARS, updatedAt:Date.now()}); }catch(e){} }
  }
  function watchStars(){
    if(HH.ready&&HH.db){ try{ return HH.db.collection('hoshouse_config').doc('stars__'+today).onSnapshot(d=>{ STARS=(d.exists&&d.data().stars)||{};
      if($('scr-team').classList.contains('on')) renderTeam(); if($('scr-list').classList.contains('on')) renderList(); }); }catch(e){} }
    loadStars().then(m=>{ STARS=m||{}; if($('scr-team').classList.contains('on')) renderTeam(); if($('scr-list').classList.contains('on')) renderList(); });
    return null;
  }

  function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); $(id).classList.add('on'); }

  // ---- notifications ----
  function hhToast(msg){
    let t=document.getElementById('hh-toast');
    if(!t){ t=document.createElement('div'); t.id='hh-toast';
      t.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1F3864;color:#fff;padding:12px 16px;border-radius:12px;font:700 14px/1.35 system-ui,-apple-system,sans-serif;box-shadow:0 8px 28px rgba(0,0,0,.35);z-index:99999;max-width:90%;text-align:center;opacity:0;transition:opacity .25s';
      document.body.appendChild(t); }
    t.textContent=msg; t.style.opacity='1'; clearTimeout(window._hhToastT);
    window._hhToastT=setTimeout(()=>{ if(t) t.style.opacity='0'; }, 4500);
  }
  function hhNotify(title, body){
    hhToast(title+' — '+body);
    try{ if('Notification' in window && Notification.permission==='granted'){ new Notification(title,{ body, icon:'icon-192.png', tag:'hh-'+Date.now() }); } }catch(e){}
    try{ if(navigator.vibrate) navigator.vibrate(120); }catch(e){}
  }
  function requestNotifyPerm(){ try{ if('Notification' in window && Notification.permission==='default'){ Notification.requestPermission(); } }catch(e){} }
  // compare each live update to the last snapshot and raise notifications
  function hhNotifyDiff(list){
    const snap={}; list.forEach(r=>{ snap[r.room]={hk:r.housekeeper||'', status:r.status||'pending', name:r.housekeeperName||'', urgent:!!r.urgent}; });
    if(prevSnap && ME){
      const mine=[], done=[], urgent=[];
      list.forEach(r=>{ const p=prevSnap[r.room];
        if(r.housekeeper===ME.id && r.status!=='done' && (!p || p.hk!==ME.id)) mine.push(r);         // newly allocated to me
        if(r.housekeeper===ME.id && r.status!=='done' && r.urgent && (!p || !p.urgent || p.hk!==ME.id)) urgent.push(r); // newly urgent for me
        if(ME.lead && r.status==='done' && r.housekeeper!==ME.id && (!p || p.status!=='done')) done.push(r); // newly completed → leads
      });
      if(urgent.length) hhNotify('🚨 URGENT room'+(urgent.length>1?'s':''),
        'Please do '+(urgent.length===1?('Room '+urgent[0].room+' · '+(urgent[0].type||'')):('Rooms '+urgent.map(x=>x.room).join(', ')))+' next');
      if(mine.filter(r=>!r.urgent).length){ const m=mine.filter(r=>!r.urgent); hhNotify(m.length===1?'New room for you':(m.length+' new rooms'),

  }

  // ---- manager tools (leads: add rooms ad-hoc, allocate) ----
  function leadMsg(t){ const e=$('lead-msg'); if(!e)return; e.textContent=t; clearTimeout(window._leadMsgT); window._leadMsgT=setTimeout(()=>{ if($('lead-msg')) $('lead-msg').textContent=''; },4500); }
  // Active workers for allocation, enriched with skills / rating / capacity.
  async function leadWorkerPool(){
    try{ const w=await HH.rotaWorkers(today); if(w&&w.length) return w; }catch(e){}
    const isActive=s=>(s.status||'active')==='active';
    const enrich=s=>({hkId:s.id, name:s.name, cap:12, skills:(s.skills&&s.skills.length)?s.skills:HH.skillTypes.slice(), rating:(typeof s.rating==='number'?s.rating:3)});
    // whoever already has rooms today (and is still active)
    const have={}; rooms.forEach(r=>{ if(r.housekeeper){ const s=HH.staffById(r.housekeeper); if(s&&isActive(s)) have[r.housekeeper]=s; } });
    const onDuty=Object.values(have);
    if(onDuty.length) return onDuty.map(enrich);
    const actives=HH.staff.filter(isActive);
    const workers=actives.filter(s=>!s.lead);
    return (workers.length?workers:actives).map(enrich);
  }
  async function leadDistribute(newRooms, type){
    const pool=await leadWorkerPool(); if(!pool.length) return 0;
    const after=await HH.getDayRooms(today);
    const load={}; pool.forEach(w=>load[w.hkId]=0);
    after.forEach(r=>{ if(r.housekeeper && r.status!=='done' && load[r.housekeeper]!=null) load[r.housekeeper]++; });
    let n=0;
    for(const room of newRooms){
      const elig=pool.filter(w=>HH.canDoType(w, type));
      const w=(elig.length?elig:pool).slice().sort((a,b)=>load[a.hkId]-load[b.hkId] || (b.rating||3)-(a.rating||3))[0];
      if(!w) break;
      await HH.updateRoom(today, room, {housekeeper:w.hkId, housekeeperName:w.name}); load[w.hkId]++; n++; }
    return n;
  }
  async function leadAddRooms(distribute){
    if(!(ME&&ME.lead)) return;
    const raw=($('lead-add').value||'').trim(); const type=$('lead-type').value||'Departure';
    const nums=raw.split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);
    if(!nums.length){ leadMsg('Type one or more room numbers first.'); return; }
    const existing=new Set(rooms.filter(r=>!r.area).map(r=>String(r.room)));
    const picks=rooms.filter(r=>!r.area).map(r=>({room:r.room,type:r.type,note:r.notes||''}));
    nums.forEach(nn=>{ if(!existing.has(String(nn))) picks.push({room:nn,type,note:''}); });
    await HH.setDayRooms(today, picks);
    const newOnes=nums.filter(nn=>!existing.has(String(nn)));
    if(distribute && newOnes.length){ const n=await leadDistribute(newOnes.map(String), type); leadMsg('✓ Added '+newOnes.length+' · shared '+n+' by skill to the lightest-loaded.'); }
    else { leadMsg('✓ Added '+newOnes.length+' room'+(newOnes.length===1?'':'s')+'.'); }
    $('lead-add').value=''; if($('scr-admin').classList.contains('on')) renderAdmin(); else renderTeam();
  }
  async function leadAllocateAll(){
    if(!(ME&&ME.lead)) return;
    const pool=await leadWorkerPool(); if(!pool.length){ leadMsg('No active housekeepers to allocate to yet.'); return; }
    const day=await HH.getDayRooms(today);
    const todo=day.filter(r=>r.status!=='done' && r.status!=='in_progress');
    if(!todo.length){ leadMsg('Nothing waiting to allocate.'); return; }
    const ordered=todo.slice().sort((a,b)=>(a.area?1:0)-(b.area?1:0)||(+a.room||0)-(+b.room||0));
    const plan=HH.distribute(ordered.map(r=>({room:r.room, type:r.type, floor:r.floor||HH.floorOf(r.room)})), pool);
    let n=0;
    for(const w of plan){ for(const it of w.items){ await HH.updateRoom(today, it.room, {housekeeper:w.hkId, housekeeperName:w.name}); n++; } }
    leadMsg('✓ Allocated '+n+' room'+(n===1?'':'s')+' across '+pool.length+' staff — by skill & rating.'); if($('scr-admin').classList.contains('on')) renderAdmin(); else renderTeam();
  }

  // ---- Bulk room picker (phone) — mirrors the desktop "Select rooms (bulk)" grid ----

  function bulkRender(){
    const B=_bulk; const box=$('bk-grid'); if(!B||!box) return;

      return `<div onclick="bulkTap('${room}')" style="border:1.5px solid ${col};border-radius:10px;padding:9px 3px;text-align:center;cursor:pointer;background:${t?col+'1f':'#fff'}">

  function bulkTap(room){
    const B=_bulk; if(!B) return; const order=['Departure','Stayover','Arrival-ready'];
    if(!B.picks[room]){ B.picks[room]=B.defType; }
    else { const i=order.indexOf(B.picks[room]); if(i>=order.length-1){ delete B.picks[room]; } else B.picks[room]=order[i+1]; }

  async function bulkConfirm(alloc){

  // ---- Housekeeping Overview — the lead's landing dashboard ----
  function renderTeam(){
    const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    const today2=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
    const done=rooms.filter(r=>r.status==='done'), prog=rooms.filter(r=>r.status==='in_progress');
    const pend=rooms.filter(r=>r.status==='pending'||r.status==='blocked');
    const urgent=rooms.filter(r=>r.urgent && r.status!=='done');
    const pct=rooms.length?Math.round(done.length/rooms.length*100):0;
    const avg=done.length?Math.round(done.reduce((a,r)=>a+(r.durationSec||0)/60,0)/done.length):0;

    const C=2*Math.PI*34, off=C*(1-pct/100);

        <div style="font-size:12.5px;opacity:.82;margin-top:4px">${prog.length} in progress · ${pend.length} to do${urgent.length?` · <b style="color:#ffd9d4">${urgent.length} urgent</b>`:''}</div>

    const stats=`<div class="ovstats">

      <div class="ovstat am"><div class="ic">🧹</div><b>${prog.length}</b><span>In progress</span></div>

      <div class="ovstat ${urgent.length?'ur':'ur0'}" ${urgent.length?'onclick="showAdmin();setTimeout(()=>setRoomFilter(\'urgent\'),60)" style="cursor:pointer"':''}><div class="ic">⏰</div><b>${urgent.length}</b><span>Urgent${urgent.length?' →':''}</span></div>

    const PAL=['#1F3864','#2E6B5E','#b89056','#7a5aa0','#2f6fb0','#c06a3a','#4a8a6a','#9c5a00'];

      <div class="nn">${n}</div></div>`).join('');
    const byType = rooms.length?`<div class="card" style="flex-direction:column;align-items:stretch;gap:0;padding:14px 16px;margin-bottom:14px">

      <div class="ql" onclick="showAdmin();setTimeout(()=>setAdminTab('links'),60)"><span class="ic">🔗</span><div><div class="tt">Staff links & codes</div><div class="ds">Print or share sign-in links & PINs</div></div><span class="ar">›</span></div>
      <div class="ql" onclick="showPlan()"><span class="ic">🗺</span><div><div class="tt">Floor plans</div><div class="ds">Ground & First layouts — plan rooms near each other</div></div><span class="ar">›</span></div>`;

  // ---- Find / room status lookup (any date) ----
  function renderAdminFind(){
    const todayStr=HH.todayISO();
    $('adminWrap').innerHTML=
      `<div class="sect" style="margin-top:2px">Find a room</div>
       <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px">

  async function findRoom(){
    const room=($('find-room')&&$('find-room').value||'').trim();
    const date=($('find-date')&&$('find-date').value)||HH.todayISO();
    const out=$('findOut'); if(!out) return;
    if(!room){ out.innerHTML='<div class="empty">Enter a room number first.</div>'; return; }
    out.innerHTML='<div class="empty">Searching…</div>';
    const day=await HH.getDayRooms(date);
    const r=day.find(x=>String(x.room)===String(room));
    if(!r){ out.innerHTML='<div class="empty">Room '+esc(room)+' wasn\'t on the list for '+esc(date)+'.</div>'; return; }
    let photos=[]; try{ photos=await HH.getRoomPhotos(date, room); }catch(e){}
    const comps=photos.filter(p=>p.kind==='complete' || (!p.kind && p.slot!=='door' && p.slot!=='lostproperty'));
    const doors=photos.filter(p=>p.kind==='cannotstart' || p.slot==='door');
    const lost=photos.filter(p=>p.kind==='lostproperty' || p.slot==='lostproperty');
    const comp=comps.length;
    const tfmt=ms=>ms?new Date(ms).toLocaleString('en-GB',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
    const pfig=p=>{ const src=p.dataUrl||p.url||''; const tt=p.takenAt?new Date(p.takenAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'';
      return src?`<figure style="margin:0"><a href="${src}" target="_blank" rel="noopener"><img src="${src}" alt="${esc(p.label||'')}" style="width:100%;height:94px;object-fit:cover;border-radius:9px;border:1px solid var(--line)"></a><figcaption style="font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.25">${esc(p.label||p.slot||'')}${tt?' · '+tt:''}</figcaption></figure>`:''; };
    const grid=(arr)=>`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px">${arr.map(pfig).join('')}</div>`;
    const photoBlock = comps.length?`<div class="sect" style="margin:8px 0 2px">📷 Completion photos (${comps.length}/4)</div>${grid(comps)}`
      : (r.status==='done'?'<div class="rnote" style="background:#fdecea;border-color:#f3c0ba;color:#b3261e">⚠ Marked done but no completion photos found.</div>':'');
    const doorBlock = doors.length?`<div class="sect" style="margin:10px 0 2px">🚪 Do Not Disturb — door photo</div>${grid(doors)}`:'';
    const lostBlock = lost.length?`<div class="sect" style="margin:10px 0 2px">🎒 Lost property photo</div>${grid(lost)}`:'';
    const stCol=r.status==='done'?'var(--ok)':r.status==='in_progress'?'var(--amber)':r.status==='blocked'?'var(--red)':'var(--muted)';
    const stTxt=r.status==='blocked'?("Can't start — "+(r.blockReason==='dnd'?'Do Not Disturb':'Guest refused')):((r.status||'pending').replace('_',' '));
    const line=(ic,lab,val)=> val&&String(val).trim()?`<div style="font-size:13px;margin-top:5px">${ic} <b>${lab}:</b> ${esc(val)}</div>`:'';
    const dur=r.durationSec?Math.round(r.durationSec/60)+' min':'';
    out.innerHTML=`<div class="card" style="flex-direction:column;align-items:stretch;gap:8px;${(r.urgent&&r.status!=='done')?'border-color:#f3b0a8;box-shadow:0 0 0 2px #fdecea':''}">
      <div style="display:flex;align-items:center;gap:10px"><div class="rmno">${esc(r.room)}</div><span class="pill ${DEFT[r.type]||'dep'}">${esc(r.type)}</span>${(r.urgent&&r.status!=='done')?'<span class="urg">🚨 URGENT</span>':''}
        <span style="margin-left:auto;font-weight:800;color:${stCol};text-transform:capitalize">${esc(stTxt)}</span></div>
      <div style="font-size:13px">👤 <b>Housekeeper:</b> ${r.housekeeperName?esc(r.housekeeperName):'<em style="color:var(--red)">Unallocated</em>'}</div>
      ${r.startAt?`<div style="font-size:13px">▶ <b>Started:</b> ${tfmt(r.startAt)}</div>`:''}
      ${r.finishAt?`<div style="font-size:13px">✓ <b>Finished:</b> ${tfmt(r.finishAt)}${dur?(' · '+dur):''}</div>`:''}
      ${line('📝','Note',r.notes)}
      ${line('🔧','To maintenance',r.maintenance)}
      ${line('♻','Items replaced',r.replaced)}
      ${line('🎒','Lost property',r.lostProperty)}
      ${photoBlock}
      ${doorBlock}
      ${lostBlock}
      ${(r.status!=='done' && date===today)?`<button class="go ghost" style="margin-top:8px" onclick="reassignRoom('${esc(r.room)}')">Reallocate ⇄</button>`:''}
    </div>`;
  }

  // ---- Rooms overview (all rooms today, by status; tap to reassign) ----
  let adminRoomFilter='all', adminRoomView='list';

  function setRoomView(v){ adminRoomView=v; renderAdminRooms(); }
  function renderAdminRooms(){
    const done=rooms.filter(r=>r.status==='done'), prog=rooms.filter(r=>r.status==='in_progress');
    const pend=rooms.filter(r=>r.status==='pending'||r.status==='blocked');
    const urgent=rooms.filter(r=>r.urgent && r.status!=='done');
    const unalloc=rooms.filter(r=>!r.housekeeper && r.status!=='done');
    const pct=rooms.length?Math.round(done.length/rooms.length*100):0;
    const tiles=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px">
      <div class="tvtile"><b style="color:var(--navy)">${rooms.length}</b><span>Rooms</span></div>
      <div class="tvtile"><b style="color:var(--ok)">${done.length}</b><span>Ready</span></div>
      <div class="tvtile"><b style="color:var(--amber)">${prog.length}</b><span>In prog</span></div>
      <div class="tvtile"><b style="color:${urgent.length?'var(--red)':'var(--muted)'}">${urgent.length}</b><span>Urgent</span></div>
    </div>
    <div class="tvrow" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-weight:700"><span>Overall progress</span><span>${pct}% · ${done.length}/${rooms.length}</span></div>
      <div class="tvbar"><div style="width:${pct}%;height:100%;background:var(--ok)"></div></div></div>`;
    const f=adminRoomFilter;
    const chip=(id,label,n,col)=>`<button class="qchip ${f===id?'on':''}" onclick="setRoomFilter('${id}')">${label} <b style="color:${f===id?'#fff':(col||'var(--navy)')}">${n}</b></button>`;
    const chips=`<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px">
      ${chip('all','All',rooms.length)}
      ${chip('urgent','🚨 Urgent',urgent.length,'var(--red)')}
      ${chip('waiting','Waiting',pend.length)}
      ${chip('prog','In progress',prog.length,'var(--amber)')}
      ${chip('ready','✓ Ready',done.length,'var(--ok)')}
      ${chip('unalloc','Unallocated',unalloc.length,'var(--red)')}
    </div>`;
    let list = f==='urgent'?urgent : f==='waiting'?pend : f==='prog'?prog : f==='ready'?done : f==='unalloc'?unalloc : rooms.slice();
    list = list.slice().sort((a,b)=>((b.urgent&&b.status!=='done')?1:0)-((a.urgent&&a.status!=='done')?1:0)||(a.area?1:0)-(b.area?1:0)||(+a.room||0)-(+b.room||0));
    const rowHtml=r=>{
      const pc=DEFT[r.type]||'dep'; const u=(r.urgent&&r.status!=='done');
      const st=r.status==='done'?'<span class="done">✓ Ready</span>':r.status==='in_progress'?'<span style="color:var(--amber);font-weight:800;font-size:13px">● In progress</span>':r.status==='blocked'?'<span style="color:var(--red);font-weight:800;font-size:13px">⛔ '+(r.blockReason==='dnd'?'DND':'Refused')+'</span>':'<span style="color:var(--muted);font-weight:700;font-size:13px">Waiting</span>';
      const who=r.housekeeperName?esc(r.housekeeperName):'<em style="color:var(--red)">Unallocated</em>';
      const move=r.status!=='done'?`<button class="go ghost" style="padding:8px 12px" onclick="reassignRoom('${esc(r.room)}')">Move ⇄</button>`:'';
      return `<div class="card${u?' urgent':''}"><div class="rmno">${esc(r.room)}</div><span class="pill ${pc}">${esc(r.type)}</span>${u?'<span class="urg">🚨</span>':''}
        <div class="grow"><div style="font-weight:700">${who}</div><div class="sub">${roomMeta(r)} · ${st}</div></div>${move}</div>`;
    };
    const label={all:'All rooms today',urgent:'Urgent rooms',waiting:'Waiting to start',prog:'In progress',ready:'Ready rooms',unalloc:'Unallocated'}[f]||'Rooms';
    const bdCard=r=>{ const cls=r.status==='done'?'done':r.status==='in_progress'?'prog':r.status==='blocked'?'blocked':'todo';
      const u=(r.urgent&&r.status!=='done')?' urgent':'';
      const who=r.housekeeperName?esc(r.housekeeperName.split(' ')[0]):'—';
      const fl=roomFloor(r);
      return `<div class="bd ${cls}${u}" onclick="${r.status!=='done'?`reassignRoom('${esc(r.room)}')`:`findShow('${esc(r.room)}')`}">
        <div class="rn">${(r.urgent&&r.status!=='done')?'🚨':''}${esc(r.room)}</div>
        <div class="ty">${esc((SKILL_ABBR[r.type]||r.type||'').slice(0,4))}${fl?' · '+esc(fl[0]):''}</div>
        <div class="wh">${who}</div></div>`; };
    const vtog=`<div style="display:flex;justify-content:flex-end;margin-bottom:10px"><div class="vtog">
      <button class="${adminRoomView==='list'?'on':''}" onclick="setRoomView('list')">☰ List</button>
      <button class="${adminRoomView==='board'?'on':''}" onclick="setRoomView('board')">▦ Board</button></div></div>`;
    const bodyHtml = adminRoomView==='board'
      ? (list.length?`<div class="board">${list.map(bdCard).join('')}</div>`:'<div class="empty">None in this view.</div>')
      : (list.length?list.map(rowHtml).join(''):'<div class="empty">None in this view.</div>');
    const tools=`<div style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:12px">
      <div style="font-weight:800;color:var(--navy);margin-bottom:9px">🛠 Add &amp; allocate rooms</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
        <input id="lead-add" inputmode="numeric" placeholder="Room numbers e.g. 101 102" style="flex:1;min-width:150px;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:15px;margin:0">
        <select id="lead-type" style="padding:10px;border:1px solid var(--line);border-radius:9px;font-size:15px;margin:0;width:auto"><option>Departure</option><option>Stayover</option><option>Arrival-ready</option></select>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button onclick="leadAddRooms(false)" style="flex:1;min-width:110px;padding:10px;border:1px solid #2E6B5E;background:#fff;color:#2E6B5E;border-radius:9px;font-weight:700;font-size:13px">+ Add</button>
        <button onclick="leadAddRooms(true)" style="flex:1;min-width:150px;padding:10px;border:none;background:#2E6B5E;color:#fff;border-radius:9px;font-weight:700;font-size:13px">+ Add &amp; give to lightest</button>
      </div>
      <button onclick="bulkOpen()" style="width:100%;margin-top:6px;padding:11px;border:1.5px solid var(--navy);background:#eef2f8;color:var(--navy);border-radius:9px;font-weight:800;font-size:13.5px">🗂 Select rooms (bulk) — tap the grid</button>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
        <button onclick="leadAllocateAll()" style="flex:1;min-width:140px;padding:10px;border:none;background:var(--navy);color:#fff;border-radius:9px;font-weight:800;font-size:13px">⚖️ Allocate all</button>
        <button onclick="leadAddAreas()" style="flex:1;min-width:120px;padding:10px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;font-weight:700;font-size:13px">🧼 Public areas</button>
      </div>
      <div id="lead-msg" style="font-size:12.5px;color:#2a6a4a;font-weight:700;margin-top:7px;min-height:16px"></div>
    </div>`;
    $('adminWrap').innerHTML = tools + (rooms.length
      ? (tiles+chips+vtog+'<div class="sect">'+label+' ('+list.length+')</div>'+bodyHtml)
      : '<div class="empty">No rooms yet — add them above, then Allocate.</div>');
  }
  // open Find for a specific room (used by the board for done rooms)
  function findShow(room){ setAdminTab('find'); setTimeout(()=>{ const i=$('find-room'); if(i){ i.value=room; } findRoom(); }, 60); }

  // ---- Top performers (today / this week / all time) ----
  let perfPeriod='today';
  function setPerfPeriod(p){ perfPeriod=p; renderAdminPerf(); }
  async function renderAdminPerf(){
    const box=$('adminWrap'); if(!box) return;
    const tog=`<div class="segtog">
      <button class="${perfPeriod==='today'?'on':''}" onclick="setPerfPeriod('today')">Today</button>
      <button class="${perfPeriod==='week'?'on':''}" onclick="setPerfPeriod('week')">This week</button>
      <button class="${perfPeriod==='all'?'on':''}" onclick="setPerfPeriod('all')">All time</button></div>`;
    box.innerHTML = tog + '<div class="empty">Loading…</div>';
    let data;
    if(perfPeriod==='today'){ data=rooms; }
    else if(perfPeriod==='week'){ const d=new Date(); d.setDate(d.getDate()-6); data=await HH.getRoomsRange(d.toLocaleDateString('en-CA'), today); }
    else { data=await HH.getRoomsRange(null,null); }
    if(adminTab!=='perf') return;   // user switched tab while loading
    const by={}; data.forEach(r=>{ if(r.status!=='done'||!r.housekeeper) return; const k=r.housekeeper;
      (by[k]=by[k]||{name:r.housekeeperName||k, done:0, mins:0}); by[k].done++; by[k].mins+=(r.durationSec||0)/60; });
    const list=Object.values(by).sort((a,b)=> b.done-a.done || (a.mins/a.done)-(b.mins/b.done));
    const maxDone=list.length?list[0].done:1; const medal=['🥇','🥈','🥉'];
    const rows=list.map((p,i)=>{ const avg=p.done?Math.round(p.mins/p.done):0; const w=Math.round(p.done/maxDone*100);
      return `<div class="card" style="align-items:center;gap:11px">
        <span style="font:800 16px inherit;width:26px;text-align:center;color:${i<3?'var(--gold)':'var(--muted)'}">${i<3?medal[i]:(i+1)}</span>
        <div style="flex:1;min-width:0"><div style="font:800 14px inherit;color:var(--navy)">${esc(p.name)}</div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:4px"><div class="pbar"><div style="width:${w}%;height:100%;background:var(--ok)"></div></div><span style="font-size:11.5px;color:var(--muted);white-space:nowrap">${p.done} rm · ${avg}m</span></div></div></div>`; }).join('');
    const totDone=list.reduce((a,p)=>a+p.done,0);
    const periodLbl=perfPeriod==='today'?'today':perfPeriod==='week'?'this week':'all time';
    const head=`<div class="sub" style="margin-bottom:10px">Ranked by rooms completed, then average time. <b>${totDone}</b> room${totDone===1?'':'s'} cleaned ${periodLbl}.</div>`;
    box.innerHTML = tog + head + (list.length?rows:'<div class="empty">No completed rooms '+periodLbl+' yet.</div>');
  }

      <div class="shsheet">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">

  function elapsedStr(r){ if(!r.startAt) return ''; const s=Math.max(0,Math.floor((Date.now()-r.startAt)/1000)); return mmss(s); }

  // ---- start a room (geo at start) ----
  async function startRoom(room){
    const g=await HH.checkGeo();
    if(g.blocked){ alert('You appear to be '+(g.distance||'?')+' m from the hotel. Move on-site to start this room.'); return; }
    await HH.updateRoom(today, room, { status:'in_progress', housekeeper:ME.id, housekeeperName:ME.name, startAt:Date.now(), geoStartOk: g.ok===true, geoStartDist: g.distance||null, blockReason:'', blockedAt:null });
    openRoom(room);

  // ---- camera capture with a burnt-in date/time + room stamp ----
  function capturePhoto(caption){
    return new Promise(res=>{
      const inp=$('camInput'); inp.value='';
      inp.onchange=async function(){ const f=inp.files&&inp.files[0]; inp.onchange=null; if(!f){ res(null); return; } res(await compressBurn(f, caption)); };
      inp.click();
    });
  }
  function compressBurn(file, caption){
    return new Promise(res=>{
      const img=new Image(), url=URL.createObjectURL(file);
      img.onload=function(){
        let w=img.width,h=img.height; const M=1000;
        if(w>h && w>M){ h=Math.round(h*M/w); w=M; } else if(h>=w && h>M){ w=Math.round(w*M/h); h=M; }
        const c=document.createElement('canvas'); c.width=w; c.height=h; const ctx=c.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        const stamp=caption+'  ·  '+new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
        const fs=Math.max(13,Math.round(w*0.030)); ctx.font='700 '+fs+'px system-ui,Arial,sans-serif';
        const pad=Math.round(fs*0.55), bh=fs+pad*2;
        ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(0,h-bh,w,bh);
        ctx.fillStyle='#fff'; ctx.textBaseline='middle'; ctx.fillText(stamp, pad, h-bh/2, w-pad*2);
        URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.55));
      };
      img.onerror=function(){ URL.revokeObjectURL(url); res(null); };
      img.src=url;
    });
  }

    box.innerHTML=`<div class="sect" style="margin-top:14px">📷 Completion photos — all 4 required (${n}/4)</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${PHOTO_SLOTS.map(slot).join('')}</div>`;
    const fin=$('rm-finish'); if(fin){ const ready=n===4; fin.style.opacity=ready?'1':'.55'; fin.textContent=ready?'Finish & sign off room':'Take all 4 photos to finish ('+n+'/4)'; }
  }
  async function takeSlot(slotK){
    const slot=PHOTO_SLOTS.find(s=>s.k===slotK); if(!slot||!active) return;
    const du=await capturePhoto('Room '+active.room+' · '+slot.label);
    if(!du) return;
    const ts=Date.now();
    localThumb(active.room, slotK, du);
    await HH.addPhoto({date:today, room:active.room, slot:slotK, label:slot.label, dataUrl:du, by:ME.id, byName:ME.name, kind:'complete', takenAt:ts});
    const photos=Object.assign({}, active.photos||{}); photos[slotK]=ts; active.photos=photos;
    await HH.updateRoom(today, active.room, {photos});
    renderPhotos();
  }
  function renderLogs(){
    const box=$('rm-logs'); if(!box) return;
    const esc=s=>String(s||'').replace(/"/g,'&quot;');
    box.innerHTML=`<div class="logsec">
      <label class="loglbl">🔧 Report to maintenance <span>— anything you can't fix yourself</span></label>
      <input class="loginp" placeholder="e.g. blown bathroom bulb" value="${esc(active.maintenance)}" onchange="saveLog('maintenance',this.value)">
      <label class="loglbl">♻ Items replaced <span>— picked up from the store</span></label>
      <input class="loginp" placeholder="e.g. 2 bulbs, 1 TV remote" value="${esc(active.replaced)}" onchange="saveLog('replaced',this.value)">
      <label class="loglbl">🎒 Lost property found</label>
      <input class="loginp" placeholder="e.g. phone charger, under bed" value="${esc(active.lostProperty)}" onchange="saveLog('lostProperty',this.value)">
      <button class="go ghost" style="background:#fff;border:1.5px solid var(--line);color:var(--navy);margin-top:7px;padding:11px" onclick="lostPropPhoto()">📷 ${active.lostPhoto?'Lost property photo saved ✓ — retake':'Take a photo of the lost property'}</button>
    </div>`;
  }
  async function lostPropPhoto(){
    if(!active) return;
    const du=await capturePhoto('Room '+active.room+' · Lost property');
    if(!du) return;
    const ts=Date.now();
    await HH.addPhoto({date:today, room:active.room, slot:'lostproperty', label:'Lost property', dataUrl:du, by:ME.id, byName:ME.name, kind:'lostproperty', takenAt:ts});
    active.lostPhoto=true; await HH.updateRoom(today, active.room, {lostPhoto:true});
    hhToast('✓ Lost property photo saved'); renderLogs();
  }
  async function saveLog(field,val){ active[field]=val; const p={}; p[field]=val; await HH.updateRoom(today, active.room, p); }
  async function toggleChk(item,val){ const cl=Object.assign({},active.checklist||{}); cl[item]=val; active.checklist=cl; await HH.updateRoom(today, active.room, {checklist:cl}); renderActive(); }
  function tickTimer(){
    if(!active||!active.startAt){ $('rm-timer').textContent='00:00'; return; }
    const s=Math.floor((Date.now()-active.startAt)/1000); const win=HH.targetMin(active.type)||30;
    const el=$('rm-timer'); el.textContent=mmss(s); el.className='timer'+(s>=win*60?' red':s>=(win-5)*60?' amber':'');
  }
  async function finishRoom(){
    if(!active.area){
      const photos=active.photos||{}; const miss=PHOTO_SLOTS.filter(s=>!photos[s.k]).map(s=>s.label);
      if(miss.length){ alert('Please take all 4 completion photos before signing off:\n\n• '+miss.join('\n• ')); return; }
    }
    const cl=active.checklist||{}; const items=HH.checklistFor(active.type); const missed=items.filter(it=>!cl[it.k]).map(it=>it.t);
    if(missed.length && !confirm('Not ticked: '+missed.join(', ')+'. Finish anyway?')) return;
    const g=await HH.checkGeo();
    const dur=active.startAt? Math.floor((Date.now()-active.startAt)/1000):0;
    await HH.updateRoom(today, active.room, { status:'done', finishAt:Date.now(), durationSec:dur, geoFinishOk:g.ok===true, geoFinishDist:g.distance||null, urgent:false });
    const doneRoom=active.room;
    if(tmr) clearInterval(tmr); active=null; backToList();
    hhToast('✓ Room '+doneRoom+' done & signed off');
  }
  function backToList(){ if(tmr) clearInterval(tmr); showScreen('scr-list'); renderList(); }

  // ---- init ----
  (async function(){
    await HH.loadCfg();   // load shared staff list first so names are current
    buildLogin();
    const saved=sessionStorage.getItem('hh_me');
    if(saved && HH.staffById(saved)){ ME=HH.staffById(saved); startList(); }
  })();
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('/hoshouse-sw.js').catch(()=>{}); }
</script>
</body>
</html>
