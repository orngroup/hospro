<style>
:root{
  --navy:#1a2b47; --navy-dk:#101d33; --navy-lt:#2d4569;
  --brand-navy:#2C3E50; --brand-orange:#AB3C0C; --brand-beige:#EDF1EB;
  --brand-sans:'Lato',system-ui,sans-serif;
  --gold:#BB9979; --gold-dk:#9d7d5f; --gold-soft:#e8dccf;
  --rust:#9b320f; --rust-lt:#b8481f;
  --ink:#1a2230; --ink-2:#3a4256; --paper:#f7f8fa; --line:#e3e7ee;
  --muted:#5a6472; --ok:#4a7c59; --warn:#c07a3e; --card:#ffffff;
  --shadow:0 1px 3px rgba(26,43,71,.08),0 6px 20px rgba(26,43,71,.06);
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
a{color:var(--gold-dk)}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
#login{min-height:100dvh;display:grid;place-items:center;padding:24px;position:relative;
  background:url('assets/hotel/exterior-dusk.png') center/cover no-repeat}
#login::before{content:"";position:absolute;inset:0;background:linear-gradient(150deg,rgba(44,62,80,.82),rgba(16,29,51,.9))}
.login-card{background:rgba(255,255,255,.97);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.4);
  width:100%;max-width:380px;padding:40px 34px;text-align:center;position:relative;z-index:2;backdrop-filter:blur(4px)}
.login-card .logo{width:120px;margin:0 auto 8px}
.login-card h1{font-family:var(--serif);font-size:26px;font-weight:600;
  letter-spacing:.3px;margin-bottom:2px}
.login-card .sub{color:var(--muted);font-size:13px;margin-bottom:26px}
.field{text-align:left;margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);
  margin-bottom:6px}
.field input{width:100%;padding:11px 13px;border:1px solid var(--line);
  border-radius:9px;transition:border .15s;background:var(--paper)}
.field input:focus{outline:none;border-color:var(--navy-lt)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 18px;border-radius:9px;font-weight:600;font-size:14px;
  transition:.15s;background:var(--navy);color:#fff}
.btn:hover{background:var(--navy-lt)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--paper);border-color:var(--gold)}
.btn.sm{padding:7px 12px;font-size:13px}
.login-err{color:#b3261e;font-size:13px;margin-top:12px;min-height:18px}
.login-hint{margin-top:20px;font-size:12px;color:var(--muted);line-height:1.6}

/* ---------- APP SHELL ---------- */
/* ---------- STAYFLOW SHELL (sidebar + header) ---------- */
#app{min-height:100dvh;display:flex}
.sf-sidebar{width:236px;flex-shrink:0;background:linear-gradient(180deg,#101d33,#0c1729);
  color:#c7d2e0;position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;overflow-y:auto;z-index:40}
.sf-logo{padding:20px 20px 2px;font-family:var(--brand-sans);font-size:24px;font-weight:800;cursor:pointer;letter-spacing:-.5px}
.sf-stay{color:#fff}.sf-flow{color:#4db6c4}
.sf-tagline{padding:0 20px 16px;font-size:9.5px;letter-spacing:1.5px;color:#6b7d95;border-bottom:1px solid rgba(255,255,255,.07)}
.sf-nav{flex:1;padding:12px 12px 8px;display:flex;flex-direction:column;gap:2px}
.sf-nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:13.5px;
  font-weight:500;color:#b3c0d1;text-align:left;transition:.14s;font-family:var(--brand-sans)}
.sf-nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.sf-nav-item.active{background:#4db6c4;color:#06263b;font-weight:700}
.sf-nav-item .sf-ico{font-size:15px;width:18px;text-align:center}
.sf-nav-item.sf-home{margin-bottom:6px;background:rgba(255,255,255,.05)}
.sf-nav-group{margin-top:8px}
.sf-nav-head{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:#7b8aa0;
  padding:6px 12px 4px;display:flex;align-items:center;gap:7px;font-weight:700}
.sf-mdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sf-side-foot{padding:12px;border-top:1px solid rgba(255,255,255,.07)}
.sf-side-link{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:13.5px;color:#b3c0d1;width:100%;text-align:left;font-family:var(--brand-sans)}
.sf-side-link:hover{background:rgba(255,255,255,.06);color:#fff}
.sf-vendor{font-size:9.5px;color:#5a6b83;padding:10px 12px 4px}
.sf-main{flex:1;min-width:0;display:flex;flex-direction:column}
.sf-header{display:flex;align-items:center;gap:16px;padding:12px 26px;background:#fff;
  border-bottom:1px solid var(--brand-beige);position:sticky;top:0;z-index:30}
.sf-loc{font-size:13px;color:var(--brand-navy);font-weight:600;font-family:var(--brand-sans)}
.sf-search{flex:0 1 320px}
.sf-search input{width:100%;padding:9px 14px;border:1px solid var(--brand-beige);border-radius:22px;background:#f6f8fa;font-size:13px}
.sf-spacer{flex:1}
.sf-user{display:flex;align-items:center;gap:9px}
.sf-avatar{width:36px;height:36px;border-radius:50%;background:var(--brand-navy);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:700;font-family:var(--brand-sans)}
.sf-uwrap{display:flex;flex-direction:column;line-height:1.15;font-family:var(--brand-sans)}
.sf-uwrap b{font-size:13.5px;color:var(--brand-navy)}
.sf-urole{font-size:11px;color:#8a97a6}

/* ---------- PRE CHECK-IN (public) ---------- */
body.pc-public{background:#0f1f30}
.pc-splash,.pc-thanks{min-height:100dvh;display:grid;place-items:center;text-align:center;padding:30px;
  background:linear-gradient(rgba(15,31,48,.72),rgba(15,31,48,.86)),url('assets/hotel/exterior-dusk.png') center/cover fixed;color:#fff}
.pc-splash-inner,.pc-thanks-inner{max-width:520px;animation:pcfade .7s ease}
@keyframes pcfade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pc-splash-logo{width:120px;margin-bottom:22px}
.pc-splash-eyebrow{font-family:'Lato',sans-serif;font-size:13px;letter-spacing:5px;color:#c9a978;font-weight:700}
.pc-splash-title{font-family:var(--serif);font-size:46px;font-weight:600;line-height:1.05;margin:10px 0 16px}
.pc-splash-sub{font-family:'Lato',sans-serif;font-size:16px;line-height:1.6;color:#dbe3ec;max-width:420px;margin:0 auto}
.pc-begin{margin-top:30px;background:#c9a978;color:#1a2b3a;border:none;padding:15px 34px;border-radius:32px;
  font:700 16px/1 'Lato',sans-serif;cursor:pointer;transition:.18s;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.pc-begin:hover{background:#d8bb8e;transform:translateY(-2px)}
.pc-formwrap{min-height:100dvh;padding:36px 20px;background:linear-gradient(rgba(15,31,48,.85),rgba(15,31,48,.92)),url('assets/hotel/exterior-dusk.png') center/cover fixed}
.pc-card{max-width:640px;margin:0 auto;background:#22374d;border-radius:18px;
  padding:34px 34px 30px;box-shadow:0 20px 60px rgba(0,0,0,.4);border:1px solid rgba(201,169,120,.25)}
.pc-card-logo{width:80px;display:block;margin:0 auto 14px}
.pc-card-title{font-family:var(--serif);font-size:30px;font-weight:600;color:#fff;text-align:center}
.pc-card-sub{font-family:'Lato',sans-serif;font-size:14px;color:#b8c6d6;text-align:center;margin-bottom:22px}
.pc-card .form-grid label{color:#c9a978;font-weight:600;font-size:12.5px}
.pc-card .form-grid input,.pc-card .form-grid select,.pc-card .form-grid textarea{
  background:rgba(255,255,255,.06);border:1px solid rgba(201,169,120,.3);color:#fff;border-radius:9px}
.pc-card .form-grid input::placeholder,.pc-card .form-grid textarea::placeholder{color:#8ea0b3}
.pc-card .form-grid input:focus,.pc-card .form-grid select:focus,.pc-card .form-grid textarea:focus{
  outline:none;border-color:#c9a978;background:rgba(255,255,255,.1)}
.pc-card .form-grid select option{background:#22374d;color:#fff}
.pc-submit{width:100%;background:#c9a978;color:#1a2b3a;border:none;padding:14px;border-radius:10px;
  font:700 15px/1 'Lato',sans-serif;cursor:pointer;transition:.15s}
.pc-submit:hover{background:#d8bb8e}
.pc-msg{font-size:13px;margin-top:10px;text-align:center;color:#dbe3ec}
.pc-foot{text-align:center;color:#8ea0b3;font-size:12px;margin:20px 0 10px;font-family:'Lato',sans-serif}
@media(max-width:560px){.pc-splash-title{font-size:36px}}

/* ---------- STAYFLOW HOME (redesigned) ---------- */
.sf-welcome{margin-bottom:20px}
.sf-welcome h1{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--brand-navy)}
.sf-welcome h1 .sf-stay{color:var(--brand-navy)}.sf-welcome h1 .sf-flow{color:#3aa9bd}
.sf-welcome p{font-size:15px;color:var(--muted);margin-top:2px}
.sf-modules{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-bottom:22px}
.sf-modcard{background:var(--mt,#eef2f6);border:1px solid rgba(0,0,0,.04);border-radius:13px;padding:16px 8px;
  display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;cursor:pointer;transition:.16s}
.sf-modcard:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(44,62,80,.13)}
.sf-modico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:19px;color:#fff}
.sf-modname{font-size:12.5px;font-weight:700;color:#2a3644;line-height:1.1}.sf-modname b{color:var(--mc)}
.sf-modcap{font-size:10px;color:#6a7686;line-height:1.3}
@media(max-width:1100px){.sf-modules{grid-template-columns:repeat(4,1fr)}}
@media(max-width:560px){.sf-modules{grid-template-columns:repeat(2,1fr)}}
.sf-stats6{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:22px}
.sf-stats6 .sf-stat{background:#fff;border:1px solid var(--brand-beige);border-radius:13px;padding:14px;
  display:flex;align-items:center;gap:11px;cursor:pointer;transition:.15s;box-shadow:0 2px 8px rgba(44,62,80,.05);text-align:left}
.sf-stats6 .sf-stat:hover{border-color:#c3d0dd;box-shadow:0 6px 16px rgba(44,62,80,.1)}
.sf-stat-ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.sf-stat-v{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--brand-navy);display:block;line-height:1}
.sf-stat-k{font-size:11.5px;color:var(--muted)}
@media(max-width:1100px){.sf-stats6{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.sf-stats6{grid-template-columns:repeat(2,1fr)}}
.snap-row{display:flex;align-items:center;gap:10px;padding:7px 0}
.snap-k{font-size:12.5px;color:var(--ink-2);min-width:76px}
.snap-bar{flex:1;height:10px;background:#eef1f4;border-radius:5px;overflow:hidden}
.snap-bar span{display:block;height:100%;border-radius:5px}
.snap-v{font-size:12.5px;font-weight:600;color:var(--brand-navy);min-width:60px;text-align:right}
.snap-tot{margin-top:10px;padding-top:10px;border-top:1px solid var(--brand-beige);font-size:13px;color:var(--ink-2)}
.snap-tot b{color:var(--brand-navy);font-family:var(--serif);font-size:16px}

/* ---------- STAYFLOW HOME / DASHBOARD ---------- */
#view{padding:24px 26px 50px;max-width:1240px;width:100%;font-family:var(--brand-sans)}
.sf-hero{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:0;border-radius:16px;overflow:hidden;
  box-shadow:0 4px 20px rgba(44,62,80,.1);margin-bottom:18px;min-height:170px}
.sf-hero-left{background:#f4f7fa;padding:26px 24px;display:flex;flex-direction:column;justify-content:center}
.sf-hero-logo{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1}
.sf-hero-logo .sf-stay{color:var(--brand-navy)}.sf-hero-logo .sf-flow{color:#3aa9bd}
.sf-hero-logo .sf-tm{font-size:13px;vertical-align:super;color:#8a97a6}
.sf-hero-tag{font-size:11px;letter-spacing:2px;color:#7b8aa0;margin-top:10px;font-weight:600}
.sf-hero-mid{background:linear-gradient(135deg,#22344a,#16283f),url('assets/hotel/exterior-dusk.png');
  background-size:cover;background-blend-mode:overlay;background-position:center;color:#fff;padding:26px 28px;position:relative}
.sf-hero-mid::after{content:"";position:absolute;inset:0;background:url('assets/hotel/exterior-dusk.png') center/cover;opacity:.42;z-index:0}
.sf-hero-mid>*{position:relative;z-index:1}
.sf-hero-welcome{font-size:14px;color:#cdd8e6}
.sf-hero-hotel{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.05;margin:2px 0 0}
.sf-hero-rule{width:44px;height:2px;background:#fff;margin:12px 0}.sf-hero-rule.sm{background:#3aa9bd;margin:10px 0}
.sf-hero-sub{font-size:14px;color:#e2e9f1;line-height:1.4}
.sf-hero-right{background:#f4f7fa;padding:26px 24px;display:flex;flex-direction:column;justify-content:center}
.sf-hero-title{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--brand-navy);line-height:1.15}
.sf-hero-blurb{font-size:12.5px;color:#5a6b7f;line-height:1.5;margin-top:4px}

.sf-modules{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-bottom:24px}
.sf-modcard{background:var(--mt,#eef2f6);border:1px solid rgba(0,0,0,.04);border-radius:13px;padding:16px 10px;
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;transition:.16s}
.sf-modcard:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(44,62,80,.13)}
.sf-modico{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-size:20px;color:#fff}
.sf-modname{font-size:13px;font-weight:700;color:#2a3644}.sf-modname b{color:var(--mc)}
.sf-modcap{font-size:10.5px;color:#7a8896;line-height:1.35}
@media(max-width:1100px){.sf-modules{grid-template-columns:repeat(4,1fr)}}
@media(max-width:560px){.sf-modules{grid-template-columns:repeat(2,1fr)}}

.sf-dash-head{margin-bottom:14px}
.sf-dash-head h2{font-family:var(--serif);font-size:24px;color:var(--brand-navy);font-weight:600}
.sf-dash-head p{font-size:13.5px;color:#7a8896}
.sf-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.sf-stat{background:#fff;border:1px solid var(--brand-beige);border-radius:13px;padding:16px 18px;
  display:flex;align-items:center;gap:14px;cursor:pointer;transition:.15s;box-shadow:0 2px 8px rgba(44,62,80,.05)}
.sf-stat:hover{border-color:#c3d0dd;box-shadow:0 6px 16px rgba(44,62,80,.1)}
.sf-stat-ic{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.sf-stat-v{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--brand-navy);display:block;line-height:1}
.sf-est{font-size:9px;color:#a0acba;font-weight:400}
.sf-stat-k{font-size:12.5px;color:#7a8896}
.sf-stat-go{margin-left:auto;color:#c3d0dd;font-size:20px}
@media(max-width:900px){.sf-stats{grid-template-columns:repeat(2,1fr)}}

.sf-dash-grid{display:grid;grid-template-columns:1.1fr 1.1fr .9fr;gap:16px}
.sf-panel{background:#fff;border:1px solid var(--brand-beige);border-radius:14px;padding:18px 20px;box-shadow:0 2px 8px rgba(44,62,80,.05)}
.sf-panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sf-panel-head h3{font-size:16px;font-weight:700;color:var(--brand-navy)}
.sf-link{font-size:12.5px;color:#3aa9bd;font-weight:600}
.sf-prio{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f0f3f6}
.sf-prio:last-child{border-bottom:none}
.sf-prio-check{color:#c3d0dd;font-size:16px}
.sf-prio-txt{flex:1;font-size:13.5px;color:#2a3644}
.sf-prio-mod{display:block;font-size:11px;color:#3aa9bd}
.sf-prio-due{font-size:12px;color:#c07a3e;font-weight:600;white-space:nowrap}
.sf-up{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #f0f3f6}
.sf-up:last-child{border-bottom:none}
.sf-up-date{text-align:center;background:#f4f7fa;border-radius:8px;padding:5px 9px;min-width:44px}
.sf-up-date b{display:block;font-family:var(--serif);font-size:17px;color:var(--brand-navy);line-height:1}
.sf-up-date span{font-size:9.5px;color:#8a97a6;font-weight:600}
.sf-up-txt{font-size:13.5px;color:#2a3644;font-weight:600}
.sf-up-sub{display:block;font-size:11.5px;color:#8a97a6;font-weight:400}
.sf-quote{border-radius:14px;padding:22px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;
  background-size:cover;background-position:center;min-height:180px}
.sf-quote-txt{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.25}
.sf-quote-by{font-size:13px;font-weight:700}.sf-quote-by small{font-weight:400;color:#dbe4ef;font-size:11px}
@media(max-width:1000px){.sf-dash-grid{grid-template-columns:1fr}}
@media(max-width:820px){.sf-sidebar{width:64px}.sf-logo,.sf-tagline,.sf-nav-head,.sf-nav-item span:not(.sf-ico),.sf-side-link span:not(.sf-ico),.sf-vendor{display:none}.sf-hero{grid-template-columns:1fr}}
.mode-badge{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:10px;
  background:#e6f3ee;color:#3a7d5f}
main#view{flex:1;padding:26px 30px 60px;max-width:1240px;width:100%;margin:0 auto}
.page-head{margin-bottom:20px}
.page-head h2{font-family:var(--serif);font-size:29px;font-weight:600;color:var(--brand-navy)}
.page-head p{color:var(--muted);font-size:14px;margin-top:2px}
@media(max-width:820px){
  .sf-sidebar{position:fixed;left:-236px;transition:.2s;box-shadow:4px 0 20px rgba(0,0,0,.3)}
  .sf-sidebar.open{left:0}
  .sf-search{display:none}
}

/* ---------- LOCATION PICKER ---------- */
.loc-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.loc-card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:22px;box-shadow:var(--shadow);cursor:pointer;transition:.18s;text-align:left}
.loc-card:hover{border-color:var(--gold);transform:translateY(-2px)}
.loc-card.soon{opacity:.5;cursor:default}
.loc-card h3{font-family:var(--serif);font-size:22px;font-weight:600}
.loc-card .town{color:var(--gold-dk);font-weight:600;font-size:13px;margin:2px 0 8px}
.loc-card .addr{color:var(--muted);font-size:13px}

/* ---------- ROOM GRID ---------- */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px;
  background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 16px}
.filters .lbl{font-size:12px;font-weight:600;color:var(--ink-2)}
.filters select,.filters input{padding:8px 11px;border:1px solid var(--line);
  border-radius:8px;background:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:7px 13px;border:1px solid var(--line);border-radius:20px;font-size:13px;
  font-weight:500;transition:.15s;background:var(--card)}
.chip.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.room-grid{display:grid;gap:15px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.room-card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:18px;box-shadow:var(--shadow);cursor:pointer;transition:.18s}
.room-card:hover{border-color:var(--gold);transform:translateY(-2px)}
.room-card.dim{opacity:.4}
.room-card h3{font-family:var(--serif);font-size:21px;font-weight:600;margin-bottom:2px}
.room-card .m2{color:var(--gold-dk);font-weight:600;font-size:13px}
.room-card .caps{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.cap-pill{background:var(--paper);border:1px solid var(--line);border-radius:6px;
  padding:3px 8px;font-size:11.5px;color:var(--ink-2)}
.cap-pill b{color:var(--gold-dk)}
.room-card .fit{margin-top:11px;font-size:12.5px;font-weight:600}
.fit.yes{color:var(--ok)} .fit.no{color:#b3261e}

/* ---------- MODAL / ROOM DETAIL ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(26,22,19,.55);z-index:60;
  display:grid;place-items:center;padding:20px;backdrop-filter:blur(2px)}
.modal{background:var(--card);border-radius:14px;max-width:640px;width:100%;
  max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{padding:22px 26px;border-bottom:1px solid var(--line);
  display:flex;align-items:flex-start;gap:12px;position:sticky;top:0;background:var(--card)}
.modal-head h3{font-family:var(--serif);font-size:26px;font-weight:600;flex:1}
.modal-head .close{font-size:22px;color:var(--muted);width:32px;height:32px;
  border-radius:8px;transition:.15s}
.modal-head .close:hover{background:var(--paper);color:var(--ink)}
.modal-body{padding:22px 26px}
.detail-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.stat{flex:1;min-width:120px;background:var(--paper);border-radius:10px;padding:13px 15px}
.stat .k{font-size:11px;color:var(--muted);font-weight:600;text-transform:none}
.stat .v{font-size:20px;font-weight:600;font-family:var(--serif);color:var(--ink)}
.stat .v small{font-size:12px;color:var(--muted);font-family:var(--sans)}
.sec-title{font-size:13px;font-weight:700;color:var(--gold-dk);margin:20px 0 9px;
  padding-bottom:5px;border-bottom:1px solid var(--gold-soft)}
.cap-table{width:100%;border-collapse:collapse;font-size:14px}
.cap-table td{padding:7px 4px;border-bottom:1px solid var(--line)}
.cap-table td:first-child{color:var(--ink-2)}
.cap-table td:last-child{text-align:right;font-weight:600}
.cap-table tr.best td{color:var(--gold-dk)}
.cap-table tr.best td:first-child::after{content:" ★";color:var(--gold)}
.equip-list{list-style:none;display:grid;gap:6px}
.equip-list li{display:flex;gap:8px;font-size:14px;align-items:flex-start}
.equip-list li::before{content:"›";color:var(--gold);font-weight:700}
.carbon-box{background:linear-gradient(135deg,#f0f5ef,#e8f0e6);border-radius:10px;
  padding:15px;border:1px solid #d6e3d2}
.carbon-box .big{font-size:26px;font-weight:600;font-family:var(--serif);color:var(--ok)}
.carbon-box .split{font-size:12.5px;color:#5a6b57;margin-top:5px}
.dummy-tag{display:inline-block;background:#fdf0e3;color:var(--warn);font-size:10.5px;
  font-weight:700;padding:2px 7px;border-radius:5px;margin-left:8px;vertical-align:middle}

/* ---------- PACKAGES ---------- */
.pkg-grid{display:grid;gap:15px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.pkg-card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:20px;box-shadow:var(--shadow)}
.pkg-card h3{font-family:var(--serif);font-size:20px;font-weight:600}
.pkg-card .price{font-size:15px;color:var(--gold-dk);font-weight:600;margin:3px 0 12px}
.pkg-card .price b{font-size:24px}
.pkg-card ul{list-style:none;display:grid;gap:5px;font-size:13.5px}
.pkg-card li{display:flex;gap:7px}.pkg-card li::before{content:"✓";color:var(--ok);font-weight:700}
.pkg-card .min{margin-top:11px;font-size:12px;color:var(--muted)}

/* ---------- MULTI-ROOM QUOTE LINES ---------- */
.rl-body{display:flex;gap:14px}
.rl-fnrow{display:grid;grid-template-columns:1.2fr 1.4fr .7fr;gap:10px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.rl-fnrow label{display:block;font-size:11px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.rl-fnrow select,.rl-fnrow input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff}
@media(max-width:600px){.rl-fnrow{grid-template-columns:1fr}}
.rl-img{width:130px;height:100px;object-fit:cover;border-radius:8px;flex-shrink:0;border:1px solid var(--line)}
.rl-spec{margin-top:10px;font-size:12px;color:var(--muted);background:#fff;border-radius:7px;padding:8px 11px;border:1px solid var(--line)}
@media(max-width:600px){.rl-body{flex-direction:column}.rl-img{width:100%;height:130px}}

/* ---------- SALES DASHBOARD ---------- */
.chart-row{display:grid;gap:16px;grid-template-columns:1fr 1fr;margin-bottom:16px}
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.chart-card.wide{margin-bottom:16px}
.cc-title{font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:14px}
.pie-wrap{display:flex;gap:16px;align-items:center}
.pie-legend{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink-2)}
.pie-leg{display:flex;align-items:center;gap:7px}
.pie-leg i{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.pie-leg b{margin-left:auto;color:var(--navy)}
@media(max-width:700px){.chart-row{grid-template-columns:1fr}}

/* clickable chart filters */
.chart-card.clickable .cc-hint{font-size:10px;color:var(--muted);font-weight:400;margin-left:6px}
.chart-filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.cf-btn{font-size:11.5px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:4px 10px;color:var(--ink-2);transition:.15s}
.cf-btn:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.bob-note{background:#eef2f8;border:1px solid #d5e0ee;border-radius:8px;padding:10px 13px;font-size:12.5px;color:var(--navy);margin-bottom:14px}

/* conversion strip */
.conv-strip{display:flex;gap:20px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.conv-main{display:flex;align-items:center;gap:14px;flex:1;min-width:280px}
.conv-rate{text-align:center}.cr-v{display:block;font-family:var(--serif);font-size:26px;font-weight:600;color:var(--navy)}
.cr-k{font-size:11px;color:var(--muted)}
.conv-bar{flex:1;display:flex;height:14px;border-radius:7px;overflow:hidden;min-width:100px}
.cb-won{background:#4a7c59}.cb-lost{background:#d99}
.conv-nums{font-size:12px}.cn-won{color:var(--ok);font-weight:600}.cn-lost{color:#b3261e;font-weight:600}
.lost-reasons{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.lr-label{font-size:12px;font-weight:600;color:var(--ink-2)}
.lr-pill{font-size:11.5px;background:#fdecec;border:1px solid #f0d5d5;border-radius:12px;padding:3px 9px;color:#a34}
.lr-pill b{color:#b3261e}

/* tasks due */
.tasks-due{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.task-row{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.task-row:last-child{border-bottom:none}
.task-row:hover{background:var(--paper)}
.tr-task{flex:1;font-weight:500}.tr-task.overdue{color:#b3261e}
.tr-name{color:var(--muted)}.tr-due{color:var(--muted);font-size:12px}

/* checklist in detail */
.mini-btn{font-size:11px;background:var(--navy);color:#fff;border-radius:6px;padding:3px 10px;margin-left:8px;font-weight:600}
.checklist{display:flex;flex-direction:column;gap:2px}
.chk-row{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.chk-row.done .chk-task{text-decoration:line-through;color:var(--muted)}
.chk-task{flex:1}.chk-due{font-size:12px;color:var(--muted)}.chk-due.overdue{color:#b3261e;font-weight:600}

/* menu picker in quote */
.rl-menu{margin-top:10px}
.menu-toggle{font-size:12.5px;background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:7px 12px;font-weight:600;color:var(--ink-2)}
.menu-toggle:hover{border-color:var(--gold)}
.menu-panel{margin-top:10px;padding:12px;background:var(--paper);border-radius:8px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu-cat b{display:block;font-size:12px;color:var(--gold-dk);margin-bottom:5px}
.menu-chk{display:block;font-size:12.5px;padding:2px 0;cursor:pointer}
.menu-chk input{margin-right:6px}
@media(max-width:600px){.menu-panel{grid-template-columns:1fr}}

/* pipeline filter bar + table */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.filter-bar input,.filter-bar select{padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:13px}
.filter-bar #fb-search{flex:1;min-width:150px}
.pipe-count{font-size:13px;color:var(--muted);margin-bottom:10px}
.pipe-count b{color:var(--navy)}
.pipe-table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);font-size:13px}
.pipe-table th{background:var(--navy);color:#fff;text-align:left;padding:10px 12px;font-weight:600;font-size:12px;position:sticky;top:0;z-index:1}
.pipe-table td{color:var(--ink)}
.pipe-table td{padding:9px 12px;border-bottom:1px solid var(--line)}
.pipe-row{cursor:pointer;transition:.12s}
.pipe-row:hover td{background:var(--paper)}
.pr-name{font-weight:600}
.pr-flag{color:#b3261e}
.status-pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;white-space:nowrap}
.rag{display:inline-block;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.05)}
.rag-red{background:#d64545}.rag-amber{background:#e0a030}.rag-yellow{background:#e8cf4a}.rag-green{background:#4a9d6a}.rag-grey{background:#c3ccd6}
.fu-over{color:#b3261e;font-weight:600}

/* pipeline toolbar + legend */
.pipe-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.rag-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.rag-legend span{display:flex;align-items:center;gap:6px}
.pipe-actions{display:flex;gap:8px}
/* action panel */
.action-panel{background:#fff;border:1px solid var(--brand-beige);border-left:4px solid #e0a030;border-radius:12px;padding:16px 18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(44,62,80,.06)}
.ap-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.ap-head h3{font-size:16px;font-weight:700;color:var(--brand-navy)}
.ap-sub{font-size:12.5px;color:var(--muted)}
.ap-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f2f4f7;cursor:pointer;transition:.12s}
.ap-row:last-child{border-bottom:none}.ap-row:hover{background:var(--paper)}
.ap-name{font-weight:600;font-size:13.5px;min-width:130px}
.ap-meta{flex:1;font-size:12px;color:var(--muted)}
.ap-due{font-size:12px;color:var(--muted);white-space:nowrap}
.ap-due.overdue{color:#b3261e;font-weight:600}
.ap-val{font-weight:600;font-size:13px;color:var(--brand-navy);min-width:60px;text-align:right}
.ap-empty{padding:8px 0;color:#4a9d6a;font-size:13.5px;font-weight:500}
.conv-wrap{display:grid;grid-template-columns:1fr 1.3fr;gap:16px;margin-bottom:16px}
.scope-chip{display:inline-flex;align-items:center;gap:12px;background:#e6eef5;border:1px solid #c3d5e5;border-radius:20px;padding:7px 14px;font-size:13px;color:var(--brand-navy);margin-bottom:14px}
.scope-chip b{color:#2f6f9e}
.scope-chip button{background:var(--brand-navy);color:#fff;border:none;border-radius:12px;padding:3px 10px;font-size:11px;cursor:pointer}
@media(max-width:900px){.conv-wrap{grid-template-columns:1fr}}
/* conversion by event type */
.ettable{width:100%;border-collapse:collapse;font-size:13.5px}
.ettable th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--brand-beige);font-size:11.5px;color:var(--muted);font-weight:600}
.ettable td{padding:9px 10px;border-bottom:1px solid #f0f3f6}
.ettr{cursor:pointer;transition:.12s}.ettr:hover td{background:var(--paper)}
.et-won{color:#4a9d6a;font-weight:600}.et-lost{color:#d64545;font-weight:600}
.et-wrbar{display:inline-block;width:60px;height:6px;background:#eef1f4;border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:6px}
.et-wrbar span{display:block;height:100%;background:#4a9d6a}
.et-wr{font-size:12px;color:var(--ink-2)}
/* QR + feedback inbox */
.qr-box{display:flex;justify-content:center;padding:16px;background:#fff;border-radius:12px;margin-top:6px}
.qr-box img,.qr-box canvas{display:block}
.fb-list{max-height:420px;overflow-y:auto;margin-top:6px}
.fb-item{border-bottom:1px solid #f0f3f6;padding:11px 0}
.fb-top{display:flex;justify-content:space-between;align-items:center}
.fb-stars{color:var(--gold);font-size:15px;letter-spacing:1px}
.fb-date{font-size:11.5px;color:var(--muted)}
.fb-text{font-size:13.5px;color:var(--ink-2);margin-top:4px;line-height:1.5}
.fb-contact{font-size:12px;color:var(--navy);margin-top:4px;font-weight:600}
.st-enquiry{background:#eef2f8;color:#3a6ea5}
.st-provisional{background:#fdf0e3;color:#c07a3e}
.st-confirmed{background:#e0efe4;color:var(--ok)}
.st-cancelled{background:#f2f2f2;color:var(--muted)}

/* M&E tracker */
.mne-room{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.mne-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mne-head h3{font-family:var(--serif);font-size:20px;font-weight:600}
.mne-m2{font-size:12px;color:var(--muted);font-family:var(--sans);font-weight:400}
.mne-head .mne-add{margin-left:auto}
.room-cost{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--navy)}
.mne-subbar{margin-bottom:14px}
.mne-progress{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;margin-bottom:8px}
.mp-seg{transition:flex .3s}
.mp-seg.st-needed{background:#e89b9b}.mp-seg.st-ordered{background:#e0b483}
.mp-seg.st-delivered{background:#9bb5d4}.mp-seg.st-installed{background:#7cae8a}
.mne-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.mne-legend span{display:flex;align-items:center;gap:5px}
.mne-legend i{width:10px;height:10px;border-radius:3px}
.mne-legend i.st-needed{background:#e89b9b}.mne-legend i.st-ordered{background:#e0b483}
.mne-legend i.st-delivered{background:#9bb5d4}.mne-legend i.st-installed{background:#7cae8a}
.rs-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px}
.rs-yes{background:#e0efe4;color:var(--ok)}.rs-no{background:#fdecec;color:#b3261e}.rs-tbc{background:#f2f2f2;color:var(--muted)}
.mne-current{font-size:12.5px;color:var(--ink-2);margin-top:10px}
.mne-comment{font-size:12.5px;color:var(--warn);background:#fdf6ee;border-radius:7px;padding:8px 11px;margin-top:8px}
.mne-items{margin-top:12px}
.mne-table{width:100%;border-collapse:collapse;font-size:13px}
.mne-table th{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);font-weight:600}
.mne-table td{padding:7px 6px;border-bottom:1px solid var(--line)}
.cat-pill{font-size:11px;background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:2px 7px;color:var(--ink-2)}
.mne-status{padding:4px 8px;border-radius:6px;border:1px solid var(--line);font-size:12px;font-weight:600}
.mne-status.needed{background:#fdecec;color:#b3261e}.mne-status.ordered{background:#fdf0e3;color:#c07a3e}
.mne-status.delivered{background:#eef2f8;color:#3a6ea5}.mne-status.installed{background:#e0efe4;color:var(--ok)}
.mne-del{width:22px;height:22px;border-radius:5px;background:var(--paper);color:var(--muted);font-size:15px}
.mne-del:hover{background:#f0e3e3;color:#b3261e}

/* ---------- ENHANCED ENQUIRY CARDS ---------- */
.col-value{font-size:12px;font-weight:600;color:var(--gold-dk);margin:-4px 0 10px}
.ec-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.owner-badge{background:var(--navy);color:#fff;font-size:10px;font-weight:700;width:24px;height:24px;
  border-radius:50%;display:grid;place-items:center;flex-shrink:0;letter-spacing:.3px}
.tag.val{background:#e8f0e6;border-color:#cfe0ca;color:var(--ok);font-weight:700}
.followup{margin-top:8px;font-size:11.5px;color:var(--muted);background:var(--paper);border-radius:6px;padding:4px 8px}
.followup.overdue{background:#fdf0e3;color:#b3261e;font-weight:600}
.manage-grid{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-top:4px}
.manage-grid label{display:block;font-size:11px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.manage-grid select,.manage-grid input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper)}

/* ---------- HELP BOX ---------- */
.help-box{margin-bottom:18px}
.help-toggle{background:var(--gold-soft);color:var(--gold-dk);font-weight:600;font-size:13px;padding:9px 15px;border-radius:9px}
.help-body{background:#fdfbf8;border:1px solid var(--gold-soft);border-radius:10px;padding:16px 18px;margin-top:10px}
.help-body p{font-size:13px;color:var(--ink-2);margin-bottom:9px;line-height:1.55}
.help-body p:last-child{margin-bottom:0}
.help-body b{color:var(--navy)}

/* ---------- BROCHURE BUILDER ---------- */
.br-price{width:110px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;font-weight:600}
.br-inc{width:100%;margin-top:8px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12.5px;resize:vertical}
.br-imgsel{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.br-imggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.br-imgopt{position:relative;cursor:pointer;border:2px solid var(--line);border-radius:8px;overflow:hidden;display:block}
.br-imgopt.on{border-color:var(--gold)}
.br-imgopt input{position:absolute;top:5px;left:5px;z-index:2}
.br-imgopt img{width:100%;height:60px;object-fit:cover;display:block}
.br-imgopt span{display:block;font-size:10px;padding:3px 5px;text-align:center;color:var(--ink-2);background:var(--paper)}
.br-preview{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.brp-hero{height:150px;background-size:cover;background-position:center;position:relative;display:flex;align-items:flex-end}
.brp-ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,43,71,.1),rgba(16,29,51,.7))}
.brp-htxt{position:relative;z-index:2;color:#fff;padding:16px}
.brp-logo{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:2.5px}
.brp-eyebrow{font-size:8px;letter-spacing:3px;color:var(--gold-soft)}
.brp-title{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.1;margin-top:6px}
.brp-sub{font-style:italic;font-size:12px;color:var(--gold-soft)}
.brp-body{padding:16px}
.brp-intro{font-size:12px;color:var(--ink-2);margin-bottom:14px}
.brp-rate{border-bottom:1px solid var(--line);padding:8px 0}
.brp-rn{font-family:var(--serif);font-weight:600;color:var(--navy);font-size:14px;display:flex;justify-content:space-between}
.brp-rn span{color:var(--gold-dk);font-family:var(--sans);font-size:12px}
.brp-ri{font-size:11px;color:var(--muted);margin-top:2px}

/* ---------- DINING & MENU ---------- */
.rest-key{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:10px}
.rest-plan{max-width:640px}
.menu-course{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.mc-head{display:flex;gap:8px;margin-bottom:8px}
.mc-name{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;font-weight:600}
.mc-del{width:28px;border-radius:6px;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:16px}
.mc-del:hover{background:#f0e3e3;color:#b3261e}
.mc-item{display:flex;gap:6px;margin-bottom:6px}
.mi-name{flex:1;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:#fff}
.mi-desc{flex:1.3;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12px}
.mi-price{width:64px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;text-align:center}
.mi-del{width:26px;border-radius:5px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.mi-del:hover{background:#f0e3e3;color:#b3261e}
.mc-additem{font-size:12px;color:var(--gold-dk);font-weight:600;padding:4px 0;background:none}
.menu-preview{background:linear-gradient(180deg,#fff,#faf8f4);border:1px solid var(--gold-soft);border-radius:10px;
  padding:26px 22px;text-align:center;min-height:300px}
.mp-logo{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:2.5px;color:var(--navy)}
.mp-sub2{font-size:9px;letter-spacing:3px;color:var(--gold);margin-bottom:18px}
.mp-title{font-family:var(--serif);font-size:24px;font-weight:600;margin:0 0 3px;color:var(--navy)}
.mp-subtitle{font-style:italic;color:var(--muted);font-size:13px;margin-bottom:14px}
.mp-course{font-family:var(--serif);font-size:14px;font-weight:600;color:var(--gold-dk);text-transform:uppercase;
  letter-spacing:1.5px;margin:18px 0 8px}
.mp-dish{margin-bottom:9px}
.mp-dn{font-family:var(--serif);font-size:15px;color:var(--ink);display:block}
.mp-dp{color:var(--gold-dk);font-size:13px;margin-left:6px}
.mp-dd{font-size:11.5px;color:var(--muted);font-style:italic}
.mp-price{font-family:var(--serif);font-size:17px;color:var(--navy);font-weight:600;margin-top:18px}
.mp-footer{font-size:9.5px;color:var(--muted);margin-top:20px;border-top:1px solid var(--gold-soft);padding-top:10px;line-height:1.5}

/* ---------- SOCIAL STUDIO ---------- */
.soc-drop{border:2px dashed var(--line);border-radius:12px;padding:28px;text-align:center;cursor:pointer;transition:.15s;background:var(--paper)}
.soc-drop:hover,.soc-drop.drag{border-color:var(--gold);background:#fdfbf8}
.soc-dropico{font-size:34px;display:block;margin-bottom:6px}
.soc-thumb{max-width:100%;max-height:180px;border-radius:8px;margin-bottom:8px}
.soc-preview{min-height:200px}
.soc-outimg{width:100%;border-radius:10px;margin-bottom:14px}
.soc-caption{font-size:14.5px;line-height:1.6;white-space:pre-wrap;background:var(--paper);border-radius:10px;padding:14px 16px}
.soc-tags{font-size:13px;color:var(--gold-dk);margin-top:10px;line-height:1.7;font-weight:500}
.soc-loading{text-align:center;padding:40px 0;color:var(--muted);font-size:15px}
.soc-prompt{background:var(--navy-dk);color:#dde4ef;border-radius:10px;padding:14px 16px;font-size:12.5px;line-height:1.55;white-space:pre-wrap;margin-top:12px;max-height:240px;overflow-y:auto}
#soc-result,#soc-desc{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--paper);font-size:14px;resize:vertical}

/* ---------- HOME / WELCOME ---------- */
body.home-active nav.tabs{display:none;}
.home-hero{background:linear-gradient(135deg,var(--brand-navy),#1d2b3a);border-radius:18px;padding:40px 38px;color:#fff;margin-bottom:20px;position:relative;overflow:hidden;font-family:var(--brand-sans)}
.home-hero::after{content:"";position:absolute;top:-60px;right:-40px;width:260px;height:260px;border-radius:50%;background:rgba(171,60,12,.16)}
.home-hero::before{content:"";position:absolute;bottom:-80px;left:30%;width:200px;height:200px;border-radius:50%;background:rgba(237,241,235,.06)}
.hh-inner{position:relative;z-index:2}
.hh-eyebrow{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--brand-orange);font-weight:700}
.hh-title{font-family:var(--serif);font-size:40px;font-weight:600;margin:6px 0 4px;letter-spacing:.3px}
.hh-sub{font-size:16px;color:#dbe2ea;font-family:var(--brand-sans)}
.hh-meta{font-size:13px;color:#9fb0c2;margin-top:12px;font-family:var(--brand-sans)}
.home-quickstats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}
.hq{background:#fff;border:1px solid var(--brand-beige);border-radius:14px;padding:18px 20px;box-shadow:0 2px 10px rgba(44,62,80,.06);font-family:var(--brand-sans)}
.hq.alert{border-color:#f0d9bf;background:#fdf6ee}
.hq-v{display:block;font-family:var(--serif);font-size:30px;font-weight:600;color:var(--brand-navy)}
.hq.alert .hq-v{color:var(--brand-orange)}
.hq-k{font-size:12.5px;color:#7a8896;letter-spacing:.3px}
.home-section{margin-bottom:26px}
.hs-head{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding-bottom:12px;border-bottom:2px solid var(--brand-beige)}
.hs-ico{font-size:22px;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--brand-navy);color:#fff}
.hs-label{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.1;color:var(--brand-navy)}
.hs-desc{font-size:12.5px;color:#7a8896;font-family:var(--brand-sans)}
.home-tiles{display:grid;gap:14px;grid-template-columns:repeat(4,1fr)}
.home-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:#fff;border:1px solid var(--brand-beige);border-radius:14px;padding:26px 16px;
  box-shadow:0 2px 10px rgba(44,62,80,.05);transition:.18s;cursor:pointer;text-align:center;position:relative;overflow:hidden;font-family:var(--brand-sans)}
.home-tile::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--brand-orange);transform:scaleX(0);transition:.2s;transform-origin:left}
.home-tile:hover{transform:translateY(-3px);border-color:var(--brand-navy);box-shadow:0 8px 24px rgba(44,62,80,.14)}
.home-tile:hover::before{transform:scaleX(1)}
.ht-ico{font-size:30px}
.ht-label{font-size:14px;font-weight:700;color:var(--brand-navy);letter-spacing:.2px}
@media(max-width:900px){.home-tiles{grid-template-columns:repeat(3,1fr)}}
@media(max-width:680px){.home-tiles{grid-template-columns:repeat(2,1fr)}.home-quickstats{grid-template-columns:1fr}}

/* ---------- CORPORATE RATE PLANNER ---------- */
.corp-candidates{background:linear-gradient(135deg,#eef5ec,#e4f0e2);border:1px solid #cfe0ca;border-radius:12px;padding:18px;margin-bottom:18px}
.cand-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(74,124,89,.15)}
.cand-row:last-child{border-bottom:none}
.cand-name{font-weight:600;font-size:14.5px;min-width:180px}
.cand-stats{flex:1;font-size:12.5px;color:#4a6147}
.cand-flag{background:var(--ok);color:#fff;font-size:11px;font-weight:700;padding:4px 12px;border-radius:12px;white-space:nowrap}
.cand-flag.sm{padding:2px 9px;font-size:10.5px}
.data-table tr.cand td{background:#f2f9f0}
#cr-paste{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--paper);font-family:ui-monospace,monospace;font-size:12.5px}

/* ---------- MARKETING LIBRARY ---------- */
.mkt-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.mkt-tab{padding:9px 14px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-weight:500;background:var(--card);transition:.15s}
.mkt-tab:hover{border-color:var(--gold)}
.mkt-tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.mkt-n{font-size:11px;background:rgba(0,0,0,.08);padding:1px 7px;border-radius:9px;margin-left:4px}
.mkt-tab.on .mkt-n{background:rgba(255,255,255,.2)}
.mkt-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.mkt-head h3{font-family:var(--serif);font-size:22px;font-weight:600}
.mkt-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.mkt-card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);transition:.18s}
.mkt-card:hover{transform:translateY(-2px);border-color:var(--gold)}
.mkt-prev{height:150px;display:grid;place-items:center;background:var(--paper);border-bottom:1px solid var(--line);overflow:hidden}
.mkt-prev.dark{background:linear-gradient(135deg,var(--navy),var(--navy-dk))}
.mkt-prev img{width:100%;height:100%;object-fit:contain;padding:14px}
.mkt-prev.noimg::after{content:"🖼️";font-size:36px}
.mkt-ico{font-size:44px}
.mkt-body{padding:13px 14px}
.mkt-name{font-weight:600;font-size:14px;line-height:1.3}
.mkt-meta{font-size:11px;color:var(--muted);margin-top:3px}
.mkt-actions{display:flex;gap:6px;margin-top:11px}
.mkt-btn{flex:1;text-align:center;font-size:12px;font-weight:600;padding:6px 8px;border-radius:7px;
  background:var(--paper);border:1px solid var(--line);color:var(--navy);text-decoration:none;transition:.15s;cursor:pointer}
.mkt-btn:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.mkt-btn.del{color:#b3261e}.mkt-btn.del:hover{background:#b3261e;color:#fff;border-color:#b3261e}

/* ---------- ENQUIRIES ---------- */
.stat-cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:18px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.stat-card.accent{background:linear-gradient(135deg,var(--navy),var(--navy-dk));border:none}
.stat-card.accent .sc-v,.stat-card.accent .sc-k{color:#fff}
.stat-card .sc-v{font-family:var(--serif);font-size:28px;font-weight:600;color:var(--navy);line-height:1}
.stat-card .sc-k{font-size:12px;color:var(--muted);margin-top:5px}
.source-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.source-bar .sb-label{font-size:12px;font-weight:600;color:var(--ink-2)}
.src-pill{font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px 11px;color:var(--ink-2)}
.src-pill b{color:var(--navy)}
.tag.src{background:var(--gold-soft);border-color:var(--gold-soft);color:var(--gold-dk);text-transform:capitalize}
.profit-banner{background:linear-gradient(135deg,var(--navy),var(--navy-dk));color:#fff;border-radius:10px;
  padding:12px 16px;font-size:14px;margin-bottom:16px}
.profit-banner b{color:var(--gold-soft)}
.enq-costing{display:flex;gap:10px;margin-top:6px}
.enq-costing>div{flex:1;background:var(--paper);border-radius:8px;padding:10px;text-align:center}
.enq-costing .ec-v{display:block;font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ok)}
.enq-costing .ec-k{font-size:11px;color:var(--muted)}
.tag.profit{background:#e0efe4;border-color:#c5e0cd;color:var(--ok);font-weight:600}
.enq-wrap{display:grid;gap:16px}
.enq-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.enq-toolbar .spacer{flex:1}
.enq-cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.enq-col h4{font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:9px;
  display:flex;justify-content:space-between}
.enq-col h4 span{background:var(--gold-soft);color:var(--gold-dk);border-radius:12px;
  padding:1px 9px;font-size:12px}
.enq-card{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
.enq-card:hover{border-color:var(--gold)}
.enq-card .nm{font-weight:600;font-size:14.5px}
.enq-card .meta{font-size:12px;color:var(--muted);margin-top:3px}
.enq-card .tags{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.tag{font-size:11px;background:var(--paper);border:1px solid var(--line);
  border-radius:5px;padding:2px 7px;color:var(--ink-2)}

/* ---------- FORMS / QUOTE ---------- */
.form-grid{display:grid;gap:14px;grid-template-columns:1fr 1fr;max-width:720px}
.form-grid .full{grid-column:1/-1}
.form-grid label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.form-grid input,.form-grid select,.form-grid textarea{width:100%;padding:10px 12px;
  border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus{outline:none;border-color:var(--gold)}
.quote-layout{display:grid;gap:22px;grid-template-columns:1.15fr .85fr;align-items:start}
.quote-panel{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:20px;box-shadow:var(--shadow)}
.quote-panel h3{font-family:var(--serif);font-size:20px;margin-bottom:14px}
.addon-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.addon-row .an{flex:1}.addon-row .ap{color:var(--muted);font-size:13px;width:70px;text-align:right}
.addon-row input[type=number]{width:56px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;text-align:center}
.quote-summary{position:sticky;top:110px}
.qs-line{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.qs-line.total{border-top:2px solid var(--ink);margin-top:8px;padding-top:10px;
  font-size:19px;font-weight:700;font-family:var(--serif)}
.qs-sub{color:var(--muted);font-size:12px}
.carbon-quote{background:#eef5ec;border-radius:8px;padding:10px 12px;margin-top:12px;
  font-size:13px;color:#4a6147}.carbon-quote b{font-size:16px}

/* ---------- ADMIN ---------- */
.admin-note{background:#fdf0e3;border:1px solid #f0d9bf;border-radius:10px;
  padding:14px 16px;font-size:13.5px;color:#7a5a2e;margin-bottom:18px}
.data-table{width:100%;border-collapse:collapse;background:var(--card);
  border-radius:10px;overflow:hidden;box-shadow:var(--shadow);font-size:13.5px}
.data-table th{background:var(--ink);color:#fff;text-align:left;padding:10px 12px;font-weight:600}
.data-table td{padding:9px 12px;border-bottom:1px solid var(--line)}
.data-table tr:hover td{background:var(--paper)}

.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .big{font-family:var(--serif);font-size:22px;color:var(--ink-2);margin-bottom:6px}

/* ---------- GALLERY ---------- */
.gallery{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:16px}
.gallery img{width:100%;height:110px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.room-hero{width:100%;height:150px;object-fit:cover;border-radius:10px;margin-bottom:14px}
.room-card .thumb{width:100%;height:120px;object-fit:cover;border-radius:8px;margin-bottom:10px;border:1px solid var(--line)}

/* ---------- LAYOUT DIAGRAMS ---------- */
.layout-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.layout-tabs button{padding:6px 12px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-weight:500;background:var(--card)}
.layout-tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.layout-view{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px}
.layout-view .desc{font-size:13px;color:var(--muted);margin-top:10px}

/* ---------- TECH GRID ---------- */
.tech-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.tech-item{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:8px;padding:9px 11px;font-size:13.5px}
.tech-item .ic{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:11px;flex-shrink:0}
.tech-item.yes .ic{background:#e0efe4;color:var(--ok)}
.tech-item.no{opacity:.5}.tech-item.no .ic{background:#f0e3e3;color:#b3261e}

/* ---------- SUPPLIERS ---------- */
.sup-grid{display:grid;gap:15px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.sup-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.sup-card.feat{border-color:var(--gold);border-width:1.5px}
.sup-card h3{font-family:var(--serif);font-size:21px;font-weight:600}
.sup-card .cat{color:var(--gold-dk);font-weight:600;font-size:12.5px;margin:2px 0 10px}
.sup-card .blurb{font-size:13.5px;color:var(--ink-2);line-height:1.5;margin-bottom:12px}
.sup-card .svc{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.sup-card .svc span{font-size:11.5px;background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:2px 8px}
.compliance{display:flex;gap:12px;font-size:12px;margin-top:8px}
.compliance b{font-weight:600}
.badge-ok{color:var(--ok)}.badge-no{color:var(--muted)}
.feat-tag{display:inline-block;background:var(--gold);color:#fff;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;margin-left:8px;vertical-align:middle}

/* ---------- CHAT / CONCIERGE ---------- */
.chat-intro-grid{display:grid;gap:24px;grid-template-columns:minmax(0,440px) 1fr;align-items:start}
.chat-frame{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 30px rgba(26,43,71,.12);
  width:100%;overflow:hidden;display:flex;flex-direction:column;height:600px}
.chat-header{background:linear-gradient(135deg,var(--navy),var(--navy-dk));color:#fff;padding:16px 20px;
  display:flex;align-items:center;gap:12px}
.chat-header .avatar{width:42px;height:42px;border-radius:50%;background:var(--gold);color:#fff;
  display:grid;place-items:center;font-family:var(--serif);font-size:17px;font-weight:600;flex-shrink:0}
.chat-header .ct{font-family:var(--serif);font-size:18px;line-height:1.2}
.chat-header .cs{font-size:11.5px;color:var(--gold-soft)}
.chat-header .online{width:9px;height:9px;border-radius:50%;background:#5cd67a;margin-left:auto;
  box-shadow:0 0 0 3px rgba(92,214,122,.25)}
.chat-body{flex:1;overflow-y:auto;padding:22px 20px;display:flex;flex-direction:column;gap:14px;background:#f4f6f9}
.bubble{max-width:80%;padding:12px 15px;border-radius:16px;font-size:14.5px;line-height:1.5;
  animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bubble.bot{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:5px;
  box-shadow:0 1px 2px rgba(26,43,71,.05)}
.bubble.user{background:var(--navy);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.bubble.typing{display:flex;gap:4px;padding:14px 16px}
.bubble.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.bubble.typing span:nth-child(2){animation-delay:.2s}.bubble.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.chat-opts{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 14px;background:#f4f6f9}
.chat-opts button{padding:9px 15px;border:1.5px solid var(--navy);color:var(--navy);border-radius:20px;
  font-size:13.5px;font-weight:500;background:#fff;transition:.15s}
.chat-opts button:hover{background:var(--navy);color:#fff}
.chat-opts button.skip{border-color:var(--line);color:var(--muted)}
.chat-opts button.skip:hover{background:var(--muted);color:#fff;border-color:var(--muted)}
.chat-input{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--line);background:#fff}
.chat-input input{flex:1;padding:12px 16px;border:1px solid var(--line);border-radius:24px;background:#f4f6f9;font-size:14.5px}
.chat-input input:focus{outline:none;border-color:var(--navy-lt);background:#fff}
.chat-input button{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;font-size:15px;flex-shrink:0;transition:.15s}
.chat-input button:hover{background:var(--navy-lt)}
.embed-box{background:var(--navy-dk);color:#dde4ef;border-radius:10px;padding:16px;font-family:ui-monospace,monospace;
  font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-all;position:relative}
.embed-box .cp{position:absolute;top:10px;right:10px;background:var(--gold);color:#fff;border-radius:6px;padding:5px 12px;font-family:var(--sans);font-size:12px;font-weight:600;cursor:pointer}
.btn-preview{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;padding:14px 26px;
  border-radius:30px;font-weight:600;font-size:15px;box-shadow:0 6px 18px rgba(26,43,71,.28);cursor:pointer}
.btn-preview::before{content:"💬"}

/* ---------- BROCHURE CTA ---------- */
.dual-btn{display:flex;gap:8px;margin-top:16px}.dual-btn .btn{flex:1}

/* ---------- MULTI-ROOM QUOTE LINES ---------- */
.rooms-head{display:flex;align-items:center;justify-content:space-between}
.room-line{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:12px}
.rl-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.rl-num{font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.4px}
.rl-del{width:24px;height:24px;border-radius:6px;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:16px;line-height:1}
.rl-del:hover{background:#f0e3e3;color:#b3261e;border-color:#e5c5c5}
.rl-grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.rl-grid label{display:block;font-size:11px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.rl-grid select,.rl-grid input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff}
@media(max-width:600px){.rl-grid{grid-template-columns:1fr}}

/* ---------- PROFIT TOOL ---------- */
.profit-layout{display:grid;gap:22px;grid-template-columns:1.2fr .8fr;align-items:start}
.profit-results{position:sticky;top:110px}
.elem-grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.elem-row label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px;font-weight:500}
.elem-row input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper)}
.elem-total{margin-top:10px;font-size:13px;color:var(--ink-2)}
.elem-total b{color:var(--navy)}
.ok-chk{color:var(--ok);font-weight:600;margin-left:6px}.warn-chk{color:var(--warn);font-weight:600;margin-left:6px}
.pay-table{width:100%;border-collapse:collapse;font-size:13px}
.pay-table th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}
.pay-table td{padding:5px 4px;border-bottom:1px solid var(--line)}
.pay-table input{width:64px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;text-align:center;background:var(--paper)}
.pay-table input.role-name{width:120px;text-align:left}
.pay-del{width:22px;height:22px;border-radius:5px;background:var(--paper);color:var(--muted);font-size:15px}
.pay-del:hover{background:#f0e3e3;color:#b3261e}
.pay-total{margin-top:8px;font-size:13px;color:var(--muted)}.pay-total b{color:var(--navy)}
.profit-hero{color:#fff;border-radius:12px;padding:20px;text-align:center;margin-bottom:14px}
.profit-hero .ph-profit{font-family:var(--serif);font-size:38px;font-weight:600;line-height:1}
.profit-hero .ph-label{font-size:13px;opacity:.9;margin-top:4px}
.profit-hero .ph-margin{font-size:14px;font-weight:600;margin-top:8px;background:rgba(255,255,255,.18);display:inline-block;padding:3px 12px;border-radius:12px}
.prof-table{width:100%;border-collapse:collapse;font-size:14px}
.prof-table td{padding:7px 4px;border-bottom:1px solid var(--line)}
.prof-table td:last-child{text-align:right;font-weight:600}
.prof-table tr.net td{color:var(--navy);font-weight:600}
.prof-table td.neg{color:#b3261e}
.prof-table tr.total td{border-top:2px solid var(--navy);font-size:17px;font-weight:700;font-family:var(--serif);padding-top:10px}
.prof-pp{margin-top:12px;font-size:13px;color:var(--muted);text-align:center}.prof-pp b{color:var(--navy)}

/* profit tool v2: template, chart, break-even, scenarios */
.tmpl-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.tmpl-row label{font-size:12px;font-weight:600;color:var(--ink-2);flex-shrink:0;align-self:center}
.tmpl-row select{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.btn.sm{padding:8px 14px;font-size:13px}
.cost-bar{display:flex;height:26px;border-radius:7px;overflow:hidden;margin:14px 0 6px;background:var(--line)}
.bar-seg{height:100%;transition:width .3s}
.s-food{background:#c9814f}.s-bev{background:#7a9bc4}.s-pay{background:#9d7d5f}
.s-ctrl{background:#b0a99f}.s-comm{background:#d4b483}.s-profit{background:#4a7c59}.s-loss{background:#b3261e}
.bar-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted);margin-bottom:12px}
.bar-legend span{display:flex;align-items:center;gap:4px}
.bar-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.break-even{background:var(--paper);border-radius:8px;padding:10px 13px;font-size:13px;margin-bottom:14px;text-align:center}
.be-ok{color:var(--ok);font-weight:600}.be-warn{color:var(--warn);font-weight:600}
.scenario-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.scenario-table th{text-align:left;padding:6px 5px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}
.scenario-table td{padding:7px 5px;border-bottom:1px solid var(--line)}
.sc-del{width:22px;height:22px;border-radius:5px;background:var(--paper);color:var(--muted);font-size:15px;line-height:1}
.sc-del:hover{background:#f0e3e3;color:#b3261e}

/* ---------- XMAS DYNAMIC PRICING ---------- */
.xmas-tool{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.xmas-controls{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.xmas-controls>div{flex:1;min-width:160px}
.xmas-controls label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.xmas-controls select,.xmas-controls input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.xmas-total{margin-top:14px;padding:14px 16px;background:linear-gradient(135deg,var(--navy),var(--navy-dk));
  color:#fff;border-radius:10px;font-size:15px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.xmas-total span{font-family:var(--serif);font-size:24px;font-weight:600}
.xmas-total .xmas-min{font-size:11px;background:rgba(255,255,255,.15);padding:3px 9px;border-radius:10px;margin-left:auto}

@media(max-width:760px){
  .quote-layout{grid-template-columns:1fr}
  .quote-summary{position:static}
  .form-grid{grid-template-columns:1fr}
  main{padding:18px 14px 50px}
  .page-head h2{font-size:24px}
}
</style>
</head>
