<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>HosKitchen — Brandon Hall</title>
<meta name="theme-color" content="#1E272C">
<link rel="icon" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--k:#232D33;--k2:#151C20;--or:#C8662B;--or2:#A8501D;--orbg:#F8E9DE;--gold:#B8925A;--ink:#1E272C;--muted:#66727A;--line:#E4DED6;--ok:#1E8A55;--okbg:#E3F3EA;--red:#C62828;--redbg:#FCEAEA;--amb:#A86200;--ambbg:#FDF1DC;--bg:#F6F2EC;--card:#fff;--serif:"Playfair Display",Georgia,serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}.hide{display:none!important}a{color:var(--or2)}
.top{position:sticky;top:0;z-index:6;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top) + 9px) 16px 9px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.top img{height:38px}.top .g{flex:1;line-height:1.1}.wm{font-family:var(--serif);font-size:22px;color:var(--k);letter-spacing:.01em}.wm b{color:var(--or)}.top small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.top button{background:var(--bg);border:1px solid var(--line);color:var(--k);border-radius:22px;padding:7px 12px;font-weight:700;cursor:pointer;font-size:14px}
.wrap{max-width:1040px;margin:0 auto;padding:16px 16px 120px}
.narrow{max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 1px 2px rgba(30,39,44,.04),0 6px 18px rgba(30,39,44,.05)}
h2{font-family:var(--serif);font-size:24px;margin:0 0 8px;color:var(--k);font-weight:700}h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:26px 2px 12px;font-weight:700}
h4{margin:16px 0 6px;color:var(--k);font-size:16px}
.muted{color:var(--muted);font-size:14px}
label{display:block;font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 3px rgba(200,102,43,.15)}textarea{min-height:64px}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-weight:800;font-size:17px;background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;margin-top:14px;cursor:pointer;box-shadow:0 6px 16px rgba(168,80,29,.25)}.btn.ghost{background:#fff;color:var(--k);border:1.5px solid var(--line);box-shadow:none}.btn:disabled{opacity:.6}
.btn.sm{display:inline-block;width:auto;padding:8px 13px;font-size:14px;margin:0;box-shadow:none}
.fm{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:9px;cursor:pointer;color:var(--ink);box-shadow:0 1px 2px rgba(30,39,44,.04)}
.fm .ic{font-size:28px;width:40px;text-align:center}.fm .t{flex:1}.fm b{display:block;color:var(--k);font-size:17px}
.st{font-size:12px;font-weight:800;border-radius:20px;padding:4px 10px;white-space:nowrap}.st.ok{background:var(--okbg);color:var(--ok)}.st.due{background:var(--redbg);color:var(--red)}.st.part{background:var(--ambbg);color:var(--amb)}.st.n{background:#EFEBE5;color:var(--muted)}
.item{border-bottom:1px solid var(--line);padding:10px 0}.item .q{margin-bottom:7px}
.seg{display:flex;gap:6px}.seg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px;font-weight:800;cursor:pointer}
.seg .on.done{background:var(--ok);border-color:var(--ok);color:#fff}.seg .on.issue{background:var(--red);border-color:var(--red);color:#fff}.seg .on.na{background:#7a8899;border-color:#7a8899;color:#fff}
.tick{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:12px 2px;cursor:pointer}.tick input{width:26px;height:26px;flex:none;accent-color:var(--ok)}
.sec{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:8px 14px;font-weight:700;cursor:pointer;color:var(--k)}.tabs .on{background:var(--k);color:#fff;border-color:var(--k)}
.tr{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:7px 0}.tr input{padding:9px;text-align:center}
.bad{background:var(--redbg)!important;border-color:var(--red)!important}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.flag{color:var(--red);font-weight:800}
canvas.sig{width:100%;height:140px;border:1.5px dashed #CFC6BA;border-radius:12px;background:#fff;touch-action:none;display:block}
.err{color:var(--red);font-weight:700;margin-top:8px}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);z-index:7}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--k);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.lim{background:var(--orbg);border-radius:12px;padding:9px 12px;font-size:14px;margin-bottom:8px;color:#6B3612}
/* gate (code / name) */
.gate{position:relative;min-height:calc(100vh - 70px);margin:-16px -16px 0;display:flex;align-items:center;justify-content:center;padding:28px 16px;background:#151C20 url(img/hero.jpg) center/cover no-repeat}
.gate:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,28,32,.55),rgba(21,28,32,.85))}
.gbox{position:relative;width:100%;max-width:470px;color:#fff;text-align:center}
.badge{display:inline-block;background:#fff;border-radius:16px;padding:10px 18px;box-shadow:0 8px 24px rgba(0,0,0,.3)}.badge img{height:54px;display:block}
.gbox h1{font-family:var(--serif);font-size:40px;margin:18px 0 4px;line-height:1.05}.gbox h1 b{color:#F0A26E}
.gbox .tag{letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:#E8D7C5;font-weight:700}
.gbox p.nar{color:#E9E4DE;font-size:15.5px;margin:14px auto 16px;max-width:420px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:18px}.chips span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:5px 11px;font-size:13px;font-weight:600}
.glass{background:rgba(255,255,255,.97);color:var(--ink);border-radius:20px;padding:20px;text-align:left;box-shadow:0 18px 40px rgba(0,0,0,.35)}.glass label{margin-top:0}
/* home */
.hero{position:relative;border-radius:22px;overflow:hidden;color:#fff;padding:26px 22px 22px;background:#151C20 url(img/hero.jpg) center 40%/cover no-repeat;box-shadow:0 12px 30px rgba(21,28,32,.25)}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(21,28,32,.92) 0%,rgba(21,28,32,.75) 55%,rgba(21,28,32,.35) 100%)}
.hero>*{position:relative}.hero .tag{letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:#F0C29F;font-weight:700}
.hero h1{font-family:var(--serif);font-size:34px;margin:6px 0 6px;line-height:1.1}.hero h1 b{color:#F0A26E;font-weight:700}
.hero p{margin:0;color:#E9E4DE;max-width:620px;font-size:15.5px}
.prog{margin-top:18px;max-width:520px}.prog .bar{height:10px;background:rgba(255,255,255,.18);border-radius:6px;overflow:hidden}.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,#F0A26E,#7BD3A3);border-radius:6px}
.prog .lab{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px;color:#F3EEE8;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pc{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;text-align:left;padding:0;color:var(--ink);box-shadow:0 1px 2px rgba(30,39,44,.05),0 8px 22px rgba(30,39,44,.06);transition:transform .15s,box-shadow .15s;text-decoration:none}
.pc:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(30,39,44,.12)}
.pc .im{position:relative;height:150px;background:#2B3A42 center/cover no-repeat}.pc .im:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.45))}
.pc .im .st{position:absolute;left:12px;top:12px;z-index:1;box-shadow:0 2px 8px rgba(0,0,0,.18)}.pc .im .ref{position:absolute;right:12px;top:12px;z-index:1;background:rgba(0,0,0,.45);color:#fff;font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 9px;letter-spacing:.04em}
.pc .im .ico{position:absolute;left:14px;bottom:10px;z-index:1;font-size:26px}
.pc .bd{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column}.pc .bd b{font-size:18px;color:var(--k);font-family:var(--serif)}.pc .bd span{color:var(--muted);font-size:14px;margin-top:3px;flex:1}
.pc .ft{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13.5px;font-weight:700;color:var(--k)}.pc .ft em{font-style:normal;color:var(--or)}
.pc.mini{flex-direction:row;align-items:center;padding:16px;gap:14px}.pc.mini .ci{width:50px;height:50px;border-radius:14px;background:var(--orbg);display:flex;align-items:center;justify-content:center;font-size:25px;flex:none}.pc.mini .bd{padding:0}.pc.mini .bd .st{display:inline-block;margin:0}.pc .go{font-style:normal;color:var(--or);font-weight:700;font-size:13.5px;flex:none}.pc.dark .go{color:#F0A26E}
.pc.dark{background:linear-gradient(135deg,#232D33,#151C20);color:#fff;border-color:#232D33}.pc.dark .bd b{color:#fff}.pc.dark .bd span{color:#C9D0D4}.pc.dark .ci{background:rgba(255,255,255,.1)}
.links{display:flex;flex-wrap:wrap;gap:8px}.links a{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:9px 14px;color:var(--k);font-weight:700;text-decoration:none;font-size:14px}.links a:hover{border-color:var(--or)}
.limits{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.limits div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}.limits b{display:block;font-size:18px;color:var(--k)}.limits span{font-size:12.5px;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:30px;letter-spacing:.04em}
/* form banner */
.fban{position:relative;border-radius:20px;overflow:hidden;color:#fff;padding:22px 20px;margin-bottom:12px;background:linear-gradient(135deg,#2B3A42,#151C20) center/cover no-repeat;min-height:120px;display:flex;align-items:flex-end}
.fban:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,28,32,.25),rgba(21,28,32,.85))}.fban>div{position:relative}
.fban span{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#F0C29F;font-weight:700}.fban h1{font-family:var(--serif);margin:3px 0 0;font-size:27px;line-height:1.1}
.wrap.formv{max-width:760px}
@media(max-width:560px){.gbox h1{font-size:34px}.hero h1{font-size:28px}.pc .im{height:130px}}
</style>
</head>
<body>
<div class="top"><img src="img/logo.png" alt="Brandon Hall"><div class="g"><div class="wm">Hos<b>Kitchen</b></div><small>Brandon Hall Hotel &amp; Spa</small></div><button id="home" class="hide">⌂ Home</button><button id="who" class="hide"></button></div>
<div class="wrap" id="app"></div>
<div class="nav hide" id="nav"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="../hosfire-defs.js?v=20261115b"></script>
<script>
(() => {
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const h = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = (n) => String(n).padStart(2, "0"), ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`, today = () => ymd(new Date());
const hm = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const mondayOf = (s) => { const d = new Date(s + "T12:00"); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };
const addDays = (s, n) => { const d = new Date(s + "T12:00"); d.setDate(d.getDate() + n); return ymd(d); };
const fdate = (s) => new Date(s + "T12:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
const DEMO = /[?&]demo=1/.test(location.search), DK = "hosfire_demo_v1";
const QF = new URLSearchParams(location.search).get("f") || "";
const CODE_OK = () => { try { return sessionStorage.getItem("hf_fire_ok") === "1"; } catch (e) { return false; } };
const F = (id) => HF_K_FORMS.find((f) => f.id === id), L = HF_K_LIMITS;
const st = { name: "", recs: [], names: [] };
let fb = null;
const app = $("#app"), nav = $("#nav");
const setNav = (html) => { nav.innerHTML = html; nav.classList.toggle("hide", !html); };
const toast = (t) => { const e = document.createElement("div"); e.className = "toast"; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 2600); };
const recsOn = (form, d = today()) => st.recs.filter((r) => r.form === form && r.date === d);

async function connect() {
  const from = addDays(today(), -9);
  if (DEMO) { const j = JSON.parse(localStorage.getItem(DK) || "{}"); st.recs = (j.kitchen || []).filter((r) => r.date >= from); st.names = (j.registers || []).filter((r) => r.kind === "training"); return; }
  firebase.apps.length || firebase.initializeApp(firebaseConfig);
  fb = { auth: firebase.auth(), db: firebase.firestore() };
  if (!fb.auth.currentUser || fb.auth.currentUser.email !== HF_KIOSK.email) await fb.auth.signInWithEmailAndPassword(HF_KIOSK.email, HF_KIOSK.pw);
  const [r, t] = await Promise.all([fb.db.collection("hosfire_kitchen").where("date", ">=", from).get(), fb.db.collection("hosfire_registers").where("kind", "==", "training").get()]);
  st.recs = r.docs.map((d) => ({ id: d.id, ...d.data() })); st.names = t.docs.map((d) => ({ id: d.id, ...d.data() }));
}
async function save(rec) {
  const doc = { ...rec, date: rec.date || today(), byName: st.name, byEmail: DEMO ? "demo" : HF_KIOSK.email, source: "Kitchen compliance (staff page)" };
  if (DEMO) { const j = JSON.parse(localStorage.getItem(DK) || "{}"); j.kitchen = j.kitchen || []; const x = { id: "k" + Date.now() + Math.random().toString(36).slice(2, 5), ...doc, createdAt: Date.now() }; j.kitchen.push(x); localStorage.setItem(DK, JSON.stringify(j)); st.recs.push(x); return; }
  const ref = await fb.db.collection("hosfire_kitchen").add({ ...doc, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
  st.recs.push({ id: ref.id, ...doc, createdAt: Date.now() });
}

/* ── signature pad ── */
function sigPad(c) {
  const ctx = c.getContext("2d"); let down = false; c._drawn = false;
  const fit = () => { const r = c.getBoundingClientRect(); c.width = r.width * 2; c.height = r.height * 2; ctx.scale(2, 2); ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.strokeStyle = "#1C272D"; };
  fit();
  const p = (e) => { const r = c.getBoundingClientRect(), t = e.touches ? e.touches[0] : e; return [t.clientX - r.left, t.clientY - r.top]; };
  const s = (e) => { down = true; const [x, y] = p(e); ctx.beginPath(); ctx.moveTo(x, y); e.preventDefault(); };
  const m = (e) => { if (!down) return; const [x, y] = p(e); ctx.lineTo(x, y); ctx.stroke(); c._drawn = true; e.preventDefault(); };
  const u = () => (down = false);
  c.addEventListener("mousedown", s); c.addEventListener("mousemove", m); window.addEventListener("mouseup", u);
  c.addEventListener("touchstart", s, { passive: false }); c.addEventListener("touchmove", m, { passive: false }); c.addEventListener("touchend", u);
  c._clear = () => { ctx.clearRect(0, 0, c.width, c.height); c._drawn = false; };
}
const sigData = (c) => { const o = document.createElement("canvas"); o.width = 360; o.height = 120; const x = o.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, 360, 120); x.drawImage(c, 0, 0, 360, 120); return o.toDataURL("image/jpeg", 0.6); };
const SIGN = (who) => `<label>${h(who || "Your signature")}</label><canvas class="sig" id="sig"></canvas><div style="text-align:right;margin-top:4px"><button class="btn ghost sm" id="sigc" type="button">Clear</button></div>
  <label style="text-transform:none;font-size:15px;color:var(--ink);display:flex;gap:10px;align-items:flex-start"><input type="checkbox" id="conf" style="width:auto;margin-top:3px">I, ${h(st.name)}, did this myself and the record is true.</label>`;
const bindSig = () => { const c = $("#sig"); if (c) { sigPad(c); $("#sigc").onclick = () => c._clear(); } };
const sigOK = (e) => { const c = $("#sig"); if (c && !c._drawn) { e.textContent = "Please sign in the box."; return false; } if (!$("#conf").checked) { e.textContent = "Tick the confirmation box."; return false; } return true; };

/* ── code and name ── */
const IMG = { open: "open", temps: "temps", clean: "clean", weekly: "weekly", close: "close" };
const DESC = { open: "Safety, temperatures, hygiene and prep before service", temps: "Fridges AM and PM, cooking, deliveries, reheating and cooling", clean: "Five areas, each signed by the person responsible", weekly: "Today's deep-clean tasks, Monday to Sunday", close: "Food stored, kitchen cleaned, equipment off and secured", staff_food: "Record staff meals taken", waste: "Record anything thrown away, and why" };
const wide = (on) => app.classList.toggle("formv", !on);
const ban = (f, sub) => `<div class="fban" ${IMG[f.id] ? `style="background-image:url(img/${IMG[f.id]}.jpg)"` : ""}><div><span>${h(f.ref)}${sub ? " · " + h(sub) : ""}</span><h1>${f.icon} ${h(f.name)}</h1></div></div>`;
const GATE = (inner) => `<div class="gate"><div class="gbox"><div class="badge"><img src="img/logo.png" alt="Brandon Hall Hotel and Spa"></div>
  <h1>Welcome to Hos<b>Kitchen</b></h1><div class="tag">Brandon Hall kitchen compliance</div>
  <p class="nar">Our kitchen's daily checks, temperatures, cleaning, logs and training — all in one place, on any phone or tablet. Every entry is saved with your name, the time and your signature.</p>
  <div class="chips"><span>🌅 Opening</span><span>🌡 Temperatures</span><span>🧽 Cleaning</span><span>🌙 Closing</span><span>🗑 Waste</span><span>🎓 Training</span></div>${inner}</div></div>`;
function viewCode() {
  wide(true); $("#home").classList.add("hide");
  app.innerHTML = GATE(`<div class="glass"><label>Staff code</label><input id="code" type="password" inputmode="numeric" autocomplete="off" placeholder="Enter the kitchen staff code"><button class="btn" id="go">Start</button><div class="err" id="e"></div></div>`);
  $("#code").onkeydown = (e) => { if (e.key === "Enter") $("#go").click(); };
  $("#go").onclick = async () => { if (!CODE_OK() && $("#code").value.trim() !== HF_KIOSK_CODE) { $("#e").textContent = "That code is not right."; return; }
    try { sessionStorage.setItem("hf_fire_ok", "1"); } catch (e) {}
    $("#go").disabled = true; $("#go").textContent = "Connecting…"; try { await connect(); viewName(); } catch (err) { $("#go").disabled = false; $("#go").textContent = "Start"; $("#e").textContent = "Could not connect: " + err.message; } };
}
function viewName() {
  setNav(""); wide(true); $("#home").classList.add("hide");
  const k = st.names.filter((r) => r.dept === "kitchen").map((r) => r.name), o = st.names.filter((r) => r.dept !== "kitchen").map((r) => r.name);
  let saved = ""; try { saved = localStorage.getItem("hk_kname") || ""; } catch (e) {}
  app.innerHTML = GATE(`<div class="glass"><label>Who's on shift?</label><input id="nm" list="nl" value="${h(st.name || saved)}" placeholder="Your first and last name"><datalist id="nl">${k.concat(o).map((n) => `<option value="${h(n)}">`).join("")}</datalist><button class="btn" id="go">Continue</button><div class="err" id="e"></div></div>`);

  }
  const [d, who, tasks] = f.days[di];
  app.innerHTML = `<div class="card"><h2>${h(d)}</h2><p class="muted">${h(f.name)} · Week commencing ${h(fdate(wk))} · ${h(who)} sign</p>${di !== tdi ? `<p class="lim">You are recording ${h(d)}'s tasks on ${h(fdate(today()))}. Say why in the note if they were done late.</p>` : ""}
    ${tasks.map((t, i) => `<label class="tick" style="text-transform:none;font-size:16px;color:var(--ink);font-weight:400;margin:0"><input type="checkbox" data-k="${i}">${h(t)}</label>`).join("")}
    <label>Note${di !== tdi ? " (required)" : " (required if any task is not done)"}</label><textarea id="notes"></textarea>${SIGN(who + " signature")}<div class="err" id="e"></div></div>`;
  bindSig(); backSave("Sign " + d); $("#bk").onclick = () => viewWeek(f);
  $("#sv").onclick = () => { const e = $("#e"), tk = {}; $$("[data-k]").forEach((x) => (tk[x.dataset.k] = x.checked)); const notes = $("#notes").value.trim(), miss = Object.values(tk).filter((v) => !v).length;
    if ((miss || di !== tdi) && !notes) { e.textContent = di !== tdi ? "Add a note — this day's tasks are being recorded late." : "Say why any unticked task was not done."; return; } if (!sigOK(e)) return;
    doSave({ form: "weekly", ref: f.ref, week: wk, day: d, tasks: tk, notes, late: di !== tdi, flag: miss > 0, sig: sigData($("#sig")) }, () => viewWeek(f)); };
}

/* ── staff food log / food wastage ── */
function viewLog(f) {
  const r = recsOn(f.id);
  app.innerHTML = `${ban(f)}<div class="card"><p class="muted">${h(f.ref)} · ${h(fdate(today()))}</p>
    <div class="row"><div><label>Date</label><input value="${h(fdate(today()))}" disabled></div><div><label>Time</label><input type="time" id="tm" value="${hm()}"></div></div>
    ${f.cols.map(([k, l, opts]) => `<label>${h(l)}</label>${opts ? `<select data-c="${k}"><option value="">Choose…</option>${opts.split("|").map((o) => `<option>${h(o)}</option>`).join("")}</select>` : `<input data-c="${k}"${k === "qty" ? ' placeholder="e.g. 2 portions, 1.5 kg"' : ""}>`}`).join("")}
    <label style="text-transform:none;font-size:15px;color:var(--ink);display:flex;gap:10px;align-items:flex-start"><input type="checkbox" id="conf" style="width:auto;margin-top:3px">Signed: ${h(st.name)}</label><div class="err" id="e"></div>
    ${r.length ? `<h4>Today</h4><table><tr><th>Time</th>${f.cols.map(([, l]) => `<th>${h(l)}</th>`).join("")}<th>Sign</th></tr>${r.map((y) => `<tr><td>${h(y.time)}</td>${f.cols.map(([k]) => `<td>${h(y[k])}</td>`).join("")}<td>${h(y.byName)}</td></tr>`).join("")}</table>` : ""}</div>`;
  backSave("Add to log"); $("#bk").onclick = viewHome;
  $("#sv").onclick = () => { const e = $("#e"), v = {}; $$("[data-c]").forEach((x) => (v[x.dataset.c] = x.value.trim()));
    if (f.cols.some(([k]) => !v[k])) { e.textContent = "Please complete every box."; return; } if (!$("#conf").checked) { e.textContent = "Tick to sign the entry."; return; }
    doSave({ form: f.id, ref: f.ref, time: $("#tm").value || hm(), ...v }, () => viewLog(f), "Added"); };
}

/* ── manager sign-off ── */
function pendingMgr() {
  const signed = new Set(st.recs.filter((r) => r.form === "mgr").map((r) => r.of)), out = [];
  st.recs.filter((r) => (r.form === "open" || r.form === "close") && !signed.has(r.id)).forEach((r) => out.push({ of: r.id, target: r.form, date: r.date, label: `${F(r.form).name} — ${fdate(r.date)}`, sub: `by ${r.byName}${r.issues ? ` · ${r.issues} issue(s)` : ""}`, r }));
  const wks = Array.from(new Set(st.recs.filter((r) => r.form === "weekly" && r.part !== "mgr").map((r) => r.week)));
  wks.forEach((w) => { const key = "week:" + w; if (!signed.has(key)) { const n = new Set(st.recs.filter((r) => r.form === "weekly" && r.week === w).map((r) => r.day)).size; out.push({ of: key, target: "weekly", date: w, label: `Weekly cleaning — week commencing ${fdate(w)}`, sub: `${n}/7 days signed` }); } });
  return out.sort((a, b) => (a.date < b.date ? 1 : -1));
}
function viewMgr(sel) {
  wide(false);
  const P = pendingMgr();
  if (!sel || !sel.of) {
    setNav(""); app.innerHTML = `<div class="card"><h2>✍️ Manager sign-off</h2><p class="muted">Head Chef or duty manager: review and sign the opening, closing and weekly sheets. Signing confirms you have checked the record.</p></div>` +
      (P.length ? P.map((p, i) => `<button class="fm" data-p="${i}"><div class="t"><b>${h(p.label)}</b><span class="muted">${h(p.sub)}</span></div><span class="st part">Sign</span></button>`).join("") : `<div class="card"><b style="color:var(--ok)">Everything is signed.</b></div>`) + `<button class="btn ghost" id="bk2">Back</button>`;
    $$("[data-p]").forEach((b) => (b.onclick = () => viewMgr(P[+b.dataset.p]))); $("#bk2").onclick = viewHome; return;
  }
  let det = "";
  if (sel.r) { const f = F(sel.r.form); det = f.sections.map(([t, items], si) => { const bad = items.map((q, i) => [q, sel.r.items["s" + si + "i" + i]]).filter(([, v]) => v !== "done"); return bad.length ? `<p><b>${h(t)}</b><br>${bad.map(([q, v]) => `${v === "issue" ? "✗" : "N/A"} ${h(q)}`).join("<br>")}</p>` : ""; }).join("") || "<p>All checks done ✓</p>"; if (sel.r.notes) det += `<p><b>Notes:</b> ${h(sel.r.notes)}</p>`; }
  else { const w = st.recs.filter((r) => r.form === "weekly" && r.week === sel.date && r.part !== "mgr"); det = F("weekly").days.map(([d]) => { const x = w.filter((y) => y.day === d); return `<div>${x.length ? "✓" : "✗"} ${h(d)}${x.length ? " — " + h(x.map((y) => y.byName).join(", ")) + (x.some((y) => y.flag) ? " · not all tasks done" : "") : " — not recorded"}</div>`; }).join(""); }
  app.innerHTML = `<div class="card"><h2>${h(sel.label)}</h2><p class="muted">${h(sel.sub)}</p>${det}${SIGN("Manager signature")}<div class="err" id="e"></div></div>`;
  bindSig(); backSave("Sign off"); $("#bk").onclick = () => viewMgr();
  $("#sv").onclick = () => { const e = $("#e"); if (!sigOK(e)) return; doSave({ form: "mgr", of: sel.of, target: sel.target, forDate: sel.date, sig: sigData($("#sig")) }, () => viewMgr(), "Signed off"); };
}

viewCode();
if (CODE_OK()) { const g = $("#go"); if (g) g.click(); }
})();
</script>
