<style>
:root{--k:#232D33;--k2:#151C20;--or:#C8662B;--or2:#A8501D;--orbg:#F8E9DE;--ink:#1E272C;--muted:#66727A;--line:#E4DED6;--ok:#1E8A55;--okbg:#E3F3EA;--red:#C62828;--redbg:#FCEAEA;--amb:#A86200;--ambbg:#FDF1DC;--bg:#F6F2EC;--serif:"Playfair Display",Georgia,serif;--sb:env(safe-area-inset-bottom);--st:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg)}body{margin:0;color:var(--ink);font:15.5px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit}.hide{display:none!important}a{color:var(--or2)}
.hdr{position:sticky;top:0;z-index:8;background:linear-gradient(135deg,#232D33,#151C20);color:#fff;padding:calc(var(--st) + 10px) 16px 12px;display:flex;align-items:center;gap:10px}
.hdr .lg{width:38px;height:38px;border-radius:10px;background:#F6F2EC url(../img/logo.png) center/80% no-repeat;flex:none}
.hdr .t{flex:1;line-height:1.1}.hdr .wm{font-family:var(--serif);font-size:20px}.hdr .wm b{color:#F0A26E}.hdr small{display:block;color:#B9C3C8;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;background:rgba(255,255,255,.1);border-radius:20px;padding:5px 10px}.live i{width:8px;height:8px;border-radius:50%;background:#7BD3A3;box-shadow:0 0 0 0 rgba(123,211,163,.7);animation:pl 2s infinite}.live.off i{background:#E57373;animation:none}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(123,211,163,.7)}70%{box-shadow:0 0 0 8px rgba(123,211,163,0)}100%{box-shadow:0 0 0 0 rgba(123,211,163,0)}}
main{padding:14px 14px calc(96px + var(--sb));max-width:720px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + var(--sb))}
.tabs button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;position:relative;cursor:pointer}.tabs button span{font-size:21px;line-height:1}.tabs button.on{color:var(--or)}
.tabs .bd{position:absolute;top:0;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10.5px;border-radius:10px;padding:1px 6px;min-width:18px}
h2{font-family:var(--serif);font-size:24px;margin:2px 2px 10px;color:var(--k)}h3{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:22px 2px 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(30,39,44,.04),0 6px 18px rgba(30,39,44,.05)}
.muted{color:var(--muted);font-size:13.5px}
.hero{position:relative;border-radius:22px;overflow:hidden;color:#fff;padding:20px 18px;background:#151C20 url(../img/hero.jpg) center 40%/cover no-repeat;box-shadow:0 12px 28px rgba(21,28,32,.25)}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,rgba(21,28,32,.93),rgba(21,28,32,.7))}.hero>*{position:relative}
.hero .tag{letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:#F0C29F;font-weight:700}.hero h1{font-family:var(--serif);font-size:27px;margin:4px 0 12px;line-height:1.1}.hero h1 b{color:#F0A26E}
.ring{display:flex;align-items:center;gap:16px}.ring svg{flex:none}.ring .rt b{font-size:22px;display:block}.ring .rt span{color:#D7DEE1;font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;cursor:pointer}.kpi b{display:block;font-size:24px;line-height:1.1}.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.kpi.red b{color:var(--red)}.kpi.amb b{color:var(--amb)}.kpi.ok b{color:var(--ok)}
.st{font-size:11.5px;font-weight:800;border-radius:20px;padding:4px 9px;white-space:nowrap}.st.ok{background:var(--okbg);color:var(--ok)}.st.due{background:var(--redbg);color:var(--red)}.st.part{background:var(--ambbg);color:var(--amb)}.st.n{background:#EFEBE5;color:var(--muted)}
.fr{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:8px;cursor:pointer}
.fr .im{width:58px;height:58px;border-radius:12px;background:#2B3A42 center/cover;flex:none;display:flex;align-items:flex-end;justify-content:flex-start;font-size:18px;padding:3px}.fr .tx{flex:1;min-width:0}.fr b{display:block;font-size:15px;color:var(--k)}.fr .muted{font-size:12.5px}
.feed{position:relative}.ev{display:flex;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}.ev:last-child{border-bottom:none}
.ev .ic{width:38px;height:38px;border-radius:12px;background:var(--orbg);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}.ev.fl .ic{background:var(--redbg)}.ev.new{animation:nw 2.5s ease}
@keyframes nw{0%{background:#FFF4E0}100%{background:transparent}}
.ev .tx{flex:1;min-width:0}.ev b{font-size:14.5px;display:block}.ev .sub{font-size:12.5px;color:var(--muted)}.ev .tm{font-size:12px;color:var(--muted);white-space:nowrap;font-weight:600}.ev.fl b{color:var(--red)}
.day{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin:16px 4px 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;-webkit-overflow-scrolling:touch}.chips button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:7px 13px;font-weight:700;font-size:13.5px;color:var(--k);cursor:pointer}.chips button.on{background:var(--k);color:#fff;border-color:var(--k)}
.dnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}.dnav button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;font-weight:800;cursor:pointer}.dnav input{flex:1;padding:9px;border:1.5px solid var(--line);border-radius:12px;background:#fff;text-align:center;font-weight:700}
.sheet{overflow-x:auto}.sheet .kpage{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}.sheet h3{margin:0 0 6px!important;text-transform:none;letter-spacing:0;font-size:16px!important;font-family:var(--serif)}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:14px;font-weight:800;font-size:16px;background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;margin-top:12px;cursor:pointer}.btn.ghost{background:#fff;color:var(--k);border:1.5px solid var(--line)}.btn:disabled{opacity:.6}
.btn.sm{display:inline-block;width:auto;padding:8px 13px;font-size:13.5px;margin:0}
label{display:block;font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
input,select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
canvas.sig{width:100%;height:140px;border:1.5px dashed #CFC6BA;border-radius:12px;background:#fff;touch-action:none;display:block}
.err{color:var(--red);font-weight:700;margin-top:8px}
.al{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.al:last-child{border-bottom:none}.al .ic{font-size:18px}.al b{display:block;font-size:14.5px}
.tm2{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}.tm2:last-child{border-bottom:none}.tm2 .pills{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.modal{position:fixed;inset:0;z-index:20;background:rgba(21,28,32,.55);display:flex;align-items:flex-end}.modal .pnl{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + var(--sb))}
.modal .grab{width:44px;height:5px;border-radius:3px;background:#CFC6BA;margin:-6px auto 12px}
.toast{position:fixed;left:50%;top:calc(var(--st) + 70px);transform:translateX(-50%);background:var(--k);color:#fff;padding:11px 16px;border-radius:14px;font-weight:700;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:92vw;font-size:14px}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:#151C20 url(../img/hero.jpg) center/cover;position:relative}.gate:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,28,32,.6),rgba(21,28,32,.9))}
.gbox{position:relative;width:100%;max-width:420px;color:#fff;text-align:center}.gbox .badge{display:inline-block;background:#fff;border-radius:16px;padding:10px 16px}.gbox .badge img{height:50px;display:block}
.gbox h1{font-family:var(--serif);font-size:34px;margin:16px 0 4px}.gbox h1 b{color:#F0A26E}.gbox p{color:#E9E4DE;font-size:15px}
.glass{background:rgba(255,255,255,.97);color:var(--ink);border-radius:20px;padding:18px;text-align:left;margin-top:14px}.glass label{margin-top:0}
.kt{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0 10px}.kt th,.kt td{border:1px solid #E4DED6;padding:4px 6px;text-align:left;vertical-align:top}.kt th{background:#2B3A42;color:#fff;font-size:11.5px}.kg{display:grid;grid-template-columns:1fr;gap:6px}
.inst{background:var(--orbg);border-radius:14px;padding:12px;font-size:13.5px;color:#6B3612;margin-bottom:10px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../../firebase-config.js"></script>
<script src="../../hosfire-defs.js?v=20261119a"></script>
<script>
(() => {
/* HosKitchen Chef — Head Chef's mobile app. Reads hosfire_kitchen live; manager sign-off writes create-only "mgr" records. */
const CHEF_CODE = "1958";   // Head Chef / management code for this app — change here if needed (the kitchen staff page stays on 999)
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const h = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = (n) => String(n).padStart(2, "0"), ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`, today = () => ymd(new Date());
const parse = (s) => { const [y, m, d] = String(s).slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fd = (s) => { if (!s) return ""; const d = parse(s); return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const fds = (s) => { if (!s) return ""; const d = parse(s); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const ms = (t) => (t && t.toMillis ? t.toMillis() : typeof t === "number" ? t : t && t.seconds ? t.seconds * 1000 : 0);
const hm = (t) => { const d = new Date(ms(t)); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const DEMO = /[?&]demo=1/.test(location.search), DK = "hosfire_demo_v1";
const S = { data: { kitchen: [] }, regs: [], tlog: [], tab: "today", date: today(), filter: "all", name: "", seen: 0, live: false };
let fb = null, unsub = null, firstLoad = true;
const IMG = { open: "open", temps: "temps", clean: "clean", weekly: "weekly", close: "close" };
const root = $("#root");
const toast = (t) => { const e = document.createElement("div"); e.className = "toast"; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 3200); };

/* ── day sheets (shared layout with HosFIRE → Kitchen) ── */
const KF = (id) => HF_K_FORMS.find((f) => f.id === id);
const kAdd = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const kMon = (s) => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };
const kOn = (form, d) => (S.data.kitchen || []).filter((r) => r.form === form && r.date === d).sort((a, b) => ms(a.createdAt) - ms(b.createdAt));
const kSigned = () => new Map((S.data.kitchen || []).filter((r) => r.form === "mgr").map((r) => [r.of, r]));
const kSig = (r) => (r && r.sig ? `<img src="${r.sig}" style="height:26px;vertical-align:middle">` : "");
const kTick = (v) => (v === "done" || v === true ? '<b style="color:#1E8A55">✓</b>' : v === "issue" || v === false ? '<b style="color:#C62828">✗</b>' : v === "na" ? "N/A" : "");
function kPending() {
  const sg = kSigned(), out = [], K = S.data.kitchen || [];
  K.filter((r) => (r.form === "open" || r.form === "close") && !sg.has(r.id)).forEach((r) => out.push({ of: r.id, target: r.form, forDate: r.date, label: `${KF(r.form).name} — ${fds(r.date)}`, by: r.byName }));
  Array.from(new Set(K.filter((r) => r.form === "weekly").map((r) => r.week))).filter((w) => !sg.has("week:" + w)).forEach((w) => out.push({ of: "week:" + w, target: "weekly", forDate: w, label: `Weekly cleaning — w/c ${fds(w)}`, by: "" }));
  return out.sort((a, b) => (a.forDate < b.forDate ? 1 : -1));
}
function kCheckHTML(f, d) {
  const R = kOn(f.id, d), sg = kSigned();
  if (!R.length) return `<p class="muted">Not completed.</p>`;
  return R.map((r) => `<p style="margin:4px 0">${h(f.head[0][1])}: <b>${h((r.fields || {}).time || "")}</b> · Staff member: <b>${h(r.byName)}</b> ${kSig(r)} · Manager: ${sg.has(r.id) ? `<b>${h(sg.get(r.id).byName)}</b> ${kSig(sg.get(r.id))}` : '<span style="color:#B36B00">not yet signed</span>'}</p>
    <table class="kt"><tr><th>Check</th><th style="width:60px">Result</th></tr>${f.sections.map(([t, items], si) => `<tr><td colspan="2" style="background:#EEF1F3;font-weight:700">${h(t)}</td></tr>` + items.map((q, i) => `<tr><td>${h(q)}</td><td>${kTick((r.items || {})["s" + si + "i" + i])}</td></tr>`).join("")).join("")}</table>
    ${r.notes ? `<p><b>Notes / corrective action:</b> ${h(r.notes)}</p>` : ""}`).join("<hr>");
}
function kTempsHTML(d) {
  const R = kOn("temps", d), P = (p) => R.filter((r) => r.part === p), L = HF_K_LIMITS;
  const fr = P("fridge"), cell = (slot, key, max) => { const x = fr.filter((r) => r.slot === slot && r.readings && r.readings[key] !== undefined).pop(); if (!x) return ""; const v = x.readings[key]; return `<span style="${v > max ? "color:#C62828;font-weight:800" : ""}">${v}°C</span>`; };
  const who = (slot) => fr.filter((r) => r.slot === slot).map((r) => `${h(r.byName)} ${h(r.time)}`).join(", ");
  const tb = (rows, cols) => rows.length ? `<table class="kt"><tr>${cols.map((c) => `<th>${c[0]}</th>`).join("")}</tr>${rows.map((r) => `<tr>${cols.map((c) => `<td style="${c[2] && r.flag ? "color:#C62828;font-weight:800" : ""}">${c[1](r)}</td>`).join("")}</tr>`).join("")}</table>` : '<p class="muted">None recorded.</p>';
  const ca = R.filter((r) => r.corrective).map((r) => `<li>${h(r.part)} ${h(r.time)} (${h(r.byName)}): ${h(r.corrective)}</li>`).join("");
  return `<div class="kg"><div><b>Fridge / freezer temperatures</b><table class="kt"><tr><th></th><th>AM</th><th>PM</th></tr>${HF_K_FRIDGES.map((n, i) => `<tr><td>${h(n)}</td><td>${cell("am", "f" + i, L.fridgeMax)}</td><td>${cell("pm", "f" + i, L.fridgeMax)}</td></tr>`).join("")}${HF_K_FREEZERS.map((n, i) => `<tr><td>${h(n)}</td><td>${cell("am", "z" + i, L.freezerMax)}</td><td>${cell("pm", "z" + i, L.freezerMax)}</td></tr>`).join("")}</table>
    <p class="muted" style="font-size:12px">AM: ${who("am") || "—"} · PM: ${who("pm") || "—"}</p>
    <b>Delivery temperatures</b>${tb(P("delivery"), [["Supplier", (r) => h(r.supplier) + (r.item ? " · " + h(r.item) : "")], ["Type", (r) => h(r.type)], ["Temp", (r) => (r.temp === "" ? "—" : r.temp + "°C"), 1], ["Sign", (r) => h(r.byName)]])}</div>
    <div><b>Cooking temperatures</b>${tb(P("cook"), [["Service", (r) => h(r.meal)], ["Item", (r) => h(r.item)], ["Temp", (r) => r.temp + "°C", 1], ["Time", (r) => h(r.time)], ["Sign", (r) => h(r.byName)]])}
    <b>Reheating temperatures</b>${tb(P("reheat"), [["Item", (r) => h(r.item)], ["Temp", (r) => r.temp + "°C", 1], ["Sign", (r) => h(r.byName)]])}
    <b>Cooling temperatures</b>${tb(P("cool"), [["Item", (r) => h(r.item)], ["Time", (r) => h(r.time)], ["Method", (r) => h(r.method)], ["Sign", (r) => h(r.byName)]])}</div></div>
    ${ca ? `<p><b>Corrective actions</b></p><ul>${ca}</ul>` : ""}<p>Sheet signed: ${P("signoff").map((r) => `<b>${h(r.byName)}</b> ${kSig(r)}`).join(", ") || '<span style="color:#B36B00">not signed</span>'}</p>`;
}
function kCleanHTML(d) {
  const f = KF("clean"), R = kOn("clean", d);
  return `<table class="kt"><tr><th>Area</th><th>Tasks</th><th>Responsible</th><th>Signed</th></tr>${f.areas.map(([n, resp, t], i) => { const x = R.filter((r) => r.area === i).pop();
    return `<tr><td><b>${h(n)}</b></td><td>${t.map((q, j) => `${x ? kTick(x.tasks[j]) : "·"} ${h(q)}`).join("<br>")}${x && x.notes ? `<br><i>${h(x.notes)}</i>` : ""}</td><td>${h(resp)}</td><td>${x ? `${h(x.byName)}<br>${kSig(x)}` : '<span style="color:#C62828">not signed</span>'}</td></tr>`; }).join("")}</table>`;
}
function kWeekHTML(d) {
  const f = KF("weekly"), w = kMon(d), R = (S.data.kitchen || []).filter((r) => r.form === "weekly" && r.week === w), m = kSigned().get("week:" + w);
  return `<p>Week commencing <b>${fds(w)}</b> · Manager: ${m ? `<b>${h(m.byName)}</b> ${kSig(m)}` : '<span style="color:#B36B00">not yet signed</span>'}</p><table class="kt"><tr><th>Day</th><th>Tasks</th><th>Sign</th></tr>${f.days.map(([dn, who, t]) => { const x = R.filter((r) => r.day === dn).pop();
    return `<tr><td><b>${h(dn)}</b></td><td>${t.map((q, j) => `${x ? kTick(x.tasks[j]) : "·"} ${h(q)}`).join("<br>")}${x && x.notes ? `<br><i>${h(x.notes)}</i>` : ""}</td><td>${x ? `${h(x.byName)}${x.late ? " (late)" : ""}<br>${kSig(x)}` : "—"}</td></tr>`; }).join("")}</table>`;
}
function kLogHTML(id, d) {
  const f = KF(id), R = kOn(id, d);
  return R.length ? `<table class="kt"><tr><th>Date</th><th>Time</th>${f.cols.map(([, l]) => `<th>${h(l)}</th>`).join("")}<th>Sign</th></tr>${R.map((r) => `<tr><td>${fds(r.date)}</td><td>${h(r.time)}</td>${f.cols.map(([k]) => `<td>${h(r[k])}</td>`).join("")}<td>${h(r.byName)}</td></tr>`).join("")}</table>` : '<p class="muted">No entries.</p>';
}
function kDayHTML(d) {

    const o = document.createElement("canvas"); o.width = 360; o.height = 120; const x = o.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, 360, 120); x.drawImage(c, 0, 0, 360, 120);
    const doc = { form: "mgr", of: p.of, target: p.target, forDate: p.forDate, date: today(), sig: o.toDataURL("image/jpeg", 0.6), byName: S.name, byEmail: DEMO ? "demo" : HF_KIOSK.email, source: "HosKitchen Chef app" };
    try { if (DEMO) { const j = JSON.parse(localStorage.getItem(DK) || "{}"); j.kitchen = j.kitchen || []; j.kitchen.push({ id: "k" + Date.now(), ...doc, createdAt: Date.now() }); localStorage.setItem(DK, JSON.stringify(j)); loadDemo(); }
      else await fb.db.collection("hosfire_kitchen").add({ ...doc, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      m.remove(); toast("Signed off ✓"); } catch (err) { b.disabled = false; b.textContent = "Sign off"; $("#e", m).textContent = "Could not save: " + err.message; } };
}

/* ── data ── */
function onData(list) {
  const before = new Set(S.data.kitchen.map((r) => r.id)); S.data.kitchen = list;
  if (!firstLoad) { const nw = list.filter((r) => !before.has(r.id) && r.form !== "mgr"); nw.forEach((r) => notify(r)); }
  firstLoad = false; render();
}
function notify(r) {
  const [ic, t, sub] = evInfo(r), msg = `${ic} ${t}${r.byName ? " — " + r.byName.split(" ")[0] : ""}`;
  toast(msg); if (navigator.vibrate && isFlag(r)) navigator.vibrate([120, 60, 120]);
  if ("Notification" in window && Notification.permission === "granted" && document.hidden && navigator.serviceWorker) navigator.serviceWorker.ready.then((reg) => reg.showNotification(isFlag(r) ? "🚨 HosKitchen alert" : "HosKitchen", { body: `${t}${sub ? " · " + sub : ""} (${r.byName || ""})`, icon: "icon-192.png", tag: r.id }));
}
function loadDemo() { const j = JSON.parse(localStorage.getItem(DK) || "{}"); S.regs = (j.registers || []).filter((r) => r.kind === "training"); onData((j.kitchen || []).filter((r) => r.date >= kAdd(today(), -35))); }
async function connect() {
  if (DEMO) { S.live = true; loadDemo(); window.addEventListener("storage", (e) => { if (e.key === DK) loadDemo(); }); return; }
  firebase.apps.length || firebase.initializeApp(firebaseConfig);
  fb = { auth: firebase.auth(), db: firebase.firestore() };
  if (!fb.auth.currentUser || fb.auth.currentUser.email !== HF_KIOSK.email) await fb.auth.signInWithEmailAndPassword(HF_KIOSK.email, HF_KIOSK.pw);
  fb.db.collection("hosfire_registers").where("kind", "==", "training").onSnapshot((s) => { S.regs = s.docs.map((d) => ({ id: d.id, ...d.data() })); if (!firstLoad) render(); });
  unsub = fb.db.collection("hosfire_kitchen").where("date", ">=", kAdd(today(), -35)).onSnapshot((s) => { S.live = true; onData(s.docs.map((d) => ({ id: d.id, ...d.data() }))); }, (err) => { S.live = false; toast("Connection problem: " + err.message); render(); });
}
window.addEventListener("online", () => { S.live = true; render(); }); window.addEventListener("offline", () => { S.live = false; render(); });

/* ── gate ── */
function gate(inner) { root.innerHTML = `<div class="gate"><div class="gbox"><div class="badge"><img src="../img/logo.png" alt="Brandon Hall"></div><h1>Hos<b>Kitchen</b> Chef</h1><p>The Head Chef's live view of the kitchen: every check, temperature, clean and log as the team records it — with alerts, daily sheets, sign-off and training.</p>${inner}</div></div>`; }
function vCode() {
  gate(`<div class="glass"><label>Chef code</label><input id="cd" type="password" inputmode="numeric" autocomplete="off" placeholder="Enter the chef code"><button class="btn" id="go">Open</button><div class="err" id="e"></div></div>`);
  $("#cd").onkeydown = (e) => { if (e.key === "Enter") $("#go").click(); };
  $("#go").onclick = () => { if ($("#cd").value.trim() !== CHEF_CODE) { $("#e").textContent = "That code is not right."; return; } try { localStorage.setItem("hkc_ok", "1"); } catch (e) {} start(); };
}
function vName() {
  gate(`<div class="glass"><label>Your name</label><input id="nm" value="${h(S.name || "")}" placeholder="First and last name"><button class="btn" id="go">Continue</button><div class="err" id="e"></div></div>`);
  $("#go").onclick = () => { const n = $("#nm").value.trim().replace(/\s+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase()); if (n.split(" ").length < 2) { $("#e").textContent = "Please enter your first and last name."; return; } S.name = n; try { localStorage.setItem("hkc_name", n); } catch (e) {} start(); };
}
async function start() {
  let ok = false; try { ok = localStorage.getItem("hkc_ok") === "1"; S.name = S.name || localStorage.getItem("hkc_name") || ""; S.seen = +localStorage.getItem("hkc_seen") || 0; } catch (e) {}
  if (!ok) return vCode(); if (!S.name) return vName();
  if (!fb && !S.started) { S.started = true; root.innerHTML = `<div class="gate"><div class="gbox"><div class="badge"><img src="../img/logo.png" alt=""></div><p style="margin-top:16px">Connecting…</p></div></div>`; try { await connect(); } catch (err) { S.started = false; gate(`<div class="glass"><p class="err">Could not connect: ${h(err.message)}</p><button class="btn" onclick="location.reload()">Try again</button></div>`); return; } }
  render();
}
function render() { if (!S.started) return; ({ today: vToday, feed: vFeed, sheets: vSheets, alerts: vAlerts, team: vTeam })[S.tab](); }
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
setInterval(() => { if (S.started && S.tab === "today") render(); }, 60000);
start();
})();
</script>
</body>
</html>
