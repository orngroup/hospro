<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2C3E50">
<title>HosFIRE — Brandon Hall Fire Safety</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#2C3E50;--navy2:#22313F;--gold:#BB9979;--red:#B3261E;--red2:#D9432F;--redbg:#FCEBE8;--cream:#F2ECE2;--bg:#F5F3EF;
  --ink:#1f2a37;--c-done:#1E8A55;--c-prog:#C77D12;--c-not:#B3261E;--muted:#5f6b78;--line:#e2ded6;--ok:#2a6a4a;--okbg:#E7F2EC;--amber:#9c5a00;--ambbg:#FFF4E0;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Lato,-apple-system,"Segoe UI",Arial,sans-serif}
button,input,select,textarea{font:inherit}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 60%,#3a1d1a 100%)}
.lgcard{background:#fff;border-radius:16px;padding:28px;width:min(420px,92vw);box-shadow:0 20px 50px rgba(0,0,0,.35);border-top:6px solid var(--red)}
.lgcard img{height:64px;display:block;margin:0 auto 8px}
.lgcard h1{margin:4px 0 2px;text-align:center;color:var(--navy);font-size:24px;letter-spacing:.5px}
.lgcard h1 span{color:var(--red)}
.lgcard p{margin:0 0 18px;text-align:center;color:var(--muted);font-size:13px}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 11px;border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
textarea{min-height:70px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border:none;border-radius:9px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}
.btn.red{background:var(--red)} .btn.gold{background:var(--gold)} .btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:13px} .btn.block{width:100%;justify-content:center;margin-top:14px}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:18px}
/* shell */
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;position:sticky;top:0;z-index:20;border-bottom:4px solid var(--red)}
header img{height:38px;background:#fff;border-radius:6px;padding:3px}
header .brand{font-weight:900;font-size:19px;letter-spacing:.6px} header .brand span{color:#ff8a78}
header .sub{font-size:12px;color:#c9d3de}
header .sp{flex:1} header .who{font-size:13px;text-align:right}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--gold);color:#fff;margin-left:6px}
.badge.demo{background:#7f8c8d}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);align-items:start}
nav{background:#fff;border-right:1px solid var(--line);position:sticky;top:66px;height:calc(100vh - 66px);overflow-y:auto;padding:10px 10px 30px}
.ng{font-size:11px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:#98a2ad;margin:14px 10px 4px}
.ng:first-child{margin-top:4px}
nav button{display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;padding:9px 10px;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer;border-radius:9px;text-align:left}
nav button .ni{width:20px;text-align:center}
nav button:hover{background:#f4f1ec}
nav button.on{background:var(--redbg);color:var(--red)}
nav button .nb{margin-left:auto;background:var(--red);color:#fff;font-size:11px;border-radius:10px;padding:1px 7px}
main{max-width:1240px;margin:0 auto;padding:18px 22px;width:100%}
#menu-btn{display:none;background:rgba(255,255,255,.14);border:none;color:#fff;border-radius:9px;padding:8px 11px;font-weight:800;font-size:15px;cursor:pointer}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  nav{position:fixed;top:66px;left:0;bottom:0;width:260px;height:auto;z-index:40;box-shadow:4px 0 20px rgba(0,0,0,.2);transform:translateX(-105%);transition:transform .2s}
  nav.open{transform:none}
  #menu-btn{display:inline-block}
}
@media(max-width:640px){
  header{gap:8px;padding:8px 10px} header img{display:none} header .sub{display:none}
  header .hp-tx{display:none} header a[href="index.html"]{padding:7px 10px!important;margin-right:4px!important}
  header .who{font-size:12px}
}
h2{color:var(--navy);margin:4px 0 4px;font-size:22px} h2 .fl{color:var(--red)}
h3{color:var(--navy);margin:18px 0 8px;font-size:16px}
.lead{color:var(--muted);margin:0 0 14px}
.grid{display:grid;gap:12px}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))} .g6{grid-template-columns:repeat(6,minmax(0,1fr))} .g4c{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.g5,.g6{grid-template-columns:repeat(3,minmax(0,1fr))} .g4c{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g5,.g6,.g4c{grid-template-columns:1fr 1fr} .g4c{grid-template-columns:1fr}}
.pct{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:4px}
.pct button{border:none;background:#fff;font:700 11px Lato,sans-serif;padding:3px 6px;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
.pct button:last-child{border-right:none} .pct button.on{background:var(--navy);color:#fff}
.seg button.on.na{background:var(--c-prog);color:#fff} .g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))} .g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tile{border-left:5px solid var(--navy)} .tile .n{font-size:30px;font-weight:900;color:var(--navy)} .tile .l{font-size:13px;color:var(--muted);font-weight:700}
.tile.r{border-left-color:var(--red)} .tile.r .n{color:var(--red)} .tile.a{border-left-color:var(--amber)} .tile.a .n{color:var(--amber)} .tile.g{border-left-color:var(--ok)} .tile.g .n{color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
th{background:var(--navy);color:#fff;text-align:left;padding:8px 9px;font-size:12px;text-transform:uppercase;letter-spacing:.3px;position:sticky;top:0}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#fbfaf7}
.ctile{cursor:pointer} .ctile:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)} .ctile.on{outline:3px solid var(--navy);outline-offset:-3px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)} .p-red{background:var(--redbg);color:var(--red)} .p-amb{background:var(--ambbg);color:var(--amber)} .p-grey{background:#eef0f2;color:#5f6b78} .p-navy{background:#e6ebf1;color:var(--navy)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:0 0 auto} .grow{flex:1 1 auto}
.chk{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;background:#fff}
.chk.must{border-left:4px solid var(--red);background:#fffaf9}
.chk .t{flex:1}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:#fff;padding:6px 11px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on.pass{background:var(--ok);color:#fff} .seg button.on.fail{background:var(--red);color:#fff} .seg button.on.na{background:#7f8c8d;color:#fff}
.note{background:var(--cream);border-left:4px solid var(--gold);padding:10px 12px;border-radius:8px;font-size:13px;margin:10px 0}
.warn{background:var(--redbg);border-left:4px solid var(--red);padding:10px 12px;border-radius:8px;font-size:13px;margin:10px 0}
.modal{position:fixed;inset:0;background:rgba(20,28,38,.55);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 12px}
.mbox{background:#fff;border-radius:14px;width:min(760px,100%);padding:20px 22px;border-top:5px solid var(--red)}
.mbox h3{margin-top:0}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px} @media(max-width:640px){.f2{grid-template-columns:1fr}}
.muted{color:var(--muted);font-size:13px}
.tabs2{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}
.tabs2 button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-weight:700;cursor:pointer;color:var(--muted)}
.tabs2 button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.imp{background:#eef2f8;color:var(--navy);font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;margin-left:4px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;z-index:60;font-weight:700}
.wk{margin-bottom:14px} .wk h4{margin:0 0 6px;color:var(--navy)}
.di{display:flex;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:14px;background:#fff}
.di .d{width:110px;font-weight:700;color:var(--navy)} .di .x{flex:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.bar-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.bar-row .bl{width:140px;flex:0 0 140px;color:var(--ink)} .bar-row .bt{flex:1;min-width:0} .bar-row .bv{flex:0 0 auto;min-width:46px;font-weight:700;color:var(--ink)}
.bar-row .bs{display:flex;gap:2px;height:20px;min-width:2px}
.seg2{color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;min-width:16px;overflow:hidden}
.seg2:first-child{border-radius:0} .seg2:last-child{border-radius:0 4px 4px 0}
@media(max-width:640px){.bar-row .bl{width:96px;flex-basis:96px}}

/* procedures / infographics */
.tbc{background:var(--ambbg);color:var(--amber);font-weight:800;padding:1px 6px;border-radius:5px}
.pstrip-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.pstrip{position:relative;display:flex;flex-direction:column;gap:4px;background:#fff;border:1px solid var(--line);border-top:5px solid var(--c);border-radius:12px;padding:14px 12px 12px;color:var(--ink);text-decoration:none;font-size:13px}
.pstrip b{font-size:14px;color:var(--c)} .pstrip span{color:var(--muted);line-height:1.35}
.pstrip .pi{font-size:26px} .pstrip .pn{position:absolute;top:10px;right:12px;width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
.pstrip:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
@media(max-width:1000px){.pstrip-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pkeys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:6px 0 14px}
.pkeys div{background:var(--c,var(--red));color:#fff;border-radius:12px;padding:12px 14px} .pkeys b{display:block;font-size:16px} .pkeys span{font-size:13px;opacity:.92}
.pkeys .tbc{background:#fff}
@media(max-width:800px){.pkeys{grid-template-columns:1fr 1fr}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.pcard{background:#fff;border:1px solid var(--line);border-top:6px solid var(--c);border-radius:14px;padding:14px 16px;break-inside:avoid}
.pcard .ph{display:flex;gap:10px;align-items:center;margin-bottom:8px} .pcard h3{margin:0;color:var(--c)} .pic{font-size:30px}
.psrc{font-size:11px;color:var(--muted)}
.psteps{counter-reset:s;list-style:none;margin:0;padding:0}
.psteps li{counter-increment:s;position:relative;padding:6px 0 8px 38px;border-left:2px dashed var(--line);margin-left:13px}
.psteps li:last-child{border-left-color:transparent}
.psteps li::before{content:counter(s);position:absolute;left:-14px;top:4px;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:13px}
.psteps b{display:block;font-size:14px} .psteps span{display:block;font-size:13px;color:var(--muted)}
.pbig{font-size:64px;font-weight:900;color:var(--c);text-align:center;letter-spacing:4px;line-height:1}
.psay{background:var(--redbg);border-left:4px solid var(--c);padding:10px 12px;border-radius:8px;font-size:14px}
.proles{display:grid;gap:6px} .prole{display:grid;grid-template-columns:120px 1fr;gap:2px 10px;padding:7px 0;border-bottom:1px solid var(--line)}
.prr{font-weight:900;color:var(--c);font-size:13px} .prw{font-size:12px;color:var(--muted);grid-row:2} .prd{grid-row:1/3;grid-column:2;font-size:13px}
@media print{.pposter .pgrid{grid-template-columns:1fr 1fr;gap:8px} .pposter .pcard{font-size:11px;padding:8px 10px} .pposter .pkeys div,.pposter .pstrip,.pposter .pcard,.pposter .psteps li::before{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.tcards{display:grid;grid-template-columns:1fr 1fr;gap:6mm}
.tcard{border:1.5px solid #2C3E50;border-top:5px solid #B3261E;border-radius:8px;padding:8px 10px;font-size:10px;break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact;height:62mm;overflow:hidden}
.tch{display:flex;gap:8px;align-items:center;border-bottom:1px solid #ddd;padding-bottom:4px;margin-bottom:5px} .tch img{height:26px} .tch b{display:block;color:#B3261E;font-size:11px} .tch span{color:#555;font-size:9px}
.tcn{font-size:14px;font-weight:900;color:#2C3E50} .tcm{background:#B3261E;color:#fff;font-size:8px;padding:1px 5px;border-radius:6px;vertical-align:middle}
.tcr{color:#555;margin-bottom:4px} .tcard table{width:100%;border-collapse:collapse} .tcard td{padding:2px 3px;border-bottom:1px solid #eee;font-size:9.5px}
.tcf{margin-top:4px;font-size:8.5px;color:#555}
#print{display:none}
.catcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-bottom:12px}
.catcard{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font:inherit;position:relative}
.catcard b{display:block;color:var(--navy);font-size:13px} .catcard span{font-size:11px;color:var(--muted)} .catcard small{position:absolute;right:10px;top:8px;font-weight:800;color:var(--navy)}
.catcard.on{border-color:var(--red);box-shadow:0 0 0 2px rgba(179,38,30,.15)}
.dts{display:grid;gap:10px} .dts-card{border-left:5px solid var(--line)} .dts-mine{border-left-color:var(--red)} .dts-done{border-left-color:var(--ok)}
.dts-t{font-weight:800;color:var(--navy);font-size:15px} .dts-tb{width:100%;margin-top:8px;border-collapse:collapse} .dts-tb th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:4px;border-bottom:1px solid var(--line);background:none;position:static} .dts-tb td{padding:6px 4px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
.sd-doc{font-size:11pt;line-height:1.35} .sd-doc table{border-collapse:collapse;width:100%} .sd-doc td,.sd-doc th{border:1px solid #ccc;padding:3px 5px;vertical-align:top} .sd-doc h1{font-size:16pt} .sd-doc h2{font-size:14pt} .sd-doc img{max-width:100%}
.fx-row{cursor:pointer} .fx-row:hover td{background:#fff4f2} .fx-done td{opacity:.6}
.fx-bar{height:6px;background:#eee;border-radius:4px;margin-top:6px;overflow:hidden} .fx-bar i{display:block;height:100%;background:var(--ok)}
@media print{
  body{background:#fff} header,nav,main,.modal,.toast{display:none!important}
  #print{display:block;padding:0;font-size:11px}
  #print h1{color:var(--navy);font-size:20px;margin:0} #print h2{font-size:15px;margin:14px 0 6px;color:var(--navy);border-bottom:2px solid var(--red);padding-bottom:3px}

}
@page{size:A4;margin:12mm 10mm}
.pk{font-family:inherit;color:#1b2430;font-size:12px;line-height:1.4}
#print .pk h2.pk-h{font-size:20px;margin:2px 0 10px;color:#2C3E50;border:none;padding:0}

.pk-cover{display:grid;grid-template-columns:1fr 1.15fr;gap:14mm;align-items:start;padding-top:8mm;min-height:170mm}
.pk-cl{text-align:center;padding-top:10mm;border-right:3px solid #B3261E;padding-right:12mm}

.pk-ct,.pk-toc{width:100%;border-collapse:collapse;text-align:left}

.pk-ct td:first-child{color:#666;width:36%}

.pk-toc2{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12px}
.pk-toc2 div{display:flex;align-items:center;gap:8px;border-bottom:1px solid #e6e6e6;padding:3px 0}
.pk-toc2 .pk-tn{display:inline-block;min-width:22px;padding:2px 0;border-radius:4px}
.pk-ptab{width:100%;border-collapse:separate!important;border-spacing:4mm 0;table-layout:fixed;margin:0 -4mm} .pk-ptab td{width:33.3%;vertical-align:top;padding:0 0 4mm!important;border:none!important;background:none!important} .pk-ptab tr{break-inside:avoid;page-break-inside:avoid} .pk-ptab .pcard{margin:0;font-size:10px} .pk .pposter .pcard{break-inside:avoid;page-break-inside:avoid;font-size:10px} .pk:not(.port) .pposter .pcard h3{font-size:12px!important} .pk .pcard{break-inside:avoid;page-break-inside:avoid}
.pk-cover{page-break-after:always;break-after:page}
.pk-tn{width:11mm;font-weight:900;color:#fff;background:#2C3E50;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pk-note{font-size:11px;color:#555;text-align:left;margin-top:6mm;line-height:1.5}
.pk-run{display:flex;align-items:center;gap:8px;font-size:10px;color:#777;border-bottom:1px solid #ccc;padding-bottom:4px;margin-bottom:8px}
.pk-run img{height:18px} .pk-run span:last-child{margin-left:auto;font-weight:800;color:#B3261E}
.pk-h{display:flex;align-items:center;gap:12px}
.pk-tab{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;border-radius:7px;background:#B3261E;color:#fff;font-size:17px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pk table{width:100%;border-collapse:collapse;margin-bottom:8px;font-size:11.5px}
.pk th{background:#2C3E50;color:#fff;text-align:left;padding:6px 7px;font-size:11px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pk td{padding:5px 7px;border-bottom:1px solid #e3e3e3;vertical-align:top}
.pk tr{break-inside:avoid}
.pk-log td{height:24px;border:1px solid #bbb} .pk-log th{border:1px solid #2C3E50}
.pk-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 10px}
.pk-tile{border:1px solid #d5dbe2;border-left:5px solid #2C3E50;border-radius:6px;padding:8px 10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
