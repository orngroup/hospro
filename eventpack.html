<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event Pack · HosSALES · Brandon Hall Hotel and Spa</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--navy:#2C3E50;--gold:#BB9979;--orange:#AB3C0C;--cream:#E9DFD3;--earth:#EDF1EB;--ink:#2C3E50;--mut:#6b7684;--line:#e4e8ee;--bg:#eef1f4}
  *{box-sizing:border-box}
  body{margin:0;font-family:Lato,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  .serif{font-family:'Cormorant Garamond',Georgia,serif}
  .topbar{background:var(--navy);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
  .topbar img{height:34px}
  .topbar h1{font-size:19px;margin:0;font-weight:700}
  .topbar .sub{font-size:12px;color:#c7d0da}
  .status{margin-left:auto;font-size:12px;color:#c7d0da;display:flex;align-items:center;gap:14px}
  .pill{background:#fff2;border:1px solid #ffffff33;border-radius:999px;padding:3px 11px;font-weight:700}
  .wrap{display:grid;grid-template-columns:minmax(360px,440px) 1fr;gap:0;min-height:calc(100vh - 58px)}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}}
  .form{background:#fff;border-right:1px solid var(--line);padding:18px 20px 60px;overflow:auto;max-height:calc(100vh - 58px)}
  .preview{padding:20px;overflow:auto;max-height:calc(100vh - 58px)}
  details.sec{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;background:#fff}
  details.sec>summary{list-style:none;cursor:pointer;padding:13px 15px;font-weight:800;font-size:14px;background:#f7f9fb;display:flex;align-items:center;gap:8px}
  details.sec>summary::-webkit-details-marker{display:none}
  details.sec[open]>summary{border-bottom:1px solid var(--line)}
  .secbody{padding:14px 15px}
  label{display:block;font-size:11.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;margin:10px 0 5px}
  input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font:500 14px Lato;color:var(--ink);background:#fff}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
  textarea{resize:vertical;min-height:60px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{border:none;border-radius:9px;padding:10px 15px;font:800 13px Lato;cursor:pointer;background:var(--navy);color:#fff}
  .btn.gold{background:var(--gold)}.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
  .btn.sm{padding:6px 10px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#f2f5f8;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700}
  .muted{color:var(--mut);font-size:12px}
  .swatch{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);cursor:pointer;padding:0}
  .logoprev{display:flex;gap:10px;margin-top:8px}
  .logoprev div{flex:1;border-radius:9px;padding:12px;text-align:center;border:1px solid var(--line)}
  .logoprev img{max-height:46px;max-width:100%}
  .course{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:9px;background:#fbfcfd}
  .dish{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px;margin-bottom:6px}
  .dish input{padding:7px 9px;font-size:13px}
  .previewTabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .previewTabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;font:700 12.5px Lato;cursor:pointer;color:var(--navy)}
  .previewTabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .stage{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;justify-content:center;overflow:auto}
  .genbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  /* ---- shared print-item styles (scaled on screen, full size in PDF) ---- */
  .doc{background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.12)}
  .navyhead{background:var(--navy);color:#fff;text-align:center;padding:8mm}
  .navyhead img{height:14mm}
  /* table number card */
  .tn{width:63mm;height:91mm;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;border-radius:2mm;overflow:hidden}
  .tn .lg{padding:6mm 0 2mm}.tn .lg img{height:12mm}
  .tn .tl{font:700 4mm Lato;letter-spacing:3mm;text-transform:uppercase;color:var(--gold);margin-left:3mm}
  .tn .no{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:44mm;line-height:1;flex:1;display:flex;align-items:center}
  .tn .strip{background:#fff;width:100%;padding:3mm;text-align:center;min-height:14mm;display:flex;align-items:center;justify-content:center;gap:4mm}
  .tn .strip img{max-height:9mm;max-width:40%}
  .tn .strip .wm{color:var(--navy);font:700 3mm Lato}
  /* a4 sheet */
  .a4{width:210mm;min-height:297mm;background:#fff;padding:12mm 10mm}
  .grid3{display:grid;grid-template-columns:repeat(3,63mm);gap:7mm 10mm;justify-content:center}
  .cut{outline:0.2mm dashed #c9c9c9}
  /* menu */
  .menu{width:210mm;min-height:297mm;background:var(--earth);padding:16mm}
  .menu .panel{background:#fff;border:0.6mm solid var(--gold);padding:14mm 16mm;min-height:100%;text-align:center}
  .menu h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:16mm;margin:4mm 0 1mm;color:var(--navy)}
  .menu .sub{color:var(--gold);font:700 4mm Lato;letter-spacing:2mm;text-transform:uppercase}
  .menu .cl{color:var(--mut);font-size:3.6mm;margin:2mm 0 8mm}
  .menu .course-t{font-family:'Cormorant Garamond',serif;color:var(--gold);font-size:6mm;margin:7mm 0 2mm}
  .menu .d-n{font-family:'Cormorant Garamond',serif;font-size:5mm;color:var(--navy)}
  .menu .d-d{font-size:3.4mm;color:#555;margin-bottom:3mm}
  .menu .allerg{font-size:3mm;color:var(--mut);margin-top:10mm;border-top:0.3mm solid #ddd;padding-top:4mm}
  .menu .foot{margin-top:6mm;display:flex;justify-content:center;gap:6mm;align-items:center}.menu .foot img{height:10mm}
  /* welcome letter */
  .letter{width:210mm;min-height:297mm;background:#fff;padding:0}
  .letter .lh{background:var(--navy);color:#fff;text-align:center;padding:10mm}.letter .lh img{height:16mm}
  .letter .lb{padding:14mm 20mm;font-size:4mm;line-height:1.7;color:#2a2a2a}
  .letter .lb h2{font-family:'Cormorant Garamond',serif;color:var(--navy);font-weight:700;font-size:7mm;text-align:center;margin:0 0 7mm}
  /* welcome sign A3 */
  .sign{width:420mm;height:297mm;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center}
  .sign .inner{border:2mm solid var(--gold);outline:0.6mm solid var(--gold);outline-offset:4mm;padding:30mm 40mm;text-align:center;width:88%;height:82%}
  .sign img{height:34mm;margin-bottom:12mm}
  .sign .wel{font-family:'Cormorant Garamond',serif;font-size:20mm;line-height:1.1}
  .sign .cli{font-family:'Cormorant Garamond',serif;font-size:34mm;color:var(--gold);font-weight:700;margin:6mm 0}
  .sign .subl{font-size:7mm;letter-spacing:2mm;text-transform:uppercase;color:#d9e0e7}
  .sign .strip{margin-top:16mm;display:flex;justify-content:center;gap:12mm;align-items:center}.sign .strip img{height:14mm;margin:0}
  /* tv 16:9 */
  .tv{width:1920px;height:1080px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Lato}
  .tv .in{text-align:center;border:10px solid var(--gold);padding:90px 120px;width:86%;height:80%;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .tv img{height:150px;margin-bottom:40px}
  .tv .w{font-family:'Cormorant Garamond',serif;font-size:80px}
  .tv .c{font-family:'Cormorant Garamond',serif;font-size:150px;color:var(--gold);font-weight:700;margin:10px 0}
  .tv .s{font-size:34px;letter-spacing:8px;text-transform:uppercase;color:#d9e0e7}
  .scaleBox{transform-origin:top center}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;font-size:13px;z-index:50;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
  .hidden{position:fixed;left:-9999px;top:0}
</style>

</head>

async function boot(){

  try{ const r=await db.collection('hoshouse_config').doc('venue').get(); if(r.exists&&(r.data()||{}).eventRooms) ROOMS=(r.data().eventRooms); }catch(e){}

  else if(qp('enquiry')){
    try{ const d=await db.collection('enquiries').doc(qp('enquiry')).get(); if(d.exists){ const e=d.data()||{}; PACK.client=e.company||e.name||''; PACK.date=(e.eventDate||e.date||'').slice(0,10); PACK.room=e.room||''; PACK.eventName=e.eventType||e.subject||''; } }catch(e){}

function touch(){ PACK.updatedAt=Date.now(); $('savestate').textContent='Saving…'; clearTimeout(SAVE_T); SAVE_T=setTimeout(save,900); }
async function save(){
  if(PACK.status==='Final'){ $('savestate').textContent='Final — locked'; return; }
  try{ await db.collection('hossales_eventpacks').doc(PACK.id).set(PACK,{merge:true}); $('savestate').textContent='Saved ✓'; }
  catch(e){ $('savestate').textContent='Save failed'; }
  saveScreenDoc();
  $('statuspill').textContent=PACK.status;
}
// Public, screen-safe copy for the TV page (welcome / agenda / menu only — no guest data)
async function saveScreenDoc(){
  try{
    await db.collection('eventpack_screens').doc(PACK.id).set({
      code:PACK.screen.code, client:PACK.client, headline:PACK.sign.headline, subline:PACK.sign.subline,
      accent:PACK.accent, logos:PACK.logos||[], eventName:PACK.eventName, date:PACK.date,
      agenda:(PACK.screen.showAgenda?(PACK.screen.agenda||''):''), showAgenda:!!PACK.screen.showAgenda, showMenu:!!PACK.screen.showMenu,
      menu:(PACK.screen.showMenu?{courses:PACK.menu.courses.map(c=>({t:c.t,dishes:c.dishes.filter(d=>d.n).map(d=>({n:d.n,d:d.d}))}))}:null),
      updatedAt:Date.now()
    },{merge:true});
  }catch(e){}
}
function set(path,val){ const p=path.split('.'); let o=PACK; for(let i=0;i<p.length-1;i++) o=o[p[i]]; o[p[p.length-1]]=val; touch(); }

// ---------- logo upload ----------
async function uploadLogo(ev,idx){
  const f=ev.target.files&&ev.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=async()=>{
    PACK.logos[idx]=rd.result;  // data URL — works offline & in PDFs
    touch(); renderForm(); renderPreview();
    if(storage){ try{ const ref=storage.ref('eventpacks/'+PACK.id+'/logo'+idx); await ref.putString(rd.result,'data_url'); const url=await ref.getDownloadURL(); /* keep data URL for rendering; store hosted url in files */ PACK.files['logo'+idx]=url; save(); }catch(e){} }
  };
  rd.readAsDataURL(f);
}

// ---------- letter template ----------
function buildLetterBody(guestName){
  const C=PACK.client||'[Client]'; const EV=PACK.eventName?(' '+PACK.eventName):' event';
  const today=PACK.date?new Date(PACK.date).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'[Date]';
  const news=(PACK.letter.news||'').split('\n').map(x=>x.trim()).filter(Boolean);
  let newsPara='';
  if(news.length){ newsPara=`<p>It has been a remarkable few months for ${esc(C)}, and we wanted to say congratulations. We have followed the news with real interest: ${news.map(esc).join('; ')}. Achievements like these do not happen by accident, and it is a pleasure to host the people behind them.</p>`; }
  const nextYear=(new Date().getFullYear()+1);
  return `<p>${esc(today)}</p>
<p>Dear ${esc(guestName)},</p>
<h2>A very warm welcome to Brandon Hall Hotel and Spa</h2>
<p>On behalf of everyone here, thank you for choosing Brandon Hall Hotel and Spa for ${esc(C)}${esc(EV)}. We are delighted to have you with us and have been looking forward to your visit.</p>
${newsPara}
<p>During your stay, our team is here to make everything easy. Your meeting space and dining are arranged, the leisure club with its indoor pool, sauna and gym is open to you, and if there is anything at all you need, please ask any member of the team or call reception on extension 0.</p>
<p>We very much hope this is the first of many visits. Brandon Hall Hotel and Spa sits ten minutes from Coventry with easy links to the M6, M69 and M45, and we would be glad to become a regular base for ${esc(C)}, whether for meetings, training days, overnight stays or celebrations. I would welcome the chance to talk about how we can support you through ${nextYear} and beyond.</p>
<p>Enjoy your time with us, and thank you again for being here.</p>
<p>With warm regards,</p>
<p style="margin-top:10mm"><b>${esc(PACK.host)}</b><br>${esc(PACK.hostTitle)}<br>Brandon Hall Hotel and Spa</p>`;
}

// ---------- generation (client-side) ----------
const {jsPDF}=window.jspdf||{};
function pageNodes(html){ const w=document.createElement('div'); w.innerHTML=html; return Array.from(w.querySelectorAll('[data-page]')); }
async function nodeToCanvas(node){ document.getElementById('stagePrint').innerHTML=''; document.getElementById('stagePrint').appendChild(node); const cv=await html2canvas(node,{scale:2,useCORS:true,backgroundColor:null}); document.getElementById('stagePrint').innerHTML=''; return cv; }
async function itemToPdf(k){
  const html=itemHTML(k); const nodes=pageNodes(html); if(!nodes.length) return null;
  const landscape=(k==='sign'); const first=nodes[0];
  // page size by item
  const sizes={tables:[210,297],names:[210,297],menu:[210,297],letter:[210,297],sign:[420,297]};
  const [pw,ph]=sizes[k]||[210,297];
  const pdf=new jsPDF({orientation:pw>ph?'landscape':'portrait',unit:'mm',format:[pw,ph]});
  for(let i=0;i<nodes.length;i++){ const cv=await nodeToCanvas(nodes[i]); const img=cv.toDataURL('image/jpeg',0.92); if(i>0) pdf.addPage([pw,ph],pw>ph?'landscape':'portrait'); pdf.addImage(img,'JPEG',0,0,pw,ph); }
  return pdf;
}
function fnameBase(){ return (PACK.client||'Event').replace(/[^a-z0-9]+/ig,'-')+'_'+(PACK.date||''); }
async function genItem(k){ toast('Generating…'); try{ const pdf=await itemToPdf(k); if(pdf) pdf.save(fnameBase()+'_'+k+'.pdf'); }catch(e){ toast('Generate failed — try again'); console.error(e);} }
async function genTVpng(){ toast('Rendering TV…'); try{ const n=pageNodes(buildTV())[0]; const cv=await nodeToCanvas(n); const a=document.createElement('a'); a.href=cv.toDataURL('image/png'); a.download=fnameBase()+'_TV_1920x1080.png'; a.click(); }catch(e){ toast('Failed'); } }
function genLetterDocx(){
  const body=(PACK.letter.body||buildLetterBody('Guest')).replace(/<h2>/g,'<p style="text-align:center;font-weight:bold;font-size:18pt">').replace(/<\/h2>/g,'</p>');
  const html=`<html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"></head><body style="font-family:Aptos,Calibri,sans-serif;font-size:11pt">${body}</body></html>`;
  const blob=new Blob(['\ufeff'+html],{type:'application/msword'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fnameBase()+'_welcome-letter.doc'; a.click();
}
async function generateAll(){
  if(!PACK.client){ toast('Add a client name first'); return; }
  toast('Building full pack…'); const zip=new JSZip();
  try{
    for(const k of ['tables','names','menu','letter','sign']){ const pdf=await itemToPdf(k); if(pdf) zip.file(fnameBase()+'_'+k+'.pdf', pdf.output('blob')); }
    // TV png
    try{ const n=pageNodes(buildTV())[0]; const cv=await nodeToCanvas(n); const b=await new Promise(r=>cv.toBlob(r,'image/png')); if(b) zip.file(fnameBase()+'_TV_1920x1080.png',b); }catch(e){}
    // letter docx
    const body=(PACK.letter.body||buildLetterBody('Guest'));
    zip.file(fnameBase()+'_welcome-letter.doc','\ufeff<html><head><meta charset="utf-8"></head><body style="font-family:Aptos,Calibri">'+body+'</body></html>');
    // readme
    zip.file('README.txt','Event pack for '+PACK.client+' — '+(PACK.date||'')+'\nTV screen: brandon.hospro.co.uk/screen.html?pack='+PACK.id+'  (code '+PACK.screen.code+')\nGenerated by HosSALES Event Pack.');
    const blob=await zip.generateAsync({type:'blob'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fnameBase()+'_EventPack.zip'; a.click();
    toast('Pack ready ✓'); logTimeline('Event pack generated');
  }catch(e){ toast('Pack build failed — try individual items'); console.error(e); }
}
function markFinal(){ if(!confirm('Mark this pack Final? It will be locked; editing creates a new version.')) return; PACK.status='Final'; save(); renderForm(); toast('Marked Final'); logTimeline('Event pack marked Final'); }
async function logTimeline(msg){ if(!PACK.enquiryId) return; try{ await db.collection('enquiries').doc(PACK.enquiryId).collection('timeline').add({ msg:msg+' by '+PACK.createdBy, at:new Date().toISOString() }); }catch(e){} }

boot();
</script>
