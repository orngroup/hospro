<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a2b3a">
<title>Welcome to Brandon Hall Hotel and Spa — Pre Check-in</title>
<meta name="description" content="Welcome to Brandon Hall Hotel and Spa. Please complete your pre check-in — we look forward to welcoming you.">
<!-- WhatsApp / social / email link preview -->
<meta property="og:title" content="Welcome to Brandon Hall Hotel and Spa — Pre Check-in">
<meta property="og:description" content="We look forward to welcoming you. Please complete your pre check-in before you arrive.">
<meta property="og:image" content="https://orngroup.github.io/brandonme/assets/hotel/exterior-dusk.png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="768">
<meta property="og:type" content="website">
<meta property="og:url" content="https://orngroup.github.io/brandonme/precheckin.html">
<meta property="og:site_name" content="Brandon Hall Hotel and Spa">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Welcome to Brandon Hall Hotel and Spa — Pre Check-in">
<meta name="twitter:description" content="We look forward to welcoming you. Please complete your pre check-in before you arrive.">
<meta name="twitter:image" content="https://orngroup.github.io/brandonme/assets/hotel/exterior-dusk.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{ --navy:#1a2b3a; --panel:#22374d; --gold:#c9a978; --gold-lt:#d8bb8e; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lato',system-ui,sans-serif;color:#fff;background:var(--navy)}
.bg{min-height:100dvh;background:linear-gradient(rgba(15,31,48,.78),rgba(15,31,48,.9)),
  url('assets/hotel/exterior-dusk.png') center/cover fixed}

/* splash */
.splash{min-height:100dvh;display:grid;place-items:center;text-align:center;padding:30px}
.splash-in{max-width:520px;animation:fade .7s ease}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.logo{width:120px;margin-bottom:22px}
.eyebrow{font-size:13px;letter-spacing:5px;color:var(--gold);font-weight:700}
.title{font-family:'Cormorant Garamond',serif;font-size:46px;font-weight:600;line-height:1.05;margin:10px 0 16px}
.sub{font-size:16px;line-height:1.6;color:#dbe3ec;max-width:430px;margin:0 auto}
.begin{margin-top:30px;background:var(--gold);color:var(--navy);border:none;padding:15px 34px;border-radius:32px;
  font:700 16px/1 'Lato',sans-serif;cursor:pointer;transition:.18s;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.begin:hover{background:var(--gold-lt);transform:translateY(-2px)}
@media(max-width:560px){.title{font-size:36px}}

/* form */
.formwrap{min-height:100dvh;padding:36px 20px;display:none}
.card{max-width:640px;margin:0 auto;background:var(--panel);border-radius:18px;padding:34px 34px 30px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);border:1px solid rgba(201,169,120,.25)}
.card-logo{width:80px;display:block;margin:0 auto 14px}
.card-title{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;text-align:center}
.card-sub{font-size:14px;color:#b8c6d6;text-align:center;margin-bottom:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid .full{grid-column:1/-1}
label{display:block;font-size:12.5px;font-weight:600;color:var(--gold);margin-bottom:5px}
input,select,textarea{width:100%;padding:11px 13px;border-radius:9px;font-size:15px;font-family:inherit;
  background:rgba(255,255,255,.06);border:1px solid rgba(201,169,120,.3);color:#fff}
input::placeholder,textarea::placeholder{color:#8ea0b3}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);background:rgba(255,255,255,.1)}
select option{background:var(--panel);color:#fff}
.submit{width:100%;background:var(--gold);color:var(--navy);border:none;padding:14px;border-radius:10px;
  font:700 15px/1 'Lato',sans-serif;cursor:pointer;margin-top:18px;transition:.15s}
.submit:hover{background:var(--gold-lt)}
.msg{font-size:13px;margin-top:10px;text-align:center;color:#ffd9b0;min-height:16px}
.foot{text-align:center;color:#8ea0b3;font-size:12px;margin:20px 0 10px}
.chkwrap{margin-top:4px}
.chk{display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:13px;color:#dbe3ec;line-height:1.4}
.chk input{width:auto;margin-top:2px;accent-color:var(--gold)}
@media(max-width:560px){.grid{grid-template-columns:1fr}}

/* thanks */
.thanks{min-height:100dvh;display:none;place-items:center;text-align:center;padding:30px}
</style>
</head>
<body>
<div class="bg">
  <!-- SPLASH -->
  <div class="splash" id="splash"><div class="splash-in">
    <img class="logo" src="assets/marketing/logos/logo-gold-transparent.png" onerror="this.src='assets/bh-logo.svg'">
    <div class="eyebrow">WELCOME TO</div>
    <h1 class="title">Brandon Hall<br>Hotel and Spa</h1>
    <p class="sub">We look forward to welcoming you. Please take a moment to complete your pre check-in so we can prepare for your stay.</p>
    <button class="begin" id="begin">Begin pre check-in →</button>
  </div></div>

  <!-- FORM -->
  <div class="formwrap" id="formwrap"><div class="card">
    <img class="card-logo" src="assets/marketing/logos/logo-gold-transparent.png" onerror="this.src='assets/bh-logo.svg'">
    <h2 class="card-title">Pre Check-in</h2>
    <p class="card-sub">Please complete the details below.</p>
    <div class="grid" id="fields"></div>
    <div class="msg" id="msg"></div>
    <button class="submit" id="submit">Submit pre check-in</button>
  </div>
  <p class="foot">Brandon Hall Hotel and Spa · Main Street, Brandon, Coventry CV8 3FW · 024 7710 2555</p>
  </div>

  <!-- THANKS -->
  <div class="thanks" id="thanks"></div>
</div>

<!-- Firebase (optional — submits to shared DB when configured) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const FIELDS = [
  { key:"name",      label:"Full name",            type:"text",  req:true },
  { key:"company",   label:"Company",              type:"text" },
  { key:"email",     label:"Email",                type:"email", req:true },
  { key:"phone",     label:"Phone",                type:"tel",   req:true },
  { key:"guests",    label:"Number of guests staying", type:"number" },
  { key:"purpose",   label:"Purpose of stay",      type:"select", opts:["Leisure","Business","Event / Wedding","Other"] },
  { key:"checkin",   label:"Check-in date",        type:"date",  req:true },
  { key:"checkout",  label:"Check-out date",       type:"date" },
  { key:"nights",    label:"Nights",               type:"readonly" },
  { key:"arrival",   label:"Estimated arrival time", type:"time" },
  { key:"carReg",    label:"Car registration",     type:"text" },
  { key:"roomReq",   label:"Room requests / preferences", type:"textarea", full:true, ph:"e.g. quiet room, high floor, twin beds, accessible" },
  { key:"dinner",    label:"Dinner reservation?",  type:"select", opts:["No","Yes"] },
  { key:"dinnerTime",label:"Dinner time",          type:"time" },
  { key:"dinnerCovers",label:"Number of covers",   type:"number" },
  { key:"dietary",   label:"Dietary requirements / allergies", type:"text", full:true, ph:"e.g. vegetarian, nut allergy" },
  { key:"occasion",  label:"Special occasion?",    type:"text", full:true, ph:"e.g. birthday, anniversary" },
  { key:"hearAbout", label:"How did you hear about us?", type:"select", full:true, opts:["","Returning guest","Recommendation","Google","Social media","Travel agent","Booking site","Event / wedding","Other"] },
  { key:"newsletter",label:"Keep me updated with offers", type:"select", opts:["No","Yes"] },
  { key:"gdpr",      label:"I agree to Brandon Hall Hotel and Spa storing these details to prepare for my stay, in line with its privacy policy.", type:"checkbox", full:true, req:true }
];

// init firebase if configured
let db=null, auth=null;
try{
  if(typeof firebase!=="undefined" && firebaseConfig && !firebaseConfig.apiKey.startsWith("YOUR_")){
    firebase.initializeApp(firebaseConfig); db=firebase.firestore(); auth=firebase.auth();
  }
}catch(e){ console.warn("Firebase init:", e.message); }

const $=s=>document.querySelector(s);
$("#begin").onclick=()=>{ $("#splash").style.display="none"; $("#formwrap").style.display="block"; buildFields(); };

function buildFields(){
  $("#fields").innerHTML=FIELDS.map(f=>{
    let inp;
    if(f.type==="textarea") inp=`<textarea id="f-${f.key}" rows="2" placeholder="${f.ph||''}"></textarea>`;
    else if(f.type==="select") inp=`<select id="f-${f.key}">${f.opts.map(o=>`<option>${o}</option>`).join("")}</select>`;
    else if(f.type==="readonly") inp=`<input id="f-${f.key}" type="text" readonly placeholder="—" style="opacity:.7">`;
    else if(f.type==="checkbox") inp=`<label class="chk"><input id="f-${f.key}" type="checkbox"> <span>${f.label}${f.req?' *':''}</span></label>`;
    else inp=`<input id="f-${f.key}" type="${f.type}" placeholder="${f.ph||''}">`;
    if(f.type==="checkbox") return `<div class="full chkwrap" data-field="${f.key}">${inp}</div>`;
    return `<div class="${f.full?'full':''}" data-field="${f.key}"><label>${f.label}${f.req?' *':''}</label>${inp}</div>`;
  }).join("");
  const toggle=()=>{ const show=$("#f-dinner").value==="Yes";
    ["dinnerTime","dinnerCovers"].forEach(k=>{ const d=document.querySelector(`[data-field="${k}"]`); if(d) d.style.display=show?"":"none"; }); };
  $("#f-dinner").onchange=toggle; toggle();
  // auto-calc nights
  const calcNights=()=>{ const ci=$("#f-checkin").value, co=$("#f-checkout").value;
    if(ci&&co){ const n=Math.round((new Date(co)-new Date(ci))/864e5);
      $("#f-nights").value = n>0 ? n+" night"+(n>1?"s":"") : "—"; } else $("#f-nights").value=""; };
  $("#f-checkin").onchange=calcNights; $("#f-checkout").onchange=calcNights;
  $("#submit").onclick=submit;
}

async function submit(){
  const rec={}; let missing=false;
  FIELDS.forEach(f=>{
    if(f.type==="checkbox"){ rec[f.key]=$("#f-"+f.key)?.checked?"Yes":"No"; if(f.req && !$("#f-"+f.key)?.checked) missing=true; return; }
    if(f.type==="readonly"){ rec[f.key]=($("#f-"+f.key)?.value||""); return; }
    const v=($("#f-"+f.key)?.value||"").trim(); rec[f.key]=v; if(f.req&&!v) missing=true;
  });
  if(missing){ $("#msg").textContent="Please complete the required fields (*) and accept the consent."; return; }
  rec.source="pre check-in"; rec.created=new Date().toISOString();
  $("#submit").disabled=true; $("#msg").textContent="Submitting…";
  try{
    if(db){
      if(auth && !auth.currentUser){ try{ await auth.signInAnonymously(); }catch(e){} }
      await db.collection("precheckin").add(rec);
    }else{
      const l=JSON.parse(localStorage.getItem("bh_precheckin")||"[]"); l.unshift(rec);
      localStorage.setItem("bh_precheckin", JSON.stringify(l));
    }
  }catch(e){ console.warn(e.message); }
  showThanks(rec.name.split(" ")[0]);
}

function showThanks(first){
  $("#formwrap").style.display="none";
  const t=$("#thanks"); t.style.display="grid";
  t.innerHTML=`<div class="splash-in">
    <img class="logo" src="assets/marketing/logos/logo-gold-transparent.png" onerror="this.src='assets/bh-logo.svg'">
    <div class="eyebrow">THANK YOU</div>
    <h1 class="title">See you soon, ${first}</h1>
    <p class="sub">Your pre check-in is complete. Everything's noted and we're getting things ready for your arrival. We look forward to welcoming you to Brandon Hall Hotel and Spa very soon.</p>
  </div>`;
  window.scrollTo(0,0);
}
</script>
</body>
</html>
