<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#1a2b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Compliance">
<title>Compliance — Brandon Hall Hotel and Spa</title>
<link rel="manifest" href="tasks-manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Compliance">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1a2b3a;--navy2:#101d33;--gold:#c9a978;--red:#d0433b;--amber:#c78a3b;--green:#2a6a4a;--teal:#1a9c8a;--paper:#f5f7f9;--ink:#2a3644;--line:#e3e7ee}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Lato',system-ui,sans-serif;background:var(--paper);color:var(--ink)}

/* LOGIN */
#login{position:fixed;inset:0;background:linear-gradient(160deg,var(--navy),var(--navy2));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;z-index:100}
#login .logo{font-family:'Cormorant Garamond',serif;font-size:40px;letter-spacing:6px;color:#fff;font-weight:600;text-align:center}
#login .sub{font-size:11px;letter-spacing:5px;color:var(--gold);font-weight:700;margin-top:5px;margin-bottom:28px}
#login .title{font-family:'Cormorant Garamond',serif;font-size:22px;color:#fff;text-align:center;margin-bottom:6px}
#login .hint{color:#9fb0c4;font-size:13px;text-align:center;margin-bottom:22px}
#login select{width:100%;max-width:340px;padding:16px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:17px;font-family:inherit;appearance:none;text-align:center}
#login select option{background:#1a2b3a;color:#fff}
#login .login-btn{margin-top:14px;width:100%;max-width:340px;padding:16px;background:var(--gold);color:var(--navy);border:none;border-radius:12px;font:700 17px 'Lato';cursor:pointer}
#login .login-btn:disabled{opacity:.4}

/* APP SHELL */
#app{display:none;height:100%;flex-direction:column}
.topbar{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar .brand{font-family:'Cormorant Garamond',serif;font-size:18px;letter-spacing:2px;font-weight:600}
.topbar .brand small{display:block;font-size:9px;letter-spacing:3px;color:var(--gold);font-family:'Lato';font-weight:700}
.topbar .user-pill{background:rgba(255,255,255,.12);border:none;color:#fff;padding:7px 12px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer}
.content{flex:1;overflow-y:auto;padding-bottom:calc(80px + env(safe-area-inset-bottom))}

/* SUMMARY CARDS */
.sum-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 14px 0}
.sum-c{background:#fff;border-radius:12px;padding:13px;text-align:center;box-shadow:0 2px 8px rgba(26,43,58,.06)}
.sum-c .v{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;line-height:1}
.sum-c .k{font-size:11px;color:#7a8494;margin-top:3px}
.sum-c.red .v{color:var(--red)}.sum-c.amber .v{color:var(--amber)}.sum-c.green .v{color:var(--green)}

/* FILTER TABS */
.filter-row{display:flex;gap:8px;padding:12px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.filter-row::-webkit-scrollbar{display:none}
.ftab{white-space:nowrap;padding:8px 16px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;flex-shrink:0}
.ftab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ftab .n{display:inline-block;background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;margin-left:4px}

/* PRIORITY FILTER */
.pri-row{display:flex;gap:8px;padding:0 14px 10px}
.pri-btn{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;cursor:pointer;text-align:center}
.pri-btn.urgent.on{background:var(--red);color:#fff;border-color:var(--red)}
.pri-btn.normal.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pri-btn.done-btn.on{background:var(--green);color:#fff;border-color:var(--green)}

/* TASK CARDS */
.task-list{display:flex;flex-direction:column;gap:8px;padding:0 14px}
.tc{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(26,43,58,.05);border-left:5px solid transparent;cursor:pointer;transition:.1s}
.tc:active{transform:scale(.98)}
.tc.urgent{border-color:var(--red)}.tc.amber-border{border-color:var(--amber)}.tc.ok{border-color:var(--green)}.tc.done-card{opacity:.6;border-color:#ccc}
.tc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.tc-name{font-weight:700;font-size:14.5px;color:var(--navy);line-height:1.3;flex:1}
.tc.done-card .tc-name{text-decoration:line-through;color:#888}
.tc-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;white-space:nowrap;flex-shrink:0}
.tc-badge.red{background:#fde8e6;color:#b3261e}.tc-badge.amber{background:#fef3e8;color:#92600a}
.tc-badge.green{background:#e8f3ee;color:#2a6a4a}.tc-badge.grey{background:#f0f2f5;color:#4a5560}
.tc-meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12px;color:#7a8494}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px}
.pill-fire{background:#fff0e6;color:#c2410c}.pill-food{background:#f0fdf4;color:#166534}
.pill-water{background:#eff6ff;color:#1d4ed8}.pill-elec{background:#fdf4ff;color:#7e22ce}
.pill-asb{background:#fefce8;color:#854d0e}.pill-hs{background:#f0f2f5;color:#374151}
.pill-grey{background:#f0f2f5;color:#4a5560}
.tc-assign{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.av-0{background:#1a2b3a}.av-1{background:#2a6a4a}.av-2{background:#c78a3b}.av-3{background:#d0433b}.av-4{background:#20b2a2}.av-5{background:#7c3aed}.av-6{background:#be185d}

/* SECTION HEADING */
.sec-h{padding:14px 14px 6px;font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--navy)}
.sec-h span{font-size:13px;color:#7a8494;font-family:'Lato';font-weight:400;margin-left:6px}
.empty-msg{text-align:center;padding:40px 20px;color:#7a8494;font-size:14px}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0;cursor:pointer;border:none;background:none;color:#7a8494;font-size:11px;font-weight:600;gap:3px;transition:.1s}
.bnav-item.on{color:var(--navy)}.bnav-item .ico{font-size:20px}

/* MODAL / DETAIL SHEET */
.modal-bg{position:fixed;inset:0;background:rgba(16,29,51,.6);z-index:50;display:flex;align-items:flex-end}
.modal-sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}
.ms-handle{width:40px;height:4px;background:#e0e0e0;border-radius:2px;margin:0 auto 16px}
.ms-title{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--navy);margin-bottom:4px}
.ms-sub{font-size:13px;color:#7a8494;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--navy);letter-spacing:.4px;margin-bottom:5px;text-transform:uppercase}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;font-size:15px;font-family:inherit}
.field textarea{min-height:80px;resize:vertical}
.btn-row{display:flex;gap:10px;margin-top:6px}
.btn-p{flex:1;padding:15px;border-radius:12px;border:none;font:700 16px 'Lato';cursor:pointer}
.btn-complete{background:var(--green);color:#fff}
.btn-urgent{background:var(--red);color:#fff}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
/* photo upload */
.photo-area{border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center;cursor:pointer;margin-bottom:12px;color:#7a8494}
.photo-area:hover{border-color:var(--gold);color:var(--navy)}
.photo-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.photo-thumb{width:72px;height:72px;object-fit:cover;border-radius:8px}
/* priority badge */
.badge-urgent{display:inline-block;background:#fde8e6;color:#b3261e;font-size:11px;font-weight:700;padding:3px 10px;border-radius:8px}
.badge-done{display:inline-block;background:#e8f3ee;color:#2a6a4a;font-size:11px;font-weight:700;padding:3px 10px;border-radius:8px}
.done-info{background:#e8f3ee;border-radius:10px;padding:12px;font-size:13px;color:#2a6a4a;margin-bottom:10px}
/* REPORT view */
.report-wrap{padding:14px}
.rpt-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(26,43,58,.05)}
.rpt-name{font-weight:700;color:var(--navy);margin-bottom:6px}
.rpt-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid #f0f2f5}
.rpt-row:last-child{border:none}
.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom) + 8px);left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:rise .2s}
@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="logo">BRANDON HALL</div>
  <div class="sub">HOTEL AND SPA</div>
  <div class="title">Compliance &amp; Tasks</div>

  <select id="lg-name">
    <option value="">Select your name…</option>
  </select>
  <button class="login-btn" id="lg-btn" disabled>Sign in</button>
</div>

<!-- APP -->
<div id="app">

    <div class="brand">COMPLIANCE<small>BRANDON HALL</small></div>
    <button class="user-pill" id="tb-user">Glen ▾</button>
  </div>
  <div class="content" id="content">
  </div>
  <div class="bottom-nav">

    <button class="bnav-item" data-view="report" onclick="switchView('report')"><span class="ico">📊</span>Report</button>
  </div>
</div>

<!-- TASK DETAIL MODAL -->
<div class="modal-bg" id="modal" style="display:none">
  <div class="modal-sheet" id="modal-sheet">
    <div class="ms-handle"></div>
    <div id="modal-content"></div>
  </div>
</div>

const STAFF = ["Alia Taub", "Arun Manoharan", "Ashwath Kumar", "Glen", "Patrik Vlach", "Ruth Addison", "Veronica Webb"];

// State
let ME = null;
let VIEW = 'tasks';
let FILTER = 'all'; // all, urgent, mine, done
let STATE = JSON.parse(localStorage.getItem('bh_comp_state') || '{}');
// STATE[id] = { status:'done'|'urgent'|'normal', completedBy, completedAt, notes, evidence, assignees, photos, priority }

const today = new Date().toISOString().slice(0,10);
const parseDate = d => {
  if(!d) return null;
  if(d.includes('/')) { const p=d.split('/'); return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`; }
  return d;
};
const fmt = d => { const p=parseDate(d); return p ? new Date(p).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : 'No date'; };
const daysOD = d => { const p=parseDate(d); if(!p) return null; return Math.round((new Date(today)-new Date(p))/864e5); };
const AV_COLS = ['av-0','av-1','av-2','av-3','av-4','av-5','av-6'];
const initials = n => n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);

// Merge state into items
function itemState(item) {
  const s = STATE[item.id] || {};
  return {
    ...item,
    assignees: s.assignees || item.assignees,
    priority: s.priority || item.priority,
    notes: s.notes || item.notes || '',
    evidence: s.evidence || item.evidence || '',
    completedBy: s.completedBy || '',
    completedAt: s.completedAt || '',
    photos: s.photos || [],
    status: s.status || (item.status === 'overdue' ? 'overdue' : 'upcoming')
  };
}

function saveState(id, patch) {
  STATE[id] = Object.assign(STATE[id]||{}, patch);
  localStorage.setItem('bh_comp_state', JSON.stringify(STATE));
}

// LOGIN
STAFF.forEach(s => {
  const o = document.createElement('option');
  o.value = s; o.textContent = s;
  document.getElementById('lg-name').appendChild(o);
});
document.getElementById('lg-name').onchange = e => {
  document.getElementById('lg-btn').disabled = !e.target.value;
};
document.getElementById('lg-btn').onclick = () => {
  ME = document.getElementById('lg-name').value;
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('tb-user').textContent = ME + ' ▾';
  render();
};
document.getElementById('tb-user').onclick = () => {
  document.getElementById('login').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
};

// VIEW SWITCHING
function switchView(v) {
  VIEW = v;
  document.querySelectorAll('.bnav-item').forEach(b => b.classList.toggle('on', b.dataset.view===v));
  render();
}

function catPill(cat) {
  const map = {
    'Fire & Safety': 'pill-fire', 'Food Safety': 'pill-food',
    'Legionella & Water': 'pill-water', 'Electrical & PAT': 'pill-elec',
    'Asbestos': 'pill-asb', 'General H&S': 'pill-hs'
  };
  return `<span class="pill ${map[cat]||'pill-grey'}">${cat}</span>`;
}

function badgeCls(item) {
  if(item.status==='done') return {cls:'done-card', badge:'Done', bCls:'green'};
  const d = item.due || item.deadline;
  const od = daysOD(d);
  if(od !== null && od > 0) return {cls:'urgent', badge:`${od}d overdue`, bCls:'red'};
  if(od !== null && od > -14) return {cls:'amber-border', badge:'Due soon', bCls:'amber'};
  return {cls:'ok', badge:d?fmt(d):'No date', bCls:'grey'};
}

function renderCard(item, dk) {
  const s = itemState(item);
  const bc = badgeCls(s);
  const isMine = s.assignees.includes(ME);
  const avHTML = s.assignees.slice(0,4).map((a,i)=>`<div class="av ${AV_COLS[i%7]}" title="${a}">${initials(a)}</div>`).join('');
  return `<div class="tc ${bc.cls}" onclick="openTask('${item.id}','${dk}')">
    <div class="tc-head">
      <div class="tc-name">${s.name}</div>
      <div class="tc-badge ${bc.bCls}">${bc.badge}</div>
    </div>
    <div class="tc-meta">
      ${catPill(s.category||s.category||'General H&S')}
      ${s.type&&s.type!=='-'?`<span class="pill pill-grey">${s.type}</span>`:''}
      ${s.freq?`<span class="pill pill-grey">${s.freq}</span>`:''}
      ${s.linkedTo&&s.linkedTo!=='-'?`<span class="pill pill-grey">${s.linkedTo}</span>`:''}
      ${isMine?`<span class="pill" style="background:#e8edf3;color:#1a2b47">Mine</span>`:''}
      ${s.priority==='urgent'?`<span class="pill" style="background:#fde8e6;color:#b3261e">URGENT</span>`:''}
    </div>
    <div class="tc-assign" style="margin-top:8px">${avHTML}</div>
  </div>`;
}

function getItems(dk) {
  const source = dk==='due' ? ALL_TASKS : ALL_ACTIONS;
  return source.map(itemState);
}

function applyFilter(items) {
  if(FILTER==='mine') return items.filter(i=>i.assignees.includes(ME));
  if(FILTER==='urgent') return items.filter(i=>i.status!=='done'&&(i.priority==='urgent'||i.status==='overdue'));
  if(FILTER==='done') return items.filter(i=>i.status==='done');
  return items;
}

function renderTasksView() {
  const items = applyFilter(getItems('due'));
  const overdue = items.filter(i=>i.status!=='done'&&i.status==='overdue');
  const upcoming = items.filter(i=>i.status!=='done'&&i.status!=='overdue');
  const done = items.filter(i=>i.status==='done');

  const myOD = ALL_TASKS.map(itemState).filter(i=>i.assignees.includes(ME)&&i.status==='overdue'&&i.status!=='done').length;
  const myUp = ALL_TASKS.map(itemState).filter(i=>i.assignees.includes(ME)&&i.status!=='overdue'&&i.status!=='done').length;

  return `
    <div class="sum-strip">
      <div class="sum-c red"><div class="v">${overdue.length}</div><div class="k">Overdue</div></div>
      <div class="sum-c amber"><div class="v">${upcoming.length}</div><div class="k">Upcoming</div></div>
      <div class="sum-c green"><div class="v">${done.length}</div><div class="k">Done</div></div>
    </div>
    <div class="filter-row">
      <button class="ftab ${FILTER==='all'?'on':''}" onclick="setFilter('all')">All tasks</button>
      <button class="ftab ${FILTER==='mine'?'on':''}" onclick="setFilter('mine')">My tasks <span class="n">${myOD+myUp}</span></button>
      <button class="ftab ${FILTER==='urgent'?'on':''}" onclick="setFilter('urgent')">Urgent <span class="n">${overdue.length}</span></button>
      <button class="ftab ${FILTER==='done'?'on':''}" onclick="setFilter('done')">Completed</button>
    </div>
    ${overdue.length?`<div class="sec-h">Overdue <span>${overdue.length}</span></div><div class="task-list">${overdue.map(i=>renderCard(i,'due')).join('')}</div>`:''}
    ${upcoming.length?`<div class="sec-h">Upcoming <span>${upcoming.length}</span></div><div class="task-list">${upcoming.map(i=>renderCard(i,'due')).join('')}</div>`:''}
    ${done.length?`<div class="sec-h">Completed <span>${done.length}</span></div><div class="task-list">${done.map(i=>renderCard(i,'due')).join('')}</div>`:''}
    ${!items.length?`<div class="empty-msg">No tasks match this filter.</div>`:''}`;
}

function renderActionsView() {
  const items = applyFilter(getItems('deadline'));
  const overdue = items.filter(i=>i.status!=='done'&&i.status==='overdue');
  const nodead = items.filter(i=>i.status!=='done'&&!i.deadline);
  const upcoming = items.filter(i=>i.status!=='done'&&i.deadline&&i.status!=='overdue');
  const done = items.filter(i=>i.status==='done');

  const myOD = ALL_ACTIONS.map(itemState).filter(i=>i.assignees.includes(ME)&&i.status==='overdue').length;

  return `
    <div class="sum-strip">
      <div class="sum-c red"><div class="v">${overdue.length}</div><div class="k">Overdue</div></div>
      <div class="sum-c amber"><div class="v">${nodead.length+upcoming.length}</div><div class="k">Outstanding</div></div>
      <div class="sum-c green"><div class="v">${done.length}</div><div class="k">Done</div></div>
    </div>
    <div class="filter-row">
      <button class="ftab ${FILTER==='all'?'on':''}" onclick="setFilter('all')">All actions</button>
      <button class="ftab ${FILTER==='mine'?'on':''}" onclick="setFilter('mine')">Mine <span class="n">${myOD}</span></button>
      <button class="ftab ${FILTER==='urgent'?'on':''}" onclick="setFilter('urgent')">Urgent <span class="n">${overdue.length}</span></button>
      <button class="ftab ${FILTER==='done'?'on':''}" onclick="setFilter('done')">Completed</button>
    </div>
    ${overdue.length?`<div class="sec-h">Overdue <span>${overdue.length}</span></div><div class="task-list">${overdue.map(i=>renderCard(i,'deadline')).join('')}</div>`:''}
    ${nodead.length?`<div class="sec-h">No deadline set <span>${nodead.length}</span></div><div class="task-list">${nodead.map(i=>renderCard(i,'deadline')).join('')}</div>`:''}
    ${upcoming.length?`<div class="sec-h">Upcoming <span>${upcoming.length}</span></div><div class="task-list">${upcoming.map(i=>renderCard(i,'deadline')).join('')}</div>`:''}
    ${done.length?`<div class="sec-h">Completed <span>${done.length}</span></div><div class="task-list">${done.map(i=>renderCard(i,'deadline')).join('')}</div>`:''}
    ${!items.length?`<div class="empty-msg">No actions match.</div>`:''}`;
}

function renderReportView() {
  // Per-person summary
  const allItems = [...ALL_TASKS.map(i=>itemState(i)), ...ALL_ACTIONS.map(i=>itemState(i))];
  const doneItems = allItems.filter(i=>i.status==='done');
  const overdueItems = allItems.filter(i=>i.status==='overdue'&&i.status!=='done');

  let staffRows = STAFF.map(s=>{
    const mine = allItems.filter(i=>i.assignees.includes(s));
    const myDone = mine.filter(i=>i.status==='done');
    const myOD = mine.filter(i=>i.status==='overdue'&&i.status!=='done');
    return {s, total:mine.length, done:myDone.length, overdue:myOD.length};
  }).filter(r=>r.total>0);

  return `<div class="report-wrap">
    <div class="rpt-card">
      <div class="rpt-name" style="font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--navy)">Overall Status</div>
      <div class="rpt-row"><span>Total items</span><span>${allItems.length}</span></div>
      <div class="rpt-row"><span style="color:var(--red)">Overdue</span><span style="color:var(--red);font-weight:700">${overdueItems.length}</span></div>
      <div class="rpt-row"><span style="color:var(--green)">Completed this session</span><span style="color:var(--green);font-weight:700">${doneItems.length}</span></div>
    </div>
    ${staffRows.map(r=>`<div class="rpt-card">
      <div class="rpt-name">${r.s}</div>
      <div class="rpt-row"><span>Assigned</span><span>${r.total}</span></div>
      <div class="rpt-row"><span style="color:var(--red)">Overdue</span><span style="color:var(--red);font-weight:700">${r.overdue}</span></div>
      <div class="rpt-row"><span style="color:var(--green)">Completed</span><span style="color:var(--green);font-weight:700">${r.done}</span></div>
    </div>`).join('')}
    ${doneItems.length?`<div class="rpt-card">
      <div class="rpt-name">Completed items</div>
      ${doneItems.map(i=>`<div class="rpt-row"><span>${i.name}</span><span>${i.completedBy||'—'} ${i.completedAt?'· '+fmt(i.completedAt):''}</span></div>`).join('')}
    </div>`:'<div class="rpt-card"><div style="color:#7a8494;font-size:14px">No items completed yet. Complete tasks and actions to see the report.</div></div>'}
    <button onclick="exportReport()" style="width:100%;margin-top:10px;padding:14px;border-radius:12px;border:1px solid var(--line);background:#fff;font:600 15px 'Lato';cursor:pointer">Export report as text</button>
  </div>`;
}

function render() {
  let html = '';
  if(VIEW==='tasks') html = renderTasksView();
  else if(VIEW==='actions') html = renderActionsView();
  else html = renderReportView();
  document.getElementById('content').innerHTML = html;
}

function setFilter(f) {
  FILTER = f; render();
}

// TASK DETAIL MODAL
let currentItem = null, currentDk = null;
function openTask(id, dk) {
  const source = dk==='due' ? ALL_TASKS : ALL_ACTIONS;
  const item = source.find(i=>i.id===id);
  if(!item) return;
  currentItem = itemState(item);
  currentDk = dk;
  const s = currentItem;
  const isDone = s.status==='done';
  const d = s[dk];

  document.getElementById('modal-content').innerHTML = `
    <div class="ms-title">${s.name}</div>
    <div class="ms-sub">${s.category||''} ${s.type&&s.type!=='-'?'· '+s.type:''} ${d?'· Due: '+fmt(d):''}</div>
    ${isDone?`<div class="done-info">&#10003; Completed by ${s.completedBy} on ${fmt(s.completedAt)}<br>${s.evidence?'Evidence: '+s.evidence:''}</div>`:''}
    ${s.notes&&!isDone?`<div style="background:#f5f7f9;border-radius:10px;padding:10px;font-size:13px;color:#4a5560;margin-bottom:12px">${s.notes}</div>`:''}

    <div class="field">
      <label>Assigned to</label>
      <div style="display:flex;flex-wrap:wrap;gap:6px;padding:10px 0">
        ${STAFF.map(st=>`<label style="display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer">
          <input type="checkbox" value="${st}" ${s.assignees.includes(st)?'checked':''} onchange="toggleAssignee('${id}','${st}',this.checked)">
          ${st.split(' ')[0]}
        </label>`).join('')}
      </div>
    </div>

    <div class="field">
      <label>Priority</label>
      <div style="display:flex;gap:8px">
        <button onclick="setPriority('${id}','urgent')" style="flex:1;padding:11px;border-radius:10px;border:1px solid ${s.priority==='urgent'?'var(--red)':'var(--line)'};background:${s.priority==='urgent'?'#fde8e6':'#fff'};color:${s.priority==='urgent'?'var(--red)':'var(--ink)'};font-weight:700;cursor:pointer">URGENT</button>
        <button onclick="setPriority('${id}','high')" style="flex:1;padding:11px;border-radius:10px;border:1px solid ${s.priority==='high'?'var(--amber)':'var(--line)'};background:${s.priority==='high'?'#fef3e8':'#fff'};color:${s.priority==='high'?'var(--amber)':'var(--ink)'};font-weight:700;cursor:pointer">HIGH</button>
        <button onclick="setPriority('${id}','normal')" style="flex:1;padding:11px;border-radius:10px;border:1px solid ${s.priority==='normal'?'var(--navy)':'var(--line)'};background:${s.priority==='normal'?'var(--navy)':'#fff'};color:${s.priority==='normal'?'#fff':'var(--ink)'};font-weight:700;cursor:pointer">NORMAL</button>
      </div>
    </div>

    <div class="field"><label>Notes / update</label>
      <textarea id="t-notes" placeholder="Add notes, contractor name, reference...">${s.notes||''}</textarea></div>

    ${!isDone?`
    <div class="field"><label>Evidence reference</label>
      <input id="t-evidence" placeholder="e.g. Saeker ref, certificate number, contractor invoice" value="${s.evidence||''}"></div>

    <div class="field"><label>Photo evidence</label>
      <div class="photo-area" onclick="document.getElementById('photo-inp-${id}').click()">
        Tap to add photo
      </div>
      <input type="file" id="photo-inp-${id}" accept="image/*" capture="environment" style="display:none" onchange="addPhoto('${id}',this)">
      <div class="photo-thumbs" id="thumbs-${id}">
        ${(s.photos||[]).map(p=>`<img class="photo-thumb" src="${p}">`).join('')}
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-p btn-complete" onclick="markDone('${id}')">&#10003; Mark complete</button>
    </div>`:`<div class="btn-row">
      <button class="btn-p btn-ghost" onclick="undoDone('${id}')">Undo completion</button>
    </div>`}
    <button class="btn-p btn-ghost" onclick="closeModal()" style="width:100%;margin-top:8px">Close</button>`;

  document.getElementById('modal').style.display = 'flex';
}

function closeModal() { document.getElementById('modal').style.display='none'; currentItem=null; }
document.getElementById('modal').onclick = e => { if(e.target===document.getElementById('modal')) closeModal(); };

function toggleAssignee(id, person, checked) {
  const item = itemState([...ALL_TASKS,...ALL_ACTIONS].find(i=>i.id===id));
  let assignees = [...item.assignees];
  if(checked&&!assignees.includes(person)) assignees.push(person);
  if(!checked) assignees = assignees.filter(a=>a!==person);
  saveState(id, {assignees});
  toast(`${checked?'Added':'Removed'}: ${person.split(' ')[0]}`);
}

function setPriority(id, p) {
  saveState(id, {priority:p});
  openTask(id, currentDk); // refresh modal
  render();
}

function addPhoto(id, inp) {
  const file = inp.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const st = STATE[id]||{};
    const photos = [...(st.photos||[]), e.target.result];
    saveState(id, {photos});
    const thumbs = document.getElementById('thumbs-'+id);
    if(thumbs){ const img=document.createElement('img'); img.className='photo-thumb'; img.src=e.target.result; thumbs.appendChild(img); }
    toast('Photo added');
  };
  reader.readAsDataURL(file);
}

function markDone(id) {
  const notes = document.getElementById('t-notes')?.value||'';
  const evidence = document.getElementById('t-evidence')?.value||'';
  saveState(id, {status:'done', completedBy:ME, completedAt:today, notes, evidence});
  closeModal(); render();
  toast('Marked complete ✓');
}

function undoDone(id) {
  const st = STATE[id]||{};
  delete st.status; delete st.completedBy; delete st.completedAt;
  STATE[id] = st;
  localStorage.setItem('bh_comp_state', JSON.stringify(STATE));
  closeModal(); render();
}

function exportReport() {
  const allItems = [...ALL_TASKS.map(itemState),...ALL_ACTIONS.map(itemState)];
  const done = allItems.filter(i=>i.status==='done');
  let txt = 'BRANDON HALL COMPLIANCE REPORT\n';
  txt += new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})+'\n\n';
  txt += `COMPLETED ITEMS (${done.length})\n${'='.repeat(40)}\n`;
  done.forEach(i=>{txt+=`\n${i.name}\nCompleted by: ${i.completedBy} on ${i.completedAt}\nEvidence: ${i.evidence||'None noted'}\nNotes: ${i.notes||'None'}\n`;});
  const od = allItems.filter(i=>i.status==='overdue'&&i.status!=='done');
  txt += `\nSTILL OUTSTANDING - OVERDUE (${od.length})\n${'='.repeat(40)}\n`;
  od.forEach(i=>{txt+='\n'+i.name+' — '+fmt(i.due||i.deadline)+'\n';});
  const el=document.createElement('a'); el.href='data:text/plain;charset=utf-8,'+encodeURIComponent(txt);
  el.download='Brandon_Hall_Compliance_Report_'+today+'.txt'; el.click();
}

function toast(msg) {
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2000);
}

// Init — check if already logged in this session
const savedUser = sessionStorage.getItem('bh_comp_user');
if(savedUser){ ME=savedUser; document.getElementById('login').style.display='none'; document.getElementById('app').style.display='flex'; document.getElementById('tb-user').textContent=ME+' ▾'; render(); }
// Save user to session
document.getElementById('lg-btn').addEventListener('click', ()=>{ sessionStorage.setItem('bh_comp_user', ME); }, true);
</script>
</body>
</html>
