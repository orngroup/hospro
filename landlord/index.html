<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Brandon Hall Hotel and Spa — Landlord documents</title>
<link rel="icon" href="../assets/favicon.png">
<style>
:root{--navy:#1F3448;--navy2:#2C3E50;--gold:#BB9979;--cream:#F7F3EC;--ink:#1B2733;--muted:#5F6B78;--line:#E2DCD1;--ok:#1E7A4C;--okbg:#E4F2EA;--amb:#9A6200;--ambbg:#FDF1DC;--red:#A8322D;--redbg:#FBE9E7}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.hide{display:none!important}
header{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold)}
.hin{max-width:1060px;margin:0 auto;padding:18px 20px;display:flex;align-items:center;gap:16px}
.hin img{height:54px;background:#fff;border-radius:8px;padding:4px 8px}
.hin h1{font-size:20px;margin:0;font-weight:700}.hin small{display:block;color:#D9CDBB;font-size:13px}
.hin .sp{flex:1}
.hin button{background:transparent;border:1px solid #8193A6;color:#fff;border-radius:8px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
main{max-width:1060px;margin:0 auto;padding:22px 20px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px}
h2{font-size:20px;color:var(--navy);margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--gold)}
h3{font-size:16px;color:var(--navy2);margin:16px 0 6px}
p{margin:0 0 10px}.muted{color:var(--muted);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;background:#F2EDE4;color:var(--navy);padding:9px 10px;font-weight:700;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tw{overflow-x:auto}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.ok{background:var(--okbg);color:var(--ok)}.amb{background:var(--ambbg);color:var(--amb)}.red{background:var(--redbg);color:var(--red)}.grey{background:#EEF0F2;color:#56606B}
.tbc{background:var(--ambbg);color:var(--amb);border-radius:6px;padding:1px 8px;font-size:13px;font-weight:700;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.tile{background:#fff;border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:10px;padding:14px 16px}
.tile b{display:block;color:var(--navy);font-size:15px}.tile span{font-size:14px;color:var(--muted)}
.btn{display:inline-block;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.doc{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.doc:last-child{border-bottom:none}
.doc .t{flex:1}.doc .t b{display:block;font-size:15px}
.pre{white-space:pre-wrap}
nav.toc{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
nav.toc a{background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:13.5px;color:var(--navy);text-decoration:none}
.lock{max-width:420px;margin:60px auto;text-align:center}
.lock img{height:90px}
.lock input{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:18px;text-align:center;letter-spacing:.2em;margin:14px 0 10px}
.lock .btn{width:100%;padding:13px;font-size:16px}
.err{color:var(--red);font-weight:600;margin-top:10px;min-height:22px}
.hero{border-top:5px solid var(--gold)}
.letter{background:var(--cream);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.tile{position:relative}.tile .tn{font-size:28px;font-weight:800;color:var(--navy);line-height:1.1;margin-bottom:4px}
.tile.g{border-left-color:var(--ok)}.tile.a{border-left-color:#D9A030}
.rq{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.rq:last-of-type{border-bottom:none}
.rq .ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}.rq .ic.ok{background:var(--okbg);color:var(--ok)}.rq .ic.amb{background:var(--ambbg);color:var(--amb)}
.rq a{text-decoration:none}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.step:last-child{border-bottom:none}
.step .sn{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 28px}
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 16px;margin-top:8px}
.kv>span{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}.kv div{font-size:14.5px}
.alt{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;background:#FDFCF9}
.alt .ah{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
details.more{margin:6px 0 14px}details.more summary,details.grp summary{cursor:pointer;font-weight:700;color:var(--navy);padding:6px 0}
details.grp{border-top:1px solid var(--line);padding:4px 0}details.grp summary{font-size:16px}
.row2{display:flex;gap:12px;align-items:center;margin-bottom:8px}.row2 input{flex:1;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font:inherit}
@media print{.row2{display:none!important}details summary{list-style:none}}
footer{max-width:1060px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:13px}
@media (max-width:640px){.hin{flex-wrap:wrap}.hin img{height:42px}.card{padding:16px}td,th{padding:8px 6px}.doc{flex-wrap:wrap}}
@media print{header button,.noprint,nav.toc{display:none!important}body{background:#fff}.card{border:none;padding:0 0 10px;break-inside:auto}.doc .btn{display:none}a[href^=http]::after{content:" (" attr(href) ")";font-size:9px;color:#777;word-break:break-all}}
</style>
</head>
<body>
<header><div class="hin"><img src="../assets/marketing/logos/logo-blue-crop.png" alt="Brandon Hall"><div><h1>Brandon Hall Hotel and Spa</h1><small>Compliance documents for the landlord</small></div><div class="sp"></div><button id="pr" class="hide">Print / save as PDF</button><button id="lk" class="hide">Lock</button></div></header>

<main id="app">
  <div class="card lock">
    <img src="../assets/marketing/logos/logo-blue-crop.png" alt="">
    <h2 style="border:none;text-align:center;margin-bottom:4px">Secure documents</h2>
    <p class="muted">This page contains documents shared with the landlord of Brandon Hall Hotel and Spa. Please enter the password you were given.</p>
    <input id="pw" type="password" autocomplete="off" inputmode="text" placeholder="Password" autofocus>
    <button class="btn" id="go">Open</button>
    <div class="err" id="e"></div>
  </div>
</main>
<footer id="ft" class="hide"></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(() => {
  // Public web config only (no logins). Data is read from hosfire_share/<key>.
  const CFG = { apiKey: "AIzaSyDnPWrPGInDRTCF1Go710XC_8_77l_72i0", authDomain: "brandonhall-7bdef.firebaseapp.com", projectId: "brandonhall-7bdef", storageBucket: "brandonhall-7bdef.firebasestorage.app", messagingSenderId: "391317900568", appId: "1:391317900568:web:643c9d6691f7f16d65226d" };
  const SALT = "brandonhall-landlord-v1", ITER = 150000, DEMO = /[?&]demo=1/.test(location.search);
  const $ = (s) => document.querySelector(s);
  const h = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const MON = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const fd = (s) => { if (!s) return ""; const [y, m, d] = String(s).slice(0, 10).split("-"); return `${+d} ${MON[+m - 1]} ${y}`; };
  const tbc = (v, fmt) => (v && String(v).trim() ? (fmt ? fmt(v) : h(v)) : '<span class="tbc">To be confirmed</span>');
  const para = (v) => (v && v.trim() ? `<p class="pre">${h(v)}</p>` : '<p><span class="tbc">To be confirmed</span></p>');
  const st = (s) => { const c = { OK: "ok", Completed: "ok", "Due soon": "amb", "In progress": "amb", Booked: "amb", Overdue: "red", "Not started": "grey", "No date": "grey" }[s] || "grey"; return `<span class="pill ${c}">${h(s === "No date" ? "Date to be confirmed" : s)}</span>`; };
  const safeUrl = (u) => (/^https:\/\/firebasestorage\.googleapis\.com\//.test(u) || u === "#demo-file" ? u : "");

  async function keyOf(pw) {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey("raw", enc.encode(pw.trim()), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: enc.encode(SALT), iterations: ITER, hash: "SHA-256" }, base, 256);
    return Array.from(new Uint8Array(bits)).map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  async function fetchPack(key) {
    if (DEMO) { const all = JSON.parse(localStorage.getItem("hosfire_share_demo") || "{}"); return all[key] || null; }
    firebase.apps.length || firebase.initializeApp(CFG);
    const d = await firebase.firestore().collection("hosfire_share").doc(key).get();
    return d.exists ? d.data() : null;
  }

  $("#pw").onkeydown = (e) => { if (e.key === "Enter") $("#go").click(); };
  $("#go").onclick = async () => {
    const pw = $("#pw").value; if (!pw.trim()) return;
    $("#go").disabled = true; $("#go").textContent = "Checking…"; $("#e").textContent = "";
    try {
      const doc = await fetchPack(await keyOf(pw));
      if (!doc || doc.kind !== "landlord") { $("#e").textContent = "That password is not right, or the page has been withdrawn."; return; }
      show(JSON.parse(doc.json));
    } catch (err) { $("#e").textContent = "Could not open the documents. Please try again."; }
    finally { const g = $("#go"); if (g) { g.disabled = false; g.textContent = "Open"; $("#pw").value = ""; } }
  };
  $("#lk").onclick = () => location.reload();
  $("#pr").onclick = () => window.print();

  function show(P) {
    $("#pr").classList.remove("hide"); $("#lk").classList.remove("hide");
    const docs = P.docs || [], groups = (P.groups || []).filter((g) => docs.some((d) => d.group === g));
    const works = (P.works || []).filter((w) => w.work), alts = (P.alts || []).filter((a) => a.what), certs = P.certs || [];
    const req = P.requested || [], reqDone = req.filter((r) => r.n).length;
    const cnt = (s) => certs.filter((c) => c.status === s).length, worksDone = works.filter((w) => w.status === "Completed").length;
    const aps = P.aps || [], apDoor = aps.filter((a) => a.door);
    const tile = (n, label, sub, cls) => `<div class="tile ${cls || ""}"><div class="tn">${n}</div><b>${label}</b><span>${sub}</span></div>`;
    const kv = (k, v) => `<div class="kv"><span>${k}</span><div>${v}</div></div>`;
    const link = (u, t) => { const x = safeUrl(u); return x ? `<a class="btn" href="${h(x)}" target="_blank" rel="noopener noreferrer">${t || "View / download"}</a>` : ""; };
    $("#app").innerHTML = `
    <div class="card hero"><h2 style="border:none;padding:0;margin-bottom:4px">Compliance documents and response</h2>
      <p class="muted" style="margin-bottom:12px">${h(P.hotel)}, ${h(P.address)}${P.addressee ? ` · Prepared for ${h(P.addressee)}` : ""} · Last updated ${fd(new Date(P.publishedAt).toISOString())}</p>
      ${P.noticeDate || P.noticeFrom ? `<div class="letter"><b>Your letter</b> ${tbc(P.noticeDate, fd)}${P.noticeFrom ? ` from ${h(P.noticeFrom)}` : ""}${P.deadline ? `<span class="pill amb" style="margin-left:8px">20 working days: ${fd(P.deadline)}</span>` : ""}</div>` : ""}
      <p class="pre">${h(P.intro)}</p></div>
    <div class="grid">
      ${tile(`${reqDone}/${req.length}`, "Documents requested", reqDone === req.length ? "All provided" : `${req.length - reqDone} to follow`, reqDone === req.length ? "g" : "a")}
      ${tile(certs.length, "Certificates", `${cnt("OK")} in date · ${cnt("Due soon")} due soon · ${cnt("Overdue")} overdue`, cnt("Overdue") ? "a" : "g")}
      ${tile(`${worksDone}/${works.length}`, "Wi-Fi remedial works", worksDone === works.length && works.length ? "Complete" : "In progress — see section 2", worksDone === works.length && works.length ? "g" : "a")}
      ${tile(docs.length, "Documents to download", `${groups.length} sections — see section 5`, "")}
    </div>
    <nav class="toc"><a href="#req">1. Documents requested</a><a href="#wifi">2. Wi-Fi access points</a><a href="#alts">3. Alterations</a><a href="#certs">4. Certificates</a><a href="#lib">5. Document library</a><a href="#contact">6. Contact</a></nav>

    <div class="card" id="req"><h2>1. Documents you requested</h2>
      ${req.map((r) => `<div class="rq"><span class="ic ${r.n ? "ok" : "amb"}">${r.n ? "✓" : "…"}</span><div style="flex:1"><b>${h(r.label)}</b></div>${r.n ? `<a href="#g-${slug(r.group)}" class="muted">${r.n} document${r.n > 1 ? "s" : ""} in section 5 →</a>` : '<span class="pill amb">To follow</span>'}</div>`).join("")}
      <p class="muted" style="margin-top:10px">The fire risk assessment (${fd(P.fra.date)}, ${h(P.fra.assessor)}${P.fra.rev ? `, ${h(P.fra.rev)}` : ""}) is next reviewed ${fd(P.fra.review)}. The hotel's Fire Safety Order inspection by ${h(P.inspection.body)} took place on ${fd(P.inspection.date)}.</p></div>

    <div class="card" id="wifi"><h2>2. Wi-Fi access points and the riser fire doors</h2>
      <h3>What was installed</h3>${para(P.wifiFacts)}
      ${apDoor.length ? `<h3>Access points fixed to doors</h3><div class="tw"><table><tr><th>Floor</th><th>Block</th><th>Location</th><th>Mounting</th></tr>${apDoor.map((a) => `<tr style="background:var(--redbg)"><td>${h(a.floor)}</td><td>${h(a.block)}</td><td>${h(a.loc)}</td><td>${h(a.mount)} <span class="pill red">To be relocated</span></td></tr>`).join("")}</table></div>` : ""}
      ${aps.length ? `<details class="more"><summary>Show all ${aps.length} access point locations</summary><p class="muted">${h(P.apSrc)}</p><div class="tw"><table><tr><th>Floor</th><th>Block</th><th>Location</th><th>Mounting</th></tr>${aps.map((a) => `<tr${a.door ? ' style="background:var(--redbg)"' : ""}><td>${h(a.floor)}</td><td>${h(a.block)}</td><td>${h(a.loc)}</td><td>${h(a.mount)}</td></tr>`).join("")}</table></div></details>` : ""}
      <h3>Our response</h3>${para(P.wifiResponse)}
      <h3>Remedial works and timetable</h3>
      ${works.map((w, i) => `<div class="step"><div class="sn">${i + 1}</div><div style="flex:1"><b>${h(w.work)}</b><div class="kvs">${kv("Contractor", tbc(w.contractor))}${kv("Target date", tbc(w.target, fd))}${kv("Evidence", tbc(w.evidence))}</div></div><div>${st(w.status || "Not started")}</div></div>`).join("") || '<p><span class="tbc">To be confirmed</span></p>'}</div>

    <div class="card" id="alts"><h2>3. Alterations since 1 December 2025 and consents</h2>
      ${alts.map((a) => `<div class="alt"><div class="ah"><b>${h(a.what)}</b>${a.status ? `<span class="pill ${/install|complet/i.test(a.status) ? "ok" : "grey"}">${h(a.status)}</span>` : '<span class="tbc">Status to be confirmed</span>'}</div>
        <div class="kvs">${kv("Date", tbc(a.date, fd))}${kv("Contractor", tbc(a.contractor))}${kv("Consent sought / relied on", tbc(a.consent))}</div>
        <div class="kv" style="margin-top:8px"><span>Certificates and approvals</span><div class="pre">${tbc(a.cert)}</div></div></div>`).join("")}
      <h3>Consents</h3>${para(P.consents)}</div>

    <div class="card" id="certs"><h2>4. Certificates and servicing</h2>
      <div class="tw"><table><tr><th>Certificate / service</th><th>Contractor</th><th>Last done</th><th>Next due</th><th>Status</th><th></th></tr>
      ${certs.map((c) => `<tr><td><b>${h(c.name)}</b>${c.certRef ? `<div class="muted">${h(c.certRef)}</div>` : ""}</td><td>${tbc(c.contractor)}</td><td>${tbc(c.last, fd)}</td><td>${c.next ? fd(c.next) : "—"}</td><td>${st(c.status)}${c.booked ? `<div class="muted" style="margin-top:4px">Booked: ${fd(c.booked)}</div>` : ""}${c.note ? `<div class="muted" style="margin-top:4px">${h(c.note)}</div>` : ""}</td><td>${link(c.url, "View")}</td></tr>`).join("")}</table></div></div>

    <div class="card" id="lib"><h2>5. Document library</h2>
      <div class="row2"><input id="q" placeholder="Search documents…"><span class="muted" id="qn">${docs.length} documents</span></div>
      ${groups.map((g) => `<details class="grp" id="g-${slug(g)}" open><summary>${h(g)} <span class="muted">(${docs.filter((d) => d.group === g).length})</span></summary>
        ${docs.filter((d) => d.group === g).map((d) => `<div class="doc" data-t="${h((d.title + " " + g).toLowerCase())}"><div class="t"><b>${h(d.title)}</b><span class="muted">${[d.date ? fd(d.date) : "", d.version, d.issuer].filter(Boolean).map(h).join(" · ")}</span></div>${link(d.url)}</div>`).join("")}</details>`).join("") || '<p><span class="tbc">Documents to follow</span></p>'}</div>

    <div class="card" id="contact"><h2>6. Contact</h2>${para(P.contact)}</div>`;
    const q = $("#q"); if (q) q.oninput = () => { const v = q.value.trim().toLowerCase(); let n = 0; document.querySelectorAll(".doc").forEach((e) => { const m = !v || e.dataset.t.includes(v); e.style.display = m ? "" : "none"; if (m) n++; }); document.querySelectorAll("details.grp").forEach((g) => { g.style.display = Array.from(g.querySelectorAll(".doc")).some((e) => e.style.display !== "none") ? "" : "none"; if (v) g.open = true; }); $("#qn").textContent = `${n} document${n === 1 ? "" : "s"}`; };
    window.addEventListener("beforeprint", () => document.querySelectorAll("details").forEach((x) => (x.open = true)));
    $("#ft").classList.remove("hide");
    $("#ft").innerHTML = `Confidential — shared with the landlord of ${h(P.hotel)}. Please do not forward this page or the password. Prepared by ${h(P.preparedBy)}.`;
    window.scrollTo(0, 0);
  }
  const slug = (x) => String(x).toLowerCase().replace(/[^a-z0-9]+/g, "-");
})();
</script>
</body>
</html>
