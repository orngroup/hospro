<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rota Approvals — HosPRO</title>
<style>
:root{--navy:#1a2b3a;--teal:#2B726A;--line:#e3e8ee;--muted:#5b6b7b;--amber:#b06a00;--green:#1d7a4d;--red:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Lato,Arial,sans-serif;background:#eef1f5;color:var(--navy)}
.top{background:var(--navy);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:12px}
.top .logo{font-weight:900;letter-spacing:.5px}
.wrap{max-width:1040px;margin:0 auto;padding:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(26,43,58,.08);margin-bottom:14px}
h1{font-size:21px;margin:0 0 4px} .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
label.fl{display:block;font:800 11px Lato;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;outline:none}
.pin{letter-spacing:8px;text-align:center;font-size:22px}
button{border:none;border-radius:11px;padding:12px;font:800 14px Lato;cursor:pointer}
.go{background:var(--teal);color:#fff;width:100%}
.err{color:var(--red);font-size:13px;min-height:16px;margin-top:8px}
.hide{display:none}
.draft-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{border-radius:999px;padding:4px 11px;font:800 12px Lato}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-top:12px}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{border-bottom:1px solid var(--line);padding:6px;font-size:12px;text-align:center}
th{background:#f5f7f9;font-weight:800;position:sticky;top:0}
td.name,th.name{text-align:left;position:sticky;left:0;background:#fff;min-width:150px;font-weight:700}
th.name{background:#f5f7f9}
.chg{background:#fff3cd;color:#8a6100;font-weight:800;border-radius:6px;padding:2px 4px;display:inline-block}
.same{color:#64748b}
.foot{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.foot button{flex:1;min-width:150px}
.approve{background:var(--green);color:#fff} .reject{background:#fff;border:1px solid var(--red);color:var(--red)}
.msg{font-size:13px;min-height:16px;margin-top:8px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
</style></head><body>
<div class="top"><span class="logo">HosPRO</span><span>· Rota Approvals</span></div>
<div class="wrap">

  <div class="card" id="login">
    <h1>Rota approvals</h1>
    <p class="sub">For Veronica, Alia &amp; Ajay. Enter the approver code.</p>
    <label class="fl">Approver code</label>
    <input id="code" class="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="err" id="login-err"></div>
    <button class="go" onclick="doLogin()">Log in</button>
  </div>

  <div class="hide" id="board">
    <div class="card">
      <div class="draft-h"><h1 style="margin:0">Submitted department rotas</h1>
        <button onclick="loadDrafts()" style="margin-left:auto;background:#f3f5f8;border:1px solid var(--line);color:var(--navy);padding:8px 14px">↻ Refresh</button></div>
      <p class="sub" style="margin-top:6px">Review each department, then approve to push it live. Approving updates the live rota and every staff link instantly.</p>
    </div>
    <div id="list"></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const APPROVER_CODE='7777';
var db=null; try{ if(!firebase.apps.length) firebase.initializeApp(firebaseConfig); db=firebase.firestore(); }catch(e){}
var $=id=>document.getElementById(id);
var LIVE=null, DRAFTS=[];
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function dkToDate(k){ try{ return new Date(k+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric'}); }catch(e){ return k; } }
function fmtWhen(iso){ if(!iso) return ''; try{ return new Date(iso).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function liveShift(k,id){ var c=LIVE&&LIVE.rota&&LIVE.rota[k]&&LIVE.rota[k][id]; return (c&&typeof c==='object')?(c.shift||'off'):(c||'off'); }
function nm(id){ var s=(LIVE.staff||[]).find(x=>x.id===id); return s?s.name:id; }
function roleOf(id){ var s=(LIVE.staff||[]).find(x=>x.id===id); return s?(s.role||''):''; }

async function doLogin(){
  if(($('code').value||'').trim()!==APPROVER_CODE){ $('login-err').textContent='Incorrect code.'; $('code').value=''; return; }
  $('login').classList.add('hide'); $('board').classList.remove('hide');
  await loadDrafts();
}
async function loadDrafts(){
  $('list').innerHTML='<div class="card"><div class="empty">Loading…</div></div>';
  if(!db){ $('list').innerHTML='<div class="card"><div class="empty">Offline.</div></div>'; return; }
  try{
    var rs=await db.collection('hospro_public').doc('rota').get();
    LIVE=rs.exists?(rs.data()||{}):{staff:[],rota:{}};
    var ds=await db.collection('rota_drafts').get();
    DRAFTS=[]; ds.forEach(d=>{ var v=d.data(); if(v && v.status==='submitted'){ v._id=d.id; DRAFTS.push(v); } });
  }catch(e){ $('list').innerHTML='<div class="card"><div class="empty">Could not load — check connection.</div></div>'; return; }
  if(!DRAFTS.length){ $('list').innerHTML='<div class="card"><div class="empty">No department rotas waiting for approval.</div></div>'; return; }
  DRAFTS.sort((a,b)=>(a.week||'').localeCompare(b.week||'')||(a.deptName||'').localeCompare(b.deptName||''));
  $('list').innerHTML=DRAFTS.map((d,i)=>renderDraft(d,i)).join('');
}
function countChanges(d){ var c=0, dates=Object.keys(d.shifts||{}); var ids={}; dates.forEach(k=>Object.keys(d.shifts[k]||{}).forEach(id=>ids[id]=1));
  dates.forEach(k=>Object.keys(ids).forEach(id=>{ if(String(d.shifts[k][id]||'off')!==String(liveShift(k,id))) c++; })); return c; }
function renderDraft(d,i){
  var dates=Object.keys(d.shifts||{}).sort();
  var ids={}; dates.forEach(k=>Object.keys(d.shifts[k]||{}).forEach(id=>ids[id]=1));
  var idList=Object.keys(ids).sort((a,b)=>nm(a).localeCompare(nm(b)));
  var nChg=countChanges(d);
  var head='<tr><th class="name">Team member</th>'+dates.map(k=>'<th>'+dkToDate(k)+'</th>').join('')+'</tr>';
  var body=idList.map(id=>{
    var tds=dates.map(k=>{ var nw=d.shifts[k][id]||'off', ol=liveShift(k,id), diff=(String(nw)!==String(ol));
      return '<td>'+(diff?'<span class="chg">'+esc(nw==='off'?'OFF':nw)+'</span><div style="font-size:9px;color:#9aa7b5;margin-top:2px">was '+esc(ol==='off'?'off':ol)+'</div>':'<span class="same">'+esc(nw==='off'?'off':nw)+'</span>')+'</td>'; }).join('');
    return '<tr><td class="name">'+esc(nm(id))+'<div style="font-weight:400;color:var(--muted);font-size:10px">'+esc(roleOf(id))+'</div></td>'+tds+'</tr>';
  }).join('');
  return '<div class="card" id="draft-'+i+'">'+
    '<div class="draft-h">'+
      '<span class="pill" style="background:#eef1f5;color:var(--navy)">'+esc(d.deptName||d.dept)+'</span>'+
      '<span class="pill" style="background:#e8f1fb;color:#1f4e85">'+esc(d.weekLabel||d.week)+'</span>'+
      '<span class="pill" style="background:#fff3cd;color:#8a6100" id="chg-'+i+'">'+nChg+(nChg===1?' change':' changes')+'</span>'+
      '<span style="margin-left:auto;font-size:12px;color:var(--muted)">by '+esc(d.by||'')+' · '+fmtWhen(d.submittedAt)+'</span>'+
    '</div>'+
    '<div class="scroll"><table>'+head+body+'</table></div>'+
    '<div class="msg" id="msg-'+i+'"></div>'+
    '<div class="foot">'+
      '<button class="approve" onclick="approve('+i+')">✓ Approve &amp; publish live</button>'+
      '<button class="reject" onclick="reject('+i+')">Reject &amp; delete</button>'+
    '</div></div>';
}
async function approve(i){
  var d=DRAFTS[i]; if(!d) return; var msg=$('msg-'+i);
  msg.style.color='var(--muted)'; msg.textContent='Publishing…';
  try{
    var rs=await db.collection('hospro_public').doc('rota').get();
    var live=rs.exists?(rs.data()||{}):{staff:[],depts:[],rota:{}};
    var rota=Object.assign({}, live.rota||{});
    Object.keys(d.shifts||{}).forEach(k=>{ rota[k]=Object.assign({}, rota[k]||{}, d.shifts[k]); });
    await db.collection('hospro_public').doc('rota').set({
      updated:new Date().toISOString(), by:'Rota approval ('+(d.deptName||d.dept)+')',
      staff:live.staff||[], depts:live.depts||[], rota:rota
    });
    await db.collection('rota_drafts').doc(d._id).set({status:'approved', approvedAt:new Date().toISOString()},{merge:true});
    msg.style.color='var(--green)'; msg.textContent='✓ Published live. Staff links and HosPEOPLE will show it.';
    setTimeout(loadDrafts, 1200);
  }catch(e){ msg.style.color='var(--red)'; msg.textContent='Could not publish — check connection / rules.'; }
}
async function reject(i){
  var d=DRAFTS[i]; if(!d) return; if(!confirm('Reject and delete the '+(d.deptName||d.dept)+' draft for '+(d.weekLabel||d.week)+'?')) return;
  var msg=$('msg-'+i);
  try{ await db.collection('rota_drafts').doc(d._id).delete(); msg.style.color='var(--muted)'; msg.textContent='Draft deleted.'; setTimeout(loadDrafts,800); }
  catch(e){ msg.style.color='var(--red)'; msg.textContent='Could not delete.'; }
}
</script></body></html>
