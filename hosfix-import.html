document.getElementById('go').onclick=function(){
  var cur=[]; try{cur=JSON.parse(localStorage.getItem('hosfix_jobs')||'[]');if(!Array.isArray(cur))cur=[];}catch(e){}
  var added=0,updated=0;
  INCOMING.forEach(function(ij){
    var ex=cur.find(function(j){return j.id===ij.id});
    if(!ex){cur.push(ij);added++;}
    else{Object.assign(ex,ij);updated++;}
  });
  try{localStorage.setItem('hosfix_jobs',JSON.stringify(cur));}catch(e){alert('Could not save: '+e.message);return;}
  document.getElementById('go').style.display='none';
  document.getElementById('ok').style.display='block';
  setTimeout(function(){location.href='/hosmain-raj.html';},1200);
};
