<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>HosHOUSE — Room report</title>
<style>
  :root{ --navy:#1F3864; --green:#2E6B5E; --ink:#1a2b3a; --muted:#6b7280; --line:#e4e9ef; --bg:#f4f6f9; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Lato,Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  .wrap{ max-width:620px; margin:0 auto; padding:0 16px 48px; }
  .top{ background:var(--navy); color:#fff; padding:16px; margin:0 -16px 0; }
  .top .brand{ font-size:12px; letter-spacing:.5px; text-transform:uppercase; opacity:.8; font-weight:700; }
  .top .ttl{ font-size:22px; font-weight:800; margin-top:4px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:16px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .room{ font-size:30px; font-weight:800; color:var(--navy); line-height:1.1; }
  .sub{ color:var(--muted); font-size:13.5px; margin-top:4px; }
  .meta{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .pill{ background:#eef2f8; color:var(--navy); border-radius:20px; padding:5px 12px; font-size:12.5px; font-weight:700; }
  .sechd{ font-size:12px; letter-spacing:.4px; text-transform:uppercase; color:var(--muted); font-weight:800; margin:2px 0 6px; }
  .issue{ font-size:16px; font-weight:600; }
  .issue.none{ color:var(--muted); font-weight:400; font-size:14px; }
  .logged{ color:var(--muted); font-size:13px; margin-top:10px; }
  .logged b{ color:var(--ink); }
  .pgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:4px; }
  .pfig{ margin:0; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fff; cursor:pointer; }
  .pfig img{ width:100%; height:130px; object-fit:cover; display:block; }
  .pfig figcaption{ font-size:11.5px; color:var(--muted); padding:6px 8px; }
  .pfig figcaption b{ color:var(--ink); }
  .empty{ color:var(--muted); font-size:14px; padding:6px 0; }
  .foot{ color:#9aa7b4; font-size:11.5px; text-align:center; margin-top:22px; }
  .load{ text-align:center; color:var(--muted); padding:40px 0; }
  .lb{ position:fixed; inset:0; background:rgba(10,16,26,.92); display:none; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .lb.open{ display:flex; }
  .lb img{ max-width:100%; max-height:84vh; border-radius:10px; }
  .lb .x{ position:absolute; top:14px; right:16px; color:#fff; font-size:30px; font-weight:800; cursor:pointer; line-height:1; }
  .tag{ display:inline-block; font-size:11px; font-weight:800; padding:3px 9px; border-radius:6px; margin-bottom:8px; }
  .tag.lost{ background:#efe7fb; color:#6b3fa0; }
  .tag.maint{ background:#fdf0dd; color:#9a6a08; }
</style>
</head>
<body>
<div class="top"><div class="brand">Brandon Hall Hotel &amp; Spa · HosHOUSE</div><div class="ttl">Housekeeping report</div></div>
<div class="wrap"><div id="app"><div class="load">Loading…</div></div>
  <div class="foot">Shared from HosHOUSE · Brandon Hall Hotel &amp; Spa</div>
</div>
<div class="lb" id="lb" onclick="this.classList.remove('open')"><span class="x">&times;</span><img id="lbimg" alt=""></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="hoshouse-config.js"></script>
<script>
(function(){
  "use strict";
  var P=new URLSearchParams(location.search);
  var id=P.get('id')||'';                 // "<date>__<room>"
  var kind=(P.get('k')||'').toLowerCase(); // "lost" | "maint" | ""
  var app=document.getElementById('app');
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fdate(d){ if(!d) return ''; var x=new Date(d+'T12:00'); return isNaN(x)?d:x.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'}); }
  function ftime(ms){ if(!ms) return ''; var x=new Date(ms); return isNaN(x)?'':x.toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
  function floorLabel(f){ try{ return (window.HH&&HH.floorLabel)?HH.floorLabel(f):(f||''); }catch(e){ return f||''; } }
  function openLb(src){ var i=document.getElementById('lbimg'); i.src=src; document.getElementById('lb').classList.add('open'); }
  window._openLb=openLb;

  if(!id || id.indexOf('__')<0){ app.innerHTML='<div class="card"><div class="empty">This link is missing its room reference. Please ask for a new link.</div></div>'; return; }
  var date=id.slice(0,id.indexOf('__')), room=id.slice(id.indexOf('__')+2);

  function render(r, photos){
    if(!r){ app.innerHTML='<div class="card"><div class="empty">This room report could not be found. It may have been cleared.</div></div>'; return; }
    var lost=(r.lostProperty&&r.lostProperty.trim())||photos.some(function(p){return (p.kind||p.slot)==='lostproperty';});
    var maint=r.maintenance&&r.maintenance.trim();
    var who=r.housekeeperName||r.housekeeper||'—';
    var when=ftime(r.finishAt||r.updatedAt||0);
    var secLost='<div class="card"><div class="tag lost">🎒 Lost property</div><div class="sechd">Item found</div><div class="issue'+((r.lostProperty&&r.lostProperty.trim())?'':' none')+'">'+esc((r.lostProperty&&r.lostProperty.trim())?r.lostProperty:'Photo only — see below')+'</div><div class="logged">Logged by <b>'+esc(who)+'</b>'+(when?(' · '+esc(when)):'')+'</div></div>';
    var secMaint='<div class="card"><div class="tag maint">🔧 Maintenance</div><div class="sechd">Issue reported</div><div class="issue">'+esc(r.maintenance)+'</div>'+(r.replaced&&r.replaced.trim()?'<div class="logged">Items replaced: <b>'+esc(r.replaced)+'</b></div>':'')+'<div class="logged">Logged by <b>'+esc(who)+'</b>'+(when?(' · '+esc(when)):'')+'</div></div>';

    var order='';
    if(kind==='maint'){ if(maint) order+=secMaint; if(lost) order+=secLost; }
    else { if(lost) order+=secLost; if(maint) order+=secMaint; }
    if(!order) order='<div class="card"><div class="empty">No lost property or maintenance was logged for this room.</div></div>';

    // photos: lost-property shots first
    var ps=photos.slice().sort(function(a,b){
      var al=((a.kind||a.slot)==='lostproperty')?0:1, bl=((b.kind||b.slot)==='lostproperty')?0:1;
      return al-bl || (a.takenAt||0)-(b.takenAt||0);
    });
    var pcard='';
    if(ps.length){
      var figs=ps.map(function(p){
        var cap=esc(p.label||p.slot||'Photo')+(p.byName?(' · '+esc(p.byName)):'')+(p.takenAt?(' · '+esc(ftime(p.takenAt))):'');
        return '<figure class="pfig" onclick="_openLb(\''+(p.dataUrl||'').replace(/'/g,"\\'")+'\')"><img src="'+(p.dataUrl||'')+'" alt=""><figcaption>'+cap+'</figcaption></figure>';
      }).join('');
      pcard='<div class="card"><div class="sechd">Photos ('+ps.length+')</div><div class="pgrid">'+figs+'</div></div>';
    } else {
      pcard='<div class="card"><div class="sechd">Photos</div><div class="empty">No photos attached.</div></div>';
    }

    app.innerHTML=
      '<div class="card"><div class="room">Room '+esc(r.room)+'</div>'+
      '<div class="sub">'+esc(r.type||'')+(floorLabel(r.floor)?(' · '+esc(floorLabel(r.floor))):'')+'</div>'+
      '<div class="meta"><span class="pill">📅 '+esc(fdate(r.date||date))+'</span>'+
      (r.status?('<span class="pill">'+esc(r.status==='done'?'Cleaned':r.status)+'</span>'):'')+'</div></div>'+
      order+pcard;
  }

  function go(){
    if(!window.HH || !HH.db){ app.innerHTML='<div class="card"><div class="empty">Could not connect. Please check your internet and reopen the link.</div></div>'; return; }
    var db=HH.db;
    db.collection('hoshouse_rooms').doc(id).get().then(function(doc){
      var r=doc.exists?doc.data():null;
      db.collection('hoshouse_photos').where('date','==',date).where('room','==',String(room)).get().then(function(snap){
        var photos=snap.docs.map(function(d){return d.data();});
        render(r, photos);
      }).catch(function(){ render(r, []); });
    }).catch(function(e){ app.innerHTML='<div class="card"><div class="empty">Could not load this report ('+esc(e&&e.code||'error')+').</div></div>'; });
  }
  // HH inits Firebase synchronously on load; give it a tick just in case
  if(window.HH && HH.db) go(); else setTimeout(go, 400);
})();
</script>
</body>
</html>
