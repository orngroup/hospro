<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a2b47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HosBIZ">
<meta name="format-detection" content="telephone=no">
<title>HosBIZ &middot; Brandon Hall</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ Sign-in screen ============ -->
<section class="lg-screen" id="signin">
  <div class="lg-brand">
    <div class="lg-mark">&pound;</div>
    <div>
      <b>Hos<i>BIZ</i></b>
      <small>BRANDON HALL &middot; LIVE TRADING</small>
    </div>
  </div>
  <p class="lg-hello">Last night&rsquo;s numbers, tonight&rsquo;s position, this month in your pocket.</p>

  <div class="lg-label">Who&rsquo;s signing in?</div>
  <div class="lg-users" id="users">
    <button class="lg-user" type="button" data-u="Raj Kumar">
      <span class="lg-avatar">RK</span>
      <span>Raj Kumar<span class="lg-role">Global COO</span></span>
    </button>
    <button class="lg-user" type="button" data-u="Ajay Kawa">
      <span class="lg-avatar">AK</span>
      <span>Ajay Kawa<span class="lg-role">Chief Commercial Officer</span></span>
    </button>
    <button class="lg-user" type="button" data-u="Alia Taub">
      <span class="lg-avatar">AT</span>
      <span>Alia Taub<span class="lg-role">Leadership Focus</span></span>
    </button>
  </div>

  <form class="lg-pw" id="pwform" autocomplete="off" style="display:none">
    <label for="pw">Password</label>
    <input id="pw" name="pw" type="password" inputmode="text" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Enter password">
    <button class="lg-btn" id="go" type="submit">Sign in</button>
    <div class="lg-err" id="err"></div>
  </form>

  <div class="lg-foot">HosPRO &middot; secure</div>
</section>

<!-- ============ Main app ============ -->
<section class="app" id="app">

  <header class="top">
    <div class="top-row">
      <div class="mark">&pound;</div>
      <div class="title">
        <b>Hos<i>BIZ</i> &middot; Brandon Hall</b>
        <small id="who">&nbsp;</small>
      </div>
      <div class="avatar" id="avatar" role="button" aria-label="Account">&nbsp;</div>
    </div>
    <div class="feed-strip" id="feed">Checking feed&hellip;</div>
  </header>

  <nav class="chips" id="chips" aria-label="Range">
    <button class="chip on" type="button" data-r="y">Yesterday</button>
    <button class="chip" type="button" data-r="7">Last 7 days</button>
    <button class="chip" type="button" data-r="28">Last 28 days</button>
    <button class="chip" type="button" data-r="mtd">MTD</button>
    <button class="chip" type="button" data-r="lm">Last month</button>
  </nav>

  <main id="main">
    <div class="empty" id="loading"><span class="spin" style="border-color:rgba(26,43,71,0.2);border-top-color:#1a2b47"></span> &nbsp;Loading&hellip;</div>
  </main>

  <nav class="nav" id="nav" aria-label="Views">
    <button type="button" class="on" data-v="today">
      <svg viewBox="0 0 24 24"><path d="M3 10.5L12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      Today
    </button>
    <button type="button" data-v="fb">
      <svg viewBox="0 0 24 24"><path d="M6 3v8a3 3 0 0 0 3 3v7M9 3v8M15 3c-2 2-2 6 0 8v10"/></svg>
      F&amp;B
    </button>
    <button type="button" data-v="otb">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      On the books
    </button>
  </nav>

</section>

<!-- Account sheet -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Account">
  <div class="sheet-card">
    <div class="grab"></div>
    <h3 id="s-name">&nbsp;</h3>
    <div class="who" id="s-role">&nbsp;</div>
    <button type="button" id="s-refresh">Refresh data</button>
    <button type="button" id="s-close">Close</button>
    <button type="button" id="s-out" class="signout">Sign out</button>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
<script src="app.js"></script>
</body>
</html>
