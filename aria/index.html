<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ARIA">
<title>ARIA · Updating</title>
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(ellipse at 50% 30%, #1a2244 0%, #0d0f14 60%); color: #eceef3; font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  main { max-width: 440px; }
  .bot { width: 96px; height: auto; filter: drop-shadow(0 10px 30px rgba(91,140,255,.35)); animation: float 3.2s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { .bot { animation: none; } }
  .logo { display: block; width: 190px; margin: 14px auto 6px; }
  h1 { font-size: 22px; font-weight: 650; margin: 14px 0 8px; }
  p { color: #a7adba; margin: 0 0 10px; }
  .bar { height: 4px; border-radius: 4px; background: #1d2333; overflow: hidden; margin: 22px auto 18px; width: 180px; }
  .bar i { display: block; height: 100%; width: 40%; border-radius: 4px; background: linear-gradient(90deg, #5b8cff, #c77dff); animation: slide 1.6s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  .small { font-size: 13px; color: #7d8494; }
  a { color: #9db2ff; }
  footer { position: fixed; right: 16px; bottom: 12px; font-size: 12px; color: #7d8494; }
  footer b { color: #eceef3; }
</style>
</head>
<body>
<main>
  <img class="bot" src="icons/mascot.png" alt="">
  <svg class="logo" viewBox="2 -2 212 94" role="img" aria-label="ARIA">
    <defs><linearGradient id="arc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B8CFF"/><stop offset="1" stop-color="#C77DFF"/></linearGradient></defs>
    <g fill="none" stroke="#F2F4F8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 68 L32 20 L54 68"/><path d="M72 68 V20 H92 a14.5 14.5 0 0 1 0 29 H72 M90 49 L106 68"/><path d="M124 20 V68"/><path d="M142 68 L164 20 L186 68"/>
    </g>
    <path d="M147.1 7.75 A40 40 0 1 1 147.1 80.25" fill="none" stroke="url(#arc)" stroke-width="9" stroke-linecap="round"/>
  </svg>
  <h1>ARIA is getting an upgrade</h1>
  <p>We're rebuilding ARIA so it can answer anything about Brandon Hall, from last night's sales to next March, in a proper conversation.</p>
  <div class="bar" aria-hidden="true"><i></i></div>
  <p class="small">Back in a few days. In the meantime, please use <a href="/business/">HosBUSINESS</a> for figures.</p>
</main>
<footer>Powered by <b>HosPRO</b></footer>
<script>
  // Clear the old app cache so phones that installed ARIA see this page, not a stored copy.
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
</script>
</body>
</html>
