<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a2b3a">
<meta name="apple-mobile-web-app-title" content="BH Requests">
<title>Housekeeping Request — Brandon Hall</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--navy:#1a2b3a;--gold:#c9a978;--green:#2a6a4a;--red:#b3261e;--amber:#b9780a;--line:#e4e9ef;--ink:#1a2b3a;--muted:#5b6b7b;--bg:#eef1f5}
html,body{font-family:'Lato',sans-serif;background:var(--bg);color:var(--ink);min-height:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 14px calc(28px + env(safe-area-inset-bottom,0px))}
.top{background:linear-gradient(160deg,#1a2b3a,#24384f);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 18px;text-align:center}
.top .nm{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;letter-spacing:.5px}
.top .sub{font-size:11px;letter-spacing:3px;color:var(--gold);font-weight:700;text-transform:uppercase;margin-top:2px}
.top .tt{font-size:14px;color:rgba(255,255,255,.85);margin-top:8px;font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
label.fl{display:block;font:800 11px Lato;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:0 0 7px}
input[type=number],input[type=text],textarea,select{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:11px;font:16px Lato;color:var(--ink);background:#fff;-webkit-appearance:none}
textarea{min-height:72px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold)}
.roomfix{font:900 30px Lato;color:var(--navy);text-align:center;padding:8px 0 2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rt{display:flex;align-items:center;gap:10px;padding:13px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font:700 14px Lato;color:var(--ink);text-align:left;touch-action:manipulation;position:relative}
.rt .e{font-size:22px;line-height:1}
.rt.on{border-color:var(--navy);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--navy)}
.rt.on::after{content:'✓';position:absolute;top:6px;right:9px;color:var(--green);font-weight:900;font-size:13px}
.selhint{font-size:12px;color:var(--muted);margin:2px 0 10px}
.selrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line)}
.selrow:first-child{border-top:none}
.sl-name{flex:1;font-weight:700;font-size:14px}
.qty{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{width:38px;height:38px;border:none;background:#f3f6f9;font:900 20px Lato;color:var(--navy);cursor:pointer}
.qty span{min-width:34px;text-align:center;font:900 16px Lato}
.sl-x{width:32px;height:32px;border:none;background:none;color:#aeb8c4;font-size:18px;cursor:pointer}
.btn{width:100%;padding:16px;border-radius:13px;border:none;font:900 16px Lato;cursor:pointer;touch-action:manipulation;margin-top:4px}
.btn-go{background:var(--navy);color:#fff}
.btn-gold{background:var(--gold);color:var(--navy)}
.prio{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pb{padding:13px;border:2px solid var(--line);border-radius:12px;background:#fff;font:800 15px Lato;cursor:pointer;text-align:center;color:var(--muted);touch-action:manipulation}
.pb.on-n{border-color:var(--green);background:#e9f3ee;color:var(--green)}
.pb.on-u{border-color:var(--red);background:#fdeceb;color:var(--red)}
.muted{color:var(--muted);font-size:13px;line-height:1.5}
.stafflink{display:block;text-align:center;color:#9aa7b5;font:700 12px Lato;margin-top:20px;cursor:pointer;text-decoration:underline;background:none;border:none;width:100%}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 6px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tile .v{font:900 24px Lato}.tile .k{font-size:9.5px;color:var(--muted);text-transform:uppercase;font-weight:800;letter-spacing:.3px;margin-top:2px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px}
.chip{padding:7px 13px;border-radius:20px;background:#fff;border:1.5px solid var(--line);font:800 12px Lato;cursor:pointer;white-space:nowrap;color:var(--muted);flex-shrink:0}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.req{background:#fff;border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.req.s-pending{border-left-color:#9aa7b5}.req.s-urgent{border-left-color:var(--red)}.req.s-in_progress{border-left-color:var(--amber)}.req.s-done{border-left-color:var(--green);opacity:.85}
.req .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.req .rm{font:900 16px Lato;color:var(--navy)}
.req .ty{font-weight:700;font-size:14px}
.bdg{font:800 10px Lato;padding:2px 8px;border-radius:7px;text-transform:uppercase;letter-spacing:.3px}
.bdg.u{background:#fdeceb;color:var(--red)}.bdg.p{background:#eef2f6;color:#5b6b7b}.bdg.ip{background:#fff6e6;color:var(--amber)}.bdg.d{background:#e9f3ee;color:var(--green)}
.req .meta{font-size:12px;color:var(--muted);margin-top:5px}
.req .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.sbtn{padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;font:800 12px Lato;cursor:pointer;color:var(--navy);touch-action:manipulation}
.sbtn.go{background:var(--green);color:#fff;border-color:var(--green)}
.sbtn.st{background:var(--amber);color:#fff;border-color:var(--amber)}
.sbtn.urg{background:#fdeceb;color:var(--red);border-color:#f0c4c0}
.sbtn.urg.on{background:var(--red);color:#fff;border-color:var(--red)}
.rsel{padding:8px 10px;border:1px solid var(--line);border-radius:9px;font:13px Lato}
.hide{display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(26,43,58,.95);color:#fff;padding:11px 18px;border-radius:22px;font:800 14px Lato;z-index:99;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="top">
  <div class="nm">Brandon Hall</div>
  <div class="sub">Hotel &amp; Spa</div>
  <div class="tt" id="top-tt">🧹 Housekeeping Request</div>
</div>

<div class="wrap">

  <!-- ===== GUEST / RECEPTION FORM ===== -->
  <div id="scr-form">
    <div class="card">
      <label class="fl">Room number</label>
      <div id="room-fixed" class="hide"><div class="roomfix" id="room-fixed-n"></div></div>
      <select id="f-room" class="hide"><option value="">Select your room…</option></select>
      <input id="f-room-txt" type="number" inputmode="numeric" placeholder="e.g. 101" min="0" class="hide">
    </div>

    <div class="card">
      <label class="fl">What do you need? <span style="font-weight:400;text-transform:none;color:#9aa7b5">(pick one or more)</span></label>
      <div class="grid" id="type-grid"></div>
    </div>

    <div class="card hide" id="sel-wrap">
      <label class="fl">Your request</label>
      <div class="selhint">Set how many where it applies (e.g. pillows).</div>
      <div id="sel-box"></div>
    </div>

    <div class="card">
      <label class="fl">Any details <span style="font-weight:400;text-transform:none;color:#9aa7b5">(optional)</span></label>
      <textarea id="f-detail" placeholder="Anything that helps the team — e.g. service after 2pm, which towels…"></textarea>
    </div>

    <!-- priority: reception only (hidden for the in-room QR) -->
    <div class="card hide" id="prio-card">
      <label class="fl">Priority</label>
      <div class="prio">
        <button type="button" class="pb on-n" id="pb-n" onclick="setPrio('normal')">Normal</button>
        <button type="button" class="pb" id="pb-u" onclick="setPrio('urgent')">🔴 Urgent</button>
      </div>
    </div>

    <button class="btn btn-go" style="margin-top:14px" onclick="submitRequest()">Send to Housekeeping →</button>
    <button class="stafflink" id="form-back" style="display:none" onclick="startBoard()">← Back to the requests board</button>
    <button class="stafflink" id="form-staff" onclick="openBoard()">Staff access</button>
  </div>

  <!-- ===== THANK YOU ===== -->
  <div id="scr-thanks" class="hide">
    <div class="card" style="text-align:center;padding:30px 20px">
      <div style="font-size:52px">✅</div>
      <div style="font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--navy);margin:8px 0 4px">Request sent</div>
      <div class="muted" id="thanks-sub">The housekeeping team has been notified and will see to it shortly.</div>
      <div id="thanks-ref" class="muted" style="margin-top:8px;font-weight:700"></div>
      <button class="btn btn-gold" style="margin-top:18px" onclick="resetForm()">Send another request</button>
    </div>
  </div>

  <!-- ===== STAFF BOARD ===== -->
  <div id="scr-pin" class="hide">
    <div class="card" style="text-align:center;margin-top:28px">
      <div style="font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--navy);margin-bottom:4px">Staff access</div>
      <div class="muted" style="margin-bottom:14px">Enter the staff code to open the requests board.</div>
      <input id="pin-in" type="tel" inputmode="numeric" maxlength="6" placeholder="••••" style="text-align:center;letter-spacing:10px;font:900 22px Lato;max-width:220px;margin:0 auto">
      <div id="pin-err" style="color:var(--red);font-size:12px;min-height:16px;margin:8px 0 2px"></div>
      <button class="btn btn-go" style="max-width:220px;margin:0 auto" onclick="checkPin()">Open board</button>
      <button class="stafflink" onclick="showForm()">← Back to request form</button>
    </div>
  </div>

  <div id="scr-board" class="hide">
    <button class="btn btn-go" style="margin-top:14px" onclick="openLogForm()">➕ Log a request</button>
    <div class="tiles" style="margin-top:4px">
      <div class="tile"><div class="v" id="t-pend" style="color:#5b6b7b">0</div><div class="k">Pending</div></div>
      <div class="tile"><div class="v" id="t-urg" style="color:var(--red)">0</div><div class="k">Urgent</div></div>
      <div class="tile"><div class="v" id="t-ip" style="color:var(--amber)">0</div><div class="k">In progress</div></div>
      <div class="tile"><div class="v" id="t-done" style="color:var(--green)">0</div><div class="k">Done today</div></div>
    </div>
    <div class="chips" id="b-chips"></div>
    <div id="b-list"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="hoshouse-config.js"></script>
<script>
'use strict';
/* ============================================================
   HosHOUSE — Front Desk / Guest Requests (standalone v1)
   Writes to Firestore collection: hoshouse_requests
   Share:  /hoshouse-request.html             (guest form — QR; no priority)
           /hoshouse-request.html?room=101    (pre-filled for a room)
           /hoshouse-request.html?reception   (reception — shows priority)
           /hoshouse-request.html?board       (staff board — PIN)
   ------------------------------------------------------------
   STAFF CODE for the board — change this line to set your own:
   ============================================================ */
const BOARD_PIN = "2468";

const REQ_TYPES = [
  {id:'cleaning',  e:'🧹', label:'Cleaning issue'},
  {id:'towels',    e:'🧺', label:'Towels / linen'},
  {id:'pillows',   e:'🛌', label:'Extra pillows'},
  {id:'teacoffee', e:'☕', label:'Tea / coffee / milk'},
  {id:'toiletries',e:'🧴', label:'Toiletries'},
  {id:'batteries', e:'🔋', label:'Remote batteries'},
  {id:'extrabed',  e:'🛏️', label:'Extra bed'},
  {id:'servicing', e:'🕐', label:'Room servicing'},
  {id:'other',     e:'✍️', label:'Something else'}
];
// items that take a quantity
const QTY_ITEMS = ['towels','pillows','teacoffee','toiletries','batteries','extrabed'];
const TYPE_LABEL = id => (REQ_TYPES.find(t=>t.id===id)||{}).label || 'Request';
const TYPE_EMOJI = id => (REQ_TYPES.find(t=>t.id===id)||{}).e || '🧹';

let db=null;
try{ if(typeof firebase!=='undefined' && typeof firebaseConfig!=='undefined'){ if(!firebase.apps.length) firebase.initializeApp(firebaseConfig); db=firebase.firestore(); } }catch(e){ console.warn('FB init',e); }

const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
const RECEPTION=qs.has('reception'); const STAFF=qs.has('board')||qs.has('reception');
let FS={ room:'', items:{}, prio:'normal' };   // items = { typeId: qty }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function ago(iso){ if(!iso) return ''; const s=Math.floor((Date.now()-new Date(iso).getTime())/1000); if(s<60)return'just now'; const m=Math.floor(s/60); if(m<60)return m+'m ago'; const h=Math.floor(m/60); if(h<24)return h+'h ago'; return Math.floor(h/24)+'d ago'; }
function todayISO(){ return new Date().toLocaleDateString('en-CA'); }

/* ---- request-type grid (multi-select) ---- */
$('type-grid').innerHTML = REQ_TYPES.map(t=>`<button type="button" class="rt" data-t="${t.id}" onclick="toggleType('${t.id}')"><span class="e">${t.e}</span>${t.label}</button>`).join('');
function toggleType(id){
  if(FS.items[id]!=null) delete FS.items[id];
  else FS.items[id]=1;
  document.querySelectorAll('.rt').forEach(b=>b.classList.toggle('on', FS.items[b.dataset.t]!=null));
  renderSelected();
}
function itemQty(id,d){ if(FS.items[id]==null) return; FS.items[id]=Math.max(1,(FS.items[id]||1)+d); renderSelected(); }
function renderSelected(){
  const ids=Object.keys(FS.items);
  $('sel-wrap').classList.toggle('hide', ids.length===0);
  $('sel-box').innerHTML=ids.map(id=>`<div class="selrow">
    <span class="sl-name">${TYPE_EMOJI(id)} ${TYPE_LABEL(id)}</span>
    ${QTY_ITEMS.includes(id)?`<div class="qty"><button type="button" onclick="itemQty('${id}',-1)">−</button><span>${FS.items[id]}</span><button type="button" onclick="itemQty('${id}',1)">+</button></div>`:''}
    <button type="button" class="sl-x" onclick="toggleType('${id}')">✕</button>
  </div>`).join('');
}
function setPrio(p){ FS.prio=p; $('pb-n').className='pb'+(p==='normal'?' on-n':''); $('pb-u').className='pb'+(p==='urgent'?' on-u':''); }

/* priority is shown only when a staff member logs from the board (openLogForm) */

/* ---- room: fixed from QR ?room=, else a picker of the real room list (no free text) ---- */
(function(){
  const r=(qs.get('room')||'').trim();
  if(r){ FS.room=r; $('room-fixed').classList.remove('hide'); $('room-fixed-n').textContent='Room '+r; return; }
  loadRooms();
})();
async function loadRooms(){
  let rooms=[];
  // same room list the app uses (HH.cfg().rooms — has a built-in default even if none saved)
  try{ if(typeof HH!=='undefined' && HH.loadCfg){ await HH.loadCfg(); const rr=HH.cfg().rooms; if(Array.isArray(rr)) rooms=rr.map(x=>String(x.room)).filter(Boolean); } }catch(e){}
  if(!rooms.length){ try{ if(typeof HH!=='undefined' && HH.cfg){ const rr=HH.cfg().rooms; if(Array.isArray(rr)) rooms=rr.map(x=>String(x.room)).filter(Boolean); } }catch(e){} }
  if(!rooms.length){ try{ if(db){ const d=await db.collection('hoshouse_config').doc('current').get(); const rr=(d.exists?(d.data()||{}):{}).rooms; if(Array.isArray(rr)) rooms=rr.map(x=>String(x.room)).filter(Boolean); } }catch(e){} }
  const sel=$('f-room');
  if(rooms.length){
    rooms.sort((a,b)=>(+a||0)-(+b||0)||String(a).localeCompare(String(b)));
    sel.innerHTML='<option value="">Select the room…</option>'+rooms.map(r=>`<option value="${esc(r)}">Room ${esc(r)}</option>`).join('');
    sel.classList.remove('hide'); $('f-room-txt').classList.add('hide');
  } else {
    $('f-room-txt').classList.remove('hide');   // fallback: type it if the room list isn't available
  }
}
function getRoom(){ if(FS.room) return FS.room; const sel=$('f-room'); if(sel && !sel.classList.contains('hide') && sel.value) return sel.value; const t=$('f-room-txt'); if(t && !t.classList.contains('hide')) return (t.value||'').trim(); return ''; }

/* ---- submit ---- */
async function submitRequest(){
  const room=getRoom().toString().trim();
  if(!room){ toast('Please select your room'); const s=$('f-room'),t=$('f-room-txt'); (s&&!s.classList.contains('hide')?s:t).focus(); return; }
  const ids=Object.keys(FS.items);
  if(!ids.length){ toast('Please pick what you need'); return; }
  const items=ids.map(id=>({type:id,label:TYPE_LABEL(id),qty:FS.items[id]||1}));
  const summary=items.map(it=>(it.qty>1?it.qty+'× ':'')+it.label).join(', ');
  const detail=$('f-detail').value.trim();
  const now=new Date().toISOString();
  const id='req_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  const doc={ id, room:String(room), items, typeLabel:summary, type:items[0].type,
    detail, priority:(window._staffLog?FS.prio:'normal'), status:'pending', source:(window._staffLog?'reception':'guest'),
    createdAt:now, updatedAt:now, assignedTo:'', assignedName:'', startedAt:null, completedAt:null, completedBy:'' };
  try{
    if(db){ await db.collection('hoshouse_requests').doc(id).set(doc); }
    else { const a=JSON.parse(localStorage.getItem('hoshouse_requests')||'[]'); a.unshift(doc); localStorage.setItem('hoshouse_requests',JSON.stringify(a)); }
    if(window._staffLog){ FS.items={}; FS.voiceNote=null; document.querySelectorAll('.rt').forEach(b=>b.classList.remove('on')); try{renderSelected();}catch(e){} $('f-detail').value=''; setPrio('normal'); toast('✓ Request logged'); window._staffLog=false; startBoard(); return; }
    $('thanks-ref').textContent='Ref: '+id.slice(-4).toUpperCase()+'  ·  Room '+room;
    showScreen('scr-thanks');
  }catch(e){ console.warn('submit',e); toast('Could not send — please tell reception'); }
}
function resetForm(){ FS={room:FS.room, items:{}, prio:'normal'}; $('f-detail').value=''; setPrio('normal'); document.querySelectorAll('.rt').forEach(b=>b.classList.remove('on')); renderSelected(); if(!qs.get('room')){ const s=$('f-room'); if(s) s.value=''; const t=$('f-room-txt'); if(t) t.value=''; } showScreen('scr-form'); }

/* ---- screens ---- */
function showScreen(id){ ['scr-form','scr-thanks','scr-pin','scr-board'].forEach(s=>$(s).classList.toggle('hide',s!==id)); window.scrollTo(0,0); }
function showForm(){ window._staffLog=false; $('prio-card').classList.add('hide'); var fb=$('form-back'); if(fb) fb.style.display='none'; var fs=$('form-staff'); if(fs) fs.style.display=''; $('top-tt').textContent='🧹 Housekeeping Request'; stopBoard(); showScreen('scr-form'); }
function openLogForm(){
  window._staffLog=true;
  FS.room=''; FS.items={}; FS.voiceNote=null; FS.prio='normal';
  if(!qs.get('room')){ var s=$('f-room'); if(s) s.value=''; var t=$('f-room-txt'); if(t) t.value=''; }
  document.querySelectorAll('.rt').forEach(b=>b.classList.remove('on')); try{renderSelected();}catch(e){} $('f-detail').value=''; setPrio('normal');
  $('prio-card').classList.remove('hide');
  var fb=$('form-back'); if(fb) fb.style.display=''; var fs=$('form-staff'); if(fs) fs.style.display='none';
  $('top-tt').textContent='➕ Log a request'; window.scrollTo(0,0); showScreen('scr-form');
}
function openBoard(){ showScreen('scr-pin'); setTimeout(()=>$('pin-in').focus(),100); }
function checkPin(){ if(($('pin-in').value||'').trim()===BOARD_PIN){ $('pin-err').textContent=''; startBoard(); } else { $('pin-err').textContent='Wrong code — ask a manager'; $('pin-in').value=''; } }
$('pin-in') && $('pin-in').addEventListener('keydown',e=>{ if(e.key==='Enter') checkPin(); });

/* ============================================================
   STAFF BOARD — live list, allocate, start, complete, mark urgent
   ============================================================ */
let B_FILTER='open', B_UNSUB=null, B_ROWS=[], B_STAFF=[], B_READY=false;
const B_FILTERS=[['open','To do'],['urgent','🔴 Urgent'],['in_progress','⏱ In progress'],['done','✓ Done today'],['all','All']];

async function loadStaff(){
  try{ if(db){ const d=await db.collection('hoshouse_config').doc('current').get(); const st=(d.exists?(d.data()||{}):{}).staff; if(Array.isArray(st)&&st.length){ B_STAFF=st.filter(s=>(s.status||'active')==='active').map(s=>({id:s.id,name:s.name})); return; } } }catch(e){}
  B_STAFF=[{id:'ruth',name:'Ruth Addison'},{id:'aryan',name:'Aryan'},{id:'lara',name:'Lara Jervis'},{id:'rahul',name:'Rahul Reghunath'},{id:'manoj',name:'Manoj'},{id:'satya',name:'Satya'},{id:'laith',name:'Laith Hardy'}];
}
async function startBoard(){
  $('top-tt').textContent='📋 Requests board';
  showScreen('scr-board');
  await loadStaff();
  $('b-chips').innerHTML=B_FILTERS.map(([f,l])=>`<button class="chip ${B_FILTER===f?'on':''}" onclick="bSetFilter('${f}')">${l}</button>`).join('');
  if(db){
    if(B_UNSUB) B_UNSUB();
    B_UNSUB=db.collection('hoshouse_requests').onSnapshot(snap=>{
      const prevOpen=B_ROWS.filter(r=>r.status==='pending').length;
      B_ROWS=snap.docs.map(d=>d.data()).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
      const nowOpen=B_ROWS.filter(r=>r.status==='pending').length;
      if(nowOpen>prevOpen && B_READY) notifyNew();
      B_READY=true; bRender();
    }, e=>{ console.warn('board snap',e); $('b-list').innerHTML='<div class="muted" style="padding:20px;text-align:center">Could not load requests — check connection.</div>'; });
  } else { B_ROWS=JSON.parse(localStorage.getItem('hoshouse_requests')||'[]'); bRender(); }
  try{ if('Notification' in window && Notification.permission==='default') Notification.requestPermission(); }catch(e){}
}
function stopBoard(){ if(B_UNSUB){ B_UNSUB(); B_UNSUB=null; } B_READY=false; }
function bSetFilter(f){ B_FILTER=f; $('b-chips').innerHTML=B_FILTERS.map(([ff,l])=>`<button class="chip ${B_FILTER===ff?'on':''}" onclick="bSetFilter('${ff}')">${l}</button>`).join(''); bRender(); }
function notifyNew(){ try{ if('Notification' in window && Notification.permission==='granted') new Notification('🧹 New housekeeping request',{body:'A guest/front-desk request just came in.'}); }catch(e){} toast('🔔 New request in'); }
function reqItems(r){ if(r.items&&r.items.length) return r.items.map(it=>`${TYPE_EMOJI(it.type)} ${esc(it.label)}${it.qty>1?(' ×'+it.qty):''}`).join('  ·  '); return `${TYPE_EMOJI(r.type)} ${esc(r.typeLabel||'')}`; }

function bRender(){
  const today=todayISO();
  const pend=B_ROWS.filter(r=>r.status==='pending'), urg=B_ROWS.filter(r=>r.status!=='done'&&r.priority==='urgent');
  const ip=B_ROWS.filter(r=>r.status==='in_progress'), doneT=B_ROWS.filter(r=>r.status==='done'&&String(r.completedAt||'').slice(0,10)===today);
  $('t-pend').textContent=pend.length; $('t-urg').textContent=urg.length; $('t-ip').textContent=ip.length; $('t-done').textContent=doneT.length;
  let rows=B_ROWS.slice();
  if(B_FILTER==='open') rows=rows.filter(r=>r.status==='pending'||r.status==='in_progress');
  else if(B_FILTER==='urgent') rows=rows.filter(r=>r.status!=='done'&&r.priority==='urgent');
  else if(B_FILTER==='in_progress') rows=rows.filter(r=>r.status==='in_progress');
  else if(B_FILTER==='done') rows=rows.filter(r=>r.status==='done'&&String(r.completedAt||'').slice(0,10)===today);
  rows.sort((a,b)=>{ const o={pending:0,in_progress:1,done:2}; const ao=(a.priority==='urgent'&&a.status!=='done')?-1:o[a.status]; const bo=(b.priority==='urgent'&&b.status!=='done')?-1:o[b.status]; return ao-bo || (b.createdAt||'').localeCompare(a.createdAt||''); });
  if(!rows.length){ $('b-list').innerHTML='<div class="muted" style="padding:26px;text-align:center">Nothing here — all clear ✓</div>'; return; }
  const staffOpts=u=>`<option value="">— allocate —</option>`+B_STAFF.map(s=>`<option value="${s.id}" ${u===s.id?'selected':''}>${esc(s.name)}</option>`).join('');
  $('b-list').innerHTML=rows.map(r=>{
    const st=(r.priority==='urgent'&&r.status!=='done')?'urgent':r.status;
    const bdg=r.status==='done'?'<span class="bdg d">✓ Done</span>':r.status==='in_progress'?'<span class="bdg ip">In progress</span>':(r.priority==='urgent'?'<span class="bdg u">Urgent</span>':'<span class="bdg p">Pending</span>');
    const resp=(r.status==='done'&&r.completedAt&&r.createdAt)?('· done in '+Math.max(1,Math.round((new Date(r.completedAt)-new Date(r.createdAt))/60000))+'m'):'';
    return `<div class="req s-${st}">
      <div class="r1"><span class="rm">Room ${esc(r.room)}</span><span class="ty">${reqItems(r)}</span>${bdg}</div>
      ${r.detail?`<div class="meta">${esc(r.detail)}</div>`:''}
      <div class="meta">${esc(r.source==='reception'?'Front desk':'Guest')} · ${ago(r.createdAt)} ${r.assignedName?('· 👤 '+esc(r.assignedName)):''} ${resp}</div>
      ${r.status!=='done'?`<div class="acts">
        <select class="rsel" onchange="allocate('${r.id}',this.value)">${staffOpts(r.assignedTo)}</select>
        <button class="sbtn urg ${r.priority==='urgent'?'on':''}" onclick="toggleUrgent('${r.id}','${r.priority}')">${r.priority==='urgent'?'● Urgent':'⚑ Urgent'}</button>
        ${r.status==='pending'?`<button class="sbtn st" onclick="setStatus('${r.id}','in_progress')">Start</button>`:''}
        <button class="sbtn go" onclick="setStatus('${r.id}','done')">✓ Complete</button>
      </div>`:''}
    </div>`;
  }).join('');
}
async function patch(id,fields){ fields.updatedAt=new Date().toISOString(); try{ if(db){ await db.collection('hoshouse_requests').doc(id).set(fields,{merge:true}); } else { const a=JSON.parse(localStorage.getItem('hoshouse_requests')||'[]'); const r=a.find(x=>x.id===id); if(r){Object.assign(r,fields); localStorage.setItem('hoshouse_requests',JSON.stringify(a)); bRender();} } }catch(e){ toast('Could not save — check connection'); } }
function allocate(id,hk){ const s=B_STAFF.find(x=>x.id===hk); patch(id,{assignedTo:hk||'',assignedName:s?s.name:''}); toast(s?('Allocated to '+s.name.split(' ')[0]):'Unassigned'); }
function setStatus(id,status){ const f={status}; const now=new Date().toISOString(); if(status==='in_progress') f.startedAt=now; if(status==='done') f.completedAt=now; patch(id,f); toast(status==='done'?'✓ Completed':'Marked in progress'); }
function toggleUrgent(id,cur){ const u=cur==='urgent'?'normal':'urgent'; patch(id,{priority:u}); toast(u==='urgent'?'Marked urgent':'Urgent removed'); }

/* ---- entry: staff console (reception/desktop) opens the board; guests see the form ---- */
if(STAFF) openBoard();
</script>
</body>
</html>
