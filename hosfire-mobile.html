<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D4E89">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HosFIRE">
<title>HosFIRE Mobile</title>
<link rel="manifest" href="hosfire-mobile-manifest.json">
<link rel="apple-touch-icon" href="assets/hosfire-mobile-180.png">
<link rel="icon" href="assets/hosfire-mobile-192.png">
<style>
:root{--blue:#1D4E89;--blue2:#163C6A;--sky:#E8F0FA;--red:#C62828;--redbg:#FDECEA;--ink:#14243A;--muted:#5E6E82;--line:#DCE4EE;--ok:#1E8A55;--okbg:#E5F4EC;--amb:#B36B00;--ambbg:#FFF3DF;--bg:#F3F6FA}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
.hide{display:none!important}
.top{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--blue) 0%,var(--blue2) 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;border-bottom:4px solid var(--red)}
.top .t{font-weight:900;font-size:20px;letter-spacing:.4px}.top .t span{color:#FF8A80}
.top .s{font-size:12px;color:#C9D8EC}
.top .row{display:flex;align-items:center;gap:10px}.grow{flex:1}
.top button{background:rgba(255,255,255,.14);border:none;color:#fff;border-radius:9px;padding:7px 11px;font-weight:700;font-size:13px}
.wrap{padding:14px 14px calc(env(safe-area-inset-bottom) + 90px)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(20,36,58,.05)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,var(--blue) 0%,var(--blue2) 70%,#4a1414 100%)}
.login .card{width:100%;max-width:380px;border-top:6px solid var(--red);padding:22px}
.login h1{margin:4px 0 2px;text-align:center;font-size:26px;color:var(--blue)}.login h1 span{color:var(--red)}
.login p{text-align:center;color:var(--muted);font-size:13px;margin:0 0 14px}
label{display:block;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:12px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-size:16px}
textarea{min-height:90px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;font-size:16px}
.btn.red{background:var(--red)}.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--line)}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:8px;text-align:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chips button{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:8px 13px;font-weight:700;color:var(--muted);font-size:14px}
.chips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px}
button.stat{font:inherit;color:inherit;cursor:pointer;border:1.5px solid var(--line)}
button.stat.on{border-color:var(--sc);box-shadow:0 0 0 2px var(--sc) inset;background:#fff}.stat span{font-size:11px;color:var(--muted);font-weight:700}
.item{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:5px solid var(--red);border-radius:12px;padding:12px;margin-bottom:9px;color:var(--ink)}
.item.ip{border-left-color:var(--amb)}.item.done{border-left-color:var(--ok);opacity:.8}
.item .r{display:flex;gap:8px;align-items:center}.item .ref{font-weight:900;color:var(--blue);min-width:34px}
.item .tt{font-weight:700;font-size:15px;margin-top:3px}
.item .m{font-size:12px;color:var(--muted);margin-top:4px}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px;white-space:nowrap}
.p-ns{background:var(--redbg);color:var(--red)}.p-ip{background:var(--ambbg);color:var(--amb)}.p-c{background:var(--okbg);color:var(--ok)}.p-h{background:var(--redbg);color:var(--red)}
.bar{height:8px;background:#E3E9F1;border-radius:4px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--amb);border-radius:4px}
.seg{display:grid;gap:6px}.seg button{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:12px 4px;font-weight:800;color:var(--muted);font-size:14px}
.seg3{grid-template-columns:repeat(3,1fr)}.seg5{grid-template-columns:repeat(5,1fr)}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.seg button.on.ns{background:var(--red);border-color:var(--red)}.seg button.on.ip{background:var(--amb);border-color:var(--amb)}.seg button.on.c{background:var(--ok);border-color:var(--ok)}
.step{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}
.step input{width:24px;height:24px;flex:0 0 24px;accent-color:var(--blue)}
.step .by{font-size:12px;color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos div{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#E3E9F1}
.photos img{width:100%;height:100%;object-fit:cover}
.photos .new{outline:3px solid var(--red)}
.photos small{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:2px 4px}
.save{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);background:rgba(243,246,250,.96);border-top:1px solid var(--line);z-index:20}
.hist{font-size:13px;border-bottom:1px solid var(--line);padding:7px 0}.hist b{color:var(--blue)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;z-index:50;max-width:90vw;text-align:center}
.off{background:var(--ambbg);color:var(--amb);font-size:13px;font-weight:700;padding:8px 12px;text-align:center}
h2{margin:2px 0 4px;font-size:19px}.muted{color:var(--muted);font-size:13px}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="card">
    <img src="assets/hosfire-mobile-192.png" alt="" style="width:72px;height:72px;display:block;margin:0 auto 6px;border-radius:16px">
    <h1>Hos<span>FIRE</span> Mobile</h1>
    <p>Brandon Hall Hotel and Spa — fire safety actions</p>
    <label>Your name</label><select id="lg-user"></select>
    <label>HosFIRE code</label><input id="lg-code" type="password" inputmode="numeric" autocomplete="off">
    <button class="btn red" id="lg-go" style="margin-top:16px">Sign in</button>
    <div class="err" id="lg-err"></div>
  </div>
</div>

<div id="app" class="hide">
  <div class="top"><div class="row">
    <button id="back" class="hide">‹ Back</button>
    <div class="grow"><div class="t">Hos<span>FIRE</span> Mobile</div><div class="s" id="who"></div></div>
    <button id="out">Sign out</button>
  </div></div>
  <div id="offline" class="off hide">You are offline — changes are saved on the phone and sent when you are back online. Photos need a connection.</div>
  <div class="wrap" id="view"></div>
</div>
<div id="savebar" class="save hide"><button class="btn red" id="save">Save update</button></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="hosfire-defs.js?v=20261027a"></script>
<script>
/* ============================================================
   HosFIRE Mobile — phone app for updating fire safety actions.
   Writes to the same hosfire_actions collection and hosfire/
   storage folder as the HosFIRE portal, so every update shows
   there straight away. ?demo=1 runs it without Firebase.
   ============================================================ */
(function () {
"use strict";
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const h = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pad = (n) => String(n).padStart(2, "0");
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fdt = (t) => { const d = new Date(t && t.toMillis ? t.toMillis() : t); return `${d.getDate()} ${MON[d.getMonth()]} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fds = (s) => { if (!s) return ""; const [y, m, d] = s.split("-").map(Number); return `${d} ${MON[m - 1]}`; };
const nat = (a, b) => String(a || "").localeCompare(String(b || ""), "en", { numeric: true });
const DEMO = /[?&]demo=1/.test(location.search);
const STATUS = ["Not started", "In progress", "Completed"];
const toast = (m) => { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); };

const LOGINS = {};
Object.entries(typeof FB_LOGINS !== "undefined" ? FB_LOGINS : {}).forEach(([k, v]) => { if (!v.spare) LOGINS[k] = v; });
Object.assign(LOGINS, typeof HF_EXTRA_LOGINS !== "undefined" ? HF_EXTRA_LOGINS : {});
const keyByEmail = (e) => Object.keys(LOGINS).find((k) => LOGINS[k].email === e);

const S = { live: false, key: null, user: null, actions: [], sigs: [], regs: [], view: "list", filter: "open", q: "", openId: null, draft: null };
let fb = null, unsub = null;

function init() {
  if (DEMO) return false;
  try {
    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
    fb = { auth: firebase.auth(), db: firebase.firestore(), st: firebase.storage() };
    try { fb.db.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch (e) {}
    return true;
  } catch (e) { console.warn(e); return false; }
}

/* ---------- login ---------- */
function buildLogin() {
  const sel = $("#lg-user");
  sel.innerHTML = `<option value="">Choose your name…</option>` + Object.entries(LOGINS).sort((a, b) => a[1].name.localeCompare(b[1].name)).map(([k, v]) => `<option value="${k}">${h(v.name)}</option>`).join("");
  try { sel.value = localStorage.getItem("hosfire_last_user") || "glenn.randell"; } catch (e) { sel.value = "glenn.randell"; }
  const go = async () => {
    const k = sel.value, code = $("#lg-code").value.trim().toUpperCase(), err = $("#lg-err"); err.textContent = "";
    if (!k) return (err.textContent = "Choose your name.");
    if (code !== HF_ACCESS_CODE && code !== String(LOGINS[k].code).toUpperCase()) return (err.textContent = "Incorrect code.");
    try { localStorage.setItem("hosfire_last_user", k); localStorage.setItem("hosfire_m_ok", "1"); } catch (e) {}
    if (!S.live) return enter(k);
    $("#lg-go").disabled = true; err.textContent = "Signing in…";
    try {
      if (fb.auth.currentUser && fb.auth.currentUser.email === LOGINS[k].email) return enter(k);
      await fb.auth.signInWithEmailAndPassword(LOGINS[k].email, LOGINS[k].pw);
    } catch (e) { $("#lg-go").disabled = false; err.textContent = /user-not-found|invalid/.test(e.code || "") ? "This login is not set up in Firebase yet — tell Ajay." : e.message; }
  };
  $("#lg-go").onclick = go; $("#lg-code").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  $("#out").onclick = async () => { try { localStorage.removeItem("hosfire_m_ok"); } catch (e) {} if (unsub) unsub(); if (S.live) await fb.auth.signOut(); location.reload(); };
}
function enter(k) {
  S.key = k; S.user = LOGINS[k];
  $("#login").classList.add("hide"); $("#app").classList.remove("hide");
  $("#who").textContent = `${S.user.name} · Brandon Hall Hotel and Spa`;
  if (S.live) {
    unsub = fb.db.collection("hosfire_actions").onSnapshot((snap) => {
      S.actions = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (S.view === "list" && !document.activeElement?.matches?.("#q")) render();
    }, (e) => toast("Cannot read actions — " + e.message));
    fb.db.collection("hosfire_signatures").onSnapshot((sn) => { S.sigs = sn.docs.map((d) => ({ id: d.id, ...d.data() })); if (S.view === "list") render(); }, () => {});
    fb.db.collection("hosfire_registers").where("kind", "==", "doc").onSnapshot((sn) => { S.regs = sn.docs.map((d) => ({ id: d.id, ...d.data() })); }, () => {});
  } else {
    try { S.actions = (JSON.parse(localStorage.getItem("hosfire_demo_v1") || "{}").actions) || []; } catch (e) {}
    render();
  }
}

/* ---------- helpers ---------- */
const prog = (a) => a.status === "Completed" ? 100 : (typeof a.pct === "number") ? a.pct : (a.steps && a.steps.length ? Math.round(a.steps.filter((x) => x.done).length / a.steps.length * 100) : 0);
const first = () => S.user.name.split(" ")[0].toLowerCase();
const mine = (a) => String(a.owner || "").toLowerCase().includes(first()) || String(a.contractor || "").toLowerCase().includes(first());
const stCls = (s) => s === "Completed" ? "c" : s === "In progress" ? "ip" : "ns";

/* ---------- documents to sign ---------- */
function toSign() {
  const out = [];
  Object.entries(typeof HF_SIGN_REQ !== "undefined" ? HF_SIGN_REQ : {}).forEach(([docId, req]) => req.forEach((q) => {
    if (q.who !== S.key) return;
    if (S.sigs.some((x) => x.docId === docId && x.role === q.role && x.signerKey === S.key)) return;
    const d = S.regs.find((r) => r.id === docId) || { title: docId };
    out.push({ docId, role: q.role, title: d.title, version: d.version || "", file: d.file });
  }));
  return out;
}
/* ---------- list ---------- */
function list() {
  const A = S.actions;
  let rows = A.slice();
  if (S.filter === "mine") rows = rows.filter((a) => mine(a) && a.status !== "Completed");
  else if (S.filter.startsWith("src:")) rows = rows.filter((a) => HF_SOURCE_OF(a).key === S.filter.slice(4) && a.status !== "Completed");
  else if (S.filter === "open") rows = rows.filter((a) => a.status !== "Completed");
  else if (S.filter === "high") rows = rows.filter((a) => a.priority === "High" && a.status !== "Completed");
  else if (S.filter === "done") rows = rows.filter((a) => a.status === "Completed");
  else if (S.filter === "ns") rows = rows.filter((a) => a.status === "Not started");
  else if (S.filter === "ip") rows = rows.filter((a) => a.status === "In progress");
  if (S.q) { const q = S.q.toLowerCase(); rows = rows.filter((a) => (a.ref + " " + a.title + " " + (a.notes || "")).toLowerCase().includes(q)); }
  const pr = { High: 0, Medium: 1, Low: 2 }, so = { "In progress": 0, "Not started": 1, "Completed": 2 };
  rows.sort((a, b) => (so[a.status] - so[b.status]) || (pr[a.priority] - pr[b.priority]) || nat(a.ref, b.ref));
  const open = A.filter((a) => a.status !== "Completed");
  const srcs = HF_SOURCES_TAG.filter((t) => open.some((a) => HF_SOURCE_OF(a).key === t.key));
  const done = A.filter((a) => a.status === "Completed").length;
  const overall = A.length ? Math.round(A.reduce((t, a) => t + prog(a), 0) / A.length) : 0;
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const touched = A.filter((a) => (a.history || []).some((x) => x.at >= t0.getTime() && !/starting data/i.test(x.note || ""))).length;
  return `<div class="card" style="padding:12px 14px">
      <div style="display:flex;align-items:baseline;gap:8px"><b style="font-size:22px;color:var(--blue)">${done} of ${A.length}</b><span class="muted">jobs completed</span><span class="grow" style="flex:1"></span><b style="color:var(--blue)">${overall}%</b></div>
      <div class="bar" style="height:10px"><i style="width:${overall}%;background:var(--ok)"></i></div>
      <div class="muted" style="margin-top:6px">${touched} job${touched === 1 ? "" : "s"} updated today</div></div>
    <div class="stats">
      <button class="stat ${S.filter === "ns" ? "on" : ""}" data-f="ns" style="--sc:var(--red)"><b style="color:var(--red)">${A.filter((a) => a.status === "Not started").length}</b><span>Not started</span></button>
      <button class="stat ${S.filter === "ip" ? "on" : ""}" data-f="ip" style="--sc:var(--amb)"><b style="color:var(--amb)">${A.filter((a) => a.status === "In progress").length}</b><span>In progress</span></button>
      <button class="stat ${S.filter === "done" ? "on" : ""}" data-f="done" style="--sc:var(--ok)"><b style="color:var(--ok)">${done}</b><span>Completed</span></button></div>
    ${["ns", "ip", "done"].includes(S.filter) ? `<div class="muted" style="margin:-4px 0 8px">Showing <b>${{ ns: "Not started", ip: "In progress", done: "Completed" }[S.filter]}</b> jobs · <a href="#" id="clearf">show all open</a></div>` : ""}
    <div class="chips">${[["open", `All open (${open.length})`], ["high", "High priority"], ["mine", "My tasks"], ...srcs.map((t) => ["src:" + t.key, `<i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${t.color};margin-right:5px"></i>${t.label} (${open.filter((a) => HF_SOURCE_OF(a).key === t.key).length})`]), ["done", "Completed"]].map(([k, l]) => `<button data-f="${k}" class="${S.filter === k ? "on" : ""}">${l}</button>`).join("")}</div>
    ${toSign().length ? `<button class="btn" id="signbtn" style="margin-bottom:8px;background:#6A3FA0">✍️ ${toSign().length} document${toSign().length > 1 ? "s" : ""} to sign</button>` : ""}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px"><button class="btn red" id="newtask">+ New task</button><button class="btn" id="newdoc">📄 Upload document</button></div>
    <input id="q" placeholder="Search actions…" value="${h(S.q)}" style="margin-bottom:10px">
    ${rows.map((a) => { const sc = HF_SOURCE_OF(a); return `<button class="item ${stCls(a.status) === "c" ? "done" : ""}" data-id="${a.id}" style="border-left-color:${sc.color}">
      <div class="r"><span class="ref" style="color:${sc.color}">${h(a.ref)}</span><span class="pill" style="background:${sc.color};color:#fff">${h(sc.label)}</span><span class="grow"></span>${a.priority === "High" ? '<span class="pill p-h">High</span>' : ""}<span class="pill p-${stCls(a.status)}">${h(a.status)}</span></div>
      <div class="tt">${h(a.title)}</div>
      <div class="m">${h(a.owner || "")}${a.due ? " · due " + fds(a.due) : ""}${(a.photos || []).length ? " · 📷 " + a.photos.length : ""} · ${prog(a)}%</div>
      <div class="bar"><i style="width:${prog(a)}%;${prog(a) >= 100 ? "background:var(--ok)" : ""}"></i></div></button>`; }).join("") || `<div class="card muted">${S.filter === "mine" ? "No open tasks with your name as owner. Try “All open”." : "Nothing here."}</div>`}`;
}

/* ---------- detail ---------- */
function detail() {
  const a = S.actions.find((x) => x.id === S.openId); if (!a) { S.view = "list"; return list(); }
  const d = S.draft;
  const pc = d.pct != null ? d.pct : prog({ ...a, status: d.status, steps: d.steps, pct: undefined });
  return `<div class="card">
      <div class="row" style="display:flex;gap:8px;align-items:center"><b style="color:${HF_SOURCE_OF(a).color};font-size:18px">${h(a.ref)}</b><span class="pill" style="background:${HF_SOURCE_OF(a).color};color:#fff">${h(HF_SOURCE_OF(a).label)}</span><span class="grow" style="flex:1"></span>${a.priority === "High" ? '<span class="pill p-h">High</span>' : ""}</div>
      <h2>${h(a.title)}</h2>
      ${a.detail ? `<div class="muted">${h(a.detail)}</div>` : ""}
      <div class="muted" style="margin-top:6px">${h(a.category || "")}${a.owner ? " · " + h(a.owner) : ""}${a.contractor ? " · " + h(a.contractor) : ""}${a.due ? " · due " + fds(a.due) : ""}</div>
      ${a.notes ? `<div style="margin-top:8px;font-size:14px;background:var(--sky);padding:9px;border-radius:9px"><b>Latest:</b> ${h(a.notes)}</div>` : ""}
    </div>
    <div class="card">
      <label style="margin-top:0">Status</label>
      <div class="seg seg3">${STATUS.map((s) => `<button data-st="${s}" class="${stCls(s)} ${d.status === s ? "on" : ""}">${s}</button>`).join("")}</div>
      <label>Progress — ${pc}%</label>
      <div class="seg seg5">${[0, 25, 50, 75, 100].map((n) => `<button data-p="${n}" class="${pc === n ? "on" : ""}">${n}%</button>`).join("")}</div>
      <div class="bar" style="height:10px"><i style="width:${pc}%;${pc >= 100 ? "background:var(--ok)" : ""}"></i></div>
    </div>

function shrink(file) { // resize to max 1600px JPEG so uploads are quick on mobile data
  return new Promise((res) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const m = 1600, r = Math.min(1, m / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob((b) => { URL.revokeObjectURL(url); res(b || file); }, "image/jpeg", 0.82);
    };
    img.onerror = () => res(file); img.src = url;
  });
}

async function save() {
  if (S.view === "doc") return saveDoc();
  if (S.view === "new") return saveNew();
  const a = S.actions.find((x) => x.id === S.openId), d = S.draft;
  d.note = $("#note").value.trim(); d.caption = $("#cap").value.trim();
  const btn = $("#save"); btn.disabled = true; btn.textContent = "Saving…";
  try {
    const photos = (a.photos || []).slice(); let up = 0;
    for (const p of d.newPhotos) {
      if (!S.live) { up++; continue; }
      if (navigator.onLine === false) throw new Error("No signal — photos need a connection. Try again when you have signal.");
      btn.textContent = `Uploading photo ${up + 1} of ${d.newPhotos.length}…`;
      const path = `hosfire/actions/${a.ref || a.id}/${Date.now()}_${up}.jpg`;
      await fb.st.ref(path).put(p.blob, { contentType: "image/jpeg" });
      photos.push({ path, name: p.name, caption: d.caption, at: Date.now(), by: S.user.name }); up++;
    }
    const changed = d.status !== a.status || d.pct !== ((typeof a.pct === "number") ? a.pct : null) || JSON.stringify(d.steps) !== JSON.stringify(a.steps || []) || d.note || up;
    if (!changed) { toast("Nothing to save"); btn.disabled = false; btn.textContent = "Save update"; return; }
    // Any work recorded on a job that was "Not started" moves it to "In progress"
    if (d.status === "Not started" && (d.note || up || (d.pct != null && d.pct > 0) || d.steps.some((x) => x.done))) d.status = "In progress";
    const pc = d.pct != null ? d.pct : prog({ ...a, status: d.status, steps: d.steps, pct: undefined });
    const noteTxt = [d.note, up ? `${up} photo${up > 1 ? "s" : ""} added${d.caption ? ": " + d.caption : ""}` : "", `Progress ${pc}%`].filter(Boolean).join(" · ") + " (HosFIRE Mobile)";
    const upd = { status: d.status, steps: d.steps, pct: d.pct, photos, updatedBy: S.user.name, updatedAt: Date.now(),
      history: (a.history || []).concat([{ at: Date.now(), by: S.user.name, status: d.status, note: noteTxt }]) };
    if (d.note) upd.notes = d.note;
    if (d.status === "Completed" && a.status !== "Completed") upd.completedOn = today();
    if (S.live) {
      await fb.db.collection("hosfire_actions").doc(a.id).set(upd, { merge: true });
      Object.assign(a, upd); // update the counters straight away, even before the server confirms
      fb.db.collection("hosfire_audit").add({ what: `Action ${a.ref} updated on HosFIRE Mobile: ${d.status}, ${pc}%${up ? `, ${up} photo(s)` : ""}`, ref: a.ref || "", byName: S.user.name, byEmail: S.user.email, createdAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(() => {});
    } else {
      Object.assign(a, upd);
      try { const j = JSON.parse(localStorage.getItem("hosfire_demo_v1") || "{}"); j.actions = S.actions; localStorage.setItem("hosfire_demo_v1", JSON.stringify(j)); } catch (e) {}
    }
    toast(`${a.ref} saved — ${d.status}, ${pc}%`);
    S.view = "list"; S.openId = null; render(); window.scrollTo(0, 0);
  } catch (e) { toast("Not saved: " + e.message); }
  btn.disabled = false; btn.textContent = "Save update";
}

  $("#back").onclick = () => { if (S.draft && ((S.draft.newPhotos || []).length || ($("#note") && $("#note").value.trim()) || ($("#nt-title") && $("#nt-title").value.trim())) && !confirmLeave()) return; S.view = "list"; render(); window.scrollTo(0, 0); };
  $("#save").onclick = save;
  window.addEventListener("online", render); window.addEventListener("offline", render);
  if (S.live) fb.auth.onAuthStateChanged((u) => {
    let ok = false; try { ok = localStorage.getItem("hosfire_m_ok") === "1"; } catch (e) {}
    if (u && !S.user && ok) { const k = keyByEmail(u.email); if (k) enter(k); }
    else if (u && !S.user) { const k = keyByEmail(u.email); if (k) $("#lg-user").value = k; }
  });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("hosfire-mobile-sw.js", { scope: "./hosfire-mobile" }).catch(() => {});
});
let leaveArmed = 0;
function confirmLeave() { if (Date.now() - leaveArmed < 4000) return true; leaveArmed = Date.now(); toast("You have an unsaved photo or note — tap Back again to discard it"); return false; }
})();
</script>
