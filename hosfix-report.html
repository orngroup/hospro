<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Report a fault — HosFIX</title>
<style>
  :root{ --navy:#1F3864; --brown:#965638; --ink:#1a2b3a; --muted:#6b7280; --line:#dde3ea; --bg:#f4f6f9; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Lato,Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  .wrap{ max-width:560px; margin:0 auto; padding:0 16px 56px; }
  .top{ background:var(--navy); color:#fff; padding:18px 16px; margin:0 -16px 0; display:flex; align-items:center; gap:14px; }
  .top img{ height:40px; width:auto; }
  .top .brand{ font-size:11px; letter-spacing:.8px; text-transform:uppercase; opacity:.8; font-weight:700; }
  .top h1{ font-size:19px; margin:2px 0 0; font-weight:800; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 16px; margin-top:16px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  label.l{ display:block; font:700 11px Lato; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin:14px 0 5px; }
  label.l:first-child{ margin-top:0; }
  select,input,textarea{ width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:9px; font:15px inherit; color:var(--ink); background:#fff; }
  textarea{ min-height:90px; resize:vertical; }
  .prio{ display:flex; gap:7px; flex-wrap:wrap; }
  .prio button{ flex:1; min-width:70px; padding:10px 6px; border:1.5px solid var(--line); border-radius:9px; background:#fff; font:700 13px inherit; cursor:pointer; color:var(--ink); }
  .prio button.on{ color:#fff; border-color:transparent; }
  .sub{ background:var(--brown); color:#fff; border:none; border-radius:11px; padding:15px; font:800 16px inherit; width:100%; margin-top:20px; cursor:pointer; }
  .sub:disabled{ opacity:.6; }
  .hint{ font-size:12px; color:var(--muted); margin-top:6px; }
  .ok{ text-align:center; padding:30px 10px; }
  .ok .big{ font-size:46px; }
  .ok h2{ color:var(--navy); margin:10px 0 4px; }
  .photo-prev{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .photo-prev img{ width:70px; height:70px; object-fit:cover; border-radius:8px; border:1px solid var(--line); }
  .err{ color:#b3261e; font-size:13px; margin-top:10px; }
</style>
</head>
<body>
<div class="top"><img src="assets/logos/logo---white-transparent.png" alt="Brandon Hall" onerror="this.style.display='none'"><div><div class="brand">Brandon Hall Hotel &amp; Spa · HosFIX</div><h1>Report a maintenance fault</h1></div></div>
<div class="wrap">
  <div class="card" id="form">
    <label class="l">Area</label>
    <select id="area" onchange="fillRooms()"></select>

    <label class="l">Room / location</label>
    <input list="roomlist" id="room" placeholder="Start typing a room number or name…" autocomplete="off">
    <datalist id="roomlist"></datalist>

    <label class="l">What's the fault?</label>
    <textarea id="desc" placeholder="e.g. Shower mixer dripping constantly; radiator not heating"></textarea>

    <label class="l">Type of work (optional)</label>
    <select id="wtype"></select>

    <label class="l">Priority</label>
    <div class="prio" id="prio"></div>

    <label class="l">Your name</label>
    <input id="by" placeholder="e.g. Front Desk — Sarah">

    <label class="l">Photo (optional)</label>
    <input type="file" id="photo" accept="image/*" capture="environment" onchange="loadPhoto(this)">
    <div class="photo-prev" id="prev"></div>

    <button class="sub" id="submit" onclick="submitFault()">🔧 Send to the maintenance team</button>
    <div class="hint">This goes straight to HosFIX and the maintenance team (Herman &amp; Pete). Glenn can reassign if needed.</div>
    <div class="err" id="err"></div>
  </div>

  <div class="card ok" id="done" style="display:none">
    <div class="big">✅</div>
    <h2>Fault reported</h2>
    <div id="donemsg" style="color:var(--muted)"></div>
    <button class="sub" style="background:var(--navy);max-width:260px;margin:22px auto 0" onclick="resetForm()">Report another fault</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="hoshouse-config.js"></script>
<script>
(function(){
  "use strict";
  // Property areas + rooms — mirrors HosFIX so jobs file against the right area.
  var AREAS={
    bedrooms:{label:"Bedrooms",rooms:(function(){var a=[];for(var i=1;i<=120;i++)a.push("Room "+i);return a.concat(["Beech Suite","Brandon Suite 1","Brandon Suite 2","Hunt Room","Warwick Room","Wolston Suite","Junior Suite","Accessible Room"]);})()},
    meeting_events:{label:"Meeting & Events",rooms:["Wolston Suite","Brandon Suite","Brandon Suite 1","Brandon Suite 2","Beech Room","Hunt Room","Warwick Room","Boardroom","Event Lawn","Marquee Area"]},
    food_beverage:{label:"Food & Beverage",rooms:["Restaurant","Bar","Private Dining","Terrace","Kitchen"]},
    spa:{label:"Spa & Leisure",rooms:["Spa","Pool","Gym","Treatment Room 1","Treatment Room 2","Sauna","Steam Room"]},
    public_areas:{label:"Public Areas",rooms:["Reception","Lobby","Corridors (Ground)","Corridors (First)","Corridors (Second)","Lift","Car Park","Gardens","Woodlands","Main Entrance","Staff Areas","Cellar/Store"]},
    external:{label:"External / Grounds",rooms:["Car Park","Gardens","Woodlands","External Walls","Roof","Outbuildings"]},
    maintenance:{label:"Maintenance Areas",rooms:["Boiler Room","Plant Room","Electrical Cupboard","Linen Store","Bin Store","Cellar"]}
  };
  var WORK=[["","— not sure —"],["plumbing","Plumbing"],["electrical","Electrical"],["decorating","Decorating / Painting"],["carpentry","Carpentry / Joinery"],["hvac","HVAC / Air Con"],["glazing","Glazing / Windows"],["flooring","Flooring / Carpets"],["roofing","Roofing"],["pest","Pest Control"],["fire","Fire Safety"],["general","General Maintenance"]];
  var PRIOS=[["low","Low","#2a6a4a"],["medium","Medium","#997300"],["high","High","#b3261e"],["urgent","Urgent","#c45c00"]];
  var prio="medium", photo=null, busy=false;
  function $(id){ return document.getElementById(id); }

  // build area + work-type + priority
  $('area').innerHTML=Object.keys(AREAS).map(function(k){return '<option value="'+k+'">'+AREAS[k].label+'</option>';}).join('');
  $('wtype').innerHTML=WORK.map(function(w){return '<option value="'+w[0]+'">'+w[1]+'</option>';}).join('');
  $('prio').innerHTML=PRIOS.map(function(p){return '<button data-p="'+p[0]+'" data-c="'+p[2]+'" onclick="pickPrio(\''+p[0]+'\')">'+p[1]+'</button>';}).join('');
  window.pickPrio=function(p){ prio=p; Array.prototype.forEach.call(document.querySelectorAll('#prio button'),function(b){ var on=b.dataset.p===p; b.classList.toggle('on',on); b.style.background=on?b.dataset.c:'#fff'; }); };
  window.fillRooms=function(){ var a=$('area').value; $('roomlist').innerHTML=(AREAS[a]?AREAS[a].rooms:[]).map(function(r){return '<option value="'+r+'">';}).join(''); };
  window.loadPhoto=function(inp){
    var f=inp.files&&inp.files[0]; if(!f) return;
    var img=new Image(), url=URL.createObjectURL(f);
    img.onload=function(){
      var max=1200, w=img.width, h=img.height; if(w>max||h>max){ if(w>h){ h=Math.round(h*max/w); w=max; } else { w=Math.round(w*max/h); h=max; } }
      var c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      try{ photo=c.toDataURL('image/jpeg',0.7); }catch(e){ photo=null; }
      URL.revokeObjectURL(url);
      $('prev').innerHTML=photo?'<img src="'+photo+'" alt="">':'';
    };
    img.onerror=function(){ URL.revokeObjectURL(url); };
    img.src=url;
  };
  window.resetForm=function(){ $('desc').value=''; $('room').value=''; $('by').value=''; photo=null; $('prev').innerHTML=''; $('photo').value=''; prio='medium'; window.pickPrio('medium'); $('done').style.display='none'; $('form').style.display='block'; $('err').textContent=''; };

  window.submitFault=async function(){
    if(busy) return;
    var area=$('area').value, loc=($('room').value||'').trim(), desc=($('desc').value||'').trim(), by=($('by').value||'').trim(), wtype=$('wtype').value;
    $('err').textContent='';
    if(!loc){ $('err').textContent='Please choose or type the room / location.'; return; }
    if(!desc){ $('err').textContent='Please describe the fault.'; return; }
    if(!window.HH || !HH.raiseFixJob){ $('err').textContent='Could not connect — please check your internet and try again.'; return; }
    busy=true; var btn=$('submit'); btn.disabled=true; btn.textContent='Sending…';
    var m=loc.match(/^Room\s+(\d+)/i); var roomNo=m?m[1]:'';
    try{
      var job=await HH.raiseFixJob({ area:area, location:loc, room:roomNo, description:desc, workType:wtype, priority:prio, by:by||'Reception', source:'Reception', photos:photo?[photo]:[] });
      $('donemsg').innerHTML='Job <b>'+(job&&job.id?job.id:'')+'</b> raised for <b>'+loc.replace(/</g,'')+'</b> and sent to the maintenance team.';
      $('form').style.display='none'; $('done').style.display='block';
      try{ window.scrollTo(0,0); }catch(e){}
    }catch(e){
      $('err').textContent='Sorry — that didn\'t send. Please try again.';
    }
    busy=false; btn.disabled=false; btn.textContent='🔧 Send to the maintenance team';
  };

  window.fillRooms(); window.pickPrio('medium');
})();
</script>
</body>
</html>
