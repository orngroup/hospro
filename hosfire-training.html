<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HosFIRE Training — Brandon Hall</title>
<meta name="theme-color" content="#1D4E89">
<link rel="icon" href="assets/favicon.png">
<style>
:root{--blue:#1D4E89;--blue2:#163C6A;--red:#C62828;--redbg:#FDECEA;--ink:#14243A;--muted:#5E6E82;--line:#DCE4EE;--ok:#1E8A55;--okbg:#E5F4EC;--bg:#F3F6FA}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit}.hide{display:none!important}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;border-bottom:4px solid var(--red);display:flex;align-items:center;gap:10px}
.top img{height:34px;background:#fff;border-radius:6px;padding:3px}.top b{font-size:19px}.top b span{color:#FF8A80}.top small{display:block;color:#C9D8EC;font-size:12px}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 110px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px;box-shadow:0 1px 2px rgba(20,36,58,.05)}
h1{font-size:24px;margin:0 0 6px;color:var(--blue2)}h2{font-size:21px;margin:0 0 10px;color:var(--blue2)}
.muted{color:var(--muted);font-size:14px}
label{display:block;font-weight:700;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 5px}
input,select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:15px;font-weight:800;font-size:17px;background:var(--red);color:#fff;margin-top:14px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--blue2);border:1.5px solid var(--line)}.btn:disabled{opacity:.5}
.mod{display:block;text-align:left;width:100%;border:2px solid var(--line);background:#fff;border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer}
.mod b{display:block;font-size:18px;color:var(--blue2)}.mod.req{border-color:var(--red)}
.pill{display:inline-block;font-size:12px;font-weight:800;border-radius:20px;padding:2px 9px;background:var(--redbg);color:var(--red);margin-left:6px}
.prog{height:8px;background:#E3E9F1;border-radius:6px;overflow:hidden;margin:4px 0 14px}.prog i{display:block;height:100%;background:var(--ok)}
.slide ul{padding-left:20px;margin:0}.slide li{margin-bottom:10px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:10px}
.nav .btn{margin:0}
.q{margin-bottom:16px}.q b{display:block;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;margin-bottom:6px;cursor:pointer}
.opt.on{border-color:var(--blue);background:#E8F0FA;font-weight:700}.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.wrong{border-color:var(--red);background:var(--redbg)}
canvas{width:100%;height:170px;border:1.5px dashed var(--line);border-radius:10px;background:#fff;touch-action:none}
.err{color:var(--red);font-weight:700;margin-top:8px;font-size:15px}
.cert{border:3px solid var(--blue2);border-top:8px solid var(--red);border-radius:12px;padding:22px;text-align:center}
.cert img{height:60px}.cert h1{margin:10px 0}
@media print{.top,.nav,.noprint{display:none!important}body{background:#fff}.wrap{padding:0}.card{border:none;box-shadow:none}}
</style>
</head>
<body>
<div class="top"><img src="assets/marketing/logos/logo-blue-transparent.png" alt=""><div><b>Hos<span>FIRE</span> Training</b><small>Brandon Hall Hotel and Spa — fire safety for every member of staff</small></div><a href="fire/" style="margin-left:auto;color:#fff;font-size:13px;text-decoration:none;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:5px 9px;white-space:nowrap">⌂ Fire home</a></div>
<div class="wrap" id="app"></div>
<div class="nav hide" id="nav"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="hosfire-defs.js?v=20261027b"></script>
<script>
(() => {
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const h = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = (n) => String(n).padStart(2, "0"), today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const MON = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const fd = (s) => { const [y, m, d] = s.split("-"); return `${+d} ${MON[+m - 1]} ${y}`; };
const DEMO = /[?&]demo=1/.test(location.search), DK = "hosfire_demo_v1";
const DEPTS = [["reception", "Reception"], ["nights", "Nights"], ["restaurant", "Restaurant / F&B"], ["bar", "Bar"], ["kitchen", "Kitchen"], ["housekeeping", "Housekeeping"], ["maintenance", "Maintenance"], ["spa", "Spa"], ["admin", "Management / office"], ["other", "Other"]];
const QS = new URLSearchParams(location.search), QDEPT = (QS.get("dept") || "").toLowerCase(), HOD = QS.get("hod") === "1";
const deptLabel = (k) => (DEPTS.find((d) => d[0] === k) || [k, k])[1];
const st = { mod: null, step: 0, name: "", dept: "", start: "", regs: [], site: {}, answers: {}, order: {} };
let fb = null;
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fill = (t) => String(t).replace("{assembly}", st.site.assembly || "the assembly point shown on the fire action notices").replace("{manager}", HF_FIRE_MANAGER.name).replace("{marshals}", HF_MARSHALS.join(", "));

async function connect() {
  if (DEMO) { const j = JSON.parse(localStorage.getItem(DK) || "{}"); st.regs = (j.registers || []).filter((r) => r.kind === "training"); st.site = Object.assign({}, HF_SITE_DEFAULT, ((j.config || []).find((c) => c.id === "main") || {}).site || {}); return; }
  firebase.apps.length || firebase.initializeApp(firebaseConfig);
  fb = { auth: firebase.auth(), db: firebase.firestore() };
  if (!fb.auth.currentUser || fb.auth.currentUser.email !== HF_KIOSK.email) await fb.auth.signInWithEmailAndPassword(HF_KIOSK.email, HF_KIOSK.pw);
  const rs = await fb.db.collection("hosfire_registers").where("kind", "==", "training").get(); st.regs = rs.docs.map((d) => ({ id: d.id, ...d.data() }));
  try { const c = await fb.db.collection("hosfire_config").doc("main").get(); st.site = Object.assign({}, HF_SITE_DEFAULT, (c.exists && c.data().site) || {}); } catch (e) { st.site = Object.assign({}, HF_SITE_DEFAULT); }
}

const app = $("#app"), nav = $("#nav");
const setNav = (html) => { nav.innerHTML = html; nav.classList.toggle("hide", !html); };

function viewCode() {
  setNav("");
  app.innerHTML = `<div class="card"><h1>Fire safety training</h1>
    <p>Every member of staff completes the <b>fire safety induction</b> when they start, and a short <b>monthly refresher</b> after that. It takes about 15 minutes for the induction and 3 minutes for the refresher. Your completion is recorded on the hotel training record.</p>
    <label>Staff code</label><input id="code" type="password" inputmode="numeric" placeholder="Ask your manager" autocomplete="off">
    <button class="btn" id="go">Start</button><div class="err" id="e"></div></div>`;
  $("#code").onkeydown = (e) => { if (e.key === "Enter") $("#go").click(); };
  $("#go").onclick = async () => {
    let ok = false; try { ok = sessionStorage.getItem("hf_fire_ok") === "1"; } catch (e) {}
    if (!ok && $("#code").value.trim() !== HF_KIOSK_CODE) { $("#e").textContent = "That code is not right."; return; }
    try { sessionStorage.setItem("hf_fire_ok", "1"); } catch (e) {}
    $("#go").disabled = true; $("#go").textContent = "Connecting…";
    try { await connect(); viewWho(); } catch (err) { $("#go").disabled = false; $("#go").textContent = "Start"; $("#e").textContent = "Could not connect: " + err.message; }
  };
}

function viewWho() {
  setNav("");
  const names = st.regs.map((r) => r.name).sort();
  const topic = hfMonthlyTopic();
  app.innerHTML = `${DEPTS.some((d) => d[0] === QDEPT) ? `<div class="card" style="border-left:6px solid var(--red);padding:12px 16px"><b>${h(deptLabel(QDEPT))} team</b> <span class="muted">— fire safety training</span></div>` : ""}<div class="card"><h2>Who are you?</h2>
    <label>Your full name</label><input id="nm" list="names" placeholder="Start typing your name" value="${h(st.name)}"><datalist id="names">${names.map((n) => `<option value="${h(n)}">`).join("")}</datalist>
    <div id="newp" class="hide"><p class="muted">You're not on the training list yet — that's fine, you'll be added.</p>
      <label>Department</label><select id="dp"><option value="">Choose…</option>${DEPTS.map(([k, l]) => `<option value="${k}" ${k === QDEPT ? "selected" : ""}>${l}</option>`).join("")}</select>
      <label>Date you started at Brandon Hall</label><input id="sd" type="date" max="${today()}"></div></div>
    <div class="card"><h2>Choose your training</h2>
    <button class="mod req" data-m="induction"><b>Fire safety induction <span class="pill">Required for everyone</span></b><span class="muted">10 short sections and a 10-question check · about 15 minutes. New staff: complete before your first shift.</span></button>
    ${HOD ? `<button class="mod req" data-m="hod"><b>Head of department — confirm the fire safety manual <span class="pill">Heads of department</span></b><span class="muted">Confirm you have read the ${h(deptLabel(QDEPT) || "department")} fire safety manual and will make sure your team completes the induction and monthly refresher.</span></button>` : ""}
    <button class="mod" data-m="monthly"><b>Monthly refresher — ${h(MON[new Date().getMonth()])}: ${h(topic[0])}</b><span class="muted">A short reminder and 3 questions · about 3 minutes. Every member of staff, every month.</span></button>
    <div class="err" id="e"></div></div>`;
  const chk = () => { const v = $("#nm").value.trim().toLowerCase(); $("#newp").classList.toggle("hide", !v || st.regs.some((r) => r.name.toLowerCase() === v)); };
  $("#nm").oninput = chk; chk();
  $$("[data-m]").forEach((b) => (b.onclick = () => {
    const nm = $("#nm").value.trim().replace(/\s+/g, " ");
    if (nm.split(" ").length < 2) { $("#e").textContent = "Please enter your first and last name."; return; }
    const known = st.regs.find((r) => r.name.toLowerCase() === nm.toLowerCase());
    if (b.dataset.m === "hod" && !QDEPT) { $("#e").textContent = "Please open this from the QR code in your department manual."; return; }
    if (!known && !$("#dp").value) { $("#e").textContent = "Please choose your department."; return; }
    st.name = known ? known.name : nm; st.dept = known ? known.dept || "" : $("#dp").value; st.start = known ? known.start || "" : $("#sd").value; st.reg = known || null;
    st.mod = b.dataset.m; st.step = 0; st.answers = {}; st.order = {};
    if (st.mod === "induction") viewSlide(); else if (st.mod === "hod") viewHod(); else viewMonthly();
  }));
}

function viewSlide() {
  const S = HF_TRAIN_INDUCTION.slides, i = st.step, [t, pts] = S[i];
  app.innerHTML = `<div class="muted">Fire safety induction · section ${i + 1} of ${S.length}</div><div class="prog"><i style="width:${Math.round(((i + 1) / (S.length + 2)) * 100)}%"></i></div>
    <div class="card slide"><h2>${h(t)}</h2><ul>${pts.map((p) => `<li>${h(fill(p))}</li>`).join("")}</ul></div>`;
  setNav(`<button class="btn ghost" id="bk">Back</button><button class="btn" id="nx">${i === S.length - 1 ? "Start the check" : "Next"}</button>`);
  $("#bk").onclick = () => { if (i === 0) viewWho(); else { st.step--; viewSlide(); } window.scrollTo(0, 0); };
  $("#nx").onclick = () => { if (i === S.length - 1) viewQuiz(HF_TRAIN_INDUCTION.quiz, HF_TRAIN_INDUCTION.pass, "Fire safety induction"); else { st.step++; viewSlide(); } window.scrollTo(0, 0); };
}

const HOD_DECL = [
  "I have read the fire safety manual for my department.",
  "Every member of my team (including casual and agency staff) will complete the online fire safety induction before their first shift; current staff by the date set by the Training Coordinator.",
  "Every member of my team will complete the monthly refresher by the 20th of each month, and I will chase anyone outstanding.",
  "I will show every new starter the fire exits, call points, extinguishers and fire action notices in our area on their first shift, and sign the new starter checklist.",
  "I will make sure my department's fire checks are done and recorded on time, and report anything unsafe straight away.",
  "I will tell the Training Coordinator about new starters, leavers and anyone who needs help to evacuate (PEEP)."];
function viewHod() {
  st.hodDept = QDEPT;
  app.innerHTML = `<div class="muted">Head of department confirmation · ${h(deptLabel(QDEPT))}</div><div class="prog"><i style="width:50%"></i></div>
    <div class="card"><h2>${h(deptLabel(QDEPT))} — fire safety manual</h2><p>Please read and tick each statement.</p>
    ${HOD_DECL.map((t, i) => `<label style="text-transform:none;font-size:16px;color:var(--ink);display:flex;gap:10px;align-items:flex-start;font-weight:600"><input type="checkbox" class="hd" style="width:auto;margin-top:5px">${h(t)}</label>`).join("")}<div class="err" id="e"></div></div>`;
  setNav(`<button class="btn ghost" id="bk">Back</button><button class="btn" id="nx">Sign</button>`);
  $("#bk").onclick = viewWho;
  $("#nx").onclick = () => { if ($$(".hd").some((x) => !x.checked)) { $("#e").textContent = "Please tick every statement."; return; } st.score = HOD_DECL.length; st.total = HOD_DECL.length; st.label = "Head of department confirmation — " + deptLabel(QDEPT) + " fire safety manual"; viewSign(); window.scrollTo(0, 0); };
}

function viewMonthly() {
  const [t, pts, qs] = hfMonthlyTopic();
  app.innerHTML = `<div class="muted">Monthly refresher · ${h(MON[new Date().getMonth()])}</div><div class="prog"><i style="width:40%"></i></div>
    <div class="card slide"><h2>${h(t)}</h2><ul>${pts.map((p) => `<li>${h(fill(p))}</li>`).join("")}</ul>
    <p class="muted">Remember: raise the alarm, get out, call 999 on every activation, never use the lift, and go to the assembly point: ${h(st.site.assembly || "")}.</p></div>`;
  setNav(`<button class="btn ghost" id="bk">Back</button><button class="btn" id="nx">Answer 3 questions</button>`);
  $("#bk").onclick = viewWho; $("#nx").onclick = () => { viewQuiz(qs, qs.length, "Monthly refresher — " + t); window.scrollTo(0, 0); };
}

function viewQuiz(Q, pass, label, review) {
  Q.forEach((q, i) => { if (!st.order[i]) st.order[i] = shuffle(q[1].map((_, j) => j)); });
  app.innerHTML = `<div class="muted">${h(label)} · check your understanding</div><div class="prog"><i style="width:85%"></i></div>
    <div class="card">${review ? `<div class="err" style="margin:0 0 12px">${review}</div>` : ""}${Q.map((q, i) => `<div class="q"><b>${i + 1}. ${h(fill(q[0]))}</b>${st.order[i].map((j) => `<button class="opt ${st.answers[i] === j ? "on" : ""}" data-q="${i}" data-a="${j}">${h(fill(q[1][j]))}</button>`).join("")}</div>`).join("")}</div>`;
  setNav(`<button class="btn" id="nx">Submit answers</button>`);
  $$(".opt").forEach((b) => (b.onclick = () => { st.answers[b.dataset.q] = +b.dataset.a; $$(`[data-q="${b.dataset.q}"]`).forEach((x) => x.classList.toggle("on", x === b)); }));
  $("#nx").onclick = () => {
    if (Q.some((_, i) => st.answers[i] === undefined)) { alertBox("Please answer every question."); return; }
    const score = Q.filter((q, i) => st.answers[i] === q[2]).length;
    if (score >= pass) { st.score = score; st.total = Q.length; st.label = label; viewSign(); }
    else { const wrong = Q.map((q, i) => (st.answers[i] === q[2] ? null : i + 1)).filter(Boolean); Q.forEach((q, i) => { if (st.answers[i] !== q[2]) delete st.answers[i]; });
      viewQuiz(Q, pass, label, `You scored ${score} out of ${Q.length} — you need ${pass}. Have another look at question${wrong.length > 1 ? "s" : ""} ${wrong.join(", ")}.`); }
    window.scrollTo(0, 0);
  };
}
function alertBox(t) { let e = $("#qerr"); if (!e) { e = document.createElement("div"); e.id = "qerr"; e.className = "err"; app.appendChild(e); } e.textContent = t; e.scrollIntoView({ behavior: "smooth" }); }

function viewSign() {
  app.innerHTML = `<div class="muted">${h(st.label)}</div><div class="prog"><i style="width:95%"></i></div>
    <div class="card"><h2>${st.mod === "hod" ? "Confirm and sign" : `Well done — ${st.score} out of ${st.total}`}</h2>
    <p>${st.mod === "hod" ? "Please sign to record your confirmation." : "Please confirm and sign to record your training."}</p>
    <label>Name</label><input value="${h(st.name)}" disabled><label>Date</label><input value="${fd(today())}" disabled>
    <label>Your signature — draw it with your finger</label><canvas id="cv"></canvas><button class="btn ghost" id="clr" style="margin-top:6px;padding:8px">Clear</button>
    <label style="text-transform:none;font-size:15px;color:var(--ink);display:flex;gap:10px;align-items:flex-start;margin-top:14px"><input type="checkbox" id="ok" style="width:auto;margin-top:4px">I, ${h(st.name)}, ${st.mod === "hod" ? `confirm the statements above as head of the ${h(deptLabel(QDEPT))} department.` : "have completed this fire safety training myself and understand the hotel's fire procedures."}</label>
    <div class="err" id="e"></div></div>`;
  const c = $("#cv"), ctx = c.getContext("2d"); let down = false, drawn = false; const r = window.devicePixelRatio || 1; c.width = c.clientWidth * r; c.height = c.clientHeight * r; ctx.scale(r, r); ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.strokeStyle = "#14243A";
  const pos = (e) => { const b = c.getBoundingClientRect(), t = e.touches ? e.touches[0] : e; return [t.clientX - b.left, t.clientY - b.top]; };
  const s1 = (e) => { e.preventDefault(); down = true; const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); }, s2 = (e) => { if (!down) return; e.preventDefault(); const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); drawn = true; };
  c.addEventListener("mousedown", s1); c.addEventListener("mousemove", s2); window.addEventListener("mouseup", () => (down = false));
  c.addEventListener("touchstart", s1, { passive: false }); c.addEventListener("touchmove", s2, { passive: false }); c.addEventListener("touchend", () => (down = false));
  $("#clr").onclick = () => { ctx.clearRect(0, 0, c.width, c.height); drawn = false; };
  setNav(`<button class="btn" id="sv">Save my training</button>`);
  $("#sv").onclick = async () => {
    if (!drawn) { $("#e").textContent = "Please sign in the box."; return; }
    if (!$("#ok").checked) { $("#e").textContent = "Please tick the declaration."; return; }
    $("#sv").disabled = true; $("#sv").textContent = "Saving…";
    try { await save(c.toDataURL("image/png")); viewDone(); } catch (err) { $("#sv").disabled = false; $("#sv").textContent = "Save my training"; $("#e").textContent = "Could not save: " + err.message; }
  };
}

async function save(sig) {
  const d = today(), k = st.mod, topic = k === "monthly" ? hfMonthlyTopic()[0] : "";
  const note = `${k === "hod" ? "HOD manual confirmation" : k === "induction" ? "HosFIRE online fire safety induction" : "HosFIRE monthly refresher — " + topic}: ${st.score}/${st.total}, signed online ${fd(d)}`;
  const log = { module: k, topic, title: st.label, name: st.name, dept: st.dept, start: st.start || "", date: d, score: st.score, total: st.total, passed: true, sig, device: navigator.userAgent.slice(0, 120), byName: st.name, byEmail: DEMO ? "demo" : HF_KIOSK.email };
  if (k === "hod") { log.dept = st.hodDept; log.title = st.label; }
  const keys = k === "induction" ? ["induction", "refresher", "procedure"] : k === "hod" ? [] : ["monthly"];
  const reg = st.reg, courses = Object.assign({}, (reg && reg.courses) || {}), ev = Object.assign({}, (reg && reg.ev) || {});
  keys.forEach((c) => { courses[c] = d; ev[c] = { confirmed: true, note, by: "HosFIRE Training" }; });
  const id = reg ? reg.id : "trn-web-" + st.name.toLowerCase().replace(/[^a-z0-9]+/g, "-");
  const upd = reg ? { courses, ev, updatedBy: st.name + " (HosFIRE Training)", updatedAt: Date.now() } : { kind: "training", name: st.name, role: "", dept: st.dept || "other", shift: st.dept === "nights" ? "Night" : "Day", start: st.start || "", marshal: false, courses, ev, note: "Added from HosFIRE Training", updatedBy: st.name + " (HosFIRE Training)", updatedAt: Date.now() };
  if (DEMO) {
    const j = JSON.parse(localStorage.getItem(DK) || "{}"); j.tlog = j.tlog || []; j.tlog.push({ id: "t" + Date.now(), ...log, createdAt: Date.now() });
    if (k !== "hod") { j.registers = j.registers || []; const i = j.registers.findIndex((x) => x.id === id); if (i >= 0) j.registers[i] = { ...j.registers[i], ...upd }; else j.registers.push({ id, ...upd }); }
    localStorage.setItem(DK, JSON.stringify(j)); return;
  }
  const ts = firebase.firestore.FieldValue.serverTimestamp();
  await fb.db.collection("hosfire_training").add({ ...log, createdAt: ts });
  if (k !== "hod") await fb.db.collection("hosfire_registers").doc(id).set(upd, { merge: true });
  fb.db.collection("hosfire_audit").add({ what: `Training completed online: ${st.label} — ${st.name} (${st.score}/${st.total})`, ref: "", byName: st.name, byEmail: HF_KIOSK.email, createdAt: ts }).catch(() => {});
}

function viewDone() {
  setNav(`<button class="btn ghost" id="pr">Print certificate</button><button class="btn" id="again">Finish</button>`);
  app.innerHTML = `<div class="card cert"><img src="assets/marketing/logos/logo-blue-transparent.png" alt=""><div class="muted" style="letter-spacing:.15em;text-transform:uppercase;color:var(--red);font-weight:800">Certificate of completion</div>
    <h1>${h(st.label)}</h1><p style="font-size:20px"><b>${h(st.name)}</b></p><p>${st.mod === "hod" ? `confirmed as head of department on <b>${fd(today())}</b>` : `completed this fire safety training on <b>${fd(today())}</b><br>Score ${st.score} out of ${st.total}`}</p>
    <p class="muted">Brandon Hall Hotel and Spa · recorded in HosFIRE · Fire Safety Manager: ${h(HF_FIRE_MANAGER.name)}</p></div>
    <div class="card noprint"><b>Thank you — your training is recorded.</b><p class="muted">${st.mod === "hod" ? "Thank you. Now share the training QR code in your manual with your team and check the Training Coordinator's list of who is outstanding." : st.mod === "induction" ? "Next: the monthly refresher, every month. Ask your manager where the fire exits, call points and extinguishers are in your area, and where to find the fire action notice." : "See you next month."}</p></div>`;
  $("#pr").onclick = () => window.print();
  $("#again").onclick = () => { st.name = ""; st.reg = null; viewWho(); window.scrollTo(0, 0); };
}

viewCode();
try { if (sessionStorage.getItem("hf_fire_ok") === "1") $("#go").click(); } catch (e) {}
})();
</script>
</body>
</html>
