<link rel="manifest" href="nightwalk.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#1a2b3a;--navy2:#223a4e;--gold:#BB9979;--green:#2a6a4a;--red:#b3261e;--amber:#b06a00;--line:#e4e8ee;--muted:#6b7886;--bg:#eef1f5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);font-family:Lato,system-ui,Arial,sans-serif;color:#1a2b3a;-webkit-text-size-adjust:100%}
body{max-width:620px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden}
.hide{display:none !important}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
.muted{color:var(--muted)}
/* login */
#login{position:fixed;inset:0;background:linear-gradient(160deg,#1a2b3a 0%,#223a4e 60%,#2b3f52 150%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;z-index:60}
#login .brand{font-family:'Playfair Display',serif;color:#fff;font-size:30px;font-weight:900}
#login .sub{color:#cdd8e2;letter-spacing:4px;font-size:12px;font-weight:800;margin-top:2px}
#login .app-ttl{color:#fff;font-weight:900;font-size:20px;margin-top:22px}
#login .app-sub{color:#cdd8e2;font-size:13px;margin-top:4px;text-align:center;max-width:300px;line-height:1.5}
.pinbox{background:#fff;border-radius:18px;padding:20px;margin-top:24px;width:100%;max-width:340px;box-shadow:0 10px 34px rgba(0,0,0,.25)}
.pinbox label{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.namebtns{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.namebtns button{padding:15px;border:2px solid var(--line);border-radius:13px;background:#f7f8fc;font-weight:900;font-size:17px;color:var(--navy);cursor:pointer;text-align:left}
.namebtns button:active{background:#eef1f7}
.otherwrap{display:flex;gap:8px;margin-top:10px}
.otherwrap input{flex:1;padding:13px;border:2px solid var(--line);border-radius:12px}
.otherwrap button{background:var(--green);color:#fff;border:none;border-radius:12px;padding:0 16px;font-weight:800;cursor:pointer}
/* header */
#app{padding-bottom:30px}
.hdr{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#1a2b3a,#223a4e);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px rgba(26,43,58,.22)}
.hdr .logo{width:40px;height:40px;border-radius:11px;flex:0 0 auto;background-size:cover}
.hdr .ht{flex:1;min-width:0}
.hdr .ht .t{font-weight:900;font-size:17px}
.hdr .ht .s{font-size:11.5px;color:#cdd8e2;margin-top:2px}
.hdr .gear{background:rgba(255,255,255,.14);border:none;color:#fff;width:38px;height:38px;border-radius:10px;font-size:17px;cursor:pointer}
.view{padding:16px 14px 24px}
.greet{font-weight:900;font-size:22px;margin:2px 2px 2px}
.greet-sub{color:var(--muted);font-size:13px;margin:0 2px 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.walkrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.walkrow:last-child{border-bottom:none}
.walkrow .wn{width:40px;height:40px;border-radius:11px;background:#1a2b3a;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.walkrow .wd{flex:1;min-width:0}
.walkrow .wd .t{font-weight:800;font-size:15px}
.walkrow .wd .s{font-size:12.5px;color:var(--muted);margin-top:1px}
.pill{border-radius:999px;padding:3px 11px;font-weight:800;font-size:12px}
.pill.ok{background:#e8f6ee;color:#13532f}.pill.prog{background:#fff5e6;color:#b06a00}.pill.due{background:#f1f4f7;color:#5b6b7b}
.bigbtn{width:100%;border:none;border-radius:15px;padding:18px;font-weight:900;font-size:18px;cursor:pointer;color:#fff;background:var(--green);box-shadow:0 4px 14px rgba(42,106,74,.3)}
.bigbtn.amber{background:var(--amber);box-shadow:0 4px 14px rgba(176,106,0,.3)}
.bigbtn.red{background:var(--red)}
.bigbtn:disabled{opacity:.5}
/* walk */
.walkhd{position:sticky;top:68px;z-index:20;background:var(--bg);padding:10px 0 8px}
.prog{height:10px;border-radius:6px;background:#e2e7ee;overflow:hidden}
.prog > i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.progtxt{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;color:var(--navy);margin-top:6px}
.zone{font-weight:900;font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;margin:16px 2px 8px}
.chk{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:9px}
.chk.done{border-color:#bfe3cd;background:#f3fbf6}
.chk.issue{border-color:#f0c4c0;background:#fdf1f0}
.chk .lab{font-weight:700;font-size:14.5px;line-height:1.35}
.chk .acts{display:flex;gap:8px;margin-top:10px}
.chk .acts button{flex:1;border:none;border-radius:10px;padding:11px;font-weight:800;font-size:14px;cursor:pointer}
.chk .sec{background:var(--green);color:#fff}
.chk .iss{background:#fff4e5;color:var(--amber);border:1px solid #f2d9ab !important}
.chk .stamp{margin-top:9px;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chk .stamp .t{color:#13532f}
.chk.issue .stamp .t{color:var(--red)}
.chk .stamp .redo{margin-left:auto;background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer}
.chk .note{margin-top:7px;font-size:13px;color:#7a2b25;background:#fff;border:1px solid #f0c4c0;border-radius:8px;padding:7px 9px}
.sticky-finish{position:sticky;bottom:0;padding:12px 0 calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(180deg,rgba(238,241,245,0),var(--bg) 30%)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1a2b3a;color:#fff;padding:11px 18px;border-radius:11px;font-weight:700;font-size:13.5px;z-index:90;opacity:0;transition:opacity .2s;max-width:90%;text-align:center}
.toast.on{opacity:1}
.banner{border-radius:12px;padding:11px 13px;font-size:13px;font-weight:700;margin-bottom:12px}
.banner.warn{background:#fff5e6;color:#8a5200;border:1px solid #f2d9ab}
.sheet{position:fixed;inset:0;background:rgba(10,18,26,.55);display:none;align-items:flex-end;justify-content:center;z-index:70}
.sheet.on{display:flex}
.sheet .inner{background:#fff;width:100%;max-width:620px;border-radius:20px 20px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px)}
.sheet .row{padding:14px 2px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;display:flex;gap:10px;cursor:pointer}
.sheet .row:last-child{border-bottom:none}
</style>
</head>
<body>

<div id="login">
  <div class="brand">Brandon Hall</div>
  <div class="sub">HOTEL &amp; SPA</div>
  <div class="app-ttl">🌙 Night Walk</div>
  <div class="app-sub">Fire &amp; security walk for the night manager. Sign in with your name — no password.</div>
  <div class="pinbox">
    <label>Who's walking tonight?</label>
    <div class="namebtns" id="namebtns"></div>
    <div class="otherwrap"><input id="othername" placeholder="Or type your name"><button onclick="pickOther()">Go</button></div>
  </div>
</div>

<div id="app" class="hide">
  <div class="hdr">
    <div class="logo" id="hdr-logo"></div>
    <div class="ht"><div class="t">🌙 Night Walk</div><div class="s">Brandon Hall Hotel &amp; Spa</div></div>
    <button class="gear" onclick="openSheet()">⚙️</button>
  </div>
  <div class="view" id="view"></div>
</div>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()">
  <div class="inner">
    <h3 style="margin:0 0 8px" id="sheet-who">Signed in</h3>
    <div class="row" onclick="howInstall()">📲 Add to home screen</div>
    <div class="row" onclick="location.reload()">🔄 Refresh</div>
    <div class="row" style="color:var(--red)" onclick="signOut()">🚪 Sign out</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
var $=function(id){return document.getElementById(id);};

var ME='';

/* helpers */
function nowAt(){ try{ return new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function nightOf(){ var d=new Date(); if(d.getHours()<7) d.setDate(d.getDate()-1); return d.toLocaleDateString('en-CA'); }
function greetWord(){ var h=new Date().getHours(); return (h>=5&&h<12)?'Good morning':(h<18?'Good afternoon':'Good evening'); }

/* boot */
function boot(){
  $('namebtns').innerHTML=NIGHT_STAFF.map(function(n){return '<button onclick="pick(\''+esc(n)+'\')">'+esc(n)+'</button>';}).join('');
  var saved=''; try{ saved=localStorage.getItem('nw_name')||''; }catch(e){}
  if(saved){ ME=saved; enterApp(); } else { $('login').classList.remove('hide'); }
}
function pick(n){ ME=n; try{ localStorage.setItem('nw_name',n); }catch(e){} enterApp(); }
function pickOther(){ var v=($('othername').value||'').trim(); if(v.length<2){ toast('Enter your name'); return; } pick(v); }
function signOut(){ try{ localStorage.removeItem('nw_name'); localStorage.removeItem('nw_active'); }catch(e){} closeSheet(); location.reload(); }
function openSheet(){ $('sheet-who').textContent='Signed in as '+ME; $('sheet').classList.add('on'); }
function closeSheet(){ $('sheet').classList.remove('on'); }
function howInstall(){ closeSheet(); alert('Add Night Walk to your home screen:\n\niPhone (Safari): Share → “Add to Home Screen”.\nAndroid (Chrome): ⋮ menu → “Add to Home screen”.'); }

function enterApp(){ $('login').classList.add('hide'); $('app').classList.remove('hide'); viewHome(); }

/* ---- HOME ---- */
var TONIGHT=[];
function viewHome(){
  var v=$('view');
  v.innerHTML='<div class="greet">'+greetWord()+', '+esc(ME.split(' ')[0])+'</div>'
    +'<div class="greet-sub">'+esc(new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}))+' · fire &amp; security walk</div>'
    +'<div class="card" id="tonight-card"><div class="muted">Loading tonight’s walks…</div></div>'
    +'<div id="home-cta"></div>'
    +'<div class="muted" style="font-size:12.5px;text-align:center;margin-top:6px">Two walks are expected each night shift.</div>';
  loadTonight();
}
function loadTonight(){
  if(!db){ $('tonight-card').innerHTML='<div class="muted">Offline — cannot load.</div>'; renderCta(); return; }
  db.collection('hosnightwalk').where('nightDate','==',nightOf()).get().then(function(qs){
    TONIGHT=qs.docs.map(function(d){ var v=d.data()||{}; v.id=d.id; return v; }).sort(function(a,b){ return (a.startTs||0)-(b.startTs||0); });
    renderTonight(); renderCta();
  }).catch(function(){ $('tonight-card').innerHTML='<div class="muted">Could not load.</div>'; renderCta(); });
}
function walkDone(w){ var c=0,it=w.items||{}; for(var k in it){ if(it[k]&&it[k].status) c++; } return c; }
function renderTonight(){
  var c=$('tonight-card'); if(!c) return;
  var rows=[1,2].map(function(no){
    var w=TONIGHT.filter(function(x){return x.walkNo===no;})[0];
    var state, pill, sub;
    if(!w){ state='due'; pill='<span class="pill due">Not started</span>'; sub='Tap Start walk below'; }
    else if(w.status==='complete'){ state='ok'; pill='<span class="pill ok">✓ Complete</span>'; var iss=walkIssues(w); sub=esc(w.by||'')+' · '+esc(w.startAt||'')+'–'+esc(w.endAt||'')+' · '+walkDone(w)+'/'+N+(iss?(' · ⚠ '+iss+' issue'+(iss===1?'':'s')):''); }
    else { state='prog'; pill='<span class="pill prog">● In progress</span>'; sub=esc(w.by||'')+' · started '+esc(w.startAt||'')+' · '+walkDone(w)+'/'+N; }
    return '<div class="walkrow"><div class="wn">'+no+'</div><div class="wd"><div class="t">Walk '+no+'</div><div class="s">'+sub+'</div></div>'+pill+'</div>';
  }).join('');
  c.innerHTML='<div style="font:800 14px Lato;margin-bottom:4px">Tonight ('+esc(new Date(nightOf()+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}))+')</div>'+rows;
}
function walkIssues(w){ var n=0,it=w.items||{}; for(var k in it){ if(it[k]&&it[k].status==='issue') n++; } return n; }
function renderCta(){
  var cta=$('home-cta'); if(!cta) return;
  var active=TONIGHT.filter(function(x){return x.status!=='complete';})[0];
  var doneCount=TONIGHT.filter(function(x){return x.status==='complete';}).length;
  if(active){ cta.innerHTML='<button class="bigbtn amber" onclick="resumeWalk(\''+active.id+'\')">▶ Resume Walk '+active.walkNo+'</button>'; }
  else if(doneCount>=2){ cta.innerHTML='<div class="banner" style="background:#e8f6ee;color:#13532f;border:1px solid #bfe3cd">✓ Both walks done tonight. You can still start another if needed.</div><button class="bigbtn" onclick="startWalk()">＋ Start another walk</button>'; }
  else { cta.innerHTML='<button class="bigbtn" onclick="startWalk()">🌙 Start Walk '+(doneCount+1)+'</button>'; }
}

/* ---- START / RESUME WALK ---- */
var WALK=null;   // {id, walkNo, items:{}}
function startWalk(){
  if(!db){ toast('Offline — cannot start'); return; }
  var no=TONIGHT.filter(function(x){return true;}).length+1;
  var doc={ date:new Date().toLocaleDateString('en-CA'), nightDate:nightOf(), walkNo:no, by:ME,
    startTs:Date.now(), startAt:nowAt(), status:'in_progress', items:{}, createdAt:new Date().toISOString() };
  db.collection('hosnightwalk').add(doc).then(function(ref){
    WALK={id:ref.id, walkNo:no, items:{}, by:ME, startAt:doc.startAt, startTs:doc.startTs};
    try{ localStorage.setItem('nw_active',ref.id); }catch(e){}
    viewWalk();
  }).catch(function(){ toast('Could not start — check connection'); });
}
function resumeWalk(id){
  if(!db){ toast('Offline'); return; }
  db.collection('hosnightwalk').doc(id).get().then(function(d){
    if(!d.exists){ toast('Walk not found'); return; }
    var w=d.data()||{}; WALK={id:id, walkNo:w.walkNo, items:w.items||{}, by:w.by, startAt:w.startAt, startTs:w.startTs};
    viewWalk();
  });
}

function viewWalk(){
  var v=$('view');
  var zones=[], seen={};
  CHECKPOINTS.forEach(function(c){ if(!seen[c.z]){ seen[c.z]=1; zones.push(c.z); } });
  var html='<div class="walkhd"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><button onclick="confirmLeave()" style="background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer">← Back</button>'
    +'<div style="font-weight:900;font-size:17px">Walk '+WALK.walkNo+'</div>'
    +'<div class="muted" style="margin-left:auto;font-size:12.5px">Started '+esc(WALK.startAt)+'</div></div>'
    +'<div class="prog"><i id="pbar"></i></div><div class="progtxt"><span id="pdone">0 of '+N+'</span><span id="pissue"></span></div></div>';
  var gi=0;
  zones.forEach(function(z){
    html+='<div class="zone">'+esc(z)+'</div>';
    CHECKPOINTS.forEach(function(c,i){ if(c.z!==z) return;
      html+='<div class="chk" id="chk-'+i+'"><div class="lab">'+esc(c.l)+'</div><div id="chkb-'+i+'"></div></div>';
    });
  });
  html+='<div class="sticky-finish"><button class="bigbtn" id="finishbtn" onclick="finishWalk()">✓ Finish walk</button></div>';
  v.innerHTML=html;
  CHECKPOINTS.forEach(function(c,i){ renderChk(i); });
  updateProg();
}
function renderChk(i){
  var box=$('chkb-'+i), card=$('chk-'+i); if(!box) return;
  var it=WALK.items[i];
  if(it && it.status){
    card.classList.remove('issue','done'); card.classList.add(it.status==='issue'?'issue':'done');
    box.innerHTML='<div class="stamp"><span>'+(it.status==='issue'?'⚠':'✓')+'</span><span class="t">'+(it.status==='issue'?'Issue':'Secure')+' · '+esc(it.at||'')+'</span><button class="redo" onclick="redo('+i+')">change</button></div>'
      +(it.note?('<div class="note">'+esc(it.note)+'</div>'):'');
  } else {
    card.classList.remove('issue','done');
    box.innerHTML='<div class="acts"><button class="sec" onclick="tick('+i+',\'ok\')">✓ Secure</button><button class="iss" onclick="tick('+i+',\'issue\')">⚠ Issue</button></div>';
  }
}
function tick(i,status){
  var note='';
  if(status==='issue'){ note=prompt('What’s the issue with:\n\n'+CHECKPOINTS[i].l)||''; note=note.trim(); if(!note){ return; } }
  var obj={status:status, ts:Date.now(), at:nowAt(), note:note};
  WALK.items[i]=obj; renderChk(i); updateProg();
  if(db){ var u={}; u['items.'+i]=obj; u.lastTs=Date.now(); db.collection('hosnightwalk').doc(WALK.id).update(u).catch(function(){}); }
}
function redo(i){ delete WALK.items[i]; renderChk(i); updateProg(); if(db){ var u={}; u['items.'+i]=firebase.firestore.FieldValue.delete(); db.collection('hosnightwalk').doc(WALK.id).update(u).catch(function(){}); } }
function updateProg(){
  var done=0,iss=0; for(var k in WALK.items){ if(WALK.items[k]&&WALK.items[k].status){ done++; if(WALK.items[k].status==='issue') iss++; } }
  var bar=$('pbar'); if(bar) bar.style.width=Math.round(done/N*100)+'%';
  if($('pdone')) $('pdone').textContent=done+' of '+N;
  if($('pissue')) $('pissue').innerHTML=iss?('<span style="color:var(--red)">⚠ '+iss+' issue'+(iss===1?'':'s')+'</span>'):'';
  var fb=$('finishbtn'); if(fb){ fb.textContent = done<N ? ('✓ Finish walk ('+(N-done)+' left)') : '✓ Finish walk'; }
}
function finishWalk(){
  var done=0; for(var k in WALK.items){ if(WALK.items[k]&&WALK.items[k].status) done++; }
  if(done<N){ if(!confirm((N-done)+' checkpoint(s) not yet ticked. Finish the walk anyway?\n\nAnything not ticked is recorded as skipped.')) return; }
  if(db){ db.collection('hosnightwalk').doc(WALK.id).update({ status:'complete', endTs:Date.now(), endAt:nowAt(), doneCount:done }).then(function(){
    try{ localStorage.removeItem('nw_active'); }catch(e){}
    toast('✓ Walk '+WALK.walkNo+' recorded'); WALK=null; viewHome();
  }).catch(function(){ toast('Could not save — check connection'); }); }
}
function confirmLeave(){ if(confirm('Leave this walk? Your ticks are saved — you can resume it from the home screen.')){ WALK=null; viewHome(); } }

/* SW */
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('nightwalk-sw.js').catch(function(){}); }catch(e){} }
boot();
</script>
