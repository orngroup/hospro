<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welcome · Brandon Hall Hotel and Spa</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--navy:#2C3E50;--gold:#BB9979;--earth:#EDF1EB}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;font-family:Lato,system-ui,sans-serif;overflow:hidden}
  .gate{height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);color:#fff;text-align:center;padding:24px}
  .gate .box{max-width:420px}
  .gate img{height:60px;margin-bottom:22px}
  .gate h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:30px;margin:0 0 6px}
  .gate p{color:#c7d0da;font-size:15px;margin:0 0 20px}
  .gate input{width:220px;text-align:center;font-size:30px;letter-spacing:10px;padding:12px;border:none;border-radius:12px;font-weight:800}
  .gate button{display:block;margin:16px auto 0;background:var(--gold);color:#fff;border:none;border-radius:12px;padding:13px 34px;font-size:16px;font-weight:800;cursor:pointer}
  .gate .err{color:#ffb4a8;font-size:14px;min-height:18px;margin-top:10px}
  .stage{height:100vh;width:100vw;position:relative;background:var(--navy)}
  .slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 1s;color:#fff;padding:4vh}
  .slide.on{opacity:1}
  .frame{border:0.8vh solid var(--gold);width:88%;height:84%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4vh 6vw}
  .frame img{height:16vh;margin-bottom:3vh}
  .wel{font-family:'Cormorant Garamond',serif;font-size:7vh}
  .cli{font-family:'Cormorant Garamond',serif;font-size:13vh;color:var(--gold);font-weight:700;line-height:1.02;margin:1vh 0}
  .sub{font-size:3vh;letter-spacing:1vh;text-transform:uppercase;color:#d9e0e7}
  .stitle{font-family:'Cormorant Garamond',serif;font-size:8vh;color:var(--gold);margin:0 0 4vh}
  .agenda{list-style:none;padding:0;margin:0;font-size:4vh;line-height:2.1}
  .agenda b{color:var(--gold);display:inline-block;min-width:5em}
  .mcourse{color:var(--gold);font-family:'Cormorant Garamond',serif;font-size:5vh;margin:3vh 0 1vh}
  .mdish{font-size:3.4vh}
  .hint{position:fixed;bottom:0;left:0;right:0;text-align:center;color:#ffffff22;font-size:12px;padding:6px}
</style>

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function qp(k){ try{ return new URLSearchParams(location.search).get(k)||''; }catch(e){ return ''; } }
let DATA=null, slides=[], idx=0, timer=null;

async function load(){
  const pid=qp('pack');
  if(!pid){ $('app').innerHTML='<div class="gate"><div class="box"><h1>No screen selected</h1><p>Open the link from the Event Pack.</p></div></div>'; return; }
  try{ const d=await db.collection('eventpack_screens').doc(pid).get(); if(d.exists) DATA=d.data(); }catch(e){}
  if(!DATA){ $('app').innerHTML='<div class="gate"><div class="box"><h1>Screen not ready</h1><p>Generate the pack first, then try again.</p></div></div>'; return; }
  // code auto if passed, else gate
  const urlCode=qp('code');
  if(urlCode && urlCode===String(DATA.code)) return play();
  gate('');
}
function gate(err){
  $('app').innerHTML=`<div class="gate"><div class="box">
    <img src="${LOGO}" alt="">
    <h1>Brandon Hall Hotel and Spa</h1>
    <p>Enter the 6-digit screen code</p>
    <input id="c" inputmode="numeric" maxlength="6" autocomplete="off">
    <div class="err">${esc(err)}</div>
    <button onclick="tryCode()">Show screen</button>
  </div></div>`;
  const i=$('c'); if(i){ i.focus(); i.addEventListener('keydown',e=>{ if(e.key==='Enter') tryCode(); }); }
}
function tryCode(){ const v=($('c').value||'').trim(); if(v===String(DATA.code)){ play(); } else { gate('That code didn’t match — check the Event Pack.'); } }

function slideWelcome(){
  const head=DATA.headline||('Brandon Hall Hotel and Spa welcomes '+(DATA.client||''));
  return `<div class="frame"><img src="${LOGO}"><div class="wel">welcomes</div><div class="cli" style="color:${DATA.accent||'#BB9979'}">${esc(DATA.client||'our guests')}</div><div class="sub">${esc(DATA.subline||'We are delighted to have you with us')}</div>
    <div style="display:flex;gap:4vw;margin-top:3vh">${(DATA.logos||[]).filter(Boolean).map(l=>`<img src="${l}" style="height:9vh;margin:0">`).join('')}</div></div>`;
}
function slideAgenda(){
  const lines=(DATA.agenda||'').split('\n').map(x=>x.trim()).filter(Boolean);
  if(!lines.length) return null;
  const items=lines.map(l=>{ const m=l.match(/^(\d{1,2}[:.]\d{2})\s+(.*)$/); return m?`<li><b>${esc(m[1])}</b> ${esc(m[2])}</li>`:`<li>${esc(l)}</li>`; }).join('');
  return `<div class="frame"><img src="${LOGO}" style="height:12vh"><div class="stitle">Today’s agenda</div><ul class="agenda">${items}</ul></div>`;
}
function slideMenu(){
  if(!DATA.menu||!DATA.menu.courses||!DATA.menu.courses.length) return null;
  const c=DATA.menu.courses.map(c=>`<div class="mcourse">${esc(c.t)}</div>${(c.dishes||[]).map(d=>`<div class="mdish">${esc(d.n)}</div>`).join('')}`).join('');
  return `<div class="frame"><img src="${LOGO}" style="height:12vh"><div class="stitle">${esc(DATA.eventName||'Dinner Menu')}</div><div>${c}</div></div>`;
}
function play(){
  slides=[slideWelcome()];
  if(DATA.showAgenda){ const a=slideAgenda(); if(a) slides.push(a); }
  if(DATA.showMenu){ const m=slideMenu(); if(m) slides.push(m); }
  $('app').innerHTML=`<div class="stage">${slides.map((s,i)=>`<div class="slide${i===0?' on':''}" id="sl${i}">${s}</div>`).join('')}</div><div class="hint">Brandon Hall Hotel and Spa · HosSALES</div>`;
  idx=0; clearInterval(timer);
  if(slides.length>1){ timer=setInterval(()=>{ document.getElementById('sl'+idx).classList.remove('on'); idx=(idx+1)%slides.length; document.getElementById('sl'+idx).classList.add('on'); }, 15000); }
  // try fullscreen on first interaction
  document.body.onclick=()=>{ try{ document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); }catch(e){} };
}
load();
</script>
