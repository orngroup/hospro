<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HosPRO Pocket — Brandon Hall</title>
<meta name="theme-color" content="#182A3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HosPRO">
<link rel="manifest" href="mobile-manifest.json">
<link rel="apple-touch-icon" href="assets/hospro/apple-touch-icon.png">
<link rel="icon" href="assets/hospro/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#182A3E;--navy2:#22374f;--jade:#4DA69C;--jade-d:#2F7A72;--ink:#1a2b3a;--muted:#5b6675;--line:#e7eaee;--bg:#f3f5f7;--good:#166534;--goodbg:#dcfce7;--warn:#92400e;--warnbg:#fef3c7;--bad:#991b1b;--badbg:#fee2e2}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:Lato,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.hdr{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 18px;position:sticky;top:0;z-index:5}
.hdr-row{display:flex;justify-content:space-between;align-items:center}
.brand{font:700 13px Lato;letter-spacing:2px;text-transform:uppercase;color:var(--jade)}
.hello{font:700 26px 'Cormorant Garamond',serif;margin-top:4px}
.sub{font-size:12.5px;color:#a9b8c9;margin-top:2px}
.who{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:18px;padding:6px 12px;font:700 12px Lato}
main{padding:14px 14px 10px}
.sec{font:900 11px Lato;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:18px 4px 8px}
.card{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 1px 3px rgba(16,28,40,.06);margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border-radius:16px;padding:13px 14px;box-shadow:0 1px 3px rgba(16,28,40,.06)}
.tile .k{font:700 10.5px Lato;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.tile .v{font:900 24px Lato;color:var(--ink);margin-top:3px;line-height:1.1}
.tile .s{font-size:12px;color:var(--muted);margin-top:3px}
.pill{display:inline-block;font:900 11px Lato;padding:3px 9px;border-radius:10px}
.ok{background:var(--goodbg);color:var(--good)}.wa{background:var(--warnbg);color:var(--warn)}.bd{background:var(--badbg);color:var(--bad)}.nu{background:#eef1f4;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-child{border-top:none}
.row .l{min-width:0}.row .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .m{font-size:12px;color:var(--muted);margin-top:1px}
.row .r{font-weight:900;white-space:nowrap}
.bar{display:grid;grid-template-columns:62px 1fr 74px;gap:8px;align-items:center;font-size:12.5px;margin:7px 0}
.bar .tr{height:12px;background:#eef1f4;border-radius:4px;overflow:hidden}.bar .fl{height:12px;background:var(--jade-d);border-radius:0 4px 4px 0}
.bar .vv{text-align:right;font-weight:900}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px}
.empty{color:var(--muted);font-size:13.5px;padding:6px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;border:none;background:none;font:700 11px Lato;color:var(--muted);padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button .i{font-size:20px;line-height:1}
nav button.on{color:var(--jade-d)}
/* sign in */
#pick{min-height:100dvh;background:var(--navy) url('assets/hospro/login-bg.jpg') center/cover;display:flex;align-items:flex-end;padding:20px;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
#pick::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(16,28,40,.35),rgba(16,28,40,.92));}
.pick-card{position:relative;width:100%;background:#fff;border-radius:22px;padding:22px}
.pick-card h1{font:700 30px 'Cormorant Garamond',serif;color:var(--navy)}
.pick-card p{color:var(--muted);font-size:14px;margin:4px 0 16px}
.pick-card select{width:100%;padding:14px;border:1.5px solid #d1d5db;border-radius:12px;font:700 16px Lato;color:var(--ink);background:#fff;appearance:none}
.go{width:100%;margin-top:12px;padding:15px;border:none;border-radius:12px;background:var(--navy);color:#fff;font:900 16px Lato}
.install{margin-top:14px;font-size:12.5px;color:var(--muted);line-height:1.5}
.upd{font-size:11.5px;color:var(--muted);text-align:center;margin:14px 0 4px}
.hidden{display:none!important}
nav button{font-size:10.5px}
.tap{cursor:pointer}.tap:active{background:#f6f8fa}
.chev{color:#b8c0ca;font-size:18px;margin-left:4px}
.seg{display:flex;background:#e6eaee;border-radius:12px;padding:3px;margin:4px 0 10px}
.seg button{flex:1;border:none;background:none;padding:8px 4px;border-radius:9px;font:700 12.5px Lato;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid #d6dbe1;background:#fff;color:var(--ink);border-radius:16px;padding:6px 12px;font:700 12px Lato}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.wkbar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 8px}
.wkbar button{border:1px solid #d6dbe1;background:#fff;border-radius:10px;width:38px;height:34px;font:900 16px Lato;color:var(--ink)}
.wkbar .lab{font:900 14px Lato}
.dept{font:900 11px Lato;letter-spacing:.5px;text-transform:uppercase;margin:10px 0 2px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sh{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;border-top:1px dashed #eef0f3}.sh:first-of-type{border-top:none}
.sh b{font-weight:900;white-space:nowrap}
.mini{font-size:11.5px;color:var(--muted)}
select.inp,input.inp{width:100%;padding:11px;border:1.5px solid #d1d5db;border-radius:12px;font:700 15px Lato;color:var(--ink);background:#fff}
.occ{display:grid;grid-template-columns:70px 1fr 54px 60px;gap:8px;align-items:center;font-size:12.5px;padding:6px 0;border-top:1px solid var(--line)}
.occ:first-child{border-top:none}.occ .tr{height:12px;background:#eef1f4;border-radius:4px;overflow:hidden}.occ .fl{height:12px;border-radius:0 4px 4px 0}
.occ.today{font-weight:900}.occ .r{text-align:right;font-weight:900}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}.tbl th{font:900 10px Lato;text-transform:uppercase;color:var(--muted);text-align:right;padding:4px 3px}.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:6px 3px;border-top:1px solid var(--line);text-align:right}
.big{display:block;width:100%;text-align:left;border:none;background:#fff;border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(16,28,40,.06);font:900 16px Lato;color:var(--ink)}
.big span{display:block;font:400 12.5px Lato;color:var(--muted);margin-top:3px}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(16,28,40,.5);display:flex;align-items:flex-end}
#sheet .in{background:#fff;width:100%;max-height:88dvh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}
#sheet h2{font:700 24px 'Cormorant Garamond',serif;color:var(--navy);margin-bottom:2px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}.kv span:first-child{color:var(--muted)}.kv span:last-child{font-weight:700;text-align:right}
.btn{display:block;width:100%;margin-top:12px;padding:13px;border:none;border-radius:12px;background:var(--navy);color:#fff;font:900 15px Lato;text-align:center;text-decoration:none}
.btn.ghost{background:#eef1f4;color:var(--ink)}
</style>
</head>
<body>

<div id="pick">
  <div class="pick-card">
    <div class="brand" style="color:var(--jade-d)">HosPRO Pocket · Brandon Hall</div>
    <h1>Good to see you</h1>
    <p>The hotel at a glance — sales, rooms, F&amp;B, shifts and events.</p>
    <select id="who">
      <option value="">Choose your name…</option>
      <option>Ajay</option><option>Raj</option><option>Alia</option>
    </select>
    <button class="go" onclick="pickGo()">Open</button>
    <div class="install" id="install-tip"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="hdr">
    <div class="hdr-row"><div class="brand">HosPRO · Brandon Hall</div><button class="who" onclick="switchUser()" id="who-btn"></button></div>
    <div class="hello" id="hello"></div>
    <div class="sub" id="today"></div>
  </div>
  <main id="main"></main>
  <nav>
    <button data-v="today" class="on" onclick="go('today')"><span class="i">🏠</span>Today</button>
    <button data-v="sales" onclick="go('sales')"><span class="i">💼</span>Sales</button>
    <button data-v="stats" onclick="go('stats')"><span class="i">📈</span>Occ &amp; ADR</button>
    <button data-v="fb" onclick="go('fb')"><span class="i">🍽</span>F&amp;B</button>
    <button data-v="shifts" onclick="go('shifts')"><span class="i">🗓</span>Shifts</button>
    <button data-v="more" onclick="go('more')"><span class="i">☰</span>More</button>
  </nav>
</div>
<div id="sheet" class="hidden" onclick="if(event.target===this)closeSheet()"><div class="in" id="sheet-in"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="bob-data.js"></script>
<script src="pocket-data.js"></script>
<script>
/* HosPRO Pocket — read-only, high-level view for directors. No sign-in by design:
   it only reads public summary data (hospro_public), open HosFIX jobs, the bookings file
   and pocket-data.js (rota, rooms, local events — names, roles and shifts only, no pay). */
const FBCFG={apiKey:"AIzaSyDnPWrPGInDRTCF1Go710XC_8_77l_72i0",authDomain:"brandonhall-7bdef.firebaseapp.com",projectId:"brandonhall-7bdef",storageBucket:"brandonhall-7bdef.firebasestorage.app",messagingSenderId:"391317900568",appId:"1:391317900568:web:643c9d6691f7f16d65226d"};
const P=(typeof POCKET!=='undefined')?POCKET:{staff:[],depts:[],rota:{},fc:{},events:[],venues:[],rooms:[],hire:{},bedrooms:120};
const S={ who:null, view:'today', summary:null, rota:null, jobs:null, loaded:false,
  salesSeg:'open', shSeg:'today', shDay:0, shWeek:null, shPerson:'', evRange:'90', evMiles:20, roomLayout:'theatre', roomPax:'', fbMonth:'cur' };
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gbp=n=>'£'+Math.round(+n||0).toLocaleString('en-GB');
const gbpK=n=>{ n=+n||0; return n>=100000?'£'+Math.round(n/1000)+'k':n>=10000?'£'+(n/1000).toFixed(1)+'k':gbp(n); };
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(k,n)=>{ const d=new Date(k+'T12:00'); d.setDate(d.getDate()+n); return dk(d); };
const fmtD=s=>s?new Date(s+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'';
const fmtDW=s=>s?new Date(s+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}):'';
const fmtDL=s=>s?new Date(s+'T12:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}):'';
const TODAY=()=>dk(new Date());
const monday=k=>{ const d=new Date(k+'T12:00'); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return dk(d); };
const store={ get(k){ try{return localStorage.getItem(k);}catch(e){return null;} }, set(k,v){ try{localStorage.setItem(k,v);}catch(e){} } };
const PORTAL='https://brandon.hospro.co.uk/';

function pickGo(){ const v=$('#who').value; if(!v) return; store.set('pocket_who',v); start(v); }
function switchUser(){ store.set('pocket_who',''); $('#app').classList.add('hidden'); $('#pick').classList.remove('hidden'); }
function start(who){
  S.who=who; $('#pick').classList.add('hidden'); $('#app').classList.remove('hidden');
  const h=new Date().getHours(); $('#hello').textContent=(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+', '+who;
  $('#who-btn').textContent=who+' ▾';
  $('#today').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  draw(); load();
}
function go(v){ S.view=v; const top=['today','sales','stats','fb','shifts'].includes(v)?v:'more';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===top)); window.scrollTo(0,0); draw(); }
function set(k,v){ S[k]=v; draw(); }

/* Fallback: read a public document over the Firestore REST API (used if the SDK can't connect, e.g. some Safari settings) */
function fsVal(v){ if(!v) return null; if('stringValue' in v) return v.stringValue; if('integerValue' in v) return +v.integerValue; if('doubleValue' in v) return +v.doubleValue;
  if('booleanValue' in v) return v.booleanValue; if('nullValue' in v) return null; if('timestampValue' in v) return v.timestampValue;
  if('mapValue' in v){ const o={}; Object.entries(v.mapValue.fields||{}).forEach(([k,x])=>o[k]=fsVal(x)); return o; }
  if('arrayValue' in v) return (v.arrayValue.values||[]).map(fsVal); return null; }
async function restDoc(path){ const r=await fetch(`https://firestore.googleapis.com/v1/projects/${FBCFG.projectId}/databases/(default)/documents/${path}?key=${FBCFG.apiKey}`,{cache:'no-store'});
  if(r.status===404) return null; if(!r.ok) throw new Error('HTTP '+r.status); const j=await r.json(); return fsVal({mapValue:{fields:j.fields||{}}}); }
async function load(){
  try{ const [a,b]=await Promise.allSettled([restDoc('hospro_public/summary'),restDoc('hospro_public/rota')]);
    if(a.status==='fulfilled'&&a.value) S.summary=a.value; if(b.status==='fulfilled'&&b.value) S.rota=b.value;
    if(a.status==='rejected') S.err='Summary: '+a.reason.message;
    if(S.summary||S.rota){ S.loaded=true; draw(); }
  }catch(e){}
  try{
    const app=firebase.apps.length?firebase.app():firebase.initializeApp(FBCFG); const db=app.firestore();
    const t=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
    const [sum,rota,jobs]=await Promise.allSettled([
      t(db.collection('hospro_public').doc('summary').get(),9000),
      t(db.collection('hospro_public').doc('rota').get(),9000),
      t(db.collection('hosfix_jobs').where('status','in',['not-started','in-progress','pending_approval']).get(),9000)]);
    if(sum.status==='fulfilled'&&sum.value.exists) S.summary=sum.value.data(); else if(sum.status==='fulfilled'&&!S.summary) S.err='The portal has not published a summary yet';
    if(rota.status==='fulfilled'&&rota.value.exists) S.rota=rota.value.data();
    if(jobs.status==='fulfilled') S.jobs=jobs.value.docs.map(d=>Object.assign({_id:d.id},d.data())).filter(j=>String(j.createdAt||'')>='2026-10-10T10:00:00.000Z');
  }catch(e){ console.warn(e); }
  S.loaded=true; draw();
}

/* ── data helpers ── */
function bobAll(){ return (typeof BOB!=='undefined')?(BOB.confirmed||[]).concat(BOB.prospect||[]):[]; }
function bobByRef(ref){ return bobAll().concat((typeof BOB!=='undefined'&&BOB.cancelled)||[]).find(r=>r.ref===ref); }
function enquiries(){ return (S.summary&&S.summary.enquiries)||[]; }
function openEnq(){ return enquiries().filter(e=>['enquiry','provisional'].includes(e.status)); }
// Rota: the live published rota wins for any date it has; pocket-data.js fills the rest
function rotaData(){
  const pub=(S.rota&&S.rota.rota)||{}; const rota=Object.assign({},P.rota||{},pub);
  const staff={}; (P.staff||[]).forEach(s=>staff[s.id]=s); ((S.rota&&S.rota.staff)||[]).forEach(s=>staff[s.id]=Object.assign({},staff[s.id]||{},s));
  const depts=((S.rota&&S.rota.depts&&S.rota.depts.length)?S.rota.depts:P.depts).map(d=>Object.assign({},(P.depts||[]).find(x=>x.id===d.id)||{},d));
  return {rota,staff,depts};
}
function shiftOf(v){ return String((v&&typeof v==='object')?(v.shift||''):(v||'')).trim(); }
function working(v){ return /\d/.test(shiftOf(v)); }
function dayList(k){
  const R=rotaData(), day=R.rota[k]||{};
  const on=Object.entries(day).filter(([id,v])=>working(v)).map(([id,v])=>{ const s=R.staff[id]||{name:id}; return {id,name:s.name,role:s.role,dept:(v&&v.dept)||s.dept||'other',shift:shiftOf(v)}; });
  const tag=t=>Object.values(day).filter(v=>shiftOf(v).toLowerCase()===t).length;
  return {has:Object.keys(day).length>0,on,hol:tag('holiday'),sick:tag('sick'),call:tag('on call'),lieu:tag('in lieu')};
}
function deptMeta(id){ const d=rotaData().depts.find(x=>x.id===id); return d||{id,name:id||'Other',colour:'#94a3b8'}; }
function fcAll(){ return Object.assign({},P.fc||{},(S.summary&&S.summary.fc)||{}); }
function bedrooms(){ return (S.summary&&S.summary.bedrooms)||P.bedrooms||120; }
function occOf(k){ const f=fcAll()[k]; if(!f||!f.rooms) return null; return {rooms:f.rooms,occ:f.rooms/bedrooms()*100,adr:f.revenue?f.revenue/f.rooms:null,rev:f.revenue||0,f}; }
function eventsInHouse(k){ return bobAll().filter(r=>r.room && r.arrival<=k && (r.departure||r.arrival)>=k && (r.departure>k||r.arrival===k)); }
function gpPill(o){ if(!o||!o.sales) return '<span class="pill nu">No sales yet</span>';
  if(o.gp>=o.target) return '<span class="pill ok">✓ On target</span>';
  if(o.gp>=o.target-3) return '<span class="pill wa">! Watch spend</span>';
  return '<span class="pill bd">✕ Over spend</span>'; }
function stPill(s){ return {enquiry:'<span class="pill wa">Enquiry</span>',provisional:'<span class="pill nu">Provisional</span>',confirmed:'<span class="pill ok">Confirmed</span>',cancelled:'<span class="pill bd">Cancelled</span>',lost:'<span class="pill bd">Lost</span>'}[s]||`<span class="pill nu">${esc(s||'')}</span>`; }
function upd(){ const u=S.summary&&S.summary.updated; return `<div class="upd">${u?'Portal figures updated '+new Date(u).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):S.loaded?'Not published yet — in the portal open F&amp;B Tracker and press 📱 Update Pocket'+(S.err?' ('+esc(S.err)+')':''):'Loading…'}${typeof BOB!=='undefined'&&BOB.pulled?' · bookings from Rezlynx '+new Date(BOB.pulled).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):''}</div>`; }
const seg=(key,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="${S[key]===v?'on':''}" onclick="set('${key}','${v}')">${l}</button>`).join('')}</div>`;
const chips=(key,opts)=>`<div class="chips">${opts.map(([v,l])=>`<button class="chip ${String(S[key])===String(v)?'on':''}" onclick="set('${key}',${typeof v==='number'?v:`'${v}'`})">${l}</button>`).join('')}</div>`;

/* ── detail sheet ── */
function openSheet(html){ $('#sheet-in').innerHTML=html+`<button class="btn ghost" onclick="closeSheet()">Close</button>`; $('#sheet').classList.remove('hidden'); }
function closeSheet(){ $('#sheet').classList.add('hidden'); }
const kv=(k,v)=>v===''||v==null||v===0&&k!=='Value'?'':`<div class="kv"><span>${k}</span><span>${v}</span></div>`;
function showEnq(i){
  const e=enquiries().find(x=>x.id===i)||enquiries()[+i]; if(!e) return;
  const od=e.followUp&&e.followUp<TODAY()&&['enquiry','provisional'].includes(e.status);
  openSheet(`<div class="brand" style="color:var(--jade-d)">Enquiry</div><h2>${esc(e.company||e.name)}</h2>
    <div style="margin:4px 0 8px">${stPill(e.status)} ${e.stage?`<span class="pill nu">${esc(e.stage)}</span>`:''}</div>
    ${kv('Contact',e.company&&e.name?esc(e.name):'')}${kv('Event type',esc(e.eventType))}
    ${kv('Date',e.date?fmtDL(e.date)+(e.departure&&e.departure!==e.date?' – '+fmtD(e.departure):''):'Not set')}
    ${kv('Guests',e.pax||'')}${kv('Bedrooms',e.rooms?e.rooms+(e.nights?' × '+e.nights+' night'+(e.nights>1?'s':''):''):'')}

/* Occupancy & ADR */
function periodStats(ks){ let rooms=0,days=0,rev=0,revDays=0,bf=0,dn=0;
  ks.forEach(k=>{ const o=occOf(k); if(o){ rooms+=o.rooms; days++; bf+=o.f.breakfastCovers||0; dn+=o.f.dinnerCovers||0; if(o.rev){ rev+=o.rev; revDays+=o.rooms; } } });
  return {days,rooms,occ:days?rooms/(days*bedrooms())*100:null,adr:revDays?rev/revDays:null,revpar:days&&rev?rev/(days*bedrooms()):null,bf,dn}; }
function vStats(){
  const t=TODAY(), past=[...Array(7)].map((_,i)=>addD(t,-7+i)), next=[...Array(7)].map((_,i)=>addD(t,i+1));
  const T=periodStats([t]), A=periodStats(past), N=periodStats(next);
  const pct=v=>v==null?'—':Math.round(v)+'%', adr=v=>v==null?'—':'£'+v.toFixed(0);
  const col=v=>v>=80?'var(--good)':v>=55?'var(--jade-d)':v>=35?'#d97706':'var(--bad)';
  const block=(lab,X,n)=>`<div class="tile"><div class="k">${lab}</div><div class="v">${pct(X.occ)}</div><div class="s">ADR ${adr(X.adr)}${X.days&&X.days<n?` · ${X.days} of ${n} days`:''}</div></div>`;
  const rows=[...past,t,...next].map(k=>{ const o=occOf(k); return `<div class="occ ${k===t?'today':''}"><div>${k===t?'Today':fmtDW(k)}</div><div class="tr">${o?`<div class="fl" style="width:${Math.min(100,o.occ)}%;background:${col(o.occ)}"></div>`:''}</div><div class="r">${o?Math.round(o.occ)+'%':'—'}</div><div class="r" style="font-weight:700">${o&&o.adr?'£'+o.adr.toFixed(0):'—'}</div></div>`; }).join('');
  return `<div class="sec">Occupancy &amp; ADR</div>
  <div class="grid2">${block('Tonight',T,1)}${block('Next 7 days',N,7)}${block('Last 7 days',A,7)}
    <div class="tile"><div class="k">Rooms sold next 7</div><div class="v">${N.rooms||'—'}</div><div class="s">${N.bf?N.bf+' breakfasts · '+N.dn+' dinners':''}</div></div></div>
  <div class="sec">Day by day</div>
  <div class="card"><div class="occ" style="font:900 10px Lato;text-transform:uppercase;color:var(--muted)"><div>Date</div><div>Occupancy</div><div class="r">Occ</div><div class="r">ADR</div></div>${rows}
    <div class="note">Occupancy = rooms occupied ÷ ${bedrooms()} bedrooms, from the weekly rota forecast. Days show “—” where no forecast has been entered. ADR and RevPAR will fill in automatically once the Guestline (Rezlynx) data feed is connected.</div></div>
  ${(()=>{ const f=fcAll(); const nx=next.filter(k=>f[k]); return nx.length?`<div class="sec">Next 7 days — arrivals &amp; covers</div><div class="card"><table class="tbl"><tr><th>Day</th><th>Rooms</th><th>Arr</th><th>Dep</th><th>Bkfst</th><th>Dinner</th></tr>${nx.map(k=>`<tr><td>${fmtDW(k)}</td><td>${f[k].rooms||0}</td><td>${f[k].arrivals||0}</td><td>${f[k].departures||0}</td><td>${f[k].breakfastCovers||0}</td><td>${f[k].dinnerCovers||0}</td></tr>`).join('')}</table></div>`:''; })()}
  ${upd()}`;
}

    <div class="card">${days.map(d=>`<div class="bar" style="grid-template-columns:70px 1fr 70px"><div>${fmtDW(d.d)}</div><div class="tr"><div class="fl" style="width:${Math.max(2,(d.food+d.bev)/mx*100)}%"></div></div><div class="vv">${gbp(d.food+d.bev)}</div></div><div class="mini" style="margin:-4px 0 6px 78px">Food ${gbp(d.food)} · Drink ${gbp(d.bev)}${d.covers?' · '+d.covers+' covers':''}${d.pf||d.pb?' · purchases '+gbp(d.pf+d.pb):''}</div>`).join('')||'<div class="empty">No days entered.</div>'}</div>

/* Shifts */
function vShifts(){
  const t=TODAY(); if(!S.shWeek) S.shWeek=monday(t);
  let h=`<div class="sec">Shifts</div>${seg('shSeg',[['today','Day'],['week','Week'],['person','Person']])}`;
  if(S.shSeg==='today'){
    const k=addD(t,S.shDay), D=dayList(k);
    h+=`<div class="wkbar"><button onclick="set('shDay',${S.shDay-1})">‹</button><div class="lab">${S.shDay===0?'Today · ':S.shDay===1?'Tomorrow · ':''}${fmtDW(k)}</div><button onclick="set('shDay',${S.shDay+1})">›</button></div>`;
    if(!D.has) return h+`<div class="card"><div class="empty">No rota loaded for this day yet.</div></div>`;
    h+=`<div class="grid2"><div class="tile"><div class="k">Working</div><div class="v">${D.on.length}</div></div><div class="tile"><div class="k">Holiday · sick · on call</div><div class="v">${D.hol} · ${D.sick} · ${D.call}</div></div></div>`;
    h+=byDept(D.on,true);
  } else if(S.shSeg==='week'){
    const w=S.shWeek, days=[...Array(7)].map((_,i)=>addD(w,i));
    h+=weekBar(w);
    h+=days.map(k=>{ const D=dayList(k); return `<div class="sec">${k===t?'Today · ':''}${fmtDL(k)}${D.has?' · '+D.on.length+' working':''}</div><div class="card">${D.has?byDept(D.on,false):'<div class="empty">No rota loaded.</div>'}</div>`; }).join('');
  } else {
    const R=rotaData(), w=S.shWeek, days=[...Array(7)].map((_,i)=>addD(w,i));
    const people=Object.values(R.staff).filter(s=>Object.values(R.rota).some(d=>d[s.id]!==undefined)).sort((a,b)=>a.name.localeCompare(b.name));
    h+=`<select class="inp" onchange="set('shPerson',this.value)"><option value="">Choose a person…</option>${people.map(p=>`<option value="${esc(p.id)}" ${S.shPerson===p.id?'selected':''}>${esc(p.name)}${p.role?' — '+esc(p.role):''}</option>`).join('')}</select><div style="height:10px"></div>${weekBar(w)}`;
    if(S.shPerson){ const p=R.staff[S.shPerson]||{}; let hrs=0;
      const rows=days.map(k=>{ const v=(R.rota[k]||{})[S.shPerson]; const sh=shiftOf(v); const m=sh.match(/(\d\d):(\d\d)\s*-\s*(\d\d):(\d\d)/);
        if(m){ let a=+m[1]*60+ +m[2], b=+m[3]*60+ +m[4]; if(b<=a) b+=1440; hrs+=(b-a)/60; }
        const dept=v&&typeof v==='object'&&v.dept?deptMeta(v.dept).name:'';
        return `<div class="row"><div class="l"><div class="t">${fmtDW(k)}${k===t?' · today':''}</div>${dept?`<div class="m">${esc(dept)}</div>`:''}</div><div class="r" style="${working(v)?'':'color:var(--muted);font-weight:700'}">${v===undefined?'—':esc(sh||'off').replace(/^off$/i,'Off')}</div></div>`; }).join('');
      h+=`<div class="card"><div class="row"><div class="l"><div class="t" style="font-size:16px">${esc(p.name||'')}</div><div class="m">${esc(p.role||'')} · ${esc(deptMeta(p.dept).name)}</div></div><div class="r">${hrs?Math.round(hrs*10)/10+' hrs':''}</div></div>${rows}</div>
      <div class="note">Hours are shift length before breaks.${p.staffCode?` Their own rota link: brandon.hospro.co.uk/my-rota.html (ID ${esc(p.staffCode)}).`:''}</div>`;
    } else h+=`<div class="card"><div class="empty">Choose someone to see their week.</div></div>`;
  }
  const u=S.rota&&S.rota.updated; return h+`<div class="upd">${u?'Rota published '+new Date(u).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Rota from the latest import'}</div>`;
}
function weekBar(w){ const t=TODAY(), cur=monday(t); const lab=w===cur?'This week':w===addD(cur,7)?'Next week':w===addD(cur,-7)?'Last week':'Week of';
  return `<div class="wkbar"><button onclick="S.shWeek=addD(S.shWeek,-7);draw()">‹</button><div class="lab">${lab} · ${fmtD(w)} – ${fmtD(addD(w,6))}</div><button onclick="S.shWeek=addD(S.shWeek,7);draw()">›</button></div>`; }
function byDept(on,big){ const by={}; on.forEach(p=>{ (by[p.dept]=by[p.dept]||[]).push(p); });
  const order=rotaData().depts.map(d=>d.id); const keys=Object.keys(by).sort((a,b)=>(order.indexOf(a)+99*(order.indexOf(a)<0))-(order.indexOf(b)+99*(order.indexOf(b)<0)));
  if(!keys.length) return '<div class="empty">Nobody rostered.</div>';
  const inner=keys.map(d=>{ const m=deptMeta(d); return `<div class="dept" style="color:${m.colour||'#475569'}"><span class="dot" style="background:${m.colour||'#94a3b8'}"></span>${esc(m.name)} · ${by[d].length}</div>${by[d].sort((a,b)=>a.shift.localeCompare(b.shift)).map(p=>`<div class="sh"><span>${esc(p.name)}${big&&p.role?` <span class="mini">${esc(p.role)}</span>`:''}</span><b>${esc(p.shift)}</b></div>`).join('')}`; }).join('');
  return big?`<div class="card" style="margin-top:10px">${inner}</div>`:inner; }

/* More */
function vMore(){ return `<div class="sec">More</div>
  <button class="big" onclick="go('rooms')">🏛 Meeting &amp; event rooms<span>Sizes, capacities by layout and room hire</span></button>
  <button class="big" onclick="go('events')">🎟 Local events<span>Concerts, shows and sport near Brandon Hall</span></button>
  <button class="big" onclick="go('fix')">🔧 Maintenance &amp; compliance<span>Open HosFIX jobs</span></button>
  <a class="big" style="text-decoration:none" href="${PORTAL}" target="_blank" rel="noopener">🖥 Open the full HosPRO portal<span>brandon.hospro.co.uk</span></a>`; }
const back=`<button class="chip" style="margin:6px 0 2px" onclick="go('more')">‹ More</button>`;

function vRooms(){
  const L=[['theatre','Theatre'],['cabaret','Cabaret'],['boardroom','Boardroom'],['ushape','U-shape'],['reception','Reception']];
  const lay=S.roomLayout, pax=+S.roomPax||0;
  const rooms=(P.rooms||[]).filter(r=>!pax||(r.cap&&r.cap[lay]>=pax)).sort((a,b)=>(b.cap[lay]||0)-(a.cap[lay]||0));
  return `${back}<div class="sec">Meeting &amp; event rooms</div>
  ${chips('roomLayout',L)}
  <input class="inp" type="number" inputmode="numeric" placeholder="Guests — show rooms that fit" value="${S.roomPax}" oninput="S.roomPax=this.value;clearTimeout(window._rp);window._rp=setTimeout(()=>{draw();const i=document.querySelector('#main input');if(i){i.focus();i.setSelectionRange(99,99)}},350)">
  <div style="height:10px"></div>
  ${rooms.map(r=>{ const h=P.hire&&P.hire[r.id]; const c=r.cap||{};
    return `<div class="card"><div class="row" style="padding-top:0"><div class="l"><div class="t" style="font-size:16px">${esc(r.name)}</div><div class="m">${r.m2?r.m2+' m²':''}${r.length&&r.width?' · '+r.length+' × '+r.width+' m':''}${r.combined?' · '+esc(r.combined):''}</div></div><div class="r" style="font-size:20px">${c[lay]||'—'}<div class="mini" style="text-align:right;font-weight:700">${L.find(x=>x[0]===lay)[1].toLowerCase()}</div></div></div>
    <table class="tbl"><tr>${L.map(([k,l])=>`<th style="text-align:center">${l}</th>`).join('')}</tr><tr>${L.map(([k])=>`<td style="text-align:center;${k===lay?'font-weight:900':''}">${c[k]||'—'}</td>`).join('')}</tr></table>
    ${h?`<div class="note">Room hire: half day ${gbp(h.half)} · full day ${gbp(h.full)} (inc VAT)</div>`:''}</div>`; }).join('')||'<div class="card"><div class="empty">No room fits that many in this layout. Try another layout.</div></div>'}`;
}

const evRow=e=>{ const d=Math.round((new Date(e.start+'T12:00')-new Date(TODAY()+'T12:00'))/864e5);
  return `<a class="row tap" style="text-decoration:none;color:inherit" href="${esc(e.url||'#')}" target="_blank" rel="noopener"><div class="l"><div class="t">${esc(e.name)}</div><div class="m">${fmtD(e.start)}${e.end&&e.end!==e.start?' – '+fmtD(e.end):''} · ${esc(e.venue||'')}${evMiles(e)!=null?' · '+evMiles(e)+' mi':''}</div></div><div class="r" style="font-size:12px;${d<=14?'color:#b45309':'color:var(--muted)'}">${d<=0?'On now':d===1?'Tomorrow':'in '+d+' days'}<span class="chev">›</span></div></a>`; };
function evMiles(e){ if(e.miles!=null&&e.miles!=='') return +e.miles; const v=String(e.venue||'').toLowerCase(); if(!v) return null; if(/coventry city centre/.test(v)) return 4.5;
  let best=null; (P.venues||[]).forEach(x=>{ const key=x.name.toLowerCase().replace(/\s*\(.*\)/,'').split(/[,–-]/)[0].trim(); if(key&&(v.includes(key)||key.includes(v.split(/[,/]/)[0].trim()))){ if(best==null||x.miles<best) best=x.miles; } }); return best; }
function vEvents(){
  const t=TODAY(), to=S.evRange==='all'?'9999':addD(t,+S.evRange);
  const list=(P.events||[]).filter(e=>(e.end||e.start)>=t && e.start<=to).filter(e=>{ const m=evMiles(e); return m==null||m<=S.evMiles; }).sort((a,b)=>a.start.localeCompare(b.start));
  const ven=(P.venues||[]).filter(v=>v.miles<=S.evMiles);
  return `${back}<div class="sec">Local events &amp; shows</div>
  ${chips('evRange',[['30','Next 30 days'],['90','Next 3 months'],['all','All upcoming']])}
  ${chips('evMiles',[[20,'20 miles'],[30,'30 miles'],[50,'50 miles']])}
  <div class="card">${list.map(evRow).join('')||'<div class="empty">No dated events in this range.</div>'}</div>
  <div class="note" style="margin:0 4px">Use these to sell room and dinner packages. Always check dates on the venue's site first. Miles are straight-line from Brandon Hall.</div>
  <div class="sec">Venues within ${S.evMiles} miles · ${ven.length}</div>
  <div class="card">${ven.map(v=>`<a class="row tap" style="text-decoration:none;color:inherit" href="${esc(v.url)}" target="_blank" rel="noopener"><div class="l"><div class="t">${esc(v.name)}</div><div class="m">${esc(v.town)} · ${esc(v.category)}${v.capacity?' · '+esc(v.capacity):''}</div></div><div class="r" style="font-size:12.5px">${v.miles} mi<span class="chev">›</span></div></a>`).join('')}</div>`;
}

function vFix(){
  const J=S.jobs; const C=S.summary&&S.summary.compliance;
  if(!J) return `${back}<div class="sec">Maintenance</div><div class="card"><div class="empty">${S.loaded?'Could not load maintenance jobs.':'Loading…'}</div></div>`;
  const pr={urgent:0,high:1,medium:2,low:3};
  const list=J.slice().sort((a,b)=>(pr[a.priority]??2)-(pr[b.priority]??2));
  return `${back}<div class="sec">Maintenance &amp; compliance</div>
  <div class="grid2"><div class="tile"><div class="k">Open jobs</div><div class="v">${J.length}</div><div class="s">${J.filter(j=>j.priority==='urgent').length} urgent</div></div>
  <div class="tile"><div class="k">Compliance</div><div class="v">${C?C.overdue:'—'}</div><div class="s">${C?`overdue · ${C.dueSoon} due this week`:'from the portal'}</div></div></div>
  <div class="sec">Open jobs</div>
  <div class="card">${list.slice(0,30).map(j=>`<div class="row"><div class="l"><div class="t">${esc(j.title||j.description||'Job')}</div><div class="m">${[j.location||j.area,j.assignedName||j.assignedTo,j.status==='pending_approval'?'awaiting approval':j.status==='in-progress'?'in progress':'not started'].filter(Boolean).map(esc).join(' · ')}</div></div>${j.priority==='urgent'?'<span class="pill bd">Urgent</span>':''}</div>`).join('')||'<div class="empty">No open jobs 🎉</div>'}</div>`;
}

/* install tip + service worker */
(function(){
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent), standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  if(!standalone) $('#install-tip').innerHTML=ios?'Add to your home screen: tap <b>Share</b> then <b>Add to Home Screen</b>.':'Add to your home screen: open the browser menu ⋮ and tap <b>Install app</b> or <b>Add to Home screen</b>.';
  if('serviceWorker' in navigator) navigator.serviceWorker.register('mobile-sw.js',{scope:'./mobile'}).catch(()=>{});
  const w=store.get('pocket_who'); if(w) start(w);
  setInterval(()=>{ if(!document.hidden && S.who) load(); }, 5*60000);
})();
</script>
</body>
</html>
